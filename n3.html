ん。"],"問4":[2,"「返事をしないと、失礼になると思っていたからだ」。"],"問5":[3,"「間違いは減った。先輩も、前より詳しく説明してくれるようになった」。"],"問6":[2,"最後の段落「自分がどこまで分かっているかを、相手に伝えるためのものでもある」。"],"問7":[2,"「早く終わったのだから、休んでもいいはずだと思っていたからだ」。"],"問8":[2,"「会議に使うと決めていた時間は、まだ終わっていない——そういう意味だったのだ」。"],"問9":[3,"「常に後者を守るべきだとは思わない」「後者を意識している人は意外に少ない」。"],"問10":[2,"最後の段落「どちらの意味で言っているのかをはっきりさせないまま話すと、話が食い違う」。"],"問11":[2,"市内勤務は「5冊まで」。市外の3冊ではありません。"],"問12":[3,"「返す日の前日までにお申し出ください。当日はできません」。"],"問13":[1,"「連絡から1週間取りに来られない場合は、次の方にお回しします」。"]},"日曜":{"L1":[3,"「先に声をかけてからにしましょう」。"],"L2":[2,"「まず看護師さんに伝えてください。記録はそのあとで」。"],"L3":[2,"二時から「一時間遅らせる」ので三時。"],"L4":[4,"「昨日と今日で、言われることが違う」。忙しさは「平気」と言っている。"],"L5":[2,"頼まれた仕事をこれから行う返事。"],"L6":[1,"お礼を言われたときは「いえ、こちらこそ」。"],"L7":[3,"なくなりそうだと知らされたので、これから注文する。"],"r1":[1,""],"r2":[1,""],"r3":[2,""],"r4":[1,""],"r5":[1,""],"r6":[2,""],"r7":[1,""],"r8":[1,""],"r9":[1,""],"r10":[1,""],"r11":[1,""],"r12":[1,""],"r13":[1,""],"r14":[1,""],"r15":[1,""],"r16":[1,""],"r17":[1,""],"r18":[1,""],"r19":[1,""],"r20":[1,""]}},"listen":[{"group":"問題1　課題理解","hint":"はじめに質問を聞いてください。それから会話を聞いて、問題用紙の1〜4から一つ選びます。","items":[{"no":"問1","label":"このあとまず何をしますか","answer":"3　利用者に声をかける","why":"「先に声をかけてからにしましょう」と言われている。順番に注意。","steps":[{"k":"q","v":"女の人は、このあとまず何をしますか。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"山田さんの車いす、そろそろ食堂へお願いします。"},{"k":"line","sp":"女","v":"はい。すぐお連れします。"},{"k":"line","sp":"男","v":"あ、先に声をかけてからにしましょう。急に動かすと驚かれますから。"},{"k":"line","sp":"女","v":"そうですね。分かりました。"},{"k":"pause","s":8,"a":true}]},{"no":"問2","label":"男の人はこのあと何をしますか","answer":"2　看護師に報告する","why":"「まず看護師さんに」と指示されている。記録はそのあと。","steps":[{"k":"q","v":"男の人は、このあと何をしますか。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"佐藤さん、熱が三十七度八分ありました。"},{"k":"line","sp":"男","v":"分かりました。記録に書いておきます。"},{"k":"line","sp":"女","v":"いえ、まず看護師さんに伝えてください。記録はそのあとで。"},{"k":"line","sp":"男","v":"はい、すぐ行ってきます。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題2　ポイント理解","hint":"はじめに質問を聞いてください。そのあと、問題用紙を見てください。読む時間があります。","items":[{"no":"問3","label":"会議は何時からになりましたか","answer":"2　三時","why":"「二時」から「一時間遅らせて」なので三時。数字の計算に注意。","steps":[{"k":"q","v":"会議は、何時からになりましたか。"},{"k":"pause","s":3},{"k":"line","sp":"男","v":"今日の会議、二時からでしたよね。"},{"k":"line","sp":"女","v":"それが、部長が戻るのが遅れるそうで、一時間遅らせることになりました。"},{"k":"line","sp":"男","v":"では、その時間に会議室へ行きます。"},{"k":"pause","s":8,"a":true}]},{"no":"問4","label":"女の人が困っているのは何ですか","answer":"4　説明が急に変わること","why":"「昨日と今日で言うことが違う」が困っている中身。忙しさや道具の話は出るが中心ではない。","steps":[{"k":"q","v":"女の人が困っているのは、何ですか。"},{"k":"pause","s":3},{"k":"line","sp":"男","v":"仕事はどうですか。慣れましたか。"},{"k":"line","sp":"女","v":"仕事自体は大丈夫です。忙しいのも平気なんですが……。"},{"k":"line","sp":"男","v":"何かありますか。"},{"k":"line","sp":"女","v":"昨日と今日で、言われることが違うことがあって。どちらに合わせればいいのか。"},{"k":"line","sp":"男","v":"ああ、それは確かに困りますね。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題3　即時応答","hint":"短い文を聞いて、1〜3から合う返事を選びます。","items":[{"no":"問5","label":"返事を選ぶ","answer":"2　はい、すぐ確認します","why":"頼まれたので、これから行う返事を選ぶ。1は終わったこと、3は関係ない。","steps":[{"k":"line","sp":"男","v":"この書類、金額が合っているか見てもらえますか。"},{"k":"line","sp":"女","v":"1、はい、もう出しました。"},{"k":"line","sp":"女","v":"2、はい、すぐ確認します。"},{"k":"line","sp":"女","v":"3、はい、金額は三つです。"},{"k":"pause","s":8,"a":true}]},{"no":"問6","label":"返事を選ぶ","answer":"1　いえ、こちらこそ","why":"お礼を言われたときの返し方。2は自分が謝る場面、3は関係ない。","steps":[{"k":"line","sp":"女","v":"昨日は手伝ってくださって、ありがとうございました。"},{"k":"line","sp":"男","v":"1、いえ、こちらこそ。"},{"k":"line","sp":"男","v":"2、すみませんでした。"},{"k":"line","sp":"男","v":"3、では、お願いします。"},{"k":"pause","s":8,"a":true}]},{"no":"問7","label":"返事を選ぶ","answer":"3　では、注文しておきます","why":"なくなりそうだと知らされた。これから注文する返事を選ぶ。","steps":[{"k":"line","sp":"女","v":"コピー用紙、なくなりそうですよ。"},{"k":"line","sp":"男","v":"1、はい、コピーしました。"},{"k":"line","sp":"男","v":"2、では、私が使います。"},{"k":"line","sp":"男","v":"3、では、注文しておきます。"},{"k":"pause","s":8,"a":true}]}]}]},"7":{"days":[{"key":"月曜","title":"短文読解 ── 大学からのメールを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>あて先：students@midori-u.ac.jp<br>件名：<b>台風接近にともなう授業の取り扱いについて</b></p><p>学生のみなさん</p><p>9月20日（金）は、台風が近づく見込みです。次のとおり対応しますので、確認してください。</p><p>・午前7時の時点で暴風警報が出ている場合　→　<b>全学休講</b><br>・午前11時までに警報が解除された場合　→　<b>3限（13時20分）から授業</b><br>・午前11時を過ぎても解除されない場合　→　<b>終日休講</b></p><p>休講になった授業の補講日は、後日あらためてお知らせします。休講かどうかを電話で問い合わせることはご遠慮ください。大学のホームページとこのメールで必ずお知らせします。</p><p>みどり大学　教務課</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"午前10時に警報が解除された場合、授業はどうなるか。  ","opts":["一日中、授業はない  ","13時20分から授業がある  ","午前中だけ授業がある  ","いつもどおり1限から授業がある"],"tag":"joken"},{"t":"q","id":"問2","text":"休講かどうかを知りたいとき、学生は何をすればよいか。  ","opts":["教務課に電話する  ","大学のホームページかメールを見る  ","友だちに聞く  ","大学へ行って確かめる"],"tag":"naiyou"},{"t":"q","id":"問3","text":"このメールの内容に合うものはどれか。  ","opts":["補講の日はこのメールに書いてある  ","午前7時に警報が出ていたら、その日は授業がない  ","電話で問い合わせてもよい  ","台風でも授業は必ず行われる"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>接近</td><td>せっきん</td><td>近づくこと</td><td>pendekatan / mendekat</td></tr><tr><td>2</td><td>取り扱い</td><td>とりあつかい</td><td>どう扱うか</td><td>penanganan</td></tr><tr><td>3</td><td>見込み</td><td>みこみ</td><td>たぶんそうなるという予想</td><td>perkiraan</td></tr><tr><td>4</td><td>時点</td><td>じてん</td><td>その時</td><td>saat / titik waktu</td></tr><tr><td>5</td><td>暴風警報</td><td>ぼうふうけいほう</td><td>強い風の危険を知らせる発表</td><td>peringatan angin kencang</td></tr><tr><td>6</td><td>休講</td><td>きゅうこう</td><td>授業が休みになること</td><td>kuliah ditiadakan</td></tr><tr><td>7</td><td>解除</td><td>かいじょ</td><td>出ていたものを取り消すこと</td><td>pencabutan</td></tr><tr><td>8</td><td>終日</td><td>しゅうじつ</td><td>一日中</td><td>sepanjang hari</td></tr><tr><td>9</td><td>補講</td><td>ほこう</td><td>休んだ分の授業</td><td>kuliah pengganti</td></tr><tr><td>10</td><td>遠慮する</td><td>えんりょする</td><td>ひかえる。しないでおく</td><td>menahan diri</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜として（立場・資格）（Sebagai ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ として</td><td>彼は小説家<b>として</b>有名になった。</td></tr><tr><td>名詞 ＋ としては</td><td>留学生<b>としては</b>、よく話せるほうだ。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜について」（話題）とは違います。「〜として」は<b>立場・資格</b>です。2018年の本試験でも問われました。"},{"t":"p","v":"②〜にともなって／〜にともなう（それと一緒に変わる）（Seiring dengan ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ にともなって</td><td>台風の接近<b>にともなって</b>、電車が止まった。</td></tr><tr><td>名詞 ＋ にともなう ＋ 名詞</td><td>値上げ<b>にともなう</b>お知らせ。</td></tr></tbody></table>"},{"t":"p","v":"・掲示・案内でよく使われる書き言葉です。話すときは「〜のため」。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"警報が（　　）されたので、授業が始まった。  ","opts":["解除","接近","休講","補講"]},{"t":"q","id":"2","drill":true,"text":"午前7時の（　　）で判断します。  ","opts":["見込み","時点","終日","取り扱い"]},{"t":"q","id":"3","drill":true,"text":"お問い合わせは（　　）ください。  ","opts":["遠慮","解除","接近","補講"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"彼は医者（　　）働いている。  ","opts":["として","について","にとって","にしたがって"]},{"t":"q","id":"5","drill":true,"text":"台風の接近（　　）、大雨が降った。  ","opts":["にともなって","にとって","において","によると"]},{"t":"q","id":"6","drill":true,"text":"この本は入門書（　　）よくできている。  ","opts":["としては","については","にしては","にとっては"]}]},{"key":"火曜","title":"短文読解 ── 店からのメールを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>件名：ご注文の品の発送について</p><p>川口様</p><p>このたびは、みどり工房をご利用いただき、ありがとうございます。</p><p>ご注文いただいた品のうち、木のスプーン2本は本日発送いたしました。明後日にはお届けできる見込みです。</p><p>なお、同時にご注文の<u>①こちらの品</u>——木のカップ1個——につきましては、職人が一つずつ手で作っているため、あと10日ほどお時間をいただきます。別便でのお届けとなりますが、送料は<b>いただきません</b>。</p><p>お急ぎの場合は、キャンセルも承ります。その際は、このメールにご返信ください。ご連絡がない場合は、そのままお作りいたします。</p><p>みどり工房　佐々木</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「こちらの品」とは何か。  ","opts":["木のスプーン2本  ","木のカップ1個  ","スプーンとカップの両方  ","別に注文した品"],"tag":"shiji"},{"t":"q","id":"問2","text":"カップの発送が遅れる理由は何か。  ","opts":["注文が多いから  ","手作りで時間がかかるから  ","送料が決まっていないから  ","店が休みだから"],"tag":"naiyou"},{"t":"q","id":"問3","text":"川口さんがキャンセルしたい場合、どうすればよいか。  ","opts":["何もしないで待つ  ","このメールに返信する  ","店に行く  ","10日待ってから連絡する"],"tag":"joken"},{"t":"q","id":"問4","text":"このメールの内容に合うものはどれか。  ","opts":["スプーンとカップは一緒に届く  ","カップの送料は別にかかる  ","連絡しなければ、カップは作られる  ","キャンセルはできない"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>発送</td><td>はっそう</td><td>荷物を送り出すこと</td><td>pengiriman</td></tr><tr><td>2</td><td>このたび</td><td>このたび</td><td>今回</td><td>kali ini</td></tr><tr><td>3</td><td>職人</td><td>しょくにん</td><td>手で物を作る専門の人</td><td>pengrajin</td></tr><tr><td>4</td><td>別便</td><td>べつびん</td><td>別の荷物として送ること</td><td>pengiriman terpisah</td></tr><tr><td>5</td><td>送料</td><td>そうりょう</td><td>送るためのお金</td><td>ongkos kirim</td></tr><tr><td>6</td><td>承る</td><td>うけたまわる</td><td>「受ける」の謙譲語</td><td>menerima (bentuk merendah)</td></tr><tr><td>7</td><td>その際</td><td>そのさい</td><td>そのとき</td><td>pada saat itu</td></tr><tr><td>8</td><td>返信</td><td>へんしん</td><td>返事のメール</td><td>balasan</td></tr><tr><td>9</td><td>明後日</td><td>あさって</td><td>あしたの次の日</td><td>lusa</td></tr><tr><td>10</td><td>同時に</td><td>どうじに</td><td>同じときに</td><td>pada saat bersamaan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜いただきます／〜いたします（謙譲語）（Bentuk merendahkan diri）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>お ＋ ます形 ＋ します</td><td><b>お届けします</b>。</td></tr><tr><td>ご ＋ 漢語 ＋ いたします</td><td><b>ご連絡いたします</b>。</td></tr><tr><td>動詞て形 ＋ いただきます</td><td>お時間を<b>いただきます</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：自分の動作をへりくだって言います。相手の動作には使いません。相手には「お〜になる」「ご〜ください」。"},{"t":"p","v":"②〜ため（に）（理由）（Karena ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ ため</td><td>手で作っている<b>ため</b>、時間がかかります。</td></tr><tr><td>名詞 ＋ のため</td><td>大雪<b>のため</b>、休講になりました。</td></tr></tbody></table>"},{"t":"p","v":"・「〜から」より書き言葉です。案内・メールでよく使われます。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"品物を（　　）しましたので、明日届きます。  ","opts":["発送","返信","送料","別便"]},{"t":"q","id":"2","drill":true,"text":"（　　）が一つずつ手で作っています。  ","opts":["職人","店員","客","係"]},{"t":"q","id":"3","drill":true,"text":"キャンセルも（　　）ます。  ","opts":["承り","申し上げ","いたし","ござい"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"明日、こちらからご連絡（　　）。  ","opts":["いたします","なさいます","くださいます","られます"]},{"t":"q","id":"5","drill":true,"text":"工事の（　　）、道が通れません。  ","opts":["ため","ように","ばかり","うちに"]},{"t":"q","id":"6","drill":true,"text":"少々お時間を（　　）ます。  ","opts":["いただき","くださり","なさい","おっしゃい"]}]},{"key":"水曜","title":"中文読解 ── エッセイを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　先日、駅の階段で重そうなスーツケースを持った女性を見かけた。手伝おうかと思ったが、声をかけるのをためらった。断られたら気まずいし、失礼だと思われるかもしれない。そう考えているうちに、別の人がさっと近づいて、「持ちますよ」と言って持ち上げてしまった。</p><p>　私は自分が恥ずかしくなった。しかし、あとで考えてみると、<u>①恥ずかしかったのは、手伝わなかったことそのものではなかった</u>。私は「断られること」ばかりを考えていて、目の前の人が困っているかどうかを見ていなかったのだ。</p><p>　国にいたころ、私はもっと気軽に人に声をかけていた。日本に来て、「迷惑をかけてはいけない」という言葉を何度も聞くうちに、いつのまにか、②<u>それ</u>を「近づかないこと」だと理解していたのかもしれない。</p><p>　迷惑をかけないことと、関わらないことは、同じではない。断られたら「そうですか」と引けばいい。それだけのことだ。次に同じ場面に出会ったら、今度は先に手が出るだろうか。正直なところ、自信はない。けれども、ためらった理由が自分の都合だったことは、もう分かっている。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「恥ずかしかったのは、手伝わなかったことそのものではなかった」とあるが、では何が恥ずかしかったのか。  ","opts":["他の人に先を越されたこと  ","自分の都合ばかり考えていたこと  ","声が小さかったこと  ","日本語がうまく話せなかったこと"],"tag":"shiji"},{"t":"q","id":"問2","text":"②「それ」は何を指しているか。  ","opts":["迷惑をかけてはいけないという考え  ","声をかけること  ","日本に来たこと  ","断られること"],"tag":"shiji"},{"t":"q","id":"問3","text":"筆者は「迷惑をかけないこと」と「関わらないこと」について、どう考えているか。  ","opts":["同じことである  ","別のことである  ","どちらも大切である  ","どちらも必要ない"],"tag":"naiyou"},{"t":"q","id":"問4","text":"この文章で筆者が最も言いたいことはどれか。  ","opts":["日本人は冷たい  ","次は必ず手伝うと決めた  ","ためらった理由が自分の都合だったと気づいた  ","外国では声をかけるのが普通だ"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>ためらう</td><td>ためらう</td><td>しようかどうか迷う</td><td>ragu-ragu</td></tr><tr><td>2</td><td>気まずい</td><td>きまずい</td><td>その場の空気が悪くなる感じ</td><td>canggung</td></tr><tr><td>3</td><td>さっと</td><td>さっと</td><td>すばやく</td><td>dengan cepat</td></tr><tr><td>4</td><td>そのもの</td><td>そのもの</td><td>まさにそれ自体</td><td>itu sendiri</td></tr><tr><td>5</td><td>気軽に</td><td>きがるに</td><td>あまり考えすぎずに</td><td>dengan santai</td></tr><tr><td>6</td><td>いつのまにか</td><td>いつのまにか</td><td>気づかないうちに</td><td>tanpa disadari</td></tr><tr><td>7</td><td>関わる</td><td>かかわる</td><td>関係を持つ</td><td>terlibat / berhubungan</td></tr><tr><td>8</td><td>引く</td><td>ひく</td><td>後ろへさがる。やめる</td><td>mundur / menarik diri</td></tr><tr><td>9</td><td>正直なところ</td><td>しょうじきなところ</td><td>本当のことを言うと</td><td>sejujurnya</td></tr><tr><td>10</td><td>都合</td><td>つごう</td><td>自分の事情</td><td>keperluan sendiri</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜うちに（その間に。気づかない変化）（Dalam kurun ~ / tanpa sadar）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ている ＋ うちに</td><td>考えている<b>うちに</b>、別の人が助けた。</td></tr><tr><td>名詞 ＋ のうちに</td><td>若い<b>うちに</b>勉強しておく。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜うちに」は「その間に、思わぬことが起きる」。「〜までに」は期限。意味が違います。"},{"t":"p","v":"②〜かもしれない（可能性）（Mungkin ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ かもしれない</td><td>失礼だと思われる<b>かもしれない</b>。</td></tr><tr><td>な形容詞・名詞 ＋ かもしれない</td><td>無理<b>かもしれない</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「〜だろう」より弱く、「そうでない可能性」も残す言い方です。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"声をかけるのを（　　）しまった。  ","opts":["ためらって","関わって","引いて","気軽に"]},{"t":"q","id":"2","drill":true,"text":"（　　）、外が暗くなっていた。  ","opts":["いつのまにか","さっと","気まずい","正直"]},{"t":"q","id":"3","drill":true,"text":"断られたら（　　）ばいい。  ","opts":["引け","関われ","ためらえ","気軽に"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"話している（　　）、電車が来た。  ","opts":["うちに","までに","あとに","ように"]},{"t":"q","id":"5","drill":true,"text":"雨が降る（　　）ので、傘を持っていく。  ","opts":["かもしれない","にちがいない","はずがない","わけがない"]},{"t":"q","id":"6","drill":true,"text":"明るい（　　）帰りましょう。  ","opts":["うちに","までに","あいだで","ところに"]}]},{"key":"木曜","title":"中文読解 ── 意見文を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　あるタクシー会社が、車内にボタンを付けたという話を聞いた。押すと、運転手がいつもよりゆっくり走ってくれるボタンだそうだ。</p><p>　この会社は長い間、「急ぐこと」がサービスだと考えていた。ところが利用者に聞いてみると、「ゆっくり走ってほしいと思ったことがある」と答えた人が想像よりずっと多かったという。小さい子どもを連れた人、車に酔いやすい人。理由はさまざまだが、共通しているのは<u>①その希望を口に出しにくい</u>ということだった。</p><p>　急いでくれている相手に「急がなくていい」とは言いにくい。親切に対して注文をつけるようで、気が引ける。だからボタンなのだろう。言葉にしなくても伝わる仕組みを作った点が、私はうまいと思う。</p><p>　この話は、タクシーだけの話ではない。職場でも、②<u>同じこと</u>が起きているのではないか。先輩が忙しそうに教えてくれているとき、「もう一度お願いします」とは言いにくい。言いにくいまま分からずに進めば、あとで困るのは両方だ。</p><p>　必要なのは「何でも言ってください」という言葉ではなく、言いにくいことでも伝えられる<b>形</b>のほうだろう。ボタンでもいいし、紙でもいい。相手の親切に水を差さずに済む方法が、一つあればいい。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「その希望を口に出しにくい」とあるが、その希望とは何か。  ","opts":["もっと急いでほしい  ","ゆっくり走ってほしい  ","料金を安くしてほしい  ","別の道を通ってほしい"],"tag":"shiji"},{"t":"q","id":"問2","text":"なぜ口に出しにくいのか。  ","opts":["言葉が思い出せないから  ","親切にしてくれている相手に注文をつけるようだから  ","運転手が怖いから  ","料金が上がるから"],"tag":"naiyou"},{"t":"q","id":"問3","text":"②「同じこと」とは、職場でのどんなことか。  ","opts":["忙しい先輩に「もう一度」と言いにくいこと  ","先輩が親切でないこと  ","仕事が急がされること  ","ボタンが必要なこと"],"tag":"shiji"},{"t":"q","id":"問4","text":"筆者が最も言いたいことはどれか。  ","opts":["タクシーのボタンは便利だ  ","「何でも言って」と声をかけることが大切だ  ","言いにくいことを伝えられる形を用意するべきだ  ","急ぐサービスはやめるべきだ"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>車内</td><td>しゃない</td><td>車の中</td><td>di dalam kendaraan</td></tr><tr><td>2</td><td>想像</td><td>そうぞう</td><td>頭の中で思うこと</td><td>bayangan</td></tr><tr><td>3</td><td>酔う</td><td>よう</td><td>乗り物で気分が悪くなる</td><td>mabuk kendaraan</td></tr><tr><td>4</td><td>さまざま</td><td>さまざま</td><td>いろいろ</td><td>bermacam-macam</td></tr><tr><td>5</td><td>共通する</td><td>きょうつうする</td><td>どれにも同じである</td><td>memiliki kesamaan</td></tr><tr><td>6</td><td>口に出す</td><td>くちにだす</td><td>言葉にして言う</td><td>mengucapkan</td></tr><tr><td>7</td><td>注文をつける</td><td>ちゅうもんをつける</td><td>こうしてほしいと言う</td><td>mengajukan permintaan</td></tr><tr><td>8</td><td>気が引ける</td><td>きがひける</td><td>遠慮する気持ちになる</td><td>merasa sungkan</td></tr><tr><td>9</td><td>仕組み</td><td>しくみ</td><td>うまく働くようにした形</td><td>sistem</td></tr><tr><td>10</td><td>水を差す</td><td>みずをさす</td><td>いい雰囲気をこわす</td><td>merusak suasana</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜にくい／〜やすい（しにくい／しやすい）（Sulit ~ / mudah ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ にくい</td><td>言い<b>にくい</b>ことがある。</td></tr><tr><td>動詞ます形 ＋ やすい</td><td>車に酔い<b>やすい</b>人。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「言いにくい」は「言うのが難しい・ためらわれる」。「言えない」（不可能）とは違います。"},{"t":"p","v":"②〜ずに済む（〜しなくてよくなる）（Tidak perlu ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ない形（ない→ずに）＋ 済む</td><td>水を差さ<b>ずに済む</b>。</td></tr><tr><td>する → せずに済む</td><td>待た<b>ずに済んだ</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「済む」は「それで終わる・足りる」。「〜なくて済む」も同じ意味です。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"親切な人に注文をつけるのは（　　）。  ","opts":["気が引ける","水を差す","口に出す","共通する"]},{"t":"q","id":"2","drill":true,"text":"理由は人によって（　　）だ。  ","opts":["さまざま","共通","想像","車内"]},{"t":"q","id":"3","drill":true,"text":"思っていても（　　）にくい。  ","opts":["口に出し","気が引け","水を差し","酔い"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"この字は小さくて読み（　　）です。  ","opts":["にくい","やすい","がち","ぎみ"]},{"t":"q","id":"5","drill":true,"text":"早めに出たので、待た（　　）済んだ。  ","opts":["ずに","ないで","なくて","ずには"]},{"t":"q","id":"6","drill":true,"text":"このペンは書き（　　）ので気に入っている。  ","opts":["やすい","にくい","たい","よい"]}]},{"key":"金曜","title":"情報検索 ── ポスターから答えを探す","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>みどり動物園　秋のイベント案内</b></p><table><thead><tr><th>イベント</th><th>日</th><th>時間</th><th>場所</th><th>申し込み</th></tr></thead><tbody><tr><td>A　えさやり体験</td><td>土・日</td><td>11:00／14:00</td><td>ふれあい広場</td><td>当日・先着20名</td></tr><tr><td>B　夜の動物園</td><td>金・土</td><td>18:00〜20:00</td><td>園内全体</td><td>1週間前まで</td></tr><tr><td>C　飼育員のお話</td><td>毎日</td><td>13:00（20分）</td><td>教室</td><td>不要</td></tr><tr><td>D　写真教室</td><td>日</td><td>10:00〜12:00</td><td>正門前集合</td><td>3日前まで</td></tr></tbody></table><p>◆入園料　大人600円／中学生以下300円／3歳未満 無料</p><p>◆イベントの参加費は、入園料のほかに<b>1人200円</b>かかります（Cは無料）。</p><p>◆<b>雨の日</b>は、AとDは中止です。BとCは行います。</p><p>◆申し込みが必要なイベントは、電話（012-345-6789）でお願いします。インターネットでの申し込みはできません。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"雨の日曜日に、参加できるイベントはどれか。  ","opts":["AとD  ","BとC  ","Cだけ  ","全部できない"],"tag":"joken"},{"t":"q","id":"問2","text":"大人1人が「飼育員のお話」だけに参加するとき、かかるお金はいくらか。  ","opts":["600円  ","800円  ","300円  ","無料"],"tag":"joken"},{"t":"q","id":"問3","text":"この案内の内容に合うものはどれか。  ","opts":["申し込みはインターネットでできる  ","「夜の動物園」は1週間前までに申し込む  ","「えさやり体験」は毎日ある  ","3歳の子どもは入園料がいらない"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>体験</td><td>たいけん</td><td>実際にやってみること</td><td>pengalaman langsung</td></tr><tr><td>2</td><td>先着</td><td>せんちゃく</td><td>早く来た順</td><td>urutan kedatangan</td></tr><tr><td>3</td><td>飼育員</td><td>しいくいん</td><td>動物を世話する人</td><td>penjaga hewan</td></tr><tr><td>4</td><td>園内</td><td>えんない</td><td>公園や動物園の中</td><td>di dalam taman</td></tr><tr><td>5</td><td>正門</td><td>せいもん</td><td>おもて側の門</td><td>gerbang utama</td></tr><tr><td>6</td><td>集合</td><td>しゅうごう</td><td>決めた場所に集まること</td><td>berkumpul</td></tr><tr><td>7</td><td>入園料</td><td>にゅうえんりょう</td><td>入るためのお金</td><td>biaya masuk</td></tr><tr><td>8</td><td>未満</td><td>みまん</td><td>その数より下</td><td>di bawah (tidak termasuk)</td></tr><tr><td>9</td><td>参加費</td><td>さんかひ</td><td>参加のためのお金</td><td>biaya partisipasi</td></tr><tr><td>10</td><td>中止</td><td>ちゅうし</td><td>とりやめること</td><td>pembatalan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜のほかに（それに加えて）（Selain ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ のほかに</td><td>入園料<b>のほかに</b>200円かかります。</td></tr><tr><td>名詞 ＋ 以外に</td><td>日曜<b>以外に</b>土曜もあります。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜のほかに」＝それも足して。「〜のかわりに」＝そちらをやめて別のもの。混同しやすい表現です。"},{"t":"p","v":"②〜未満／〜以上／〜以下（数の範囲）（Batas angka）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>数 ＋ 未満</td><td>3歳<b>未満</b>（3歳は入らない）</td></tr><tr><td>数 ＋ 以下</td><td>中学生<b>以下</b>（中学生も入る）</td></tr><tr><td>数 ＋ 以上</td><td>20名<b>以上</b>（20名も入る）</td></tr></tbody></table>"},{"t":"p","v":"・「未満」だけ、その数を<b>含みません</b>。案内文を読むとき、ここで間違えやすいので注意します。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"（　　）20名までです。早めにどうぞ。  ","opts":["先着","集合","未満","中止"]},{"t":"q","id":"2","drill":true,"text":"雨のため、イベントは（　　）になりました。  ","opts":["中止","体験","参加","集合"]},{"t":"q","id":"3","drill":true,"text":"10時に正門前に（　　）してください。  ","opts":["集合","園内","先着","未満"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"入園料（　　）、200円必要です。  ","opts":["のほかに","のかわりに","について","として"]},{"t":"q","id":"5","drill":true,"text":"6歳（　　）の子どもは入れません（6歳は入れる）。  ","opts":["未満","以下","以上","まで"]},{"t":"q","id":"6","drill":true,"text":"中学生（　　）は300円です（中学生も300円）。  ","opts":["以下","未満","以上","より"]}]},{"key":"土曜","title":"読解通しテスト（55分）","blocks":[{"t":"passage","v":"<p>55分です。タイマーをセットして、途中で止めないこと。時間配分の目安：中文5分／長文11分／情報検索7分。</p>"},{"t":"h2","v":"問題1　中文（3問）"},{"t":"passage","v":"<p>　自転車の鍵をなくした。交番に届けを出し、あきらめて新しい鍵を作った。ところが一週間後、駅前の店の人から電話があった。「うちの前に落ちていましたよ」。</p><p>　礼を言いに行くと、店の人は言った。「鍵に、小さな名札が付いていたでしょう。あれがなかったら分からなかった」。名札を付けたのは三年前だ。付けたこと自体、忘れていた。</p><p>　三年前の自分が、今の自分を助けたことになる。面倒だと思いながらやっておいたことが、ずっとあとで効いてくる。そういうことが、たしかにある。</p>"},{"t":"q","id":"問1","text":"鍵が戻ってきたのは、なぜか。  ","opts":["交番に届けたから  ","鍵に名札が付いていたから  ","新しい鍵を作ったから  ","店の人が知り合いだったから"],"tag":"naiyou"},{"t":"q","id":"問2","text":"筆者は名札について、どう思っていたか。  ","opts":["付けたことを忘れていた  ","いつも大切にしていた  ","三年前に外した  ","店の人が付けてくれた"],"tag":"naiyou"},{"t":"q","id":"問3","text":"筆者が言いたいことはどれか。  ","opts":["鍵はなくさないほうがよい  ","面倒でもやっておいたことが、あとで役に立つことがある  ","交番は役に立たない  ","名札は必ず付けるべきだ"],"tag":"naiyou"},{"t":"h2","v":"問題2　中文（3問）"},{"t":"passage","v":"<p>　スーパーで、店員が商品を並べているところを見た。古いものを手前に、新しいものを奥に置いていく。当たり前のことのようだが、<u>逆にすれば楽なのに</u>、とふと思った。奥から順に置いていけば、いちいち前のものを動かさなくていい。</p><p>　あとで店の人に聞いてみた。「そうすると、古いものが奥に残ってしまうんです」。手前から取る人が多いから、新しいものばかりが先に売れる。残った古いものは、期限が切れて捨てることになる。</p><p>　楽なやり方を選ぶと、あとで捨てる量が増える。面倒なやり方を選ぶと、捨てる量が減る。どちらが「効率がいい」のかは、どこまでを一つの仕事と考えるかで変わるのだと思った。</p>"},{"t":"q","id":"問4","text":"「逆にすれば楽なのに」とあるが、どうすることか。  ","opts":["新しいものを手前に置く  ","古いものを捨てる  ","商品を並べない  ","店員を増やす"],"tag":"shiji"},{"t":"q","id":"問5","text":"店の人は、なぜ古いものを手前に置くのか。  ","opts":["そのほうが早く並べられるから  ","古いものが売れ残って捨てることになるのを防ぐため  ","客に頼まれたから  ","決まりだから"],"tag":"naiyou"},{"t":"q","id":"問6","text":"筆者の考えに合うものはどれか。  ","opts":["効率のよさは、どこまでを一つの仕事と見るかで変わる  ","楽なやり方がいつも正しい  ","面倒なやり方は避けるべきだ  ","商品は捨てても仕方がない"],"tag":"naiyou"},{"t":"h2","v":"問題3　長文（4問）"},{"t":"passage","v":"<p>　外国人の同僚が入った職場で、最初に問題になるのは言葉だと思われがちだ。しかし私の経験では、言葉そのものよりも、<u>①言葉の使われ方</u>のほうが難しい。</p><p>　たとえば「ちょっと難しいですね」。辞書のとおりに読めば「少し難しい」だが、実際には「できません」の意味で使われることが多い。私は長い間、これを「難しいけれど、やってくれる」と受け取っていた。待っても返事が来ないので聞きに行くと、「あのとき断ったつもりでした」と言われた。</p><p>　こういう言い方は、相手を傷つけないためにある。はっきり断ると角が立つから、やわらかく言う。その気持ちは分かる。けれども、②<u>やわらかさは、伝わって初めて意味を持つ</u>。伝わらなければ、ただ分かりにくいだけだ。</p><p>　では、どちらが変わるべきか。外国人が慣れるべきだ、という意見がある。一方で、日本人がはっきり言うべきだ、という意見もある。私はどちらか一方ではないと思う。大事なのは、<b>伝わったかどうかを確かめる一言</b>だ。「今の、断りの意味で合っていますか」。この一言があれば、言い方はどちらでもいい。</p><p>　言葉は、送ったところで終わりではない。届いて、初めて言葉になる。</p>"},{"t":"q","id":"問7","text":"①「言葉の使われ方」とは、ここではどういうことか。  ","opts":["文法が正しいかどうか  ","辞書の意味と実際の意味が違うこと  ","発音が難しいこと  ","敬語が多いこと"],"tag":"shiji"},{"t":"q","id":"問8","text":"筆者は「ちょっと難しいですね」をどう受け取っていたか。  ","opts":["できないという意味  ","難しいけれどやってくれるという意味  ","早くしてほしいという意味  ","手伝ってほしいという意味"],"tag":"naiyou"},{"t":"q","id":"問9","text":"②「やわらかさは、伝わって初めて意味を持つ」とはどういうことか。  ","opts":["やわらかい言い方はやめるべきだ  ","伝わらなければ、やわらかく言った意味がない  ","やわらかい言い方は日本だけにある  ","やわらかく言えば必ず伝わる"],"tag":"shiji"},{"t":"q","id":"問10","text":"筆者が最も言いたいことはどれか。  ","opts":["外国人が日本の言い方に慣れるべきだ  ","日本人がはっきり言うべきだ  ","伝わったかどうかを確かめることが大切だ  ","言葉より態度が大切だ"],"tag":"shucho"},{"t":"h2","v":"問題4　情報検索（3問）"},{"t":"passage","v":"<p><b>みどり市　日本語教室のご案内</b></p><table><thead><tr><th>クラス</th><th>曜日</th><th>時間</th><th>レベル</th><th>費用（1期）</th></tr></thead><tbody>< ]}},"listen":[{"group":"問題1　課題理解","hint":"はじめに質問を聞いてください。それから会話を聞いて、1〜4から一つ選びます。","items":[{"no":"問1","label":"女の人はこのあと何をしますか","answer":"2　資料をコピーする","why":"「先にコピーだけお願い」と頼まれている。会議室の準備はそのあと。","steps":[{"k":"q","v":"女の人は、このあと何をしますか。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"三時の会議、資料は足りていますか。"},{"k":"line","sp":"女","v":"あ、二部足りません。今から会議室の準備をしようと思っていたんですが。"},{"k":"line","sp":"男","v":"じゃあ、先にコピーだけお願いします。準備は私がやっておきます。"},{"k":"line","sp":"女","v":"分かりました。"},{"k":"pause","s":8,"a":true}]},{"no":"問2","label":"男の人はどうしますか","answer":"4　あしたの朝、電話する","why":"「今日はもう遅い」「あしたの朝いちばんで」と決まる。","steps":[{"k":"q","v":"男の人は、このあとどうしますか。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"山田さんに連絡したいんですが、もう六時ですね。"},{"k":"line","sp":"女","v":"今日はもう遅いですよ。先方も帰られたころです。"},{"k":"line","sp":"男","v":"メールだけでも送っておきましょうか。"},{"k":"line","sp":"女","v":"急ぎでなければ、あしたの朝いちばんで電話したほうが確実です。"},{"k":"line","sp":"男","v":"そうですね。そうします。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題2　ポイント理解","hint":"質問を聞いてから、問題用紙を見てください。読む時間があります。","items":[{"no":"問3","label":"休みの理由は何ですか","answer":"3　子どもが熱を出したから","why":"「自分の風邪」ではなく「下の子が熱を出して」が理由。","steps":[{"k":"q","v":"女の人が休む理由は、何ですか。"},{"k":"pause","s":3},{"k":"line","sp":"女","v":"すみません、あした休ませていただきたいのですが。"},{"k":"line","sp":"男","v":"どうしました。風邪ですか。"},{"k":"line","sp":"女","v":"いえ、私は大丈夫なんですが、下の子が熱を出してしまって。"},{"k":"line","sp":"男","v":"分かりました。お大事に。"},{"k":"pause","s":8,"a":true}]},{"no":"問4","label":"集合場所はどこになりましたか","answer":"1　駅の南口","why":"北口から南口へ変更された。最後の決定を聞き取る。","steps":[{"k":"q","v":"集合場所は、どこになりましたか。"},{"k":"pause","s":3},{"k":"line","sp":"男","v":"あしたは駅の北口に八時でしたよね。"},{"k":"line","sp":"女","v":"それが、北口は工事中で狭いんです。南口に変えましょう。"},{"k":"line","sp":"男","v":"分かりました。じゃあ南口で。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題3　即時応答","hint":"短い文を聞いて、1〜3から合う返事を選びます。","items":[{"no":"問5","label":"返事を選ぶ","answer":"2　いえ、まだです","why":"「もう〜ましたか」に対し、終わっていない場合の答え方。","steps":[{"k":"line","sp":"男","v":"報告書、もう書きましたか。"},{"k":"line","sp":"女","v":"1、はい、書きます。"},{"k":"line","sp":"女","v":"2、いえ、まだです。"},{"k":"line","sp":"女","v":"3、いいえ、書きました。"},{"k":"pause","s":8,"a":true}]},{"no":"問6","label":"返事を選ぶ","answer":"1　ありがとうございます。助かります","why":"手伝いの申し出を受けるときの返事。","steps":[{"k":"line","sp":"女","v":"重そうですね。半分持ちましょうか。"},{"k":"line","sp":"男","v":"1、ありがとうございます。助かります。"},{"k":"line","sp":"男","v":"2、はい、持ってください。"},{"k":"line","sp":"男","v":"3、いえ、重くないですよ。持ちます。"},{"k":"pause","s":8,"a":true}]},{"no":"問7","label":"返事を選ぶ","answer":"3　すみません、もう一度お願いします","why":"聞き取れなかったときの言い方。","steps":[{"k":"line","sp":"男","v":"では、あさっての十時にお願いします。"},{"k":"line","sp":"女","v":"1、はい、十時に伺いました。"},{"k":"line","sp":"女","v":"2、いいえ、十時です。"},{"k":"line","sp":"女","v":"3、すみません、もう一度お願いします。"},{"k":"pause","s":8,"a":true}]}]}]},"8":{"days":[{"key":"月曜","title":"短文読解 ── 会社の掲示を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>社員のみなさまへ　健康診断の受診について</b></p><p>今年度の健康診断を、次のとおり行います。全社員が対象で、受診は<b>就業時間内</b>に行われます。</p><p>・実施日　11月5日（水）〜7日（金）<br>・場所　　本社3階　会議室A<br>・持ち物　健康保険証、問診票（記入したもの）</p><p>問診票は、各部署の担当者から配られます。<b>前日までに</b>記入を終えてください。当日、会場での記入はできません。</p><p>3日間のうち、都合のよい日を各自で選んでください。部署ごとの割り当てはありません。ただし、混雑を避けるため、午前と午後のどちらかを担当者に伝えておいてください。</p><p>やむを得ず3日間とも受けられない場合は、11月20日までに外部の病院で受診し、結果を提出してください。費用は会社が負担します。</p><p>総務部</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"問診票について、正しいものはどれか。  ","opts":["当日、会場で書く  ","前日までに書いて持っていく  ","担当者が書いてくれる  ","必要ない"],"tag":"naiyou"},{"t":"q","id":"問2","text":"受診する日はどうやって決めるか。  ","opts":["部署ごとに決まっている  ","担当者が決める  ","自分で選ぶ  ","くじで決める"],"tag":"naiyou"},{"t":"q","id":"問3","text":"3日間とも受けられない社員は、どうすればよいか。  ","opts":["受けなくてよい  ","11月20日までに外部の病院で受け、結果を出す  ","来年受ける  ","総務部で受ける"],"tag":"joken"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>今年度</td><td>こんねんど</td><td>今年の4月からの1年</td><td>tahun fiskal ini</td></tr><tr><td>2</td><td>対象</td><td>たいしょう</td><td>あてはまる人・もの</td><td>sasaran</td></tr><tr><td>3</td><td>就業時間</td><td>しゅうぎょうじかん</td><td>働く時間</td><td>jam kerja</td></tr><tr><td>4</td><td>問診票</td><td>もんしんひょう</td><td>体の状態を書く用紙</td><td>formulir riwayat kesehatan</td></tr><tr><td>5</td><td>部署</td><td>ぶしょ</td><td>会社の中の分かれた組織</td><td>bagian / divisi</td></tr><tr><td>6</td><td>割り当て</td><td>わりあて</td><td>分けて決めること</td><td>pembagian / alokasi</td></tr><tr><td>7</td><td>混雑</td><td>こんざつ</td><td>人が多くて込むこと</td><td>kepadatan</td></tr><tr><td>8</td><td>避ける</td><td>さける</td><td>そうならないようにする</td><td>menghindari</td></tr><tr><td>9</td><td>やむを得ず</td><td>やむをえず</td><td>どうしようもなく</td><td>terpaksa</td></tr><tr><td>10</td><td>負担する</td><td>ふたんする</td><td>費用などを持つ</td><td>menanggung (biaya)</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①受身（〜られる）——ものごとを主語にする（Bentuk pasif）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞受身形</td><td>受診は就業時間内に<b>行われます</b>。</td></tr><tr><td>人 ＋ から ＋ 受身</td><td>担当者<b>から配られます</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：案内文では「会社が行う」ではなく「行われる」と書きます。<b>だれがするか</b>を言わずに済むためです。2018年の本試験でも出題されました。"},{"t":"p","v":"②〜ておく（前もってする）（Melakukan sebelumnya）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ おく</td><td>担当者に伝え<b>ておいて</b>ください。</td></tr><tr><td>（口語）〜とく</td><td>言っ<b>とく</b>ね。</td></tr></tbody></table>"},{"t":"p","v":"・「〜てある」（状態）とは違います。「〜ておく」は<b>準備の行為</b>です。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"費用は会社が（　　）します。  ","opts":["負担","対象","混雑","割り当て"]},{"t":"q","id":"2","drill":true,"text":"（　　）を避けるため、時間を分けます。  ","opts":["混雑","部署","対象","負担"]},{"t":"q","id":"3","drill":true,"text":"（　　）、今日は早退します。  ","opts":["やむを得ず","対象で","就業して","割り当てて"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"会議は3階で（　　）ます。  ","opts":["行われ","行い","行わせ","行え"]},{"t":"q","id":"5","drill":true,"text":"資料は前日までに配（　　）ます。  ","opts":["られ","り","らせ","れ"]},{"t":"q","id":"6","drill":true,"text":"先に確認し（　　）ください。  ","opts":["ておいて","てあって","ていて","てしまって"]}]},{"key":"火曜","title":"短文読解 ── お礼のメールを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>件名：先日はありがとうございました</p><p>山本工業　中村様</p><p>いつもお世話になっております。あおば商事の李と申します。</p><p>先日は、お忙しいところ工場をご案内いただき、誠にありがとうございました。実際に作業を拝見して、<u>①資料では分からなかったこと</u>がよく理解できました。とくに、部品を一つずつ手で確認しておられる様子が印象に残っております。</p><p>社内で報告しましたところ、上司の田村も一度お伺いしたいと申しております。来月の中ごろで、ご都合のよい日はございますでしょうか。2〜3日、候補をお知らせいただければ、こちらで調整いたします。</p><p>取り急ぎ、お礼を申し上げます。</p><p>あおば商事　李 明</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「資料では分からなかったこと」を、李さんはどのようにして理解したか。  ","opts":["資料をもう一度読んで  ","実際に作業を見て  ","中村さんに電話で聞いて  ","上司に教えてもらって"],"tag":"shiji"},{"t":"q","id":"問2","text":"このメールで、李さんが中村さんに頼んでいることは何か。  ","opts":["資料を送ること  ","来月の都合のよい日を知らせること  ","工場をもう一度案内すること  ","上司に連絡すること"],"tag":"naiyou"},{"t":"q","id":"問3","text":"李さんが印象に残ったのは、どんなことか。  ","opts":["工場が大きかったこと  ","部品を一つずつ手で確認していたこと  ","作業が速かったこと  ","資料がくわしかったこと"],"tag":"naiyou"},{"t":"q","id":"問4","text":"このメールの内容に合うものはどれか。  ","opts":["田村さんも工場を見たいと言っている  ","訪問の日はもう決まっている  ","李さんは工場に行っていない  ","中村さんが日程を調整する"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>誠に</td><td>まことに</td><td>本当に（かたい言い方）</td><td>sungguh / sangat</td></tr><tr><td>2</td><td>拝見する</td><td>はいけんする</td><td>「見る」の謙譲語</td><td>melihat (bentuk merendah)</td></tr><tr><td>3</td><td>印象</td><td>いんしょう</td><td>心に残る感じ</td><td>kesan</td></tr><tr><td>4</td><td>社内</td><td>しゃない</td><td>会社の中</td><td>di dalam perusahaan</td></tr><tr><td>5</td><td>上司</td><td>じょうし</td><td>自分より上の立場の人</td><td>atasan</td></tr><tr><td>6</td><td>伺う</td><td>うかがう</td><td>「行く・聞く」の謙譲語</td><td>berkunjung / bertanya (merendah)</td></tr><tr><td>7</td><td>申す</td><td>もうす</td><td>「言う」の謙譲語</td><td>berkata (merendah)</td></tr><tr><td>8</td><td>候補</td><td>こうほ</td><td>いくつかの選べる案</td><td>kandidat / pilihan</td></tr><tr><td>9</td><td>調整する</td><td>ちょうせいする</td><td>合うように直すこと</td><td>menyesuaikan</td></tr><tr><td>10</td><td>取り急ぎ</td><td>とりいそぎ</td><td>まずは急いで</td><td>untuk sementara / segera</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①謙譲語（自分の動作をへりくだる）（Bahasa merendahkan diri）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>言う → 申す</td><td>李と<b>申します</b>。</td></tr><tr><td>見る → 拝見する</td><td>資料を<b>拝見しました</b>。</td></tr><tr><td>行く・聞く → 伺う</td><td>来週<b>伺います</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：2018年の本試験でも「中田と（　　）」の答えが「申します」でした。<b>自分</b>には謙譲語、<b>相手</b>には尊敬語（おっしゃる・ご覧になる・いらっしゃる）。"},{"t":"p","v":"②〜ておられる（尊敬）（Bentuk hormat dari ~te iru）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ おられる</td><td>確認して<b>おられる</b>様子。</td></tr><tr><td>動詞て形 ＋ いらっしゃる</td><td>お待ちして<b>いらっしゃいます</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「〜ております」は自分。「〜ておられます」は相手。1文字違いで向きが逆になります。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"来週、そちらへ（　　）ます。  ","opts":["伺い","いらっしゃい","おっしゃい","ご覧になり"]},{"t":"q","id":"2","drill":true,"text":"日程の（　　）をいくつかお知らせください。  ","opts":["候補","印象","調整","社内"]},{"t":"q","id":"3","drill":true,"text":"（　　）、お礼まで申し上げます。  ","opts":["取り急ぎ","誠に","拝見し","伺い"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"私、山田と（　　）ます。  ","opts":["申し","おっしゃい","言われ","申され"]},{"t":"q","id":"5","drill":true,"text":"資料を（　　）ました。ありがとうございます。  ","opts":["拝見し","ご覧になり","見られ","拝見され"]},{"t":"q","id":"6","drill":true,"text":"部長は今、電話をして（　　）ます。  ","opts":["おられ","おり","あり","しまい"]}]},{"key":"水曜","title":"中文読解 ── エッセイを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　母から荷物が届いた。中に、見覚えのない小さな瓶が入っていた。手紙には「こちらでよく使う調味料です。合わなければ捨てて」と書いてある。</p><p>　その夜、いつもの野菜炒めに少し入れてみた。味は、想像とまるで違った。国で食べていたあの味が、台所いっぱいに広がったのである。私は箸を持ったまま、しばらく動けなかった。</p><p>　日本に来て四年になる。食べ物には慣れたつもりでいた。しょうゆも味噌も、今では自分で選んで買う。それなのに、①<u>たった一滴</u>で、四年分の距離が消えた。</p><p>　あとで母に電話をした。「おいしかったよ」と言うと、母は「そう」とだけ答えた。そして「食べ物は、体が覚えているからね」と続けた。</p><p>　②<u>その言葉</u>を、私はうまく説明できない。けれども、頭で覚えたことは忘れても、体が覚えたことは残るのだろうと思う。言葉も、そうであってほしい。教科書で覚えた日本語ではなく、毎日使って体にしみこんだ日本語が、いつか私の中に残ればいい。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「たった一滴」は、何のことか。  ","opts":["母の手紙  ","瓶に入っていた調味料  ","野菜炒めの油  ","しょうゆ"],"tag":"shiji"},{"t":"q","id":"問2","text":"「四年分の距離が消えた」とは、どういうことか。  ","opts":["国に帰りたくなった  ","国にいたころの感覚がすぐによみがえった  ","四年間が無駄だったと思った  ","日本の食べ物が嫌になった"],"tag":"shiji"},{"t":"q","id":"問3","text":"②「その言葉」とは何か。  ","opts":["おいしかったよ  ","そう  ","食べ物は、体が覚えているからね  ","合わなければ捨てて"],"tag":"shiji"},{"t":"q","id":"問4","text":"筆者が日本語について望んでいることはどれか。  ","opts":["教科書でしっかり覚えること  ","毎日使って体にしみこんだ日本語が残ること  ","早く上手になること  ","国の言葉を忘れないこと"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>見覚え</td><td>みおぼえ</td><td>前に見た記憶</td><td>ingatan pernah melihat</td></tr><tr><td>2</td><td>瓶</td><td>びん</td><td>ガラスの入れ物</td><td>botol</td></tr><tr><td>3</td><td>調味料</td><td>ちょうみりょう</td><td>味をつけるもの</td><td>bumbu</td></tr><tr><td>4</td><td>まるで</td><td>まるで</td><td>まったく（〜と違う）</td><td>sama sekali</td></tr><tr><td>5</td><td>広がる</td><td>ひろがる</td><td>大きく行きわたる</td><td>menyebar</td></tr><tr><td>6</td><td>箸</td><td>はし</td><td>食事に使う二本の棒</td><td>sumpit</td></tr><tr><td>7</td><td>一滴</td><td>いってき</td><td>一つのしずく</td><td>setetes</td></tr><tr><td>8</td><td>距離</td><td>きょり</td><td>へだたり</td><td>jarak</td></tr><tr><td>9</td><td>しみこむ</td><td>しみこむ</td><td>中まで入る</td><td>meresap</td></tr><tr><td>10</td><td>残る</td><td>のこる</td><td>あとまである</td><td>tersisa / tertinggal</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜つもりでいた（そう思いこんでいた）（Mengira bahwa ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞た形 ＋ つもりでいた</td><td>慣れた<b>つもりでいた</b>。</td></tr><tr><td>名詞 ＋ のつもりだった</td><td>冗談<b>のつもりだった</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜つもりだ」（意志）とは違います。「〜たつもりでいた」は<b>実際はそうでなかった</b>ときに使います。"},{"t":"p","v":"②〜のである（説明・強調）（Penegasan / penjelasan）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ のである</td><td>台所いっぱいに広がった<b>のである</b>。</td></tr><tr><td>普通形 ＋ のだろう</td><td>体が覚えたことは残る<b>のだろう</b>。</td></tr></tbody></table>"},{"t":"p","v":"・文章の締めくくりに使うと、そこが筆者の考えだと分かります。設問の答えになりやすい部分です。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"味が台所いっぱいに（　　）た。  ","opts":["広がっ","しみこん","残っ","見覚え"]},{"t":"q","id":"2","drill":true,"text":"その顔には（　　）がある。  ","opts":["見覚え","距離","一滴","調味料"]},{"t":"q","id":"3","drill":true,"text":"想像とは（　　）違っていた。  ","opts":["まるで","しみこんで","広がって","残って"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"説明した（　　）が、伝わっていなかった。  ","opts":["つもりでいた","ところだった","ばかりだった","ようだった"]},{"t":"q","id":"5","drill":true,"text":"そこに答えがあった（　　）。  ","opts":["のである","のでいる","そうである","ようになる"]},{"t":"q","id":"6","drill":true,"text":"体が覚えている（　　）と思う。  ","opts":["のだろう","のである","のだった","のでいる"]}]},{"key":"木曜","title":"中文読解 ── 意見文を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　「マニュアルどおりで、心がこもっていない」。接客について、こう言われることがある。私も以前はそう思っていた。しかし、ある店での経験から、<u>①考えが変わった</u>。</p><p>　その日、私は買った商品を交換したくて店に行った。応対した店員は、まだ若く、明らかに慣れていない様子だった。ところが手続きは早く、説明も分かりやすかった。緊張しているのに、必要なことは全部言えている。あとで気づいたが、彼女は決められた順番どおりに、一つずつ確認していただけなのだ。</p><p>　もし手順が決まっていなかったら、慣れない彼女は何から話せばいいか分からず、私はもっと待たされただろう。②<u>マニュアルは、彼女を守っていた</u>のである。</p><p>　もちろん、マニュアルだけでは足りない場面もある。想定外のことが起きたとき、判断するのは人だ。けれども「心」は、土台があってはじめて働く。何をすればいいか分からず頭が真っ白な人に、心を配る余裕はない。</p><p>　マニュアルは、心をなくすものではなく、<b>心を使う余裕を作るもの</b>だと、今の私は思っている。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「考えが変わった」とあるが、前はどう思っていたか。  ","opts":["マニュアルは大切だ  ","マニュアルどおりでは心がこもらない  ","店員は若いほうがよい  ","手続きは早いほうがよい"],"tag":"shiji"},{"t":"q","id":"問2","text":"店員の応対が分かりやすかったのは、なぜか。  ","opts":["経験が長かったから  ","決められた順番どおりに確認していたから  ","緊張していなかったから  ","筆者が説明したから"],"tag":"naiyou"},{"t":"q","id":"問3","text":"②「マニュアルは、彼女を守っていた」とは、どういうことか。  ","opts":["客からの苦情を防いだ  ","慣れない店員でも必要なことを言えるようにした  ","店員の仕事を減らした  ","店員の給料を上げた"],"tag":"shiji"},{"t":"q","id":"問4","text":"筆者の考えに合うものはどれか。  ","opts":["マニュアルは心をなくすものだ  ","マニュアルがあれば心はいらない  ","マニュアルは心を使う余裕を作る  ","想定外のことは起きない"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>接客</td><td>せっきゃく</td><td>客に応対すること</td><td>pelayanan pelanggan</td></tr><tr><td>2</td><td>こもる</td><td>こもる</td><td>中に入っている（心が〜）</td><td>terkandung</td></tr><tr><td>3</td><td>交換</td><td>こうかん</td><td>取りかえること</td><td>penukaran</td></tr><tr><td>4</td><td>応対する</td><td>おうたいする</td><td>相手をして受け答えする</td><td>melayani / menanggapi</td></tr><tr><td>5</td><td>明らかに</td><td>あきらかに</td><td>はっきりと</td><td>jelas / nyata</td></tr><tr><td>6</td><td>手順</td><td>てじゅん</td><td>やる順番</td><td>urutan kerja</td></tr><tr><td>7</td><td>想定外</td><td>そうていがい</td><td>考えていなかったこと</td><td>di luar dugaan</td></tr><tr><td>8</td><td>判断する</td><td>はんだんする</td><td>考えて決めること</td><td>memutuskan</td></tr><tr><td>9</td><td>土台</td><td>どだい</td><td>いちばん下の支え</td><td>fondasi</td></tr><tr><td>10</td><td>余裕</td><td>よゆう</td><td>ゆとり。あまり</td><td>kelonggaran / ruang</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜たら〜だろう（もし〜なら）（Seandainya ~, mungkin ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞た形 ＋ ら〜だろう</td><td>決まっていなかっ<b>たら</b>、待たされた<b>だろう</b>。</td></tr><tr><td>〜なかったら〜</td><td>手順がなかっ<b>たら</b>、困ったはずだ。</td></tr></tbody></table>"},{"t":"passage","v":"注意：実際には起きなかったことを想像する言い方です。本試験の読解でも、この形が「筆者の考え」を示すことがあります。"},{"t":"p","v":"②〜てはじめて（〜してから、やっと）（Baru setelah ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ はじめて</td><td>土台があっ<b>てはじめて</b>働く。</td></tr><tr><td>名詞 ＋ になってはじめて</td><td>親になっ<b>てはじめて</b>分かった。</td></tr></tbody></table>"},{"t":"p","v":"・「〜てから」より強く、「それがないと成り立たない」という意味になります。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"（　　）どおりに一つずつ確認する。  ","opts":["手順","土台","余裕","接客"]},{"t":"q","id":"2","drill":true,"text":"（　　）のことが起きたら、人が判断する。  ","opts":["想定外","明らか","交換","応対"]},{"t":"q","id":"3","drill":true,"text":"忙しくて、心を配る（　　）がない。  ","opt 0分／情報検索6分。</p>"},{"t":"h2","v":"問題1　中文（3問）"},{"t":"passage","v":"<p>　道を聞かれるのが、昔は苦手だった。正しく案内できる自信がなかったからだ。あいまいに答えて相手を迷わせたら申し訳ない。そう思って、聞かれそうになると目をそらしていた。</p><p>　あるとき、駅前で年配の女性に病院の場所を聞かれた。いつものように迷ったが、「たぶんあちらですが、自信がありません」と正直に言ってみた。すると女性は「そう、ありがとう」と笑って、別の人にも同じことを聞きに行った。</p><p>　私は、自分が全部を引き受けなければならないと思い込んでいた。知っている分だけ答えて、あとは次の人に渡せばいい。それで足りるのだ。</p>"},{"t":"q","id":"問1","text":"筆者が道を聞かれるのが苦手だった理由はどれか。  ","opts":["人と話すのが嫌いだから  ","正しく案内できる自信がなかったから  ","道を知らないから  ","時間がなかったから"],"tag":"naiyou"},{"t":"q","id":"問2","text":"年配の女性は、筆者の答えを聞いてどうしたか。  ","opts":["怒った  ","別の人にも聞きに行った  ","病院をあきらめた  ","筆者に案内を頼んだ"],"tag":"naiyou"},{"t":"q","id":"問3","text":"筆者が気づいたことはどれか。  ","opts":["道を全部覚えるべきだ  ","知っている分だけ答えればよい  ","正直に言うのは失礼だ  ","人に聞かないほうがよい"],"tag":"naiyou"},{"t":"h2","v":"問題2　中文（3問）"},{"t":"passage","v":"<p>　新しい掃除機を買った。前のものより軽く、音も静かだ。ところが使い始めて一週間で、私は前の掃除機のほうが好きだったと気づいた。</p><p>　理由は簡単で、前のものは音が大きかったからだ。音が大きいと、家族は「掃除しているな」と分かる。静かな掃除機だと、誰も気づかない。気づかれないと、手伝おうという人も出てこない。</p><p>　便利さは、たいてい「一人で完結すること」を意味する。けれども家事は、一人で完結してしまうと、一人のものになる。道具が良くなるほど、分担は難しくなるのかもしれない。</p>"},{"t":"q","id":"問4","text":"筆者が前の掃除機のほうが好きだった理由はどれか。  ","opts":["軽かったから  ","音が大きくて、家族が気づいたから  ","安かったから  ","よく汚れが取れたから"],"tag":"naiyou"},{"t":"q","id":"問5","text":"「便利さは、たいてい『一人で完結すること』を意味する」とはどういうことか。  ","opts":["便利になると、人の手を借りずに済むということ  ","便利になると、人が集まるということ  ","便利なものは高いということ  ","便利さは長続きしないということ"],"tag":"shiji"},{"t":"q","id":"問6","text":"筆者の考えに合うものはどれか。  ","opts":["道具は新しいほうがよい  ","道具が良くなるほど、家事の分担は難しくなるかもしれない  ","掃除機は音が大きいほうがよく汚れが取れる  ","家事は一人でするべきだ"],"tag":"shucho"},{"t":"h2","v":"問題3　長文（4問）"},{"t":"passage","v":"<p>　職場に新しい人が入ると、私はまず「分からないことがあったら聞いてください」と言う。長い間、これが親切だと思っていた。</p><p>　考えが変わったのは、自分が新しい部署に移ったときだ。同じ言葉をかけられて、私は一度も質問できなかった。<u>①理由は自分でもよく分かっていた</u>。何が分からないのかが分からない。それに、みんな忙しそうで、声をかける「すきま」がない。</p><p>　三日目、隣の席の人が「今、五分だけ空いてるんですけど、何かありますか」と言った。その瞬間、質問が三つも出てきた。不思議なもので、②<u>聞いてよい時間だと分かった途端に、疑問が形になった</u>のである。</p><p>　「いつでも聞いて」は、言い換えれば「聞く時間は決まっていない」ということだ。決まっていないものに、人は入っていきにくい。五分でいい。<b>区切られた時間</b>のほうが、無限に開かれた時間よりも入りやすい。</p><p>　今、私は新しい人にこう言う。「毎日四時に、五分だけ時間を取ります」。親切な言葉より、確かな五分のほうが役に立つ。</p>"},{"t":"q","id":"問7","text":"①「理由は自分でもよく分かっていた」とあるが、その理由として本文に書かれていないものはどれか。  ","opts":["何が分からないのかが分からない  ","みんな忙しそうで声をかけにくい  ","声をかけるすきまがない  ","質問すると怒られる"],"tag":"naiyou"},{"t":"q","id":"問8","text":"隣の席の人は、何と言ったか。  ","opts":["いつでも聞いてください  ","今、五分だけ空いていますが、何かありますか  ","質問はありませんか  ","忙しいのであとにしてください"],"tag":"naiyou"},{"t":"q","id":"問9","text":"②「聞いてよい時間だと分かった途端に、疑問が形になった」とは、どういうことか。  ","opts":["質問の内容を思い出した  ","聞ける時間が決まったら、質問がすぐに出てきた  ","疑問がなくなった  ","時間が足りなくなった"],"tag":"shiji"},{"t":"q","id":"問10","text":"筆者が最も言いたいことはどれか。  ","opts":["やさしい言葉をかけるべきだ  ","新しい人は自分から聞くべきだ  ","区切られた短い時間のほうが質問しやすい  ","質問は四時にするべきだ"],"tag":"shucho"},{"t":"h2","v":"問題4　情報検索（3問）"},{"t":"passage","v":"<p><b>みどり図書館　パソコン講座のご案内</b></p><table><thead><tr><th>講座</th><th>日時</th><th>定員</th><th>対象</th><th>費用</th></tr></thead><tbody><tr><td>①　文書の作り方</td><td>11/8（土）10:00〜12:00</td><td>10名</td><td>市内在住・在勤</td><td>500円</td></tr><tr><td>②　表計算の基本</td><td>11/15（土）10:00〜12:00</td><td>10名</td><td>①を受けた人</td><td>500円</td></tr><tr><td>③　インターネット入門</td><td>11/8（土）14:00〜16:00</td><td>15名</td><td>どなたでも</td><td>無料</td></tr><tr><td>④　写真の整理</td><td>11/22（土）14:00〜16:00</td><td>8名</td><td>どなたでも</td><td>800円</td></tr></tbody></table><p>◆パソコンは図書館が用意します。持ち込みもできます。</p><p>◆申し込みは10月25日から。<b>電話または窓口</b>で、先着順です。</p><p>◆定員に達した講座は、キャンセル待ちを受け付けます。空きが出た場合のみ、こちらからご連絡します。</p><p>◆②は①を受けた方だけが申し込めます。同じ日に①と③の両方を受けることもできます。</p>"},{"t":"q","id":"問11","text":"11月8日に、①と③の両方を受けることはできるか。  ","opts":["できない  ","できる  ","①だけできる  ","③だけできる"],"tag":"joken"},{"t":"q","id":"問12","text":"②を受けたい人は、どうしなければならないか。  ","opts":["先に①を受ける  ","市外に住んでいる  ","パソコンを持っていく  ","800円払う"],"tag":"joken"},{"t":"q","id":"問13","text":"この案内の内容に合うものはどれか。  ","opts":["申し込みはインターネットでできる  ","定員に達したら、キャンセル待ちができる  ","パソコンは必ず持っていく  ","③は市内在住の人だけが受けられる"],"tag":"naiyou"}]},{"key":"日曜","title":"聴解30分 ＋ 復習30分","blocks":[{"t":"h2","v":"Part 1　聴解（20分・7問）"},{"t":"passage","v":"<p>注意：この紙には会話は書いてありません。音を聞いて答えます。会話は1回だけ流れます。メモを取ってもかまいません。</p>"},{"t":"h3","v ,"s":3},{"k":"line","sp":"女","v":"こちら、5,000円ですが、今日は会員の方は1割引きになります。"},{"k":"line","sp":"男","v":"あ、会員証あります。"},{"k":"line","sp":"女","v":"では、こちらのお値段で。"},{"k":"pause","s":8,"a":true}]},{"no":"問4","label":"男の人が困っていることは何ですか","answer":"4　説明の順番が分からないこと","why":"「量が多い」「時間がない」も出るが、最後に「どこから話せば」が中心。","steps":[{"k":"q","v":"男の人が困っていることは、何ですか。"},{"k":"pause","s":3},{"k":"line","sp":"女","v":"資料、できましたか。"},{"k":"line","sp":"男","v":"量は書けたんですが……。"},{"k":"line","sp":"女","v":"時間が足りませんか。"},{"k":"line","sp":"男","v":"いえ、時間はあります。ただ、どこから話せばいいのか、順番が決められなくて。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題3　即時応答","hint":"短い文を聞いて、1〜3から合う返事を選びます。","items":[{"no":"問5","label":"返事を選ぶ","answer":"1　はい、承知しました","why":"指示を受けたときの丁寧な返事。","steps":[{"k":"line","sp":"男","v":"この件、明日までにまとめておいてください。"},{"k":"line","sp":"女","v":"1、はい、承知しました。"},{"k":"line","sp":"女","v":"2、はい、まとめてあります。"},{"k":"line","sp":"女","v":"3、いいえ、明日です。"},{"k":"pause","s":8,"a":true}]},{"no":"問6","label":"返事を選ぶ","answer":"2　いえ、まだ伺っておりません","why":"「聞いていない」を謙譲語で言う。","steps":[{"k":"line","sp":"女","v":"その話、部長からお聞きになりましたか。"},{"k":"line","sp":"男","v":"1、はい、申し上げました。"},{"k":"line","sp":"男","v":"2、いえ、まだ伺っておりません。"},{"k":"line","sp":"男","v":"3、はい、おっしゃいました。"},{"k":"pause","s":8,"a":true}]},{"no":"問7","label":"返事を選ぶ","answer":"3　では、また改めます","why":"相手が忙しいと分かったときの引き方。","steps":[{"k":"line","sp":"女","v":"申し訳ありません、ただ今、席を外しております。"},{"k":"line","sp":"男","v":"1、では、お待ちしております。"},{"k":"line","sp":"男","v":"2、では、お伝えください。"},{"k":"line","sp":"男","v":"3、では、また改めます。"},{"k":"pause","s":8,"a":true}]}]}]},"9":{"days":[{"key":"月曜","title":"短文読解 ── 回覧を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>【回覧】自転車置き場の使い方について</b></p><p>マンションの自転車置き場について、「自分の自転車が出しにくい」というご意見が続いています。原因を調べたところ、<u>①長い間動かされていない自転車</u>が15台ありました。</p><p>これらには、9月1日に黄色の札を付けます。使っている方は、<b>9月30日までに札を外して</b>ください。外されなかった自転車は、10月に管理室で預かります。預かった自転車は3か月間保管し、その後は処分することがあります。</p><p>なお、札を外すだけでけっこうです。管理室への連絡は必要ありません。</p><p>みどりマンション管理組合</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「長い間動かされていない自転車」は、どうなるか。  ","opts":["すぐに処分される  ","黄色の札が付けられる  ","管理室に運ばれる  ","ご意見が書かれる"],"tag":"shiji"},{"t":"q","id":"問2","text":"自転車を使っている人は、何をすればよいか。  ","opts":["管理室に連絡する  ","9月30日までに札を外す  ","自転車を移動する  ","何もしなくてよい"],"tag":"joken"},{"t":"q","id":"問3","text":"この回覧の内容に合うものはどれか。  ","opts":["預かった自転車はすぐ処分される  ","札を外したら管理室に連絡する  ","預かった自転車は3か月保管される  ","札は10月に付けられる"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>回覧</td><td>かいらん</td><td>順番に回して読む文書</td><td>surat edaran</td></tr><tr><td>2</td><td>意見</td><td>いけん</td><td>考え。言い分</td><td>pendapat</td></tr><tr><td>3</td><td>原因</td><td>げんいん</td><td>そうなったもと</td><td>penyebab</td></tr><tr><td>4</td><td>札</td><td>ふだ</td><td>小さな紙や板の目印</td><td>label / tanda</td></tr><tr><td>5</td><td>外す</td><td>はずす</td><td>取ってしまう</td><td>melepas</td></tr><tr><td>6</td><td>預かる</td><td>あずかる</td><td>人のものを一時受け取る</td><td>menitipkan / menyimpan</td></tr><tr><td>7</td><td>保管する</td><td>ほかんする</td><td>しまっておくこと</td><td>menyimpan</td></tr><tr><td>8</td><td>処分する</td><td>しょぶんする</td><td>捨てること</td><td>membuang / memproses</td></tr><tr><td>9</td><td>なお</td><td>なお</td><td>それに加えて</td><td>selain itu</td></tr><tr><td>10</td><td>管理組合</td><td>かんりくみあい</td><td>建物を管理する住民の組織</td><td>asosiasi pengelola</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜たところ（〜してみたら）（Setelah mencoba ~, ternyata）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞た形 ＋ ところ</td><td>調べ<b>たところ</b>、15台ありました。</td></tr><tr><td>（結果を述べる）</td><td>聞いてみ<b>たところ</b>、休みだった。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜たら」より書き言葉です。<b>やってみた結果、こうだった</b>と報告するときに使います。"},{"t":"p","v":"②〜ことがあります（ときどきそうなる）（Kadang ~ terjadi）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ ことがある</td><td>処分する<b>ことがあります</b>。</td></tr><tr><td>動詞た形 ＋ ことがある（経験）</td><td>行っ<b>たことがあります</b>。</td></tr></tbody></table>"},{"t":"p","v":"・辞書形なら「ときどき起こる」、た形なら「経験」。1文字で意味が変わります。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"黄色い（　　）を付けます。  ","opts":["札","回覧","原因","意見"]},{"t":"q","id":"2","drill":true,"text":"3か月間（　　）します。  ","opts":["保管","処分","外","預かり"]},{"t":"q","id":"3","drill":true,"text":"調べて（　　）が分かった。  ","opts":["原因","回覧","札","なお"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"電話してみ（　　）、留守だった。  ","opts":["たところ","たとたん","たばかり","たまま"]},{"t":"q","id":"5","drill":true,"text":"雨で中止になる（　　）あります。  ","opts":["ことが","ものが","はずが","わけが"]},{"t":"q","id":"6","drill":true,"text":"一度、京都へ行っ（　　）あります。  ","opts":["たことが","ることが","ていることが","たものが"]}]},{"key":"火曜","title":"短文読解 ── 断りのメールを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>件名：見学のお申し込みについて</p><p>さくら日本語学校　佐野様</p><p>お世話になっております。あおば製作所の高橋です。</p><p>このたびは、工場見学のお申し込みをいただき、ありがとうございました。</p><p>さっそくご希望の11月10日で調整いたしましたが、あいにくその週は設備の点検が入っており、<u>①ご案内が難しい状況です</u>。せっかくお申し込みいただいたのに、申し訳ございません。</p><p>つきましては、11月17日か24日であればご案内できます。どちらも午後2時から1時間ほどの予定です。ご都合はいかがでしょうか。</p><p>また、人数は20名までとさせていただいております。それ以上の場合は、2回に分けてのご案内となりますので、あらかじめお知らせください。</p><p>あおば製作所　高橋 実</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「ご案内が難しい状況です」の理由は何か。  ","opts":["人数が多すぎるから  ","その週は設備の点検があるから  ","担当者が休みだから  ","工場が閉まっているから"],"tag":"naiyou"},{"t":"q","id":"問2","text":"高橋さんが提案している日はいつか。  ","opts":["11月10日  ","11月17日か24日  ","11月中ならいつでも  ","12月"],"tag":"naiyou"},{"t":"q","id":"問3","text":"25名で見学したい場合、どうなるか。  ","opts":["見学できない  ","2回に分けて案内される  ","5名減らす必要がある  ","別の工場になる"],"tag":"joken"},{"t":"q","id":"問4","text":"このメールの内容に合うものはどれか。  ","opts":["見学は断られた  ","見学の時間は午前中である  ","別の日なら見学できる  ","人数の制限はない"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>見学</td><td>けんがく</td><td>見て学ぶこと</td><td>kunjungan belajar</td></tr><tr><td>2</td><td>さっそく</td><td>さっそく</td><td>すぐに</td><td>segera</td></tr><tr><td>3</td><td>調整</td><td>ちょうせい</td><td>合うように直すこと</td><td>penyesuaian</td></tr><tr><td>4</td><td>あいにく</td><td>あいにく</td><td>都合の悪いことに</td><td>sayangnya</td></tr><tr><td>5</td><td>設備</td><td>せつび</td><td>機械や装置</td><td>peralatan / fasilitas</td></tr><tr><td>6</td><td>点検</td><td>てんけん</td><td>調べること</td><td>pemeriksaan</td></tr><tr><td>7</td><td>状況</td><td>じょうきょう</td><td>そのときの様子</td><td>situasi</td></tr><tr><td>8</td><td>つきましては</td><td>つきましては</td><td>そこで（かたい）</td><td>sehubungan dengan itu</td></tr><tr><td>9</td><td>あらかじめ</td><td>あらかじめ</td><td>前もって</td><td>sebelumnya</td></tr><tr><td>10</td><td>せっかく</td><td>せっかく</td><td>わざわざ。努力して</td><td>dengan susah payah</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜とさせていただきます（ていねいに決まりを伝える）（Kami tetapkan ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ とさせていただきます</td><td>20名まで<b>とさせていただいております</b>。</td></tr><tr><td>動詞使役て形 ＋ いただきます</td><td>休ま<b>せていただきます</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：自分の側の決定を、相手にことわって伝える形です。店や会社の案内で非常によく使われます。"},{"t":"p","v":"②〜ており（〜ていて。かたい言い方）（Bentuk formal dari ~te ite）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ おり、〜</td><td>点検が入っ<b>ており</b>、案内できません。</td></tr><tr><td>動詞て形 ＋ おります</td><td>承っ<b>ております</b>。</td></tr></tbody></table>"},{"t":"p","v":"・自分側のことに使います。相手には「〜ていらっしゃいます」。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"（　　）その日は予定があります。  ","opts":["あいにく","さっそく","あらかじめ","せっかく"]},{"t":"q","id":"2","drill":true,"text":"（　　）ご連絡ください。  ","opts":["あらかじめ","あいにく","つきましては","さっそく"]},{"t":"q","id":"3","drill":true,"text":"機械の（　　）を行います。  ","opts":["点検","状況","調整","見学"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"本日は休業（　　）ます。  ","opts":["とさせていただき","とさせてください","になさい","とされ"]},{"t":"q","id":"5","drill":true,"text":"工事が入っ（　　）、通れません。  ","opts":["ており","ておき","てあり","ていらっしゃり"]},{"t":"q","id":"6","drill":true,"text":"先に帰ら（　　）ます。  ","opts":["せていただき","れていただき","させられ","せてくださり"]}]},{"key":"水曜","title":"中文読解 ── エッセイを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　日本語学校に通っていたころ、先生が「毎日ノートに三行書きなさい」と言った。内容は何でもいい。ただし、必ず日本語で、必ず毎日。</p><p>　最初はつまらなかった。「今日は雨でした。寒かったです。早く寝ます」。こんな文が何十日も続いた。こんなもので上手になるのかと疑っていた。</p><p>　変化に気づいたのは、半年ほどたったころだ。ある日、書こうとして手が止まった。「うれしかった」と書きかけて、<u>①それでは足りない</u>と感じたのである。その日あったことは、「うれしい」の一言では収まらない何かだった。私は辞書を引いて、「ほっとした」という言葉を見つけた。</p><p>　そのときはじめて分かった。この宿題は、日本語を覚えるためのものではなかった。<b>自分の気持ちに合う言葉をさがす</b>練習だったのだ。言葉が増えると、気持ちが細かく見えてくる。見えてくると、また言葉が要る。</p><p>　②<u>その繰り返し</u>が、今も続いている。ノートはもう十冊を超えた。相変わらず三行だが、同じ三行ではないと思っている。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「それでは足りない」の「それ」は何か。  ","opts":["三行という長さ  ","「うれしかった」という言葉  ","辞書  ","半年という時間"],"tag":"shiji"},{"t":"q","id":"問2","text":"筆者は、この宿題が何のための練習だったと気づいたか。  ","opts":["漢字を覚える練習  ","自分の気持ちに合う言葉をさがす練習  ","速く書く練習  ","毎日続ける練習"],"tag":"naiyou"},{"t":"q","id":"問3","text":"②「その繰り返し」とは何か。  ","opts":["毎日三行書くこと  ","言葉が増えると気持ちが細かく見え、また言葉が要ること  ","辞書を引くこと  ","ノートを買うこと"],"tag":"shiji"},{"t":"q","id":"問4","text":"「同じ三行ではない」とは、どういう意味か。  ","opts":["行数が変わった  ","内容や言葉の選び方が前とは違う  ","字がきれいになった  ","毎日書かなくなった"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>内容</td><td>ないよう</td><td>中身</td><td>isi</td></tr><tr><td>2</td><td>疑う</td><td>うたがう</td><td>本当かどうか信じられない</td><td>meragukan</td></tr><tr><td>3</td><td>変化</td><td>へんか</td><td>変わること</td><td>perubahan</td></tr><tr><td>4</td><td>書きかける</td><td>かきかける</td><td>書き始めて途中でやめる</td><td>mulai menulis lalu berhenti</td></tr><tr><td>5</td><td>収まる</td><td>おさまる</td><td>その中にきちんと入る</td><td>tertampung / muat</td></tr><tr><td>6</td><td>ほっとする</td><td>ほっとする</td><td>安心する</td><td>merasa lega</td></tr><tr><td>7</td><td>細かい</td><td>こまかい</td><td>小さく、くわしい</td><td>detail / halus</td></tr><tr><td>8</td><td>要る</td><td>いる</td><td>必要である</td><td>diperlukan</td></tr><tr><td>9</td><td>繰り返し</td><td>くりかえし</td><td>同じことを何度もすること</td><td>pengulangan</td></tr><tr><td>10</td><td>相変わらず</td><td>あいかわらず</td><td>前と同じで</td><td>seperti biasa</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜かける（〜し始めて途中でやめる）（Mulai ~ tapi berhenti）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ かける</td><td>書き<b>かけて</b>、手が止まった。</td></tr><tr><td>動詞ます形 ＋ かけの ＋ 名詞</td><td>読み<b>かけの</b>本。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜始める」は始まって続く。「〜かける」は<b>途中で止まっている</b>。違いに注意します。"},{"t":"p","v":"②〜てくる（変化がこちらへ向かう）（Perubahan menuju sekarang）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ くる</td><td>気持ちが細かく見え<b>てくる</b>。</td></tr><tr><td>動詞て形 ＋ いく</td><td>これから増え<b>ていく</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「〜てくる」は過去から今へ、「〜ていく」は今から未来へ。向きが逆です。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"知らせを聞いて（　　）した。  ","opts":["ほっと","うたがい","おさまり","くりかえし"]},{"t":"q","id":"2","drill":true,"text":"（　　）忙しくしています。  ","opts":["相変わらず","細かく","要って","疑って"]},{"t":"q","id":"3","drill":true,"text":"この箱には（　　）らない。  ","opts":["収ま","要","疑","変化"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"読み（　　）の本が机にある。  ","opts":["かけ","はじめ","おわり","つづけ"]},{"t":"q","id":"5","drill":true,"text":"だんだん寒くなっ（　　）た。  ","opts":["てき","ていっ","ておい","てしまっ"]},{"t":"q","id":"6","drill":true,"text":"これから人が増え（　　）でしょう。  ","opts":["ていく","てくる","ておく","てある"]}]},{"key":"木曜","title":"中文読解 ── 意見文を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　「若い人は本を読まなくなった」と言われる。調査を見ると、たしかに紙の本を読む時間は減っている。しかし、この数字だけで<u>①「読まなくなった」と言えるだろうか</u>。</p><p>　電車の中を見ればいい。ほとんどの人が画面を見ている。そこで読まれているのは、記事であり、説明であり、誰かの書いた長い文章だ。文字を追う時間は、むしろ増えているのではないか。</p><p>　もちろん、違いはある。本は最初から最後まで、書いた人の順番で読む。画面の文章は、途中でやめて別のものに移れる。この「移りやすさ」が、②<u>読み方そのものを変えている</u>のは確かだろう。</p><p>　だから問題は「読むか読まないか」ではなく、「<b>最後まで読む力</b>が育っているか」だと私は思う。長い文章を、途中で投げ出さずに読み通す。この力は、本でなくても育てられる。逆に、本を持っていても、数ページで置いてしまえば育たない。</p><p>　紙か画面かではない。最後まで行くかどうかである。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「『読まなくなった』と言えるだろうか」と筆者が疑うのはなぜか。  ","opts":["調査が間違っているから  ","画面で文章を読む時間が増えているから  ","若い人は本を買っているから  ","数字が古いから"],"tag":"naiyou"},{"t":"q","id":"問2","text":"本と画面の文章の違いとして、筆者が挙げているものはどれか。  ","opts":["値段が違う  ","画面は途中でやめて別のものに移りやすい  ","本のほうが字が大きい  ","画面は目が疲れる"],"tag":"naiyou"},{"t":"q","id":"問3","text":"②「読み方そのものを変えている」のは何か。  ","opts":["本の値段  ","画面の明るさ  ","移りやすさ  ","文章の長さ"],"tag":"shiji"},{"t":"q","id":"問4","text":"筆者が最も言いたいことはどれか。  ","opts":["紙の本のほうがよい  ","画面のほうがよい  ","大事なのは最後まで読み通す力である  ","若い人は本を読むべきだ"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>調査</td><td>ちょうさ</td><td>調べること</td><td>survei / penelitian</td></tr><tr><td>2</td><td>たしかに</td><td>たしかに</td><td>そのとおり（認める）</td><td>memang benar</td></tr><tr><td>3</td><td>数字</td><td>すうじ</td><td>数で表したもの</td><td>angka / data</td></tr><tr><td>4</td><td>画面</td><td>がめん</td><td>スクリーン</td><td>layar</td></tr><tr><td>5</td><td>記事</td><td>きじ</td><td>新聞などの文章</td><td>artikel</td></tr><tr><td>6</td><td>追う</td><td>おう</td><td>後を追いかける</td><td>mengikuti / mengejar</td></tr><tr><td>7</td><td>むしろ</td><td>むしろ</td><td>どちらかといえば逆に</td><td>malah / justru</td></tr><tr><td>8</td><td>投げ出す</td><td>なげだす</td><td>途中でやめる</td><td>menyerah di tengah jalan</td></tr><tr><td>9</td><td>読み通す</td><td>よみとおす</td><td>最後まで読む</td><td>membaca sampai selesai</td></tr><tr><td>10</td><td>育つ</td><td>そだつ</td><td>大きくなる。身につく</td><td>tumbuh / berkembang</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜のではないか（やわらかい主張・問いかけ）（Bukankah ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ のではないか</td><td>増えている<b>のではないか</b>。</td></tr><tr><td>普通形 ＋ のではないだろうか</td><td>必要な<b>のではないだろうか</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：意見文の<b>結び</b>によく出ます。ここが筆者の主張であることが多いので、設問の答えになりやすい部分です。"},{"t":"p","v":"②〜ずに（〜しないで。かたい言い方）（Tanpa ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ない形（ない→ずに）</td><td>投げ出さ<b>ずに</b>読み通す。</td></tr><tr><td>する → せずに</td><td>確認<b>せずに</b>出した。</td></tr></tbody></table>"},{"t":"p","v":"・「する」だけ「せずに」です。「しずに」は誤りなので注意します。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"途中で（　　）ないで最後までやる。  ","opts":["投げ出さ","読み通さ","育た","追わ"]},{"t":"q","id":"2","drill":true,"text":"減るどころか（　　）増えている。  ","opts":["むしろ","たしかに","なお","あいにく"]},{"t":"q","id":"3","drill":true,"text":"（　　）の結果が出た。  ","opts":["調査","記事","画面","数字"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"もう少し話し合うべきな（　　）。  ","opts":["のではないか","わけではないか","ものではないか","ことではないか"]},{"t":"q","id":"5","drill":true,"text":"相談（　　）決めてしまった。  ","opts":["せずに","しずに","さずに","しないずに"]},{"t":"q","id":"6","drill":true,"text":"あわて（　　）、ゆっくり読もう。  ","opts":["ずに","なくて","ないで済んで","ずには"]}]},{"key":"金曜","title":"情報検索 ── 貸し会議室の案内を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>みなと市民センター　貸し会議室のご案内</b></p><table><thead><tr><th>部屋</th><th>定員</th><th>1時間の料金</th><th>使える設備</th><th>利用できる時間</th></tr></thead><tbody><tr><td>ア　第1会議室</td><td>40名</td><td>1,200円</td><td>マイク・プロジェクター</td><td>9:00〜21:00</td></tr><tr><td>イ　第2会議室</td><td>20名</td><td>800円</td><td>マイク</td><td>9:00〜21:00</td></tr><tr><td>ウ　和室</td><td>15名</td><td>600円</td><td>なし</td><td>9:00〜17:00</td></tr><tr><td>エ　調理室</td><td>24名</td><td>1,000円</td><td>ガス・調理器具</td><td>9:00〜17:00</td></tr></tbody></table><p>◆申し込みは、利用日の3か月前から3日前まで、窓口またはインターネットで受け付けます。電話でのお申し込みは受け付けておりません。</p><p>◆料金は、申し込みのときにお支払いください。<b>市内にお住まいの方に限り、料金が半額</b>になります。窓口で住所の分かるものをお見せください。</p><p>◆調理室は、利用の前に説明を受けてからでないとお使いになれません。説明は毎週水曜日の午後3時から、1階事務室で行っています。</p><p>◆取り消しは利用日の前日まで。当日の取り消しは料金をお返しできません。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"市内に住んでいる山田さんが、第2会議室を2時間借りるとき、料金はいくらか。  ","opts":["400円  ","800円  ","1,600円  ","3,200円"],"tag":"joken"},{"t":"q","id":"問2","text":"今週の金曜日に、はじめて調理室を使いたい人がしなければならないことはどれか。  ","opts":["前の日に電話で申し込む  ","水曜日の説明を受けておく  ","当日、朝9時に窓口へ行く  ","和室もいっしょに申し込む"],"tag":"joken"},{"t":"q","id":"問3","text":"この案内の内容に合うものはどれか。  ","opts":["電話でも申し込むことができる  ","利用日の当日に取り消しても料金は戻る  ","和室は夜7時まで使える  ","申し込みは利用日の3日前まで受け付ける"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>定員</td><td>ていいん</td><td>入れる人数の決まり</td><td>kapasitas / jumlah maksimal</td></tr><tr><td>2</td><td>料金</td><td>りょうきん</td><td>使うときに払うお金</td><td>biaya / tarif</td></tr><tr><td>3</td><td>設備</td><td>せつび</td><td>建物にそなえてある道具</td><td>fasilitas</td></tr><tr><td>4</td><td>半額</td><td>はんがく</td><td>値段の半分</td><td>setengah harga</td></tr><tr><td>5</td><td>住所</td><td>じゅうしょ</td><td>住んでいる場所</td><td>alamat</td></tr><tr><td>6</td><td>器具</td><td>きぐ</td><td>道具</td><td>peralatan</td></tr><tr><td>7</td><td>事務室</td><td>じむしつ</td><td>手続きをする部屋</td><td>ruang administrasi</td></tr><tr><td>8</td><td>取り消し</td><td>とりけし</td><td>申し込みをやめること</td><td>pembatalan</td></tr><tr><td>9</td><td>受け付ける</td><td>うけつける</td><td>申し込みを受ける</td><td>menerima (pendaftaran)</td></tr><tr><td>10</td><td>前日</td><td>ぜんじつ</td><td>その日の前の日</td><td>sehari sebelumnya</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜に限り／〜に限って（〜だけ）（Khusus ~ saja）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ に限り</td><td>市内にお住まいの方<b>に限り</b>、半額です。</td></tr><tr><td>名詞 ＋ に限って</td><td>今日<b>に限って</b>、雨が降った。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「に限り」は案内・掲示で「〜だけ特別に」。「に限って」は話しことばで「よりによってその日だけ」という残念な気持ちにも使います。"},{"t":"p","v":"②〜てからでないと〜ない（先にそれをしないとできない）（Tidak bisa ~ sebelum ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ からでないと</td><td>説明を受け<b>てからでないと</b>、使えません。</td></tr><tr><td>動詞て形 ＋ からでなければ</td><td>登録し<b>てからでなければ</b>、借りられない。</td></tr></tbody></table>"},{"t":"p","v":"・後ろは必ず否定（〜ない／〜られない）になります。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"この部屋の（　　）は20名です。  ","opts":["定員","料金","住所","前日"]},{"t":"q","id":"2","drill":true,"text":"市内の方は（　　）になります。  ","opts":["半額","設備","器具","取り消し"]},{"t":"q","id":"3","drill":true,"text":"（　　）は前の日までにお願いします。  ","opts":["取り消し","事務室","定員","設備"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"本日（　　）、閉店を7時といたします。  ","opts":["に限り","について","にとって","によって"]},{"t":"q","id":"5","drill":true,"text":"説明を受け（　　）、機械は使えません。  ","opts":["てからでないと","てからでも","たあとで","たところで"]},{"t":"q","id":"6","drill":true,"text":"急いでいる日（　　）、電車が遅れる。  ","opts":["に限って","に限り","にわたって","において"]}]},{"key":"土曜","title":"読解通しテスト（50分）","blocks":[{"t":"passage","v":"<p>先週と同じ<b>50分</b>です。今週は「線が引いてある部分の意味を選ぶ問題」を多めにしました。時間配分の目安：中文4分30秒／長文10分／情報検索6分。</p>"},{"t":"h2","v":"問題1　中文（3問）"},{"t":"passage","v":"<p>　毎朝、同じ時間に同じ電車に乗る。同じ車両の、同じあたりに立つ。知らない人ばかりなのに、顔は覚えてしまう。</p><p>　あるとき、その中の一人が半月ほど姿を見せなかった。名前も知らない、話したこともない人である。それなのに私は、<u>①どうしているだろうと思った</u>。心配というほど強くはない。ただ、いつもあるものがない、という落ち着かなさだった。</p><p>　人との関係は、話した回数で決まるのだと思っていた。そうではないらしい。同じ場所に、同じ時間に、黙って居合わせるだけでも、人は少しずつ相手を自分の風景に入れてしまうのだ。</p>"},{"t":"q","id":"問1","text":"筆者は毎朝どうしているか。  ","opts":["同じ時間に同じ電車の同じあたりに立つ  ","毎日ちがう電車に乗る  ","同じ人と話しながら通勤する  ","電車の中で本を読む"],"tag":"naiyou"},{"t":"q","id":"問2","text":"①「どうしているだろうと思った」とあるが、そのときの筆者の気持ちに近いものはどれか。  ","opts":["強く心配している  ","いつもあるものがなくて落ち着かない  ","早く話しかけたい  ","怒っている"],"tag":"shiji"},{"t":"q","id":"問3","text":"筆者の考えに合うものはどれか。  ","opts":["人との関係は話した回数で決まる  ","知らない人には関心を持つべきではない  ","同じ場所に居合わせるだけでも相手は自分の風景に入る  ","毎日同じ電車に乗るのはよくない"],"tag":"shucho"},{"t":"h2","v":"問題2　中文（3問）"},{"t":"passage","v":"<p>　子どものころ、母がよく「片づけなさい」と言った。私は片づけたつもりでも、母は満足しなかった。長い間、母は厳しい人だと思っていた。</p><p>　自分が家を持って分かったのは、母の言う「片づける」は、物を見えない所に入れることではなかった、ということである。②<u>次に使う人が、すぐ取り出せる形にする</u>。それが母の片づけだった。引き出しの奥に押し込むのは、母から見れば隠しているだけだったのだ。</p><p>　言葉は同じでも、中身がちがえば、話は通じない。通じていないことにさえ、長い間、気づかなかった。</p>"},{"t":"q","id":"問4","text":"子どものころ、筆者は母をどう思っていたか。  ","opts":["やさしい人だ  ","厳しい人だ  ","忙しい人だ  ","片づけが苦手な人だ"],"tag":"naiyou"},{"t":"q","id":"問5","text":"②「次に使う人が、すぐ取り出せる形にする」とあるが、これと反対のことはどれか。  ","opts":["よく使う物を手前に置く  ","引き出しの奥に押し込む  ","置く場所を決めておく  ","名前を書いておく"],"tag":"shiji"},{"t":"q","id":"問6","text":"筆者が最も言いたいことはどれか。  ","opts":["母の片づけ方は間違っていた  ","同じ言葉でも中身がちがえば話は通じない  ","片づけは子どものうちに覚えるべきだ  ","引き出しは少ないほうがよい"],"tag":"shucho"},{"t":"h2","v":"問題3　長文（4問）"},{"t":"passage","v":"<p>　私の働く工場では、毎朝5分間、前の日に起きた小さな失敗を一つだけ話す時間がある。始まったころは、だれも話したがらなかった。</p><p>　当たり前である。失敗を話せば、注意されると思うからだ。そこで係長は、<u>①自分の失敗から話すことにした</u>。「昨日、数を数え間違えて、二度手間になりました」。一番上の人が最初に言うと、不思議と、次の人が続けやすくなる。</p><p>　半年たって、大きな事故が減った。ただし、私が驚いたのはそこではない。②<u>減ったのは事故ではなく、「言わないでおこう」という気持ちのほうだった</u>。小さな失敗を口に出す人が増えれば、同じ失敗をしかけている人が、その場で気づく。大きくなる前に止まるのである。</p><p>　失敗を減らそうとすると、人は失敗を隠す。隠さなくてよい場所を作ると、結果として失敗が減る。順番が逆に見えるが、こちらのほうが確かだと、今の私は思っている。</p>"},{"t":"q","id":"問7","text":"始まったころ、だれも話したがらなかったのはなぜか。  ","opts":["時間が短かったから  ","失敗を話すと注意されると思ったから  ","失敗がなかったから  ","朝は忙しかったから"],"tag":"riyuu"},{"t":"q","id":"問8","text":"①「自分の失敗から話すことにした」とあるが、その結果どうなったか。  ","opts":["係長が注意された  ","次の人が話しやすくなった  ","5分では足りなくなった  ","話す人がいなくなった"],"tag":"naiyou"},{"t":"q","id":"問9","text":"②「減ったのは事故ではなく、『言わないでおこう』という気持ちのほうだった」とは、どういうことか。  ","opts":["事故はまったく減らなかったということ  ","事故が減ったのは、失敗を隠さなくなったからだということ  ","気持ちは数えられないということ  ","事故より気持ちのほうが大事だということ"],"tag":"shiji"},{"t":"q","id":"問10","text":"筆者の考えに合うものはどれか。  ","opts":["失敗を減らすには、強く注意するのがよい  ","隠さなくてよい場所を作ると、結果として失敗が減る  ","失敗の話は上の人がするべきではない  ","朝の5分は長すぎる"],"tag":"shucho"},{"t":"h2","v":"問題4　情報検索（3問）"},{"t":"passage","v":"<p><b>さくら台　健康まつり　体験コーナー</b></p><table><thead><tr><th>コーナー</th><th>時間</th><th>定員</th><th>費用</th><th>申し込み</th></tr></thead><tbody><tr><td>①　体力測定</td><td>10:00〜12:00</td><td>なし</td><td>無料</td><td>不要（そのまま参加）</td></tr><tr><td>②　血液検査</td><td>10:00〜11:30</td><td>30名</td><td>500円</td><td>前日までに電話</td></tr><tr><td>③　料理教室</td><td>13:00〜15:00</td><td>16名</td><td>800円</td><td>前日までに電話</td></tr><tr><td>④　歩き方教室</td><td>13:30〜14:30</td><td>20名</td><td>無料</td><td>不要（そのまま参加）</td></tr></tbody></table><p>◆②の血液検査を受ける方は、当日の朝、食事をしないでお越しください。</p><p>◆③と④は時間が重なりますので、両方に参加することはできません。</p><p>◆費用は当日、受付でお支払いください。65歳以上の方に限り、③は半額になります。</p><p>◆雨の場合、①は体育館で行います。ほかのコーナーは変わりません。</p>"},{"t":"q","id":"問11","text":"70歳の田中さんが③の料理教室に参加するとき、当日払う費用はいくらか。  ","opts":["無料  ","400円  ","800円  ","1,300円"],"tag":"joken"},{"t":"q","id":"問12","text":"午前も午後も参加したい人の組み合わせとして、正しいものはどれか。  ","opts":["③と④  ","②と③  ","①と②だけ  ","④と②"],"tag":"joken"},{"t":"q","id":"問13","text":"この案内の内容に合うものはどれか。  ","opts":["血液検査は当日の朝、食事をしてから来る  ","歩き方教室は申し込みが要らない  ","雨の日は全部中止になる  ","費用は前日までに払う"],"tag":"naiyou"}]},{"key":"日曜","title":"聴解30分 ＋ 復習30分","blocks":[{"t":"h2","v":"Part 1　聴解（20分・7問）"},{"t":"passage","v":"<p>注意：この紙には会話は書いてありません。音を聞いて答えます。会話は1回だけ流れます。今週は<b>概要理解</b>と<b>発話表現</b>が入ります。概要理解は選択肢を先に読まずに、話の中心をつかんでください。</p>"},{"t":"h3","v":"問題1　課題理解（2問）"},{"t":"q","id":"問1","text":"","opts":["いすを並べる","資料をコピーする","資料を配る","会議室のかぎを開ける"]},{"t":"q","id":"問2","text":"","opts":["保険証と写真","申込書と印鑑","保険証だけ","印鑑と写真"]},{"t":"h3","v":"問題2　概要理解（2問）"},{"t":"q","id":"問3","text":"","opts":["授業の受け方","メモの取り方","手の使い方","テストの点数"]},{"t":"q","id":"問4","text":"","opts":["棚のきれいにし方","値段の書き方","あいさつを先にすること","失敗をしないこと"]},{"t":"h3","v":"問題3　発話表現（3問）"},{"t":"q","id":"問5","text":"1　　2　　3","opts":["1","2","3"]},{"t":"q","id":"問6","text":"1　　2　　3","opts":["1","2","3"]},{"t":"q","id":"問7","text":"1　　2　　3","opts":["1","2","3"]},{"t":"h3","v":"聞き取りメモ欄"},{"t":"passage","v":"<p style=\"min-height:5em\">　</p>"},{"t":"h2","v":"Part 2　今週の復習テスト（20問）"},{"t":"h3","v":"A 語彙（10問）"},{"t":"q","id":"1","drill":true,"text":"（　　）を読んだら、来週工事だそうだ。  ","opts":["回覧","意見","原因","札"]},{"t":"q","id":"2","drill":true,"text":"かぎは事務所で（　　）ています。  ","opts":["預かっ","外し","疑っ","育っ"]},{"t":"q","id":"3","drill":true,"text":"（　　）その日は都合がつきません。  ","opts":["あいにく","さっそく","むしろ","たしかに"]},{"t":"q","id":"4","drill":true,"text":"機械の（　　）で今日は休みです。  ","opts":["点検","調整","状況","見学"]},{"t":"q","id":"5","drill":true,"text":"書き（　　）の手紙が机にある。  ","opts":["かけ","だし","こみ","なおし"]},{"t":"q","id":"6","drill":true,"text":"話がやっと（　　）た。  ","opts":["収まっ","疑っ","追っ","要っ"]},{"t":"q","id":"7","drill":true,"text":"（　　）の結果を発表します。  ","opts":["調査","数字","画面","記事"]},{"t
