nan</td></tr><tr><td>10</td><td>裏</td><td>うら</td><td>後ろ側</td><td>belakang</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜べきだ</b>（そうするのが正しい／Sebaiknya (secara moral) ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ べきだ</td><td>約束は守る<b>べきです</b>。</td></tr><tr><td>例外：する → するべき／すべき</td><td>早く連絡<b>すべきだ</b>。</td></tr></tbody></table>"}, {"t": "p", "v": "・<b>正しさ</b>を言う強い言葉です。目上の人には使いにくいので、「〜たほうがいい」に変えます。"}, {"t": "p", "v": "<b>②〜しかない</b>（ほかに方法がない／Tidak ada pilihan selain ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ しかない</td><td>電車が止まったので、歩く<b>しかない</b>。</td></tr><tr><td>名詞 ＋ しかない</td><td>千円<b>しかありません</b>。（数量が少ない）</td></tr></tbody></table>"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "大事な書類は（　　）で送ったほうが安心です。", "opts": ["速達", "書留", "貯金", "販売"], "drill": true}, {"t": "q", "id": "2", "text": "銀行の（　　）は午後3時までです。", "opts": ["時間外", "受付時間", "取り扱い", "裏"], "drill": true}, {"t": "q", "id": "3", "text": "この店ではたばこの（　　）はしていません。", "opts": ["保険", "郵便", "販売", "貯金"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "借りたものは、すぐに返す（　　）だ。", "opts": ["べき", "しかない", "はず", "わけ"], "drill": true}, {"t": "q", "id": "5", "text": "バスがもうないので、タクシーで帰る（　　）。", "opts": ["べきだ", "しかない", "はずだ", "ものだ"], "drill": true}, {"t": "q", "id": "6", "text": "体の調子が悪いなら、無理をせず休む（　　）です。", "opts": ["しかない", "べき", "わけ", "まま"], "drill": true}]}, {"key": "火曜", "title": "短文読解 ── 依頼のメールを読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p>件名：10月3日のシフト交代のお願い</p><p>佐藤さん</p><p>お疲れさまです。パクです。</p><p>突然のお願いで申し訳ありません。10月3日（土）の午後のシフトですが、その日に市役所で在留カードの手続きをすることになりました。<b>平日は窓口が5時までで、仕事の日には行けません。</b>土曜も受け付けているのは、その日だけだそうです。</p><p>そこで、もしご都合がよろしければ、<b>10日（土）の午後</b>と交代していただけないでしょうか。10日は私が入ります。</p><p>難しいようでしたら、店長に相談して別の方を探しますので、遠慮なくお知らせください。返事は今週中にいただけると助かります。</p><p>パク</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "パクさんが10月3日に働けないのは、なぜか。", "opts": ["体の調子が悪いから", "その日しか市役所の手続きができないから", "店長に休むように言われたから", "10日に用事があるから"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "パクさんは佐藤さんに何をお願いしているか。", "opts": ["10月3日の午後、代わりに働いてほしい", "10月10日の午後、代わりに働いてほしい", "市役所へ一緒に行ってほしい", "店長に話してほしい"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "佐藤さんが交代できない場合、どうなるか。", "opts": ["パクさんが休みをあきらめる", "パクさんが店長に相談して、別の人を探す", "佐藤さんが別の人を探す", "その日は店を閉める"], "tag": "naiyou"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>交代</td><td>こうたい</td><td>入れかわること</td><td>pergantian</td></tr><tr><td>2</td><td>突然</td><td>とつぜん</td><td>急に</td><td>tiba-tiba</td></tr><tr><td>3</td><td>市役所</td><td>しやくしょ</td><td>市の役所</td><td>kantor kota</td></tr><tr><td>4</td><td>手続き</td><td>てつづき</td><td>必要な事務のやり方</td><td>prosedur / pengurusan</td></tr><tr><td>5</td><td>都合</td><td>つごう</td><td>予定などの具合</td><td>keadaan / waktu luang</td></tr><tr><td>6</td><td>相談する</td><td>そうだんする</td><td>話して意見を聞く</td><td>berkonsultasi</td></tr><tr><td>7</td><td>探す</td><td>さがす</td><td>見つけようとする</td><td>mencari</td></tr><tr><td>8</td><td>遠慮</td><td>えんりょ</td><td>気をつかって控えること</td><td>sungkan</td></tr><tr><td>9</td><td>今週中</td><td>こんしゅうじゅう</td><td>今週が終わるまでに</td><td>dalam minggu ini</td></tr><tr><td>10</td><td>申し訳ない</td><td>もうしわけない</td><td>とてもすまない</td><td>mohon maaf</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①使役（〜せる／〜させる）</b>（人に何かをさせる／Menyuruh atau membiarkan melakukan）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>Ⅰグループ：〜あ段 ＋ せる</td><td>部下に書類を<b>書かせる</b>。</td></tr><tr><td>Ⅱグループ：ますを取る ＋ させる</td><td>子どもに野菜を<b>食べさせる</b>。</td></tr><tr><td>Ⅲ：する→させる／来る→来させる</td><td>準備を<b>させます</b>。</td></tr></tbody></table>"}, {"t": "p", "v": "<b>②受身（〜れる／〜られる）</b>（〜される／Dikenai perbuatan orang lain）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>Ⅰグループ：〜あ段 ＋ れる</td><td>店長に<b>呼ばれました</b>。</td></tr><tr><td>Ⅱグループ：ますを取る ＋ られる</td><td>先生に<b>ほめられました</b>。</td></tr><tr><td>Ⅲ：する→される／来る→来られる</td><td>注意<b>されました</b>。</td></tr></tbody></table>"}, {"t": "passage", "v": "<p><b>見分け方</b>：<b>させる＝自分がさせる側／〜れる＝自分がされる側</b>。</p><p>「母に部屋を掃除<b>させられた</b>」は使役受身（させられる）で、いやいややった意味になります。N3ではここまで出ます。</p>"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "役所で在留カードの（　　）をします。", "opts": ["交代", "手続き", "都合", "遠慮"], "drill": true}, {"t": "q", "id": "2", "text": "明日の午後、（　　）はいかがですか。", "opts": ["都合", "突然", "遠慮", "相談"], "drill": true}, {"t": "q", "id": "3", "text": "（　　）雨が降ってきて、服がぬれました。", "opts": ["今週中", "突然", "交代", "手続き"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "先生は学生に作文を（　　）ました。", "opts": ["書かれ", "書かせ", "書けれ", "書かさせ"], "drill": true}, {"t": "q", "id": "5", "text": "電車で足を（　　）て、痛かったです。", "opts": ["ふませ", "ふまれ", "ふまさせ", "ふめれ"], "drill": true}, {"t": "q", "id": "6", "text": "母に部屋の掃除を（　　）ました。", "opts": ["させ", "され", "させられ", "させられれ"], "drill": true}]}, {"key": "水曜", "title": "中文読解 ── エッセイを読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p>引っ越してきた日から、隣の家のおじいさんは、毎朝必ずあいさつをしてくれました。</p><p>私は正直、少し困っていました。朝は急いでいますし、何を話せばいいのか分かりません。「おはようございます」と返すだけで、足早に通り過ぎる日が続きました。</p><p><b>①それが変わったのは、去年の冬です。</b>三日ほど姿を見なかったあと、久しぶりに会ったおじいさんが「風邪をひいていてね」と言いました。私は驚きました。姿を見なかったことに、自分が気づいていたからです。毎朝の三秒が、いつのまにか自分の中に入っていたのです。</p><p>今も私たちは、天気の話くらいしかしません。<b>②けれども、この三秒がなくなったら、私はきっと気づく。</b>それが分かってから、あいさつが少し違うものに見えるようになりました。</p><p>親しくなることだけが、人と人のつながりではないのだと思います。</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "引っ越してきたころ、筆者はあいさつをどう感じていたか。", "opts": ["うれしいと感じていた", "何を話せばいいか分からず、困っていた", "おじいさんが心配だと感じていた", "毎日続けたいと思っていた"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "「<b>①それが変わったのは、去年の冬です</b>」とあるが、何がきっかけだったか。", "opts": ["おじいさんと長く話をしたこと", "おじいさんの姿を見ない日が続いたこと", "自分が風邪をひいたこと", "引っ越しをしたこと"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "「<b>②けれども、この三秒がなくなったら、私はきっと気づく</b>」とあるが、どういうことか。", "opts": ["三秒では話が足りないということ", "短いつきあいでも、自分にとって意味があるということ", "もっと長く話すべきだということ", "あいさつをやめようと思っているということ"], "tag": "naiyou"}, {"t": "q", "id": "問4", "text": "この文章で筆者が最も言いたいことはどれか。", "opts": ["近所の人とは親しくなったほうがよい", "朝のあいさつは礼儀として必要だ", "深く親しくならなくても、人とのつながりはある", "高齢の人には気をつかうべきだ"], "tag": "shucho"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>隣</td><td>となり</td><td>すぐ横</td><td>sebelah</td></tr><tr><td>2</td><td>足早</td><td>あしばや</td><td>歩くのが速い様子</td><td>dengan langkah cepat</td></tr><tr><td>3</td><td>姿</td><td>すがた</td><td>人の見える形</td><td>sosok</td></tr><tr><td>4</td><td>久しぶり</td><td>ひさしぶり</td><td>長い間会わなかったあと</td><td>setelah sekian lama</td></tr><tr><td>5</td><td>驚く</td><td>おどろく</td><td>びっくりする</td><td>terkejut</td></tr><tr><td>6</td><td>いつのまにか</td><td>―</td><td>気づかないうちに</td><td>tanpa terasa</td></tr><tr><td>7</td><td>親しい</td><td>したしい</td><td>仲がよい</td><td>akrab</td></tr><tr><td>8</td><td>つながり</td><td>―</td><td>人と人の結びつき</td><td>hubungan</td></tr><tr><td>9</td><td>きっと</td><td>―</td><td>たぶん間違いなく</td><td>pasti</td></tr><tr><td>10</td><td>続く</td><td>つづく</td><td>途切れないで進む</td><td>berlanjut</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜ことになっている</b>（規則・予定として決まっている／Sudah ditetapkan bahwa ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形・ない形 ＋ ことになっている</td><td>会議は毎週月曜に行う<b>ことになっています</b>。</td></tr></tbody></table>"}, {"t": "p", "v": "・<b>個人の決意ではなく、集団の決まり</b>を表します。"}, {"t": "p", "v": "<b>②〜わけだ</b>（だから当然そうなる／Pantas saja ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞・い形容詞の普通形 ＋ わけだ</td><td>窓が開いている。寒い<b>わけだ</b>。</td></tr></tbody></table>"}, {"t": "passage", "v": "<p><b>注意</b>：「わけだ」＝理由が分かって納得。「はずだ」＝根拠からの推測。</p><p>「寒い<b>わけだ</b>」＝（窓が開いていたから）寒いのも当然だ。</p>"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "十年ぶりに友だちに会って、（　　）ました。", "opts": ["続き", "驚き", "親しみ", "続け"], "drill": true}, {"t": "q", "id": "2", "text": "（　　）ぶりに国の料理を食べました。", "opts": ["久し", "足早", "いつのまに", "きっと"], "drill": true}, {"t": "q", "id": "3", "text": "（　　）夕方になっていました。", "opts": ["きっと", "いつのまにか", "久しぶり", "親しく"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "うちの会社では、9時までに来る（　　）。", "opts": ["ことになっています", "ことにしています", "はずです", "つもりです"], "drill": true}, {"t": "q", "id": "5", "text": "電気がついていない。まだ帰っていない（　　）。", "opts": ["わけです", "ことです", "ものです", "ままです"], "drill": true}, {"t": "q", "id": "6", "text": "3時間も歩いたのか。疲れている（　　）。", "opts": ["はずがない", "わけだ", "ことにする", "ようにする"], "drill": true}]}, {"key": "木曜", "title": "中文読解 ── 意見文を読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p>人気のラーメン店の前を通ると、いつも長い列ができています。一時間並ぶ人もいるそうです。私はその列を見るたびに、少し不思議な気持ちになります。</p><p>誤解のないように言っておくと、私は行列が嫌いなわけではありません。おいしいものを食べたい気持ちはよく分かります。<b>①私が気になるのは、時間の使い方です。</b></p><p>一時間並んで千円のラーメンを食べる。この人は、そのラーメンに千円ではなく、千円と一時間を払っています。もしその一時間で働けば、いくらかのお金になったかもしれません。ここまでは、よく言われる話です。</p><p>しかし、私が本当に言いたいのは別のことです。<b>②その一時間が「損」かどうかは、並んでいる本人にしか決められない。</b>友人と話しながら並んだのなら、それは楽しい一時間だったでしょう。一人で黙って立っていて、つらいと感じたのなら、損だったのかもしれません。</p><p>時間の値段は、時計では測れません。同じ一時間でも、人によって、その日によって、まったく違う値段がつきます。だから私は、行列を見ても「もったいない」とは言わないことにしています。<b>言えるのは、自分の一時間についてだけです。</b></p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "「<b>①私が気になるのは、時間の使い方です</b>」とあるが、この前で筆者は何を断っているか。", "opts": ["ラーメンが好きではないということ", "行列が嫌いなわけではないということ", "お金の話をするつもりはないということ", "人気店に行ったことがないということ"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "「一時間並んで千円のラーメンを食べる」について、筆者はどう説明しているか。", "opts": ["千円は高すぎる", "千円と一時間の両方を払っている", "一時間で千円かせげる", "一時間並ぶ価値はない"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "「<b>②その一時間が「損」かどうかは、並んでいる本人にしか決められない</b>」とあるが、なぜか。", "opts": ["他人には時間の長さが分からないから", "店によって待ち時間が違うから", "同じ一時間でも、感じ方が人によって違うから", "お金にすると計算できないから"], "tag": "naiyou"}, {"t": "q", "id": "問4", "text": "この文章で筆者が最も言いたいことはどれか。", "opts": ["行列に並ぶのは時間のむだである", "おいしいものには時間をかけるべきだ", "時間の価値は他人が決めることではない", "一人で並ぶのはつらいことだ"], "tag": "shucho"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>行列</td><td>ぎょうれつ</td><td>並んでいる人の列</td><td>antrean</td></tr><tr><td>2</td><td>並ぶ</td><td>ならぶ</td><td>列になって待つ</td><td>mengantre</td></tr><tr><td>3</td><td>誤解</td><td>ごかい</td><td>間違って理解すること</td><td>salah paham</td></tr><tr><td>4</td><td>損</td><td>そん</td><td>得をしないこと</td><td>rugi</td></tr><tr><td>5</td><td>黙る</td><td>だまる</td><td>何も言わない</td><td>diam</td></tr><tr><td>6</td><td>測る</td><td>はかる</td><td>長さや時間を調べる</td><td>mengukur</td></tr><tr><td>7</td><td>価値</td><td>かち</td><td>それだけのねうち</td><td>nilai</td></tr><tr><td>8</td><td>本人</td><td>ほんにん</td><td>その人自身</td><td>orang yang bersangkutan</td></tr><tr><td>9</td><td>気になる</td><td>きになる</td><td>心にひっかかる</td><td>jadi memikirkan</td></tr><tr><td>10</td><td>別の</td><td>べつの</td><td>ちがう</td><td>yang lain</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜に違いない</b>（きっとそうだ／Pasti ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞・い形容詞の普通形 ＋ に違いない</td><td>あの店は行列ができている。おいしい<b>に違いない</b>。</td></tr><tr><td>な形容詞・名詞 ＋ に違いない</td><td>彼は留学生<b>に違いない</b>。</td></tr></tbody></table>"}, {"t": "p", "v": "・「はずだ」より<b>強い確信</b>を表します。"}, {"t": "p", "v": "<b>②〜みたいに／〜のように</b>（たとえ／Seperti ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ みたいに（話し言葉）</td><td>子ども<b>みたいに</b>喜んだ。</td></tr><tr><td>名詞 ＋ のように（書き言葉）</td><td>母<b>のように</b>やさしい人。</td></tr></tbody></table>"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "店の前に長い（　　）ができています。", "opts": ["行列", "誤解", "価値", "本人"], "drill": true}, {"t": "q", "id": "2", "text": "説明が足りないと、（　　）されることがあります。", "opts": ["測定", "誤解", "行列", "損"], "drill": true}, {"t": "q", "id": "3", "text": "その話は（　　）でないと分かりません。", "opts": ["別の", "本人", "価値", "行列"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "電気が消えている。もう寝た（　　）。", "opts": ["に違いない", "わけがない", "ことにする", "ようにする"], "drill": true}, {"t": "q", "id": "5", "text": "彼は日本人（　　）上手に日本語を話す。", "opts": ["みたいに", "らしくて", "そうに", "ばかりに"], "drill": true}, {"t": "q", "id": "6", "text": "あんなに勉強したのだから、合格する（　　）。", "opts": ["わけがない", "に違いない", "ことになる", "ものだ"], "drill": true}]}, {"key": "金曜", "title": "情報検索 ── 案内から答えを探す", "blocks": [{"t": "passage", "v": "<p><b>解き方の手順</b>：①設問の条件に線を引く　②表からその行だけを見る　③「ご注意」の例外を足す。</p>"}, {"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p><b>さくら市　レンタサイクルのご案内</b></p><table><thead><tr><th>種類</th><th>3時間まで</th><th>1日</th><th>保証金</th></tr></thead><tbody><tr><td>ふつうの自転車</td><td>300円</td><td>500円</td><td>1,000円</td></tr><tr><td>電動アシスト自転車</td><td>600円</td><td>1,000円</td><td>1,000円</td></tr><tr><td>子ども用自転車</td><td>200円</td><td>300円</td><td>なし</td></tr></tbody></table><p><b>貸出時間</b>　9:00〜18:00（3月〜11月）／9:00〜17:00（12月〜2月）</p><p><b>ご注意</b></p><p>・<b>保証金は、返却のときにお返しします。</b>自転車をなくした場合はお返しできません。</p><p>・借りるときは、身分証明書が必要です。<b>外国籍の方は在留カードをお持ちください。</b></p><p>・返却は、借りた場所と同じ場所へお願いします。<b>駅前と市役所前の2か所で、返す場所を変えることはできません。</b></p><p>・時間を過ぎた場合は、1時間ごとに200円をいただきます。</p><p>・電動アシスト自転車は、<b>16歳以上</b>の方のみご利用いただけます。</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "大人が電動アシスト自転車を1日借りる。窓口で最初に払う金額はいくらか。", "opts": ["1,000円", "1,100円", "2,000円", "600円"], "tag": "joken"}, {"t": "q", "id": "問2", "text": "駅前で自転車を借りた。市役所前で返したい。どうなるか。", "opts": ["市役所前でも返せる", "200円払えば返せる", "借りた駅前へ返さなければならない", "電動アシストなら返せる"], "tag": "joken"}, {"t": "q", "id": "問3", "text": "15歳の中学生が自転車を借りたい。正しいものはどれか。", "opts": ["電動アシスト自転車を借りられる", "電動アシスト自転車は借りられない", "自転車は一台も借りられない", "保証金が2倍になる"], "tag": "joken"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>貸出</td><td>かしだし</td><td>貸すこと</td><td>peminjaman</td></tr><tr><td>2</td><td>返却</td><td>へんきゃく</td><td>返すこと</td><td>pengembalian</td></tr><tr><td>3</td><td>保証金</td><td>ほしょうきん</td><td>預けておくお金</td><td>uang jaminan</td></tr><tr><td>4</td><td>電動</td><td>でんどう</td><td>電気で動く</td><td>elektrik</td></tr><tr><td>5</td><td>国籍</td><td>こくせき</td><td>どの国の人か</td><td>kewarganegaraan</td></tr><tr><td>6</td><td>在留カード</td><td>ざいりゅうカード</td><td>在留資格を示すカード</td><td>kartu izin tinggal</td></tr><tr><td>7</td><td>〜ごとに</td><td>―</td><td>そのたびに</td><td>setiap ~</td></tr><tr><td>8</td><td>過ぎる</td><td>すぎる</td><td>時間などを越える</td><td>melewati</td></tr><tr><td>9</td><td>場所</td><td>ばしょ</td><td>ところ</td><td>tempat</td></tr><tr><td>10</td><td>〜のみ</td><td>―</td><td>〜だけ</td><td>hanya</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜おきに／〜ごとに</b>（間隔／Setiap ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>数量 ＋ おきに（間をあけて）</td><td>バスは10分<b>おきに</b>来ます。</td></tr><tr><td>数量・名詞 ＋ ごとに（そのたび）</td><td>1時間<b>ごとに</b>200円かかります。</td></tr></tbody></table>"}, {"t": "passage", "v": "<p><b>注意</b>：「3日<b>おきに</b>」＝間を3日あける（4日に1回）。「3日<b>ごとに</b>」＝3日に1回。試験ではこの差が問われます。</p>"}, {"t": "p", "v": "<b>②〜以上／〜未満</b>（数の範囲／Lebih dari / kurang dari）"}, {"t": "table", "v": "<table><thead><tr><th>語</th><th>意味</th></tr></thead><tbody><tr><td>16歳以上</td><td>16歳をふくむ、それより上</td></tr><tr><td>16歳未満</td><td>16歳をふくまない、それより下</td></tr><tr><td>16歳以下</td><td>16歳をふくむ、それより下</td></tr></tbody></table>"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "本の（　　）は2週間以内にお願いします。", "opts": ["貸出", "返却", "保証金", "場所"], "drill": true}, {"t": "q", "id": "2", "text": "外国籍の方は（　　）が必要です。", "opts": ["在留カード", "保証金", "返却", "電動"], "drill": true}, {"t": "q", "id": "3", "text": "約束の時間を（　　）てしまいました。", "opts": ["越え", "過ぎ", "返し", "貸し"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "この薬は6時間（　　）飲んでください。", "opts": ["おきに", "ごとに", "までに", "ばかり"], "drill": true}, {"t": "q", "id": "5", "text": "18歳（　　）の方は、保護者の同意が必要です。", "opts": ["以上", "未満", "以内", "以降"], "drill": true}, {"t": "q", "id": "6", "text": "バスは20分（　　）に出ています。", "opts": ["おき", "ながら", "うち", "ほど"], "drill": true}]}, {"key": "土曜", "title": "読解通しテスト（60分）", "blocks": [{"t": "passage", "v": "<p>タイマーを<b>60分</b>にセットしてください。途中で止めないこと。</p><p>時間配分の目安：中文6分／長文12分／情報検索8分。</p>"}, {"t": "h2", "v": "問題1　中文（3問）"}, {"t": "passage", "v": "<p>会社に入って三年目のとき、新人の教育を任されました。私は自分がしてもらったように、丁寧に教えようと決めました。手順書を作り、一つずつ説明し、質問にはすぐ答えました。</p><p>ところが三か月たっても、その新人は一人で仕事ができるようになりません。同じことを何度も聞きに来ます。私は自分の教え方が悪いのだと思い、説明をさらに細かくしました。それでも変わりませんでした。</p><p>見かねた先輩が言いました。「君の説明、完ぺきすぎるんだよ。あの子、考える場所がないんじゃないかな」</p><p>次の週から、私は説明を半分でやめてみました。「ここから先はどうすればいいと思う？」と聞くようにしたのです。最初は沈黙が続いて、こちらがつらくなりました。しかし一か月後、その新人は自分で手順書を書き直して持ってきました。私の作ったものより、分かりやすいものでした。</p>"}, {"t": "q", "id": "問1", "text": "三か月たっても新人が仕事を覚えなかったとき、筆者はどうしたか。", "opts": ["先輩に相談した", "説明をもっと細かくした", "教えるのをやめた", "手順書を書き直させた"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "先輩は、筆者の教え方の何が問題だと言ったか。", "opts": ["説明が足りないこと", "質問に答えないこと", "説明が完ぺきすぎて、考える余地がないこと", "手順書が分かりにくいこと"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "一か月後、新人はどうなったか。", "opts": ["質問をしなくなった", "自分で手順書を書き直して持ってきた", "仕事をやめた", "筆者の手順書を覚えた"], "tag": "naiyou"}, {"t": "h2", "v": "問題2　中文（3問）"}, {"t": "passage", "v": "<p>父は物を捨てない人でした。壊れた時計、片方だけの手袋、いつのものか分からない鍵。どれも「いつか使う」と言って、引き出しにしまっていました。</p><p>父が入院したとき、私はその引き出しを開けました。整理しようと思ったのです。ところが、一つ一つ手に取るうちに、手が止まりました。時計は私が小学校の入学祝いにもらったものでした。手袋は、母が編んだものの片方でした。</p><p>父は「いつか使う」と言っていましたが、<b>本当は使うつもりなどなかったのかもしれません。</b>捨てられなかっただけなのでしょう。そして父は、そのことを言葉にしませんでした。</p><p>私は引き出しを閉めました。整理は、父が帰ってきてからにしようと思いました。</p>"}, {"t": "q", "id": "問4", "text": "父はどんな人だったか。", "opts": ["きれい好きで、よく整理をする人", "壊れた物も捨てずに取っておく人", "物をよく人にあげる人", "新しい物をすぐ買う人"], "tag": "naiyou"}, {"t": "q", "id": "問5", "text": "引き出しを開けた筆者の手が止まったのは、なぜか。", "opts": ["中身が多すぎたから", "一つ一つに思い出があると分かったから", "汚れていたから", "父に怒られると思ったから"], "tag": "naiyou"}, {"t": "q", "id": "問6", "text": "「<b>本当は使うつもりなどなかったのかもしれません</b>」とあるが、筆者は父についてどう考えたか。", "opts": ["うそをついていた", "忘れっぽくなっていた", "捨てられなかっただけだ", "物を大切にしていた"], "tag": "naiyou"}, {"t": "h2", "v": "問題3　長文（4問）"}, {"t": "passage", "v": "<p>「なぜ日本語を勉強しているのですか」と聞かれることがあります。以前の私は、少し困っていました。理由を一つに決められなかったからです。</p><p>最初のきっかけは、仕事でした。日本で働くには言葉が必要です。それだけの理由で始めました。教科書を開くのは義務のようなもので、楽しいとは思いませんでした。</p><p>変わったのは、二年目です。休憩室で同僚が話しているのを聞いて、笑ったことがありました。冗談が分かったのです。<b>①その瞬間、言葉が「道具」から「場所」に変わりました。</b>それまで日本語は、何かをするために使うものでした。しかしそのとき初めて、日本語の中に自分がいると感じたのです。</p><p>それからは、勉強のしかたも変わりました。試験のための単語より、同僚が使う言い方を覚えるようになりました。<b>②これは効率のよい方法ではありません。</b>試験に出ない言葉をたくさん覚えることになるからです。実際、その年の試験の点は、あまり伸びませんでした。</p><p>けれども、私はこの回り道を後悔していません。試験のためだけに勉強していたら、たぶん三年目には続かなくなっていたでしょう。<b>続けられる形にすることも、勉強の一部</b>だと思います。</p><p>今、あの質問にはこう答えます。「最初は仕事のためでした。今は、そこに自分の場所があるからです」</p>"}, {"t": "q", "id": "問7", "text": "勉強を始めたころ、筆者にとって日本語はどんなものだったか。", "opts": ["楽しい趣味", "仕事のために必要な、義務のようなもの", "友だちを作る手段", "試験に合格するための科目"], "tag": "naiyou"}, {"t": "q", "id": "問8", "text": "「<b>①その瞬間、言葉が「道具」から「場所」に変わりました</b>」とあるが、何があったのか。", "opts": ["日本語で仕事ができるようになった", "同僚の冗談が分かって、一緒に笑えた", "試験に合格した", "教科書を読み終えた"], "tag": "naiyou"}, {"t": "q", "id": "問9", "text": "「<b>②これは効率のよい方法ではありません</b>」とあるが、なぜか。", "opts": ["覚える時間が足りないから", "同僚が正しい日本語を使わないから", "試験に出ない言葉を多く覚えることになるから", "教科書を使わないから"], "tag": "naiyou"}, {"t": "q", "id": "問10", "text": "この文章で筆者が最も言いたいことはどれか。", "opts": ["試験のための勉強はやめるべきだ", "同僚と話すのが最もよい勉強法だ", "続けられる形にすることも勉強のうちである", "日本語は仕事のために必要である"], "tag": "shucho"}, {"t": "h2", "v": "問題4　情報検索（3問）"}, {"t": "passage", "v": "<p><b>みどりシネマ　料金のご案内</b></p><table><thead><tr><th>区分</th><th>通常</th><th>水曜</th><th>20時以降</th></tr></thead><tbody><tr><td>一般</td><td>1,900円</td><td>1,200円</td><td>1,400円</td></tr><tr><td>大学生</td><td>1,500円</td><td>1,200円</td><td>1,300円</td></tr><tr><td>高校生以下</td><td>1,000円</td><td>1,000円</td><td>1,000円</td></tr><tr><td>60歳以上</td><td>1,200円</td><td>1,200円</td><td>1,200円</td></tr></tbody></table><p><b>ご注意</b></p><p>・学生の方は<b>学生証</b>をお見せください。ない場合は一般料金となります。</p><p>・割引は<b>重ねて使えません</b>。いちばん安い料金を適用します。</p><p>・3D作品は、上の料金に<b>400円</b>が加わります。</p><p>・水曜が祝日の場合、水曜料金はありません。</p>"}, {"t": "q", "id": "問11"   ]}, "5": {"days": [{"key": "月曜", "title": "短文読解 ── 募集の案内を読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p><b>さくら公園　フリーマーケット出店者募集</b></p><p>日時：10月18日（日）10:00〜15:00（雨天中止）</p><p>場所：さくら公園　中央広場</p><p>出店料：1区画 2,000円（約2m×2m）</p><p><b>お申し込み</b></p><p>・9月30日（火）までに、公園事務所へ直接お越しください。<b>電話・メールでの申し込みはできません。</b></p><p>・申込時に出店料をお支払いいただきます。</p><p>・区画は先着順です。定員（40区画）になり次第、締め切ります。</p><p><b>ご注意</b></p><p>・<b>食べ物・飲み物の販売はできません。</b></p><p>・机やいすは各自でご用意ください。貸し出しはありません。</p><p>・雨で中止になった場合、出店料は<b>全額お返しします</b>。ただし、当日ご自身の都合で来られなかった場合はお返しできません。</p><p>・売れ残った品物は、必ずお持ち帰りください。</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "出店を申し込む方法として、正しいものはどれか。", "opts": ["電話で申し込む", "メールで申し込む", "公園事務所へ行って申し込む", "当日会場で申し込む"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "雨で中止になった場合、出店料はどうなるか。", "opts": ["半分返ってくる", "全額返ってくる", "返ってこない", "次回に使える"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "この案内の内容に合うものはどれか。", "opts": ["手作りのパンを売ることができる", "机といすは会場で借りられる", "申し込みは先着順で、40区画で締め切る", "売れ残った品物は会場に置いていける"], "tag": "naiyou"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>出店</td><td>しゅってん</td><td>店を出すこと</td><td>membuka lapak</td></tr><tr><td>2</td><td>募集</td><td>ぼしゅう</td><td>人を集めること</td><td>rekrutmen</td></tr><tr><td>3</td><td>雨天</td><td>うてん</td><td>雨の天気</td><td>cuaca hujan</td></tr><tr><td>4</td><td>区画</td><td>くかく</td><td>区切られた場所</td><td>petak / area</td></tr><tr><td>5</td><td>先着順</td><td>せんちゃくじゅん</td><td>早く来た人から順に</td><td>urutan kedatangan</td></tr><tr><td>6</td><td>締め切る</td><td>しめきる</td><td>受付を終わりにする</td><td>menutup pendaftaran</td></tr><tr><td>7</td><td>貸し出し</td><td>かしだし</td><td>貸すこと</td><td>peminjaman</td></tr><tr><td>8</td><td>全額</td><td>ぜんがく</td><td>全部の金額</td><td>seluruh jumlah</td></tr><tr><td>9</td><td>売れ残る</td><td>うれのこる</td><td>売れないで残る</td><td>tidak laku / tersisa</td></tr><tr><td>10</td><td>各自</td><td>かくじ</td><td>それぞれの人が自分で</td><td>masing-masing</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜てほしい</b>（相手にそうしてもらいたい／Ingin orang lain melakukan ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ ほしい</td><td>早く返事をし<b>てほしい</b>です。</td></tr><tr><td>動詞ない形 ＋ でほしい</td><td>大きな声を出さ<b>ないでほしい</b>。</td></tr></tbody></table>"}, {"t": "passage", "v": "<p><b>注意</b>：「〜たい」は自分がしたいこと。「〜てほしい」は<b>相手にしてもらいたい</b>こと。主語が違います。</p>"}, {"t": "p", "v": "<b>②〜ばいい／〜たらいい</b>（そうするのがよい／助言／Sebaiknya ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ば形 ＋ いい</td><td>どこで申し込め<b>ばいい</b>ですか。</td></tr><tr><td>動詞た形 ＋ ら ＋ いい</td><td>事務所へ行っ<b>たらいい</b>ですよ。</td></tr></tbody></table>"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "申し込みは（　　）なので、早めにお願いします。", "opts": ["全額", "先着順", "区画", "雨天"], "drill": true}, {"t": "q", "id": "2", "text": "定員になったので、受付を（　　）ました。", "opts": ["締め切り", "売れ残り", "貸し出し", "募集し"], "drill": true}, {"t": "q", "id": "3", "text": "机やいすは（　　）でご用意ください。", "opts": ["全額", "各自", "区画", "出店"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "子どもには、もっと外で遊ん（　　）と思います。", "opts": ["でほしい", "でいたい", "でみたい", "でおきたい"], "drill": true}, {"t": "q", "id": "5", "text": "すみません、この用紙はどこに出せ（　　）ですか。", "opts": ["たら", "ばいい", "てもいい", "ないと"], "drill": true}, {"t": "q", "id": "6", "text": "大きな音を出さ（　　）のですが。", "opts": ["ないでほしい", "なくてほしい", "ずにほしい", "ないほしい"], "drill": true}]}, {"key": "火曜", "title": "短文読解 ── あいさつのメールを読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p>件名：異動のごあいさつ</p><p>営業部のみなさま</p><p>お疲れさまです。総務課の井上です。</p><p><b>私事で恐縮ですが</b>、10月1日付で福岡支店へ異動することになりました。この三年間、みなさまには本当にお世話になりました。</p><p>入社したばかりのころ、書類の書き方も分からず、何度も助けていただきました。特に、去年の秋のシステム入れ替えのときは、営業部のみなさまに残業までしていただき、今でも感謝しています。</p><p>後任は同じ総務課の<b>森さん</b>です。すでに引き継ぎは終えておりますので、10月以降のご連絡は森さんへお願いいたします。私の社内メールは、<b>9月30日で使えなくなります。</b></p><p>福岡へお越しの際は、ぜひお声をおかけください。</p><p>井上</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "井上さんは、10月からどうなるか。", "opts": ["会社をやめる", "福岡支店へ移る", "営業部へ移る", "総務課に残る"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "10月以降、総務課の用事はだれに連絡すればよいか。", "opts": ["井上さん", "森さん", "営業部の人", "福岡支店"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "このメールから分かることはどれか。", "opts": ["井上さんの社内メールは10月以降も使える", "引き継ぎはこれから行う", "井上さんは入社してすぐこの部署に来た", "井上さんは営業部の人に感謝している"], "tag": "naiyou"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>異動</td><td>いどう</td><td>勤め先の中で担当や場所が変わること</td><td>mutasi</td></tr><tr><td>2</td><td>支店</td><td>してん</td><td>本社以外の店・営業所</td><td>kantor cabang</td></tr><tr><td>3</td><td>私事</td><td>しじ</td><td>個人的なこと</td><td>urusan pribadi</td></tr><tr><td>4</td><td>恐縮</td><td>きょうしゅく</td><td>申し訳なく思うこと</td><td>merasa tidak enak</td></tr><tr><td>5</td><td>世話になる</td><td>せわになる</td><td>助けてもらう</td><td>dibantu / diurus</td></tr><tr><td>6</td><td>入れ替え</td><td>いれかえ</td><td>別のものに変えること</td><td>penggantian</td></tr><tr><td>7</td><td>感謝</td><td>かんしゃ</td><td>ありがたく思うこと</td><td>rasa terima kasih</td></tr><tr><td>8</td><td>後任</td><td>こうにん</td><td>あとを引きつぐ人</td><td>pengganti</td></tr><tr><td>9</td><td>引き継ぎ</td><td>ひきつぎ</td><td>仕事を次の人に渡すこと</td><td>serah terima</td></tr><tr><td>10</td><td>〜の際</td><td>のさい</td><td>〜のとき（かたい言い方）</td><td>ketika ~</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①お〜する／ご〜する</b>（謙譲。自分の動作をへりくだる／Merendahkan diri）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>お ＋ 動詞ます形 ＋ する</td><td>荷物を<b>お持ちします</b>。</td></tr><tr><td>ご ＋ 漢語 ＋ する</td><td>明日<b>ご連絡します</b>。</td></tr></tbody></table>"}, {"t": "passage", "v": "<p><b>注意</b>：相手の動作には使いません。相手には「お〜になる」（尊敬）を使います。</p><p>自分が持つ → お持ちします／相手が持つ → お持ちになります。</p>"}, {"t": "p", "v": "<b>②〜（さ）せていただく</b>（させてもらう。とてもていねいな申し出／Izinkan saya ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞使役形 ＋ ていただく</td><td>明日は休ま<b>せていただきます</b>。</td></tr></tbody></table>"}, {"t": "p", "v": "・「〜します」より控えめですが、使いすぎると回りくどくなります。<b>申し出や許可を求める場面</b>で使います。"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "10月1日付で大阪支店へ（　　）することになりました。", "opts": ["異動", "移動", "引き継ぎ", "後任"], "drill": true}, {"t": "q", "id": "2", "text": "三年間、大変お（　　）になりました。", "opts": ["感謝", "世話", "恐縮", "私事"], "drill": true}, {"t": "q", "id": "3", "text": "仕事の（　　）は先週終わりました。", "opts": ["入れ替え", "引き継ぎ", "後任", "異動"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "重そうですね。私が（　　）ましょうか。", "opts": ["お持ちになり", "お持ちし", "持たれ", "お持ちくださり"], "drill": true}, {"t": "q", "id": "5", "text": "明日、こちらから（　　）します。", "opts": ["ご連絡", "お連絡", "ご連絡になり", "連絡され"], "drill": true}, {"t": "q", "id": "6", "text": "申し訳ありませんが、本日は早めに帰ら（　　）。", "opts": ["せていただきます", "れていただきます", "させてくださいます", "せてさしあげます"], "drill": true}]}, {"key": "水曜", "title": "中文読解 ── エッセイを読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p>私は方向感覚がありません。地図を見ても、自分がどちらを向いているのか分からないのです。</p><p>五年前、初めて日本へ来た日に、駅で反対方向の電車に乗りました。三十分ほど走ってから気づいて、あわてて降りました。知らない駅でした。看板の漢字も読めず、どうしていいか分かりませんでした。</p><p>ホームのベンチに座っていると、掃除をしていた年配の女性が近づいてきて、何か言いました。<b>①言葉は分かりませんでした。</b>でも、その人は私の手のスマートフォンを指さし、地図の画面を開いて、乗るべきホームの番号を指で示してくれました。それから、電車が来るまで隣に立っていてくれました。</p><p>あれから五年たち、今は道に迷うこともほとんどありません。日本語も、あのときよりは分かります。<b>②けれども、あの三十分の間違いを、私は失敗だと思っていません。</b>あの日、あの電車に乗らなければ、あの人には会わなかったからです。</p><p>私は今も方向感覚がありません。それでいいと思っています。</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "五年前、筆者は駅で何をしたか。", "opts": ["電車の時間を間違えた", "反対方向の電車に乗った", "切符をなくした", "駅で道を聞いた"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "「<b>①言葉は分かりませんでした</b>」とあるが、女性はどうやって助けてくれたか。", "opts": ["ゆっくり日本語で説明してくれた", "駅員を呼んでくれた", "地図を開いて、指でホームの番号を示してくれた", "一緒に電車に乗ってくれた"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "「<b>②けれども、あの三十分の間違いを、私は失敗だと思っていません</b>」とあるが、なぜか。", "opts": ["三十分しか無駄にしなかったから", "その間違いがなければ、その人に会わなかったから", "日本語が上手になったから", "道に迷わなくなったから"], "tag": "naiyou"}, {"t": "q", "id": "問4", "text": "この文章で筆者が最も言いたいことはどれか。", "opts": ["方向感覚は練習で身につく", "日本人は親切である", "間違いが、大切な出会いにつながることもある", "地図を見る力が必要である"], "tag": "shucho"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>方向</td><td>ほうこう</td><td>向き</td><td>arah</td></tr><tr><td>2</td><td>感覚</td><td>かんかく</td><td>感じ取る力</td><td>indra / kepekaan</td></tr><tr><td>3</td><td>反対</td><td>はんたい</td><td>逆</td><td>berlawanan</td></tr><tr><td>4</td><td>あわてて</td><td>―</td><td>急いで落ち着かない様子で</td><td>dengan panik</td></tr><tr><td>5</td><td>看板</td><td>かんばん</td><td>店名などを書いた板</td><td>papan nama</td></tr><tr><td>6</td><td>年配</td><td>ねんぱい</td><td>年をとっている</td><td>berumur</td></tr><tr><td>7</td><td>指さす</td><td>ゆびさす</td><td>指で示す</td><td>menunjuk</td></tr><tr><td>8</td><td>示す</td><td>しめす</td><td>見せて教える</td><td>menunjukkan</td></tr><tr><td>9</td><td>迷う</td><td>まよう</td><td>道が分からなくなる</td><td>tersesat</td></tr><tr><td>10</td><td>出会い</td><td>であい</td><td>人と会うこと</td><td>perjumpaan</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜ため（に）</b>（目的・原因の両方／Untuk ~ / Karena ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ ため（に）＝目的</td><td>合格する<b>ために</b>勉強します。</td></tr><tr><td>動詞た形・名詞＋の ＋ ため＝原因</td><td>雨の<b>ため</b>、中止になりました。</td></tr></tbody></table>"}, {"t": "passage", "v": "<p><b>見分け方</b>：<b>これからのこと＝目的／すでに起きたこと＝原因</b>。案内文では原因の使い方が多く出ます。</p>"}, {"t": "p", "v": "<b>②〜によると</b>（情報の出どころ／Menurut ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ によると</td><td>天気予報<b>によると</b>、明日は雨だそうです。</td></tr></tbody></table>"}, {"t": "p", "v": "・文の最後は「〜そうだ」「〜ということだ」で受けるのが自然です。"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "駅を出たら（　　）が分からなくなりました。", "opts": ["方向", "感覚", "看板", "出会い"], "drill": true}, {"t": "q", "id": "2", "text": "地図を見せて、行き方を（　　）てくれました。", "opts": ["迷っ", "示し", "あわて", "反対し"], "drill": true}, {"t": "q", "id": "3", "text": "知らない町で道に（　　）ました。", "opts": ["示し", "迷い", "指さし", "感じ"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "大雪の（　　）、電車が止まっています。", "opts": ["ために", "ように", "だけに", "うちに"], "drill": true}, {"t": "q", "id": "5", "text": "新聞（　　）、来月から料金が上がるそうです。", "opts": ["によって", "によると", "について", "に対して"], "drill": true}, {"t": "q", "id": "6", "text": "家を買う（　　）、お金をためています。", "opts": ["ために", "によると", "のように", "ばかりに"], "drill": true}]}, {"key": "木曜", "title": "中文読解 ── 意見文を読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p>職場で連絡をするとき、メールと電話のどちらを使うか。若い人はメール、年配の人は電話、と言われることがあります。しかし私は、<b>①この分け方はあまり役に立たない</b>と思っています。</p><p>大事なのは、その連絡が<b>「記録に残すべきものか」</b>という点です。日時や金額のように、あとで確認する必要があるものは、必ず文字にすべきです。電話で伝えると、聞き間違いが起きても証拠が残りません。</p><p>逆に、<b>②相手の反応を見ながら進めたい話</b>は、電話や対面のほうが早く終わります。断りにくいお願いや、謝罪がこれにあたります。メールで断りの理由を三回やりとりするより、一分話すほうが、お互いに気持ちよく終わることが多いのです。</p><p>つまり、選ぶ基準は年齢ではなく、<b>内容</b>です。記録が必要か、反応が必要か。この二つで決めれば、たいていの場合はうまくいきます。</p><p>ただし、一つだけ例外があります。<b>急ぎのときは、必ず電話です。</b>メールは相手が読むまで届いていないのと同じだからです。送ったから伝えた、とは言えません。</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "「<b>①この分け方はあまり役に立たない</b>」とあるが、どのような分け方か。", "opts": ["記録に残すか残さないかで分ける", "内容で分ける", "若い人はメール、年配の人は電話と分ける", "急ぎかどうかで分ける"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "筆者によれば、必ず文字にすべきなのはどんな連絡か。", "opts": ["断りにくいお願い", "日時や金額など、あとで確認する必要があるもの", "謝罪", "急ぎの用件"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "「<b>②相手の反応を見ながら進めたい話</b>」の例として、筆者は何を挙げているか。", "opts": ["会議の日程の連絡", "断りにくいお願いや謝罪", "金額の確認", "急ぎの連絡"], "tag": "naiyou"}, {"t": "q", "id": "問4", "text": "急ぎの連絡について、筆者はなぜ電話がよいと考えているか。", "opts": ["電話のほうが記録に残るから", "メールは相手が読むまで伝わったことにならないから", "電話のほうが早く書けるから", "メールは間違いが多いから"], "tag": "naiyou"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>職場</td><td>しょくば</td><td>働く場所</td><td>tempat kerja</td></tr><tr><td>2</td><td>分け方</td><td>わけかた</td><td>分類のしかた</td><td>cara membagi</td></tr><tr><td>3</td><td>記録</td><td>きろく</td><td>残しておくこと</td><td>catatan</td></tr><tr><td>4</td><td>証拠</td><td>しょうこ</td><td>事実を示すもの</td><td>bukti</td></tr><tr><td>5</td><td>反応</td><td>はんのう</td><td>相手の受け答えや様子</td><td>reaksi</td></tr><tr><td>6</td><td>対面</td><td>たいめん</td><td>直接会うこと</td><td>tatap muka</td></tr><tr><td>7</td><td>謝罪</td><td>しゃざい</td><td>あやまること</td><td>permintaan maaf</td></tr><tr><td>8</td><td>基準</td><td>きじゅん</td><td>判断のもとになるもの</td><td>kriteria</td></tr><tr><td>9</td><td>例外</td><td>れいがい</td><td>決まりに当てはまらないもの</td><td>pengecualian</td></tr><tr><td>10</td><td>急ぎ</td><td>いそぎ</td><td>早くしなければならないこと</td><td>mendesak</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜てばかりいる</b>（そればかりしている／Hanya melakukan ~ terus）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ ばかりいる</td><td>休みの日は寝<b>てばかりいます</b>。</td></tr><tr><td>名詞 ＋ ばかり</td><td>甘いもの<b>ばかり</b>食べている。</td></tr></tbody></table>"}, {"t": "p", "v": "・<b>よくない習慣</b>を批判するときに使うことが多い表現です。"}, {"t": "p", "v": "<b>②〜ないことはない</b>（できないわけではない／Bukan berarti tidak bisa）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ない形 ＋ ことはない</td><td>行け<b>ないことはない</b>が、遠い。</td></tr></tbody></table>"}, {"t": "p", "v": "・<b>控えめな肯定</b>です。「できるが、あまり気が進まない」という気持ちが入ります。"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "あとで確認できるよう、（　　）に残しておきます。", "opts": ["記録", "反応", "基準", "例外"], "drill": true}, {"t": "q", "id": "2", "text": "全員が対象ですが、一つだけ（　　）があります。", "opts": ["基準", "例外", "証拠", "職場"], "drill": true}, {"t": "q", "id": "3", "text": "選ぶときの（　　）を決めましょう。", "opts": ["反応", "基準", "謝罪", "急ぎ"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "弟はゲームをし（　　）、勉強しません。", "opts": ["てばかりいて", "たばかりで", "るばかりに", "てばかりして"], "drill": true}, {"t": "q", "id": "5", "text": "行け（　　）が、少し遠いですね。", "opts": ["ないことはない", "ないことがない", "るわけがない", "ないものだ"], "drill": true}, {"t": "q", "id": "6", "text": "甘いもの（　　）食べていると、体によくないですよ。", "opts": ["ばかり", "だけに", "しか", "ほど"], "drill": true}]}, {"key": "金曜", "title": "情報検索 ── 案内から答えを探す", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p><b>さくらモバイル　料金プランのご案内</b></p><table><thead><tr><th>プラン</th><th>月額</th><th>データ量</th><th>通話</th></tr></thead><tbody><tr><td>ライト</td><td>1,000円</td><td>3GB</td><td>30秒22円</td></tr><tr><td>スタンダード</td><td>2,000円</td><td>20GB</td><td>30秒22円</td></tr><tr><td>かけ放題つき</td><td>3,500円</td><td>20GB</td><td>無料</td></tr><tr><td>家族プラン</td><td>1人1,500円</td><td>20GB</td><td>家族間のみ無料</td></tr></tbody></table><p><b>ご注意</b></p><p>・<b>家族プランは3人以上でのお申し込みが必要です。</b>2人ではお申し込みいただけません。</p><p>・データ量を使い切ったあとは、速度が遅くなります。追加する場合は1GBごとに500円です。</p><p>・<b>学割</b>：18歳以下の方は、上の月額から<b>500円引き</b>になります。家族プランには使えません。</p><p>・海外でのご利用には、別のお申し込みが必要です。</p><p>・プランの変更は月に1回まで、翌月から適用されます。</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "16歳の人が「スタンダード」を申し込む。月額はいくらか。", "opts": ["2,000円", "1,500円", "1,000円", "2,500円"], "tag": "joken"}, {"t": "q", "id": "問2", "text": "夫婦2人で「家族プラン」を申し込みたい。どうなるか。", "opts": ["1人1,500円で申し込める", "2人では申し込めない", "1人2,000円になる", "学割が使える"], "tag": "joken"}, {"t": "q", "id": "問3", "text": "「スタンダード」の人が、月の途中でデータを2GB追加した。その月の支払いはいくらか。", "opts": ["2,000円", "2,500円", "3,000円", "3,500円"], "tag": "joken"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>月額</td><td>げつがく</td><td>1か月あたりの金額</td><td>biaya bulanan</td></tr><tr><td>2</td><td>通話</td><td>つうわ</td><td>電話で話すこと</td><td>panggilan telepon</td></tr><tr><td>3</td><td>使い切る</td><td>つかいきる</td><td>全部使ってしまう</td><td>menghabiskan</td></tr><tr><td>4</td><td>速度</td><td>そくど</td><td>速さ</td><td>kecepatan</td></tr><tr><td>5</td><td>追加</td><td>ついか</td><td>足すこと</td><td>penambahan</td></tr><tr><td>6</td><td>学割</td><td>がくわり</td><td>学生向けの割引</td><td>diskon pelajar</td></tr><tr><td>7</td><td>割引</td><td>わりびき</td><td>安くすること</td><td>potongan harga</td></tr><tr><td>8</td><td>適用</td><td>てきよう</td><td>当てはめて使うこと</td><td>penerapan</td></tr><tr><td>9</td><td>変更</td><td>へんこう</td><td>変えること</td><td>perubahan</td></tr><tr><td>10</td><td>翌月</td><td>よくげつ</td><td>次の月</td><td>bulan berikutnya</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜に関して／〜に関する</b>（〜について。かたい言い方／Mengenai ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ に関して</td><td>料金<b>に関して</b>は、窓口でお尋ねください。</td></tr><tr><td>名詞 ＋ に関する ＋ 名詞</td><td>契約<b>に関する</b>書類。</td></tr></tbody></table>"}, {"t": "p", "v": "・「〜について」より<b>かたい書き言葉</b>です。案内文・書類でよく使われます。"}, {"t": "p", "v": "<b>②〜といった</b>（例をあげる／Seperti ~ dan ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞、名詞 ＋ といった ＋ 名詞</td><td>日時や金額<b>といった</b>情報は、文字で残す。</td></tr></tbody></table>"}, {"t": "p", "v": "・2つ以上の例をあげてから、まとめの名詞につなげます。"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "データを（　　）と、速度が遅くなります。", "opts": ["使い切る", "追加する", "適用する", "変更する"], "drill": true}, {"t": "q", "id": "2", "text": "18歳以下の方には（　　）があります。", "opts": ["月額", "学割", "速度", "通話"], "drill": true}, {"t": "q", "id": "3", "text": "プランの変更は（　　）から使えます。", "opts": ["当月", "翌月", "先月", "今週"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "契約（　　）ご質問は、こちらへお願いします。", "opts": ["に関する", "によって", "にとって", "に対する"], "drill": true}, {"t": "q", "id": "5", "text": "日時や場所（　　）情報は、必ずメモしてください。", "opts": ["といった", "という", "といって", "とした"], "drill": true}, {"t": "q", "id": "6", "text": "料金（　　）は、ホームページをご覧ください。", "opts": ["に関して", "にとって", "によって", "に対して"], "drill": true}]}, {"key": "土曜", "title": "読解通しテスト（55分）", "blocks": [{"t": "passage", "v": "<p>今週から<b>55分</b>です。タイマーをセットして、途中で止めないこと。</p><p>時間配分の目安：中文5分／長文11分／情報検索7分。</p>"}, {"t": "h2", "v": "問題1　中文（3問）"}, {"t": "passage", "v": "<p>スーパーのレジで、前の人が小銭を数えていました。財布から一円玉を一枚ずつ出しています。後ろには五、六人が並んでいました。</p><p>若い店員が「お急ぎでしたら、お札でも大丈夫ですよ」と声をかけました。その人は「いえ、ちょうど出したいので」と答え、また数え始めました。</p><p>私は、正直に言えば少しいらいらしていました。ところが、その人が財布を閉じたとき、店員が言いました。「ぴったりですね。ありがとうございます」。その言い方に、急かす気持ちがまったくありませんでした。</p><p>私は自分が恥ずかしくなりました。<b>待たされていたのは私も店員も同じなのに、感じていたことは違ったのです。</b>時間を取られたと思うか、丁寧に払ってもらったと思うか。同じ一分でも、そこには選択がありました。</p>"}, {"t": "q", "id": "問1", "text": "店員は前の人に何と声をかけたか。", "opts": ["早くしてほしい", "急いでいるならお札でもよい", "小銭は使えない", "後ろの人が待っている"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "筆者が恥ずかしくなったのは、なぜか。", "opts": ["自分も小銭を数えていたから", "店員に注意されたから", "同じ状況なのに、店員と自分の感じ方が違ったから", "列に並ぶのが嫌いだから"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "「そこには選択がありました」とあるが、どういう意味か。", "opts": ["支払い方法を選べたということ", "同じことをどう受け取るかは、自分で決められるということ", "別のレジに並べたということ", "店員が対応を選んだということ"], "tag": "naiyou"}, {"t": "h2", "v": "問題2　中文（3問）"}, {"t": "passage", "v": "<p>娘が小学生のとき、夏休みの自由研究で「家族の朝ごはん調べ」をしたことがあります。一週間、家族三人が何を食べたかを表にするだけの、簡単なものでした。</p><p>表ができあがったとき、娘が言いました。「お母さんだけ、毎日ちがう」。見ると、私と娘は毎朝ほぼ同じもので、妻だけが日によって違っていました。</p><p>娘はその理由を妻に聞きに行きました。妻の答えはこうでした。「二人が残したものを食べてるからよ」。</p><p>娘はそれを、そのまま研究の結論に書きました。<b>「お母さんの朝ごはんは、家族の残りでできている」。</b>先生に何と言われるか心配でしたが、娘は賞をもらってきました。私は表彰状より、その一行のほうを長く覚えています。</p>"}, {"t": "q", "id": "問4", "text": "娘がした自由研究はどんなものか。", "opts": ["家族の好きな食べ物を調べたもの", "一週間の家族の朝ごはんを表にしたもの", "朝ごはんの作り方を調べたもの", "家族の健康を調べたもの"], "tag": "naiyou"}, {"t": "q", "id": "問5", "text": "妻の朝ごはんが毎日違ったのは、なぜか。", "opts": ["料理が好きだから", "健康に気をつけているから", "夫と娘が残したものを食べていたから", "早く起きるから"], "tag": "naiyou"}, {"t": "q", "id": "問6", "text": "筆者が長く覚えているのは何か。", "opts": ["娘がもらった賞", "先生の言葉", "娘が書いた結論の一行", "表の作り方"], "tag": "naiyou"}, {"t": "h2", "v": "問題3　長文（4問）"}, {"t": "passage", "v": "<p>日本に来て最初の一年、私がいちばん苦労したのは、言葉でも食べ物でもなく、「あいまいな返事」でした。</p><p>何かをお願いしたとき、日本の人はよく「ちょっと難しいですね」と言います。私は最初、これを「難しいけれど、できる」という意味だと理解していました。だから、何度も同じお願いをしました。相手が困った顔をしていることに、しばらく気づきませんでした。</p><p>教えてくれたのは、同じ職場のベトナム人の先輩でした。「あれは『できません』だよ」。<b>①私は驚きました。</b>なぜはっきり言わないのか、と腹を立てもしました。</p><p>しかし三年たった今、私は自分も同じ言い方をしています。理由が分かったからです。<b>②「できません」と言い切ると、相手が次の言葉を出せなくなる。</b>「難しいですね」なら、相手は「では別の方法は」と続けられます。断っているのに、話を終わらせない。そういう言い方なのだと気づきました。</p><p>もちろん、これは外国人にとって分かりにくい習慣です。私自身、今でも判断を間違えることがあります。<b>③けれども、分かりにくいことと、意味がないことは別</b>です。分かりにくい形の中に、相手を追い込まないための工夫が入っていることもあります。</p><p>言葉を学ぶというのは、単語を覚えることだけではないのだと思います。その言い方が<b>なぜそうなっているのか</b>まで分かったとき、初めてその言葉が使えるようになるのでしょう。</p>"}, {"t": "q", "id": "問7", "text": "来日して一年目、筆者は「ちょっと難しいですね」をどう理解していたか。", "opts": ["できないという意味", "難しいができるという意味", "あとで返事をするという意味", "相手が忙しいという意味"], "tag": "naiyou"}, {"t": "q", "id": "問8", "text": "「<b>①私は驚きました</b>」とあるが、何に驚いたのか。", "opts": ["先輩がベトナム人だったこと", "その言葉が断りの意味だったこと", "自分の日本語が通じていなかったこと", "相手が怒っていたこと"], "tag": "naiyou"}, {"t": "q", "id": "問9", "text": "「<b>②「できません」と言い切ると、相手が次の言葉を出せなくなる</b>」とあるが、「難しいですね」だとどうなるか。", "opts": ["相手が断られたと気づかない", "相手が別の方法を提案できる", "相手が同じお願いをくり返す", "相手が怒らずにすむ"], "tag": "naiyou"}, {"t": "q", "id": "問10", "text": "「<b>③けれども、分かりにくいことと、意味がないことは別</b>」とあるが、筆者が言いたいことはどれか。", "opts": ["分かりにくい習慣は変えるべきだ", "外国人には理解できない", "分かりにくい言い方にも理由や工夫がある", "意味のない習慣も多い"], "tag": "naiyou"}, {"t": "h2", "v": "問題4　情報検索（3問）"}, {"t": "passage", "v": "<p><b>みどり市民ホール　施設のご利用案内</b></p><table><thead><tr><th>部屋</th><th>午前(9-12)</th><th>午後(13-17)</th><th>夜間(18-21)</th><th>定員</th></tr></thead><tbody><tr><td>大ホール</td><td>12,000円</td><td>16,000円</td><td>16,000円</td><td>400人</td></tr><tr><td>会議室A</td><td>3,000円</td><td>4,000円</td><td>4,000円</td><td>50人</td></tr><tr><td>会議室B</td><td>2,000円</td><td>2,500円</td><td>2,500円</td><td>20人</td></tr><tr><td>和室</td><td>1,500円</td><td>2,000円</td><td>利用不可</td><td>15人</td></tr></tbody></table><p><b>ご注意</b></p><p>・市内にお住まいの方、市内の団体は<b>半額</b>になります。</p><p>・お申し込みは、利用日の<b>3か月前から1週間前まで</b>です。</p><p>・<b>市外の方のお申し込みは、利用日の2か月前から</b>となります。</p><p>・キャンセルは利用日の3日前まで無料。それ以降は全額をいただきます。</p><p>・飲食は会議室A・Bのみ可能です。大ホールと和室ではできません。</p>"}, {"t": "q", "id": "問11", "text": "市内の団体が会議室Aを午後に借りる。料金はいくらか。", "opts": ["4,000円", "2,000円", "3,000円", "1,500円"], "tag": "joken"}, {"t": "q", "id": "問12", "text": "市外の人が、3か月後の利用を今日申し込みたい。どうなるか。", "opts": ["今日申し込める", " ,"v":"文法（2項目）"},{"t":"p","v":"①〜より（〜から。日時の始まり／かたい言い方）（Mulai dari ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>日時 ＋ より</td><td>10月1日<b>より</b>変更いたします。</td></tr><tr><td>場所 ＋ より</td><td>玄関<b>より</b>お入りください。</td></tr></tbody></table>"},{"t":"passage","v":"注意：話すときは「10月1日<b>から</b>」です。「より」は掲示・案内・書類に使うかたい言い方です。"},{"t":"p","v":"②〜ことがあります（ときどきそうなる／可能性）（Kadang bisa terjadi ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ ことがあります</td><td>ご希望にそえない<b>ことがあります</b>。</td></tr><tr><td>動詞ない形 ＋ ことがあります</td><td>雨で中止になる<b>ことがあります</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「〜たことがあります」は経験。「〜ることがあります」はときどき起こること。形が似ているので注意します。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"夕方は職員が（　　）になるので、注意が必要です。  ","opts":["手薄","個別","面会","記入"]},{"t":"q","id":"2","drill":true,"text":"お仕事の（　　）がつかない方は、ご相談ください。  ","opts":["希望","都合","変更","準備"]},{"t":"q","id":"3","drill":true,"text":"受付でお名前を（　　）してください。  ","opts":["対応","記入","面会","準備"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"１０月１日（　　）、時間が変わります。  ","opts":["より","ほど","しか","だけ"]},{"t":"q","id":"5","drill":true,"text":"混雑していて、お待たせする（　　）。  ","opts":["ことがあります","たことがあります","ものがあります","はずがあります"]},{"t":"q","id":"6","drill":true,"text":"去年、一度だけ来（　　）。  ","opts":["たことがあります","ることがあります","ておきます","てあります"]}]},{"key":"火曜","title":"短文読解 ── お詫びのメールを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>件名：資料の送付が遅れております件</p><p>山川商事　鈴木様</p><p>いつもお世話になっております。中村物産の田口です。</p><p>先週お約束しておりました見積書の件ですが、<u>①社内の確認に時間がかかっており</u>、まだお送りできておりません。お待たせしてしまい、申し訳ございません。</p><p>明日9月18日の午前中には、必ずお送りいたします。もし午前中に届かない場合は、お手数ですがご一報いただけますでしょうか。すぐに確認いたします。</p><p>なお、10月からの単価につきましては、見積書とは<b>別にご案内</b>いたします。そちらは来週になる見込みです。</p><p>ご迷惑をおかけしますが、どうぞよろしくお願いいたします。</p><p>中村物産株式会社　田口 健一</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"このメールを書いた一番の目的は何か。  ","opts":["見積書が遅れていることをわびるため  ","新しい単価を知らせるため  ","注文を取り消すため  ","会う日を決めるため"],"tag":"shucho"},{"t":"q","id":"問2","text":"①「社内の確認に時間がかかっており」とあるが、この部分は何を説明しているか。  ","opts":["見積書が遅れている理由  ","単価が上がる理由  ","会社が忙しい理由  ","鈴木様が待っている理由"],"tag":"shiji"},{"t":"q","id":"問3","text":"明日の午前中に見積書が届かなかったら、鈴木様はどうすればよいか。  ","opts":["もう一日待つ  ","田口さんに連絡する  ","別の会社に頼む  ","単価の案内を待つ"],"tag":"joken"},{"t":"q","id":"問4","text":"10月からの単価について、正しいものはどれか。  ","opts":["見積書に一緒に書かれている  ","明日、見積書と同時に届く  ","見積書とは別に、来週ごろ案内される  ","案内はしないことになった"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>送付</td><td>そうふ</td><td>書類などを送ること</td><td>pengiriman (dokumen)</td></tr><tr><td>2</td><td>見積書</td><td>みつもりしょ</td><td>いくらかかるかを書いた書類</td><td>surat penawaran harga</td></tr><tr><td>3</td><td>社内</td><td>しゃない</td><td>会社の中</td><td>di dalam perusahaan</td></tr><tr><td>4</td><td>確認</td><td>かくにん</td><td>間違いがないか調べること</td><td>konfirmasi</td></tr><tr><td>5</td><td>一報</td><td>いっぽう</td><td>短い連絡</td><td>kabar singkat</td></tr><tr><td>6</td><td>お手数</td><td>おてすう</td><td>相手に手間をかけること</td><td>merepotkan</td></tr><tr><td>7</td><td>単価</td><td>たんか</td><td>一つあたりの値段</td><td>harga satuan</td></tr><tr><td>8</td><td>見込み</td><td>みこみ</td><td>たぶんそうなるという予想</td><td>perkiraan</td></tr><tr><td>9</td><td>迷惑</td><td>めいわく</td><td>人を困らせること</td><td>merepotkan / mengganggu</td></tr><tr><td>10</td><td>必ず</td><td>かならず</td><td>きっと。例外なく</td><td>pasti</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜ており／〜ております（〜ている のかたい言い方）（Bentuk formal dari ~te iru）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ おります</td><td>まだお送りでき<b>ておりません</b>。</td></tr><tr><td>動詞て形 ＋ おり、〜</td><td>確認に時間がかかっ<b>ており</b>、遅れています。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜ております」は自分側のことに使います。相手のことには「〜ていらっしゃいます」を使います。"},{"t":"p","v":"②〜につきましては（〜については のかたい言い方）（Mengenai ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ につきましては</td><td>単価<b>につきましては</b>、別にご案内します。</td></tr><tr><td>名詞 ＋ につきまして</td><td>その件<b>につきまして</b>、ご説明いたします。</td></tr></tbody></table>"},{"t":"p","v":"・話すときは「〜については」。メールや書類では「〜につきましては」を使います。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"（　　）が届きましたので、金額を確認します。  ","opts":["見積書","一報","単価","見込み"]},{"t":"q","id":"2","drill":true,"text":"（　　）ですが、もう一度ご連絡いただけますか。  ","opts":["お手数","見込み","社内","送付"]},{"t":"q","id":"3","drill":true,"text":"返事は来週になる（　　）です。  ","opts":["迷惑","見込み","確認","単価"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"ただいま確認し（　　）ますので、少々お待ちください。  ","opts":["ており","ていき","てあり","ておき"]},{"t":"q","id":"5","drill":true,"text":"その件（　　）は、あらためてご連絡します。  ","opts":["につきまして","にとりまして","にあたりまして","におきまして"]},{"t":"q","id":"6","drill":true,"text":"まだ届い（　　）ので、確認いたします。  ","opts":["ておりません","ていません","おりません","ありません"]}]},{"key":"水曜","title":"中文読解 ── エッセイを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　日本に来て三年目の夏、私は初めて「ひとりで買い物ができた」と感じた。それまでも買い物はしていたのだから、おかしな言い方かもしれない。けれども、あの日までの私は、店に入ると必ず値札の数字だけを見ていた。書いてある言葉は読まずに、安いか高いかだけで決めていたのである。</p><p>　その日、私は棚の前で足を止めた。二つの牛乳が並んでいて、値段はほとんど同じだった。片方には「本日中にお召し上がりください」と書いてあり、もう片方には何も書かれていない。私は前者を手に取り、そして<u>①戻した</u>。今日は使わないと分かっていたからだ。</p><p>　たったそれだけのことだ。しかし店を出たとき、私の中で何かが変わっていた。値段ではなく<b>言葉で選んだ</b>のは、それが初めてだったのだ。</p><p>　日本語の勉強というと、試験の点数のことだと思われやすい。私自身、長い間そう思っていた。けれども②<u>本当に力がついた</u>と感じるのは、点数が上がったときではなかった。棚の前で立ち止まれたとき、駅の放送が耳に入ってきたとき、同僚の冗談に自然に笑えたとき——そういう小さな瞬間だった。</p><p>　言葉を覚えるのは、点を取るためではない。目の前のものが、少しずつ「読めるもの」に変わっていくためだ。今の私はそう思っている。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「戻した」とあるが、なぜ戻したのか。  ","opts":["値段が高かったから  ","今日中に使わないと分かっていたから  ","言葉が読めなかったから  ","もう一つのほうが安かったから"],"tag":"shiji"},{"t":"q","id":"問2","text":"②「本当に力がついた」と筆者が感じるのは、どんなときか。  ","opts":["試験の点数が上がったとき  ","日本語で長い文章が書けたとき  ","日常の小さな場面で日本語が働いたとき  ","先生にほめられたとき"],"tag":"shiji"},{"t":"q","id":"問3","text":"「ひとりで買い物ができた」と筆者が感じた理由はどれか。  ","opts":["店員に聞かずに買えたから  ","日本語の言葉を見て自分で決めたから  ","安い店を見つけられたから  ","お金の計算ができたから"],"tag":"naiyou"},{"t":"q","id":"問4","text":"この文章で筆者が最も言いたいことはどれか。  ","opts":["試験の点数は気にしなくてよい  ","言葉を覚えると、身のまわりが少しずつ読めるようになる  ","買い物は日本語の勉強によい  ","三年たてば日本語は自然にできるようになる"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>値札</td><td>ねふだ</td><td>値段が書いてある札</td><td>label harga</td></tr><tr><td>2</td><td>棚</td><td>たな</td><td>物をのせる台</td><td>rak</td></tr><tr><td>3</td><td>本日中</td><td>ほんじつちゅう</td><td>今日のうちに</td><td>dalam hari ini</td></tr><tr><td>4</td><td>召し上がる</td><td>めしあがる</td><td>「食べる・飲む」の尊敬語</td><td>makan/minum (bentuk hormat)</td></tr><tr><td>5</td><td>前者</td><td>ぜんしゃ</td><td>先に言ったほう</td><td>yang pertama (disebut)</td></tr><tr><td>6</td><td>立ち止まる</td><td>たちどまる</td><td>歩くのをやめて止まる</td><td>berhenti melangkah</td></tr><tr><td>7</td><td>瞬間</td><td>しゅんかん</td><td>ごく短い時間</td><td>saat / momen</td></tr><tr><td>8</td><td>同僚</td><td>どうりょう</td><td>同じ職場の仲間</td><td>rekan kerja</td></tr><tr><td>9</td><td>冗談</td><td>じょうだん</td><td>笑わせるための話</td><td>lelucon</td></tr><tr><td>10</td><td>自然に</td><td>しぜんに</td><td>無理なく、ひとりでに</td><td>secara alami</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜のである／〜のだ（説明・強調）（Penjelasan atau penegasan）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ のである</td><td>安いか高いかだけで決めていた<b>のである</b>。</td></tr><tr><td>な形容詞・名詞 ＋ なのである</td><td>大切なのは、そこ<b>なのである</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：話すときは「〜んです」。書き言葉、とくに文章の締めくくりでは「〜のである／〜のだ」を使います。"},{"t":"p","v":"②〜やすい／〜にくい（そうなりがち／しにくい）（Mudah ~ / sulit ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ やすい</td><td>点数のことだと思われ<b>やすい</b>。</td></tr><tr><td>動詞ます形 ＋ にくい</td><td>この字は読み<b>にくい</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「思われやすい」のように受身と組み合わせると、「世間ではそう思われがちだ」という意味になります。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"（　　）を見て、値段を確かめた。  ","opts":["値札","棚","瞬間","冗談"]},{"t":"q","id":"2","drill":true,"text":"（　　）が言ったことで、みんなが笑った。  ","opts":["前者","同僚","値札","本日中"]},{"t":"q","id":"3","drill":true,"text":"その言葉を聞いた（　　）、うれしくなった。  ","opts":["瞬間","自然に","棚","値札"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"この道は暗くて、歩き（　　）です。  ","opts":["にくい","やすい","がち","ぎみ"]},{"t":"q","id":"5","drill":true,"text":"私はそう考えていた（　　）。  ","opts":["のである","のでいる","ようである","そうである"]},{"t":"q","id":"6","drill":true,"text":"この漢字は覚え（　　）ので、何度も書きます。  ","opts":["にくい","やすい","たい","よい"]}]},{"key":"木曜","title":"中文読解 ── 意見文を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　「わからないことがあったら、いつでも聞いてください」。新しく入った人に、私たちはよくこう言う。やさしい言葉であり、言うほうに悪気はない。しかし、この一言だけで終わらせてしまうのは、<u>①受け入れる側の準備としては足りない</u>と私は考えている。</p><p>　理由は二つある。一つは、新しい人にとって「何がわからないのか」自体がわからないからだ。仕事の全体が見えていないうちは、質問の形にすることさえ難しい。もう一つは、聞くには相手の時間をもらう必要があるということだ。忙しそうに動いている人に声をかけるのは、想像以上に勇気がいる。</p><p>　では、どうすればよいか。私の職場では、一日の終わりに五分だけ「質問の時間」を取ることにした。こちらから「今日、困ったことはありましたか」と聞く。たったこれだけで、質問の数は目に見えて増えた。②<u>それ</u>は、新しい人が急に積極的になったからではない。<b>聞いてよい時間が決まっていた</b>からである。</p><p>　「いつでも聞いて」は、裏を返せば「聞く時間は決まっていない」ということでもある。受け入れる側がすべきなのは、やさしい言葉をかけることよりも、聞きやすい仕組みを用意することではないだろうか。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「受け入れる側の準備としては足りない」とあるが、筆者はなぜそう考えるのか。理由として本文に書かれていないものはどれか。  ","opts":["新しい人は、何がわからないかも分からないから  ","質問するには相手の時間をもらう必要があるから  ","忙しい人に声をかけるのは勇気がいるから  ","新しい人が日本語を話せないから"],"tag":"naiyou"},{"t":"q","id":"問2","text":"②「それ」は何を指しているか。  ","opts":["五分の時間を取ったこと  ","質問の数が増えたこと  ","新しい人が入ったこと  ","こちらから声をかけたこと"],"tag":"shiji"},{"t":"q","id":"問3","text":"筆者の職場で質問が増えたのは、なぜだと筆者は考えているか。  ","opts":["新しい人の性格が変わったから  ","聞いてよい時間が決まったから  ","仕事に慣れたから  ","上司がやさしくなったから"],"tag":"naiyou"},{"t":"q","id":"問4","text":"この文章で筆者が最も言いたいことはどれか。  ","opts":["やさしい言葉をかけることが何より大切だ  ","新しい人は自分から質問すべきだ  ","受け入れる側は、聞きやすい仕組みを用意するべきだ  ","質問の時間は五分がちょうどよい"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>悪気</td><td>わるぎ</td><td>人を困らせようとする気持ち</td><td>niat buruk</td></tr><tr><td>2</td><td>受け入れる</td><td>うけいれる</td><td>人や物を迎え入れる</td><td>menerima</td></tr><tr><td>3</td><td>全体</td><td>ぜんたい</td><td>部分ではなく、まとまり全部</td><td>keseluruhan</td></tr><tr><td>4</td><td>自体</td><td>じたい</td><td>そのもの</td><td>itu sendiri</td></tr><tr><td>5</td><td>想像</td><td>そうぞう</td><td>頭の中で思いえがくこと</td><td>bayangan / imajinasi</td></tr><tr><td>6</td><td>勇気</td><td>ゆうき</td><td>こわくても行う気持ち</td><td>keberanian</td></tr><tr><td>7</td><td>目に見えて</td><td>めにみえて</td><td>はっきり分かるほど</td><td>secara nyata / jelas</td></tr><tr><td>8</td><td>積極的</td><td>せっきょくてき</td><td>自分から進んで行う様子</td><td>aktif / proaktif</td></tr><tr><td>9</td><td>裏を返せば</td><td>うらをかえせば</td><td>反対から見れば</td><td>sebaliknya / dilihat dari sisi lain</td></tr><tr><td>10</td><td>仕組み</td><td>しくみ</td><td>うまく働くようにした形</td><td>sistem / mekanisme</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜のではないだろうか（やわらかい主張）（Bukankah sebaiknya ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ のではないだろうか</td><td>用意することな<b>のではないだろうか</b>。</td></tr><tr><td>普通形 ＋ のではないか</td><td>もう少し待つべき<b>ではないか</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜べきだ」より弱く、読む人に考えさせる言い方です。意見文の結びでよく使われます。"},{"t":"p","v":"②〜さえ（〜も。極端な例をあげる）（Bahkan ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ さえ</td><td>質問の形にすること<b>さえ</b>難しい。</td></tr><tr><td>動詞ます形 ＋ さえすれば</td><td>読み<b>さえすれば</b>分かります。</td></tr></tbody></table>"},{"t":"p","v":"・「〜さえ」は「ふつうならできることも、できない」という強調です。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"忙しい人に声をかけるには（　　）がいる。  ","opts":["勇気","悪気","全体","仕組み"]},{"t":"q","id":"2","drill":true,"text":"新しい（　　）を作ったので、質問しやすくなった。  ","opts":["仕組み","自体","想像","裏"]},{"t":"q","id":"3","drill":true,"text":"説明のあと、質問が（　　）増えた。  ","opts":["目に見えて","裏を返せば","悪気で","自体で"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"もう少し話を聞くべきな（　　）。  ","opts":["のではないだろうか","のようだろうか","ものだろうか","ことだろうか"]},{"t":"q","id":"5","drill":true,"text":"忙しくて、昼ごはん（　　）食べられなかった。  ","opts":["さえ","ほど","だけ","しか"]},{"t":"q","id":"6","drill":true,"text":"名前（　　）書けば、あとは職員が記入します。  ","opts":["さえ","ほど","より","だけしか"]}]},{"key":"金曜","title":"情報検索 ── 案内から答えを探す","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>市民健康センター　健康診断のご案内（10月）</b></p><table><thead><tr><th>コース</th><th>費用</th><th>所要時間</th><th>受付曜日</th><th>予約</th></tr></thead><tbody><tr><td>A　基本</td><td>3,000円</td><td>約40分</td><td>月・水・金</td><td>不要</td></tr><tr><td>B　基本＋血液</td><td>6,000円</td><td>約60分</td><td>月・水・金</td><td>必要</td></tr><tr><td>C　総合</td><td>12,000円</td><td>約2時間</td><td>火・木</td><td>必要</td></tr></tbody></table><p>◆受付時間　午前9時〜午前11時（コース共通）</p><p>◆予約が必要なコースは、<b>受診日の3日前まで</b>にお電話ください。当日の追加はできません。</p><p>◆Bコース・Cコースは、<b>朝食をとらずに</b>お越しください。水は飲んでもかまいません。</p><p>◆市内にお住まいの65歳以上の方は、<b>費用が半額</b>になります。受付で保険証をご提示ください。年齢の確認ができない場合は、割引できません。</p><p>◆結果は2週間後に郵送します。窓口でのお渡しはしておりません。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"木曜日に受けられるコースはどれか。  ","opts":["Aコースのみ  ","Bコースのみ  ","Cコースのみ  ","AコースとBコース"],"tag":"joken"},{"t":"q","id":"問2","text":"市内に住む70歳の人がBコースを受けるとき、払う金額はいくらか。  ","opts":["3,000円  ","6,000円  ","1,500円  ","12,000円"],"tag":"joken"},{"t":"q","id":"問3","text":"この案内の内容に合うものはどれか。  ","opts":["Aコースは予約をしてから行く  ","Cコースの前に朝ごはんを食べてよい  ","予約は受診日の3日前までにする  ","結果は窓口で受け取る"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>健康診断</td><td>けんこうしんだん</td><td>体の状態を調べる検査</td><td>pemeriksaan kesehatan</td></tr><tr><td>2</td><td>費用</td><td>ひよう</td><td>かかるお金</td><td>biaya</td></tr><tr><td>3</td><td>所要時間</td><td>しょようじかん</td><td>かかる時間</td><td>waktu yang diperlukan</td></tr><tr><td>4</td><td>受付</td><td>うけつけ</td><td>申し込みを受ける場所・時間</td><td>penerimaan / resepsi</td></tr><tr><td>5</td><td>予約</td><td>よやく</td><td>前もって申し込むこと</td><td>reservasi</td></tr><tr><td>6</td><td>受診</td><td>じゅしん</td><td>診察や検査を受けること</td><td>menerima pemeriksaan</td></tr><tr><td>7</td><td>共通</td><td>きょうつう</td><td>どれにも同じであること</td><td>sama untuk semua</td></tr><tr><td>8</td><td>半額</td><td>はんがく</td><td>半分の金額</td><td>setengah harga</td></tr><tr><td>9</td><td>提示する</td><td>ていじする</td><td>見せること</td><td>menunjukkan</td></tr><tr><td>10</td><td>郵送</td><td>ゆうそう</td><td>郵便で送ること</td><td>pengiriman via pos</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜までに（期限）（Paling lambat ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>時 ＋ までに</td><td>3日前<b>までに</b>お電話ください。</td></tr><tr><td>動詞辞書形 ＋ までに</td><td>受付が終わる<b>までに</b>お越しください。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜まで」は続いている終わり（5時<b>まで</b>働く）。「〜までに」は期限（5時<b>までに</b>出す）。意味が違います。"},{"t":"p","v":"②〜ずに（〜しないで。かたい言い方）（Tanpa melakukan ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ない形（ない→ずに）</td><td>朝食をとら<b>ずに</b>お越しください。</td></tr><tr><td>する → せずに</td><td>予約を<b>せずに</b>行った。</td></tr></tbody></table>"},{"t":"p","v":"・「する」だけ「せずに」になります。「しずに」は誤りです。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"（　　）は約40分です。  ","opts":["所要時間","半額","郵送","受診"]},{"t":"q","id":"2","drill":true,"text":"受付で保険証を（　　）してください。  ","opts":["提示","郵送","共通","予約"]},{"t":"q","id":"3","drill":true,"text":"65歳以上の方は費用が（　　）になります。  ","opts":["共通","半額","受付","費用"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"金曜日（　　）申込書を出してください。  ","opts":["までに","まで","ばかり","だけ"]},{"t":"q","id":"5","drill":true,"text":"連絡を（　　）来てしまった。  ","opts":["せずに","しずに","さずに","しないずに"]},{"t":"q","id":"6","drill":true,"text":"昨日は夜10時（　　）勉強しました。  ","opts":["まで","までに","ほど","しか"]}]},{"key":"土曜","title":"読解通しテスト（55分）","blocks":[{"t":"passage","v":"<p>55分です。タイマーをセットして、途中で止めないこと。時間配分の目安：中文5分／長文11分／情報検索7分。</p>"},{"t":"h2","v":"問題1　中文（3問）"},{"t":"passage","v":"<p>　休みの日に、近所の川へ散歩に行った。橋の下で、年配の男性が一人、長い棒で川の中のごみを拾っていた。市の仕事だろうと思って、「お疲れさまです」と声をかけた。すると男性は笑って、「いや、勝手にやってるだけですよ」と言った。</p><p>　毎朝三十分、もう八年になるという。誰かに頼まれたわけでも、お金をもらっているわけでもない。「きれいだと、気持ちがいいでしょう」。それだけの理由だった。</p><p>　私は少し恥ずかしくなった。声をかけたとき、私はこの人を「仕事でやっている人」だと決めつけていた。誰かがやっているなら、それは仕事だからだろう——そう考えるのが当たり前になっていたのだ。</p>"},{"t":"q","id":"問1","text":"男性は、なぜごみを拾っているのか。  ","opts":["市から頼まれたから  ","お金がもらえるから  ","きれいだと気持ちがいいから  ","八年前に約束したから"],"tag":"naiyou"},{"t":"q","id":"問2","text":"筆者が「少し恥ずかしくなった」のはなぜか。  ","opts":["声のかけ方を間違えたから  ","仕事でやっていると決めつけていたから  ","自分は何もしていないから  ","男性を八年間知らなかったから"],"tag":"naiyou"},{"t":"q","id":"問3","text":"この文章の内容に合うものはどれか。  ","opts":["男性は市の職員である  ","男性は毎朝三十分、八年続けている  ","筆者も一緒にごみを拾った  ","男性はお金をもらっている"],"tag":"naiyou"},{"t":"h2","v":"問題2　中文（3問）"},{"t":"passage","v":"<p>　工場で働きはじめたころ、私はよく「はい」と答えていた。分からないときも「はい」と言った。返事をしないと、失礼になると思っていたからだ。</p><p>　ある日、部品の置き場所を間違えた。先輩は怒らずに、こう言った。「さっき『はい』って言ったよね。あれは、分かったっていう意味だと思ったよ」。</p><p>　その日から、私は「はい」の代わりに「すみません、もう一度お願いします」と言うようにした。最初は、そう言うたびに自分が仕事のできない人間に見える気がした。けれども、間違いは減った。先輩も、前より詳しく説明してくれるようになった。</p><p>　返事は、相手のためだけにするものではない。自分がどこまで分かっているかを、相手に伝えるためのものでもある。</p>"},{"t":"q","id":"問4","text":"筆者が分からないときも「はい」と答えていたのはなぜか。  ","opts":["本当に分かっていたから  ","返事をしないと失礼だと思ったから  ","先輩がこわかったから  ","日本語が話せなかったから"],"tag":"naiyou"},{"t":"q","id":"問5","text":"「はい」をやめたあと、何が起きたか。  ","opts":["先輩に怒られるようになった  ","仕事が増えた  ","間違いが減り、説明も詳しくなった  ","返事をしなくなった"],"tag":"naiyou"},{"t":"q","id":"問6","text":"筆者が最も言いたいことはどれか。  ","opts":["返事は早くするべきだ  ","返事は、自分の理解の程度を相手に伝えるものでもある  ","「はい」と言ってはいけない  ","先輩には質問しないほうがよい"],"tag":"naiyou"},{"t":"h2","v":"問題3　長文（4問）"},{"t":"passage","v":"<p>　「時間を守る」という言葉を、私は長い間、一つの意味でしか考えていなかった。遅れないこと。約束の時刻に間に合うこと。それだけだと思っていた。</p><p>　考えが変わったのは、日本の職場で働きはじめて半年ほどたったころだ。ある日、会議が予定より十五分早く終わった。私は得をした気分になり、そのまま次の作業に移ろうとした。すると上司が「今日は早く終わったから、その分、机の整理をしましょう」と言った。①<u>私はその言葉に少し驚いた</u>。早く終わったのだから、休んでもいいはずだと思っていたからだ。</p><p>　しかし、あとになって分かった。上司が言ったのは「働け」ということではなかった。<b>会議に使うと決めていた時間は、まだ終わっていない</b>——そういう意味だったのだ。早く終わったのは、会議が短くて済んだからであって、その時間そのものが消えたわけではない。</p><p>　それ以来、私は「時間を守る」を二つに分けて考えるようになった。一つは、始まりを守ること。もう一つは、②<u>使うと決めた分を、最後まで使うこと</u>。前者は誰でも知っているが、後者を意識している人は意外に少ない。</p><p>　もっとも、常に後者を守るべきだとは思わない。早く終わったら休む、という考え方にも理由がある。ただ、どちらの意味で「時間を守る」と言っているのかをはっきりさせないまま話すと、話が食い違う。私が驚いたのも、結局はそこだったのだと思う。</p>"},{"t":"q","id":"問7","text":"①「私はその言葉に少し驚いた」とあるが、なぜか。  ","opts":["上司の日本語が難しかったから  ","早く終わったら休んでよいと思っていたから  ","机が汚れていなかったから  ","会議が長すぎたから"],"tag":"naiyou"},{"t":"q","id":"問8","text":"上司の言葉の意味を、筆者はあとでどう理解したか。  ","opts":["もっと働けという意味  ","会議に使うと決めた時間はまだ終わっていないという意味  ","会議が失敗だったという意味  ","整理が下手だという意味"],"tag":"naiyou"},{"t":"q","id":"問9","text":"②「使うと決めた分を、最後まで使うこと」について、筆者はどう考えているか。  ","opts":["必ず守るべきだ  ","守る必要はまったくない  ","常に守るべきだとは思わないが、意識する人は少ない  ","上司だけが守ればよい"],"tag":"naiyou"},{"t":"q","id":"問10","text":"この文章で筆者が最も言いたいことはどれか。  ","opts":["日本人は時間に厳しい  ","「時間を守る」には二つの意味があり、どちらの意味かをはっきりさせるべきだ  ","会議は短いほうがよい  ","早く終わったら休むべきだ"],"tag":"naiyou"},{"t":"h2","v":"問題4　情報検索（3問）"},{"t":"passage","v":"<p><b>みどり図書館　利用案内</b></p><table><thead><tr><th>区分</th><th>貸出冊数</th><th>期間</th><th>予約</th><th>延長</th></tr></thead><tbody><tr><td>市内在住</td><td>10冊まで</td><td>2週間</td><td>5冊まで</td><td>1回（2週間）</td></tr><tr><td>市内勤務・通学</td><td>5冊まで</td><td>2週間</td><td>3冊まで</td><td>1回（2週間）</td></tr><tr><td>市外</td><td>3冊まで</td><td>1週間</td><td>不可</td><td>不可</td></tr></tbody></table><p>◆延長は、返す日の<b>前日まで</b>にお申し出ください。当日はできません。</p><p>◆予約した本が届いたら、電話でお知らせします。<b>連絡から1週間</b>取りに来られない場合は、次の方にお回しします。</p><p>◆新しく出た本（発行から6か月以内）は、延長できません。</p><p>◆返却は、閉館後もカウンター横の返却ポストが使えます。ただしCD・DVDはポストに入れず、必ずカウンターへお持ちください。</p>"},{"t":"q","id":"問11","text":"市外に住み、市内の会社に勤めている人が借りられる冊数はどれか。  ","opts":["3冊まで  ","5冊まで  ","10冊まで  ","借りられない"],"tag":"joken"},{"t":"q","id":"問12","text":"延長について、正しいものはどれか。  ","opts":["返す日の当日にも申し出られる  ","新しく出た本も延長できる  ","返す日の前日までに申し出る  ","市外の人も1回延長できる"],"tag":"joken"},{"t":"q","id":"問13","text":"この案内の内容に合うものはどれか。  ","opts":["予約した本は、連絡から1週間で次の人に回る  ","DVDも返却ポストに入れてよい  ","市内在住の人は予約が10冊までできる  ","閉館後は返却できない"],"tag":"joken"}]},{"key":"日曜","title":"聴解30分 ＋ 復習30分","blocks":[{"t":"h2","v":"Part 1　聴解（20分・7問）"},{"t":"passage","v":"<p>注意：この紙には会話は書いてありません。音を聞いて答えます。会話は1回だけ流れます。メモを取ってもかまいません。</p>"},{"t":"h3","v":"問題1
