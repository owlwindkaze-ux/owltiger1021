  ]}, "3": {"days": [{"key": "月曜", "title": "短文読解 ── 不在連絡票を読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p><b>ご不在連絡票</b></p><p>お届けにまいりましたが、ご不在でしたので持ち帰りました。</p><p>　お届け日時：9月14日（月）午前10時20分</p><p>　品名：クール便（冷蔵）</p><p>再配達のお申し込みは、<b>当日は午後7時まで</b>に受け付けます。それ以降にお申し込みの場合は、翌日以降のご希望日時となります。インターネットまたはお電話でお申し込みください。</p><p><b>クール便のため、お預かりできる期間は3日間です。</b>（通常のお荷物は7日間）期間を過ぎたお荷物は、送り主さまにお返しします。</p><p>営業所でのお受け取りをご希望の場合は、<b>身分証明書とこの連絡票</b>をお持ちください。</p><p>　　さくら運輸　みどり営業所</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "このお荷物について、正しいものはどれか。", "opts": ["預かってもらえる期間は7日間である", "預かってもらえる期間は3日間である", "再配達は当日しか申し込めない", "営業所では受け取ることができない"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "9月14日の午後8時に再配達を申し込んだ。荷物はいつ届くか。", "opts": ["その日のうちに届く", "翌日以降の希望した日時に届く", "3日後に届く", "送り主に返される"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "営業所で受け取るとき、必要なものは何か。", "opts": ["この連絡票だけ", "身分証明書だけ", "身分証明書とこの連絡票", "品物の代金"], "tag": "naiyou"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>不在</td><td>ふざい</td><td>家にいないこと</td><td>tidak ada di rumah</td></tr><tr><td>2</td><td>届ける</td><td>とどける</td><td>持って行って渡す</td><td>mengantarkan</td></tr><tr><td>3</td><td>再配達</td><td>さいはいたつ</td><td>もう一度届けること</td><td>pengantaran ulang</td></tr><tr><td>4</td><td>預かる</td><td>あずかる</td><td>人のものを持っていてあげる</td><td>menyimpankan</td></tr><tr><td>5</td><td>期間</td><td>きかん</td><td>ある時からある時までの間</td><td>jangka waktu</td></tr><tr><td>6</td><td>過ぎる</td><td>すぎる</td><td>ある時を越える</td><td>melewati</td></tr><tr><td>7</td><td>送り主</td><td>おくりぬし</td><td>荷物を送った人</td><td>pengirim</td></tr><tr><td>8</td><td>営業所</td><td>えいぎょうしょ</td><td>会社の窓口となる事務所</td><td>kantor cabang</td></tr><tr><td>9</td><td>身分証明書</td><td>みぶんしょうめいしょ</td><td>本人だと証明する書類</td><td>kartu identitas</td></tr><tr><td>10</td><td>希望</td><td>きぼう</td><td>こうしてほしいという願い</td><td>keinginan / permintaan</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜まま</b>（状態が変わらないで／Dalam keadaan tetap ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞た形 ＋ まま</td><td>電気をつけた<b>まま</b>出かけました。</td></tr><tr><td>名詞 ＋ の ＋ まま</td><td>昔の<b>まま</b>の町です。</td></tr></tbody></table>"}, {"t": "p", "v": "<b>②〜ずに</b>（〜しないで／Tanpa melakukan ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ない形（ないを取る）＋ ずに</td><td>何も言わ<b>ずに</b>帰りました。</td></tr><tr><td>例外：する → せずに</td><td>連絡<b>せずに</b>休んだ。</td></tr></tbody></table>"}, {"t": "passage", "v": "<p><b>注意</b>：「〜ずに」は「〜ないで」の<b>書き言葉</b>です。意味は同じですが、案内文や記録では「ずに」が使われます。</p>"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "留守だったので、荷物を（　　）してもらった。", "opts": ["不在", "再配達", "希望", "期間"], "drill": true}, {"t": "q", "id": "2", "text": "申し込みの（　　）は今月末までです。", "opts": ["期間", "不在", "営業所", "送り主"], "drill": true}, {"t": "q", "id": "3", "text": "受付で（　　）を見せてください。", "opts": ["送り主", "身分証明書", "再配達", "希望"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "靴をはいた（　　）家に上がってはいけません。", "opts": ["まま", "ずに", "ながら", "ように"], "drill": true}, {"t": "q", "id": "5", "text": "朝ごはんを食べ（　　）出かけたので、おなかがすいた。", "opts": ["まま", "ずに", "ながら", "ばかり"], "drill": true}, {"t": "q", "id": "6", "text": "連絡（　　）休むのはよくない。", "opts": ["しまま", "せずに", "しないまま", "しずに"], "drill": true}]}, {"key": "火曜", "title": "短文読解 ── 社内の連絡を読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p>件名：あすの打ち合わせの場所変更について</p><p>各位</p><p>お疲れさまです。総務課の林です。</p><p>あす15日（火）14時からの打ち合わせですが、第1会議室が工事のため使えなくなりました。<b>3階の第3会議室</b>に変更します。<b>時間は変わりません。</b></p><p>資料はこれまでどおり、各自で印刷してお持ちください。</p><p>プロジェクターは第3会議室にもありますが、パソコンをつなぐケーブルの種類が違います。ノートパソコンで発表する方は、<b>変換アダプターを総務課で借りてから</b>お越しください。</p><p>なお、この変更のお知らせはメールのみです。掲示は出しませんので、同じ課の方にも伝えていただけると助かります。</p><p>林</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "あすの打ち合わせについて、変更されたことは何か。", "opts": ["時間だけ", "場所だけ", "時間と場所の両方", "資料の準備の方法"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "ノートパソコンで発表する人は、何をしなければならないか。", "opts": ["資料を総務課で印刷する", "第1会議室のプロジェクターを借りる", "総務課で変換アダプターを借りてから行く", "前の日に会議室でテストをする"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "このメールの内容に合うものはどれか。", "opts": ["掲示板にも同じお知らせが出る", "資料は総務課が用意する", "第3会議室にはプロジェクターがない", "同じ課の人にも自分から伝えたほうがよい"], "tag": "naiyou"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>打ち合わせ</td><td>うちあわせ</td><td>前もって相談すること</td><td>rapat persiapan</td></tr><tr><td>2</td><td>各位</td><td>かくい</td><td>「みなさま」の書き言葉</td><td>kepada yang bersangkutan</td></tr><tr><td>3</td><td>変更</td><td>へんこう</td><td>決まっていたことを変えること</td><td>perubahan</td></tr><tr><td>4</td><td>各自</td><td>かくじ</td><td>それぞれの人が自分で</td><td>masing-masing</td></tr><tr><td>5</td><td>これまでどおり</td><td>―</td><td>今までと同じように</td><td>seperti biasanya</td></tr><tr><td>6</td><td>つなぐ</td><td>―</td><td>線などで結ぶ</td><td>menyambungkan</td></tr><tr><td>7</td><td>種類</td><td>しゅるい</td><td>タイプ、分け方</td><td>jenis</td></tr><tr><td>8</td><td>伝える</td><td>つたえる</td><td>情報を人に知らせる</td><td>menyampaikan</td></tr><tr><td>9</td><td>助かる</td><td>たすかる</td><td>楽になる、ありがたい</td><td>terbantu</td></tr><tr><td>10</td><td>なお</td><td>―</td><td>それに加えて（補足）</td><td>selain itu</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜始める／〜続ける／〜終わる</b>（動作の始め・途中・終わり／Mulai ~ / terus ~ / selesai ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形（ますを取る）＋ 始める</td><td>3時から会議を<b>し始めます</b>。</td></tr><tr><td>動詞ます形 ＋ 続ける</td><td>2時間<b>話し続けました</b>。</td></tr><tr><td>動詞ます形 ＋ 終わる</td><td>資料を<b>印刷し終わりました</b>。</td></tr></tbody></table>"}, {"t": "p", "v": "<b>②〜てみる</b>（ためしに〜する／Mencoba ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ みる</td><td>一度使っ<b>てみて</b>ください。</td></tr></tbody></table>"}, {"t": "p", "v": "・「〜てみたい」＝ためしにやりたい。「〜てみたら」＝ためしにやった結果。"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "会議の前に、部長と（　　）をします。", "opts": ["打ち合わせ", "変更", "種類", "各位"], "drill": true}, {"t": "q", "id": "2", "text": "資料は（　　）で印刷してください。", "opts": ["各位", "各自", "種類", "なお"], "drill": true}, {"t": "q", "id": "3", "text": "手伝ってくれて（　　）ました。", "opts": ["伝え", "つなぎ", "助かり", "変わり"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "昼から雨が降り（　　）、夜までやみませんでした。", "opts": ["始めて", "続けて", "終わって", "みて"], "drill": true}, {"t": "q", "id": "5", "text": "この本、読み（　　）から貸しますね。", "opts": ["始めて", "続けて", "終わって", "みて"], "drill": true}, {"t": "q", "id": "6", "text": "おいしいかどうか、一口食べ（　　）ください。", "opts": ["ておいて", "てみて", "てしまって", "ておわって"], "drill": true}]}, {"key": "水曜", "title": "中文読解 ── エッセイを読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p>一人暮らしを始めたころ、私は米の量り方も知りませんでした。毎日コンビニで弁当を買い、それが普通だと思っていました。店に入るたびに、同じ棚の前に立っていました。</p><p>料理を始めたきっかけは、健康でも節約でもありません。ある日、弁当のふたを開けようとした瞬間に、<b>①「今日、自分で選んだものが何もないな」</b>と思ったのです。朝から夜まで、決められたことをして、決められたものを食べる。一日のどこにも自分がいませんでした。</p><p>次の日、スーパーで野菜を買いました。作ったのは、切って炒めただけの、料理と呼べないようなものです。正直、おいしくもありませんでした。<b>②それでも、その日の夕食だけは自分のものでした。</b></p><p>三年たった今も、私の料理は上手になっていません。時間がない日は、やはり弁当を買います。それでいいと思っています。</p><p>毎日でなくていい。週に二回でも自分で選んだ日があれば、一週間の感じ方が変わります。</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "「<b>①「今日、自分で選んだものが何もないな」</b>」とあるが、このとき筆者はどう感じていたか。", "opts": ["弁当がおいしくないと感じていた", "一日の中に自分の意思がないと感じていた", "お金を使いすぎていると感じていた", "料理を覚えたいと感じていた"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "筆者が料理を始めた理由は何か。", "opts": ["健康によくないと言われたから", "節約したかったから", "自分で選ぶということをしたかったから", "料理が上手になりたかったから"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "「<b>②それでも、その日の夕食だけは自分のものでした</b>」とあるが、どういう意味か。", "opts": ["一人で全部食べたということ", "おいしくできたということ", "味は悪くても、自分で選んで作ったものだということ", "だれにも見せなかったということ"], "tag": "naiyou"}, {"t": "q", "id": "問4", "text": "この文章で筆者が最も言いたいことはどれか。", "opts": ["料理は毎日したほうがよい", "コンビニの弁当は体によくない", "料理は続ければ上手になる", "毎日でなくても、自分で選ぶ時間があれば生活の感じ方が変わる"], "tag": "shucho"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>一人暮らし</td><td>ひとりぐらし</td><td>一人で生活すること</td><td>hidup sendiri</td></tr><tr><td>2</td><td>量る</td><td>はかる</td><td>重さや量を調べる</td><td>menakar / menimbang</td></tr><tr><td>3</td><td>節約</td><td>せつやく</td><td>むだをなくしてお金を使わないこと</td><td>penghematan</td></tr><tr><td>4</td><td>瞬間</td><td>しゅんかん</td><td>ほんの短い時</td><td>saat / detik itu</td></tr><tr><td>5</td><td>炒める</td><td>いためる</td><td>油で強い火を使って調理する</td><td>menumis</td></tr><tr><td>6</td><td>ふた</td><td>―</td><td>入れ物の上のおおい</td><td>tutup</td></tr><tr><td>7</td><td>やはり</td><td>―</td><td>思ったとおり／結局は</td><td>tetap saja</td></tr><tr><td>8</td><td>感じ方</td><td>かんじかた</td><td>どう感じるかということ</td><td>cara merasakan</td></tr><tr><td>9</td><td>まったく</td><td>―</td><td>ぜんぜん（否定と一緒に使う）</td><td>sama sekali</td></tr><tr><td>10</td><td>正直</td><td>しょうじき</td><td>本当のことを言うと</td><td>sejujurnya</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜ようとする</b>（〜しようと動きはじめる／Hendak / berusaha ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞意向形 ＋ とする</td><td>ふたを開け<b>ようとした</b>瞬間に、電話が鳴った。</td></tr><tr><td></td><td>何度もやめ<b>ようとした</b>が、できなかった。</td></tr></tbody></table>"}, {"t": "p", "v": "・「〜ようとしたとき／瞬間」＝まさにその直前。"}, {"t": "p", "v": "<b>②〜たびに</b>（〜するときはいつも／Setiap kali ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ たびに</td><td>店に入る<b>たびに</b>、同じ棚の前に立っていた。</td></tr><tr><td>名詞 ＋ の ＋ たびに</td><td>旅行の<b>たびに</b>写真を撮る。</td></tr></tbody></table>"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "電気代を（　　）するために、こまめに消しています。", "opts": ["節約", "瞬間", "感じ方", "正直"], "drill": true}, {"t": "q", "id": "2", "text": "フライパンで野菜を（　　）ます。", "opts": ["量り", "炒め", "届け", "預かり"], "drill": true}, {"t": "q", "id": "3", "text": "（　　）に言うと、あまりおいしくなかった。", "opts": ["やはり", "まったく", "正直", "各自"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "家を出（　　）としたとき、雨が降ってきた。", "opts": ["る", "よう", "た", "て"], "drill": true}, {"t": "q", "id": "5", "text": "この写真を見る（　　）、子どものころを思い出す。", "opts": ["うちに", "たびに", "ばかり", "ながら"], "drill": true}, {"t": "q", "id": "6", "text": "何度も立ち上がろう（　　）が、足が動かなかった。", "opts": ["とした", "になった", "とみた", "にした"], "drill": true}]}, {"key": "木曜", "title": "中文読解 ── 意見文を読む", "blocks": [{"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p>旅行に行っても、私はほとんど写真を撮りません。</p><p>以前は違いました。きれいな景色を見つけるたびにカメラを構え、一日に二百枚も撮ることがありました。ところが、家に帰ってその写真を見返すと、不思議なことに、その日のことをあまり思い出せないのです。</p><p>逆に、カメラを忘れて行った旅行のことは、細かいところまで覚えています。海の音、風の冷たさ、隣にいた人の話し方。写真は一枚もありません。</p><p><b>①写真を撮ると、頭が「もう覚えなくていい」と判断するのかもしれません。</b>記録を外に置いた分だけ、中に残らない。メモを取ると忘れられる、というのと同じ仕組みでしょう。</p><p>ただ、<b>②だから写真を撮るな、と言いたいのではありません。</b>十年後に見返して、忘れていたことを思い出せるのも写真の力です。</p><p>私が言いたいのは、順番の話です。まず自分の目で見る。写真はそのあとでいい。カメラを構えたまま景色を見ている人を、旅先でよく見かけます。もったいないと思います。</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "以前の筆者は、旅行でどうしていたか。", "opts": ["写真をまったく撮らなかった", "一日に二百枚も撮ることがあった", "カメラをいつも家に忘れていた", "景色より人の写真を撮っていた"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "「<b>①写真を撮ると、頭が「もう覚えなくていい」と判断するのかもしれません</b>」とあるが、筆者はこれを何と同じだと言っているか。", "opts": ["日記を書くこと", "人に話すこと", "メモを取ると忘れられること", "何度も見返すこと"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "「<b>②だから写真を撮るな、と言いたいのではありません</b>」とあるが、筆者は写真についてどう考えているか。", "opts": ["写真は撮らないほうがよい", "写真には、忘れたことを思い出させる力もある", "写真は十年後に捨てるべきだ", "写真より記憶のほうが正確だ"], "tag": "naiyou"}, {"t": "q", "id": "問4", "text": "この文章で筆者が最も言いたいことはどれか。", "opts": ["旅行にカメラを持って行くべきではない", "写真より記憶のほうが大切だ", "まず自分の目で見て、写真はそのあとにするべきだ", "写真を撮る人はもったいないことをしている"], "tag": "shucho"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>景色</td><td>けしき</td><td>目に見える風景</td><td>pemandangan</td></tr><tr><td>2</td><td>構える</td><td>かまえる</td><td>カメラなどを持って向ける</td><td>mengarahkan / bersiap</td></tr><tr><td>3</td><td>見返す</td><td>みかえす</td><td>もう一度見る</td><td>melihat kembali</td></tr><tr><td>4</td><td>不思議（な）</td><td>ふしぎ</td><td>理由が分からず変な感じ</td><td>aneh / ajaib</td></tr><tr><td>5</td><td>逆に</td><td>ぎゃくに</td><td>反対に</td><td>sebaliknya</td></tr><tr><td>6</td><td>細かい</td><td>こまかい</td><td>小さい部分まで</td><td>detail / kecil</td></tr><tr><td>7</td><td>判断</td><td>はんだん</td><td>考えて決めること</td><td>keputusan / penilaian</td></tr><tr><td>8</td><td>記録</td><td>きろく</td><td>書いたり撮ったりして残すこと</td><td>rekaman / catatan</td></tr><tr><td>9</td><td>仕組み</td><td>しくみ</td><td>どうなっているかという構造</td><td>mekanisme</td></tr><tr><td>10</td><td>もったいない</td><td>―</td><td>むだにして惜しい</td><td>sayang (mubazir)</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜ものだ</b>（一般的にそうだ／当然だ／Memang begitulah ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形・ない形 ＋ ものだ</td><td>年をとると、忘れっぽくなる<b>ものです</b>。</td></tr><tr><td>い形容詞 ＋ ものだ</td><td>時間がたつのは早い<b>ものだ</b>。</td></tr></tbody></table>"}, {"t": "p", "v": "・<b>世の中の一般的な性質</b>を言うときに使います。個人の一回きりの話には使いません。"}, {"t": "p", "v": "<b>②〜ことがある</b>（ときどきそうする／そういう場合がある／Kadang-kadang ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ ことがある</td><td>一日に二百枚も撮る<b>ことがありました</b>。</td></tr></tbody></table>"}, {"t": "passage", "v": "<p><b>注意</b>：「動詞た形 ＋ ことがある」は<b>経験</b>（〜したことがある）で、意味がまったく違います。</p><p>「京都へ行く<b>ことがある</b>」＝ときどき行く／「京都へ行った<b>ことがある</b>」＝行った経験がある。</p>"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "山の上からの（　　）がすばらしかった。", "opts": ["景色", "記録", "判断", "仕組み"], "drill": true}, {"t": "q", "id": "2", "text": "まだ使えるのに捨てるのは（　　）。", "opts": ["不思議だ", "細かい", "もったいない", "逆だ"], "drill": true}, {"t": "q", "id": "3", "text": "この機械の（　　）が分からない。", "opts": ["判断", "仕組み", "記録", "景色"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "子どもは風邪をひきやすい（　　）です。", "opts": ["もの", "こと", "はず", "わけ"], "drill": true}, {"t": "q", "id": "5", "text": "忙しくて、昼ごはんを食べない（　　）。", "opts": ["ことがあります", "ことがありました", "ものです", "はずです"], "drill": true}, {"t": "q", "id": "6", "text": "わたしは富士山に登った（　　）。", "opts": ["ことがあります", "ことがある", "ものです", "ところです"], "drill": true}]}, {"key": "金曜", "title": "情報検索 ── 案内から答えを探す", "blocks": [{"t": "passage", "v": "<p><b>解き方の手順</b>：①設問の条件（だれが・いつ・何回目か）に線を引く　②表からその行だけを見る　③「ご注意」の例外を確かめる。</p>"}, {"t": "h2", "v": "本文"}, {"t": "passage", "v": "<p><b>みどり内科クリニック　受付のご案内</b></p><table><thead><tr><th>曜日</th><th>午前</th><th>午後</th></tr></thead><tbody><tr><td>月・火・木・金</td><td>9:00〜12:30</td><td>15:00〜18:00</td></tr><tr><td>水</td><td>9:00〜12:30</td><td>休診</td></tr><tr><td>土</td><td>9:00〜13:00</td><td>休診</td></tr><tr><td>日・祝</td><td>休診</td><td>休診</td></tr></tbody></table><p><b>ご注意</b></p><p>・受付は、診療終了の<b>30分前</b>までです。</p><p>・<b>初めての方</b>は、保険証をお持ちのうえ、診療終了の<b>1時間前</b>までにお越しください。</p><p>・予約をお取りできるのは、<b>2回目以降の方のみ</b>です。</p><p>・水曜午後と土曜午後は休診ですが、お電話でのご相談は17時まで受け付けます。</p><p>・お薬は院内ではお渡ししません。近くの薬局へ処方せんをお持ちください。</p>"}, {"t": "h2", "v": "設問"}, {"t": "q", "id": "問1", "text": "初めてこのクリニックに行く人が、金曜の午後に受診したい。何時までに行けばよいか。", "opts": ["15時", "17時", "17時30分", "18時"], "tag": "joken"}, {"t": "q", "id": "問2", "text": "予約について、正しいものはどれか。", "opts": ["だれでも予約できる", "初めての人だけ予約できる", "2回目以降の人だけ予約できる", "予約はできない"], "tag": "joken"}, {"t": "q", "id": "問3", "text": "薬について、正しいものはどれか。", "opts": ["クリニックの中でもらう", "近くの薬局へ処方せんを持って行く", "受付で申し込むと家に届く", "初めての人はもらえない"], "tag": "joken"}, {"t": "h2", "v": "本文から拾う語彙（10語）"}, {"t": "table", "v": "<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>診療</td><td>しんりょう</td><td>医者が病気を診ること</td><td>pelayanan medis</td></tr><tr><td>2</td><td>休診</td><td>きゅうしん</td><td>診療を休むこと</td><td>tutup (praktik)</td></tr><tr><td>3</td><td>受付</td><td>うけつけ</td><td>申し込みを受ける場所・こと</td><td>resepsionis</td></tr><tr><td>4</td><td>保険証</td><td>ほけんしょう</td><td>健康保険のカード</td><td>kartu asuransi</td></tr><tr><td>5</td><td>予約</td><td>よやく</td><td>前もって申し込むこと</td><td>reservasi</td></tr><tr><td>6</td><td>〜以降</td><td>いこう</td><td>それから先</td><td>setelah ~</td></tr><tr><td>7</td><td>処方せん</td><td>しょほうせん</td><td>医者が書く薬の指示書</td><td>resep obat</td></tr><tr><td>8</td><td>薬局</td><td>やっきょく</td><td>薬を売る店</td><td>apotek</td></tr><tr><td>9</td><td>院内</td><td>いんない</td><td>病院の中</td><td>di dalam klinik</td></tr><tr><td>10</td><td>相談</td><td>そうだん</td><td>話して意見を聞くこと</td><td>konsultasi</td></tr></tbody></table>"}, {"t": "h2", "v": "文法（2項目）"}, {"t": "p", "v": "<b>①〜ば</b>（条件。そうすれば、そうなる／Kalau ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ば形</td><td>早く行け<b>ば</b>、待たなくてすみます。</td></tr><tr><td>い形容詞（いを取る）＋ ければ</td><td>安けれ<b>ば</b>買います。</td></tr></tbody></table>"}, {"t": "p", "v": "<b>②〜なら</b>（相手の話を受けて、その場合は／Kalau memang ~）"}, {"t": "table", "v": "<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞・動詞普通形 ＋ なら</td><td>病院へ行く<b>なら</b>、保険証を持って行ってください。</td></tr></tbody></table>"}, {"t": "passage", "v": "<p><b>見分け方</b>：「〜なら」は<b>相手が言ったこと</b>を受けて話すときに使います。</p><p>「京都へ行く<b>なら</b>、新幹線が早いですよ」＝相手が「京都へ行く」と言ったのを受けている。</p><p>「ば」にはこの使い方がありません。ここが試験で狙われます。</p>"}, {"t": "h2", "v": "確認ドリル（6問）"}, {"t": "p", "v": "<b>A 語彙（3問）</b>"}, {"t": "q", "id": "1", "text": "病院の（　　）で保険証を出します。", "opts": ["受付", "休診", "院内", "以降"], "drill": true}, {"t": "q", "id": "2", "text": "医者に（　　）をもらって、薬局へ行った。", "opts": ["保険証", "処方せん", "予約", "相談"], "drill": true}, {"t": "q", "id": "3", "text": "明日は（　　）なので、あさって来てください。", "opts": ["診療", "休診", "予約", "受付"], "drill": true}, {"t": "p", "v": "<b>B 文法（3問）</b>"}, {"t": "q", "id": "4", "text": "ボタンを押せ（　　）、切符が出ます。", "opts": ["ば", "なら", "たら", "と"], "drill": true}, {"t": "q", "id": "5", "text": "A「駅へ行きたいんですが」　B「駅へ行く（　　）、この道をまっすぐです」", "opts": ["ば", "なら", "ても", "のに"], "drill": true}, {"t": "q", "id": "6", "text": "安けれ（　　）買いますが、高かったらやめます。", "opts": ["なら", "ば", "ても", "のに"], "drill": true}]}, {"key": "土曜", "title": "読解通しテスト（60分）", "blocks": [{"t": "passage", "v": "<p>タイマーを<b>60分</b>にセットしてください。途中で止めないこと。</p><p>時間配分の目安：中文6分／長文12分／情報検索8分。</p>"}, {"t": "h2", "v": "問題1　中文（3問）"}, {"t": "passage", "v": "<p>高校のとき、数学の先生は質問にすぐ答えてくれませんでした。「先生、この問題が分かりません」と言うと、必ず「どこまで分かった？」と聞き返されます。</p><p>最初は不親切だと思いました。答えを教えてくれれば五秒で済むのに、と。ところが、「どこまで分かったか」を説明しようとすると、話しているうちに自分で気づくことがよくあるのです。「あ、ここです」と言って席に戻ることが何度もありました。</p><p>卒業のとき、先生に理由を聞きました。先生は「答えを教えるのは、次に同じ問題が出たときに、また私を呼ばせることだから」と答えました。</p><p>今、私は後輩に教える立場です。忙しいときほど、答えを言ってしまいたくなります。そのたびに、あの「どこまで分かった？」を思い出します。</p>"}, {"t": "q", "id": "問1", "text": "「席に戻ることが何度もありました」とあるが、なぜか。", "opts": ["先生が答えを教えてくれなかったから", "説明しているうちに自分で答えに気づいたから", "先生が忙しそうだったから", "質問の順番を待つように言われたから"], "tag": "naiyou"}, {"t": "q", "id": "問2", "text": "先生が答えを教えなかった理由は何か。", "opts": ["生徒に自分で解けるようになってほしかったから", "答えを知らなかったから", "時間がなかったから", "生徒に考えさせるのが決まりだったから"], "tag": "naiyou"}, {"t": "q", "id": "問3", "text": "今の筆者について、正しいものはどれか。", "opts": ["後輩の質問には必ずすぐ答えている", "後輩に質問させないようにしている", "答えを言いたくなるが、先生の言葉を思い出している", "先生と同じやり方が正しいとは思っていない"], "tag": "naiyou"}, {"t": "h2", "v": "問題2　中文（3問）"}, {"t": "passage", "v": "<p>祖母は手紙を書く人でした。電話もメールも使えたのに、私が進学で家を出てからの四年間、月に一度、必ず手紙が届きました。</p><p>内容はいつも同じです。畑のこと、天気のこと、近所の犬のこと。読んでも五分で終わります。当時の私は、正直、少し面倒に思っていました。返事を書かなければならないからです。</p><p>祖母が亡くなったあと、母がその手紙の下書きを見つけました。同じ内容を、三回も四回も書き直したあとがありました。畑の話を書くのに、祖母は何時間もかけていたのです。</p><p><b>五分で読める手紙の裏に、何時間もあった。</b>私はそれを、手紙が届いているときには知りませんでした。</p>"}, {"t": "q", "id": "問4", "text": "当時、筆者が手紙を少し面倒に思っていたのはなぜか。", "opts": ["内容がいつも同じだったから", "返事を書かなければならなかったから", "字が読みにくかったから", "電話のほうが早いから"], "tag": "naiyou"}, {"t": "q", "id": "問5", "text": "下書きから分かったことは何か。", "opts": ["祖母が同じ手紙を何人にも送っていたこと", "祖母が長い時間をかけて書いていたこと", "祖母が字を練習していたこと", "祖母が返事を待っていたこと"], "tag": "naiyou"}, {"t": "q", "id": "問6", "text": "「<b>五分で読める手紙の裏に、何時間もあった</b>」とは、どういう意味か。", "opts": ["手紙は五分では読めないということ", "短い手紙にも、書くための長い時間がかかっていたということ", "手紙の裏にも字が書いてあったということ", "五分で書ける手紙もあるということ"], "tag": "naiyou"}, {"t": "h2", "v": "問題3　長文（4問）"}, {"t": "passage", "v": "<p>部屋が片づかない、と長い間悩んでいました。収納の本を何冊も読み、箱やケースを買い足しました。ところが、片づけ用品を買うほど、部屋は狭くなっていきました。</p><p>あるとき、友人の部屋に行って驚きました。物がほとんどないのに、収納家具も少ないのです。「どうやって片づけてるの」と聞くと、友人は不思議そうな顔で「片づけてないよ。置くものがないだけ」と答えました。</p><p><b>①その言葉</b>で、自分の間違いが分かりました。私は「どう置くか」ばかり考えて、「置くかどうか」を考えていなかったのです。片づけとは、入れる場所を増やすことではなく、入れるものを減らすことでした。</p><p>それから半年かけて、家具を三つ捨てました。捨てるときは不安でした。あとで必要になったらどうしよう、と。しかし、半年たっても、困ったことは一度もありません。<b>②「必要になるかもしれないもの」の多くは、必要になりませんでした。</b></p><p>ただし、これは物を持つなという話ではありません。減らすこと自体が目的になると、今度は「捨てられない自分」を責めることになります。それでは前より苦しくなります。</p><p>大事なのは、物の数ではなく、自分が管理できる量を知ることだと思います。その量は人によって違います。友人の部屋が正解なのではありません。私にとっての量は、私が見つけるしかないのです。</p>"}, {"t": "q", "id": "問7", "text": "収納の本を読んで箱やケースを買った結果、どうなったか。", "opts": ["部屋が片づいた", "部屋がかえって狭くなった", "物が減った", "収納家具が必要なくなった"], "tag": "naiyou"}, {"t": "q", "id": "問8", "text": "「<b>①その言葉</b>」で、筆者はどんな間違いに気づいたか。", "opts": ["収納の本を読みすぎていたこと", "友人の部屋をまねしていたこと", "「どう置くか」だけを考え、「置くかどうか」を考えていなかったこと", "家具を捨てるのが早すぎたこと"], "tag": "naiyou"}, {"t": "q", "id": "問9", "text": "「<b>②「必要になるかもしれないもの」の多くは、必要になりませんでした</b>」とあるが、これは何を示しているか。", "opts": ["捨てた家具はもともと使えなかった", "心配して取っておいた物の多くは、実際には使わなかった", "半年では判断できない", "必要なものは自然に集まってくる"], "tag": "naiyou"}, {"t": "q", "id": "問10", "text": "この文章で筆者が最も言いたいことはどれか。", "opts": ["物はできるだけ捨てたほうがよい", "収納用品を買うのは無駄である", "友人のような部屋を目指すべきだ", "自分が管理できる量を、自分で知ることが大切だ"], "tag": "shucho"}, {"t": "h2", "v": "問題4　情報検索（3問）"}, {"t": "passage", "v": "<p><b>さくら鉄道　おトクなきっぷ</b></p><table><thead><tr><th>きっぷ名</th><th>料金</th><th>内容</th><th>買える場所</th></tr></thead><tbody><tr><td>一日乗車券</td><td>大人900円・子ども450円</td><td>当日1日、全線乗り放題</td><td>駅の券売機</td></tr><tr><td>二日乗車券</td><td>大人1,500円</td><td>続いた2日間、全線乗り放題</td><td>駅の窓口のみ</td></tr><tr><td>土日エコきっぷ</td><td>大人700円</td><td>土・日・祝の1日、全線乗り放題</td><td>券売機・コンビニ</td></tr><tr><td>回数券（11枚）</td><td>区間によって違う</td><td>3か月有効</td><td>駅の窓口のみ</td></tr></tbody></table><p><b>ご注意</b></p><p>・小学生未満のお子さまは、大人1人につき2人まで無料です。</p><p>・一日乗車券と二日乗車券は、<b>買った日から使います。前もって買うことはできません。</b></p><p>・土日エコきっぷは平日には使えませんが、<b>前の日までに買っておくことができます。</b></p><p>・特急にお乗りの場合は、別に特急券が必要です。</p>"}, {"t": "q", "id": "問11", "text": "大人1人が土曜日に一日中乗る。いちばん安いのはどれか。", "opts": ["一日乗車券", "二日乗車券", "土日エコきっぷ", "回数券"], "tag": "joken"}, {"t": "q", "id": "問12", "text": "来週の日曜の旅行のために、今日きっぷを買っておきたい。買えるものはどれか。", "opts": ["一日乗車券", "二日乗車券", "土日エコきっぷ", "どれも買えない"], "tag": "joken"}, {"t": "q", "id": "問13", "text": "大人1人と4歳の子ども2人で乗る。料金について正しいものはどれか。", "opts": ["子ども2人分の料金がかかる", "子ども1人分の料金がかかる", "子ども2人とも無料になる", "子どもは乗れない"], "tag": "joken"}]}, {"key": "日曜", "title": "聴解30分 ＋ 復習30分", "blocks": [{"t": "h2", "v": "Part 1　聴解（20分・7問）"}, {"t": "passage", "v": "<p><b>注意</b>：この紙には会話は書いてありません。音を聞いて答えます。</p><p>会話は<b>1回だけ</b>流れます。メモを取ってもかまいません。</p>"}, {"t": "h3", "v": "問題1　課題理解（2問）"}, {"t": "q", "id": "問1", "text": "", "opts": ["受付に用紙をもらいに行く", "男の人から用紙をもらって書く", "インターネットで申し込む", "来週まで待つ"]}, {"t": "q", "id": "問2", "text": "", "opts": ["レストラン", "本屋", "傘を売っている店", "映画館"]}, {"t": "h3", "v": "問題2　ポイント理解（2問）"}, {"t": "q", "id": "問3", "text": "", "opts": ["家賃が高かったから", "駅から遠かったから", "部屋が狭かったから", "上の階の音が気になったから"]}, {"t": "q", "id": "問4", "text": "", "opts": ["味がいいから", "値段が安いから", "静かだから", "家から近いから"]}, {"t": "h3", "v": "問題3　即時応答（3問）"}, {"t": "q", "id": "問5", "text": "1　　2　　3", "opts": ["1", "2", "3"], "audioOnly": true}, {"t": "q", "id": "問6", "text": "1　　2　　3", "opts": ["1", "2", "3"], "audioOnly": true}, {"t": "q", "id": "問7", "text": "1　　2　　3", "opts": ["1", "2", "3"], "audioOnly": true}, {"t": "h3", "v": "聞き取りメモ欄"}, {"t": "passage", "v": ""}, {"t": "h2", "v": "Part 2　今週の復習テスト（20問）"}, {"t": "h3", "v": "A 語彙（10問）"}, {"t": "q", "id": "1", "text": "留守だったので荷物を（　　）してもらった。", "opts": ["不在", "再配達", "希望", "期間"], "drill": true}, {"t": "q", "id": "2", "text": "受付で（　　）を見せる。", "opts": ["送り主", "身分証明書", "再配達", "院内"], "drill": true}, {"t": "q", "id": "3", "text": "会議の前に部長と（　　）をする。", "opts": ["打ち合わせ", "変更", "種類", "各位"], "drill": true}, {"t": "q", "id": "4", "text": "資料は（　　）で印刷してください。", "opts": ["各位", "各自", "なお", "種類"], "drill": true}, {"t": "q", "id": "5", "text": "電気代を（　　）する。", "opts": ["節約", "瞬間", "判断", "記録"], "drill": true}, {"t": "q", "id": "6", "text": "フライパンで野菜を（　　）。", "opts": ["量る", "炒める", "預かる", "構える"], "drill": true}, {"t": "q", "id": "7", "text": "まだ使えるのに捨てるのは（　　）。", "opts": ["不思議だ", "細かい", "もったいない", "逆だ"], "drill": true}, {"t": "q", "id": "8", "text": "山の上からの（　　）がすばらしい。", "opts": ["景色", "記録", "仕組み", "判断"], "drill": true}, {"t": "q", "id": "9", "text": "医者に（　　）をもらって薬局へ行く。", "opts": ["保険証", "処方せん", "予約", "相談"], "drill": true}, {"t": "q", "id": "10", "text": "明日は（　　）なので、あさって来てください。", "opts": ["診療", "休診", "受付", "以降"], "drill": true}, {"t": "h3", "v": "B 文法（10問）"}, {"t": "q", "id": "11", "text": "靴をはいた（　　）家に上がってはいけない。", "opts": ["まま", "ずに", "ながら", "ばかり"], "drill": true}, {"t": "q", "id": "12", "text": "朝ごはんを食べ（　　）出かけた。", "opts": ["まま", "ずに", "ながら", "うちに"], "drill": true}, {"t": "q", "id": "13", "text": "昼から雨が降り（　　）、夜までやまなかった。", "opts": ["始めて", "続けて", "終わって", "みて"], "drill": true}, {"t": "q", "id": "14", "text": "おいしいかどうか、一口食べ（　　）ください。", "opts": ["ておいて", "てみて", "てしまって", "ておわって"], "drill": true}, {"t": "q", "id": "15", "text": "家を出（　　）としたとき、電話が鳴った。", "opts": ["る", "よう", "た", "て"], "drill": true}, {"t": "q", "id": "16", "text": "この写真を見る（　　）、昔を思い出す。", "opts": ["うちに", "たびに", "ばかり", "ながら"], "drill": true}, {"t": "q", "id": "17", "text": "子どもは風邪をひきやすい（　　）だ。", "opts": ["もの", "こと", "はず", "わけ"], "drill": true}, {"t": "q", "id": "18", "text": "わたしは富士山に登った（　　）。", "opts": ["ことがあります", "ものです", "ところです", "ばかりです"], "drill": true}, {"t": "q", "id": "19", "text": "ボタンを押せ（　　）、切符が出ます。", "opts": ["ば", "なら", "ても", "のに"], "drill": true}, {"t": "q", "id": "20", "text": "A「駅へ行きたいんですが」B「駅へ行く（　　）、この道をまっすぐです」", "opts": ["ば", "なら", "ても", "のに"], "drill": true}]}], "answers": {"月曜": {"問1": [2, "「クール便のため、お預かりできる期間は3日間です」。かっこの中の「通常のお荷物は7日間」を選んでしまう学習者が出ます。<b>かっこは条件の違う情報</b>だと教えてください。"], "問2": [2, "「当日は午後7時まで」「それ以降は翌日以降」。午後8時は「それ以降」。"], "問3": [3, "「身分証明書とこの連絡票をお持ちください」。"], "d1": [2, ""], "d2": [1, ""], "d3": [2, ""], "d4": [1, ""], "d5": [2, ""], "d6": [2, ""]}, "火曜": {"問1": [2, "「時間は変わりません」と本文にある。"], "問2": [3, "「変換アダプターを総務課で借りてからお越しください」。"], "問3": [4, "「掲示は出しませんので、同じ課の方にも伝えていただけると助かります」。1は「掲示は出しません」に反する。3は「第3会議室にもあります」に反     { group:'問題2　ポイント理解', hint:'質問のあと、選択肢を読む時間があります。それから会話を聞きます。',
      items:[

    { group:'問題3　即時応答', hint:'問題用紙には何も書いてありません。短い文を聞いて、返事として最もよいものを1〜3から選びます。',
      items:[

          why:'「何部いりますか」は数を聞く質問。数で答えているのは1だけ。',

        { no:'問6', label:'返事を選ぶ', answer:'2　すぐお持ちします',
          why:'「まだ見ていない」＝資料が手元にない。これから持って行く2が自然。',
          steps:[

            {k:'line', sp:'男', v:'1、もう見ましたよ。'},

          steps:[

var WEEK = "1";
var CONTENT = null, LISTEN = null;

var exam = new Date(2026,11,6), t0 = new Date(); t0.setHours(0,0,0,0);
document.getElementById('days').textContent = Math.max(0, Math.round((exam-t0)/86400000));

var TAGNAME = { shiji:'指示語', shucho:'筆者の主張', joken:'条件・情報検索', naiyou:'言いかえ・内容一致' };
var STORE = 'n3-week1';
var state = { ans:{}, marked:{} };
function loadState(){
  state = { ans:{}, marked:{} };
  try { var raw = localStorage.getItem(STORE); if(raw) state = JSON.parse(raw); } catch(e){}
  if(!state.ans) state.ans = {};
  if(!state.marked) state.marked = {};
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

var days = [], KEYS = {}, cur = 0;

function keyOf(dayKey, q){
  if(dayKey === '日曜') return q.drill ? ('r'+q.id) : ('L'+q.id.replace('問',''));
  return q.drill ? ('d'+q.id) : q.id;
}
function correctOf(dayKey, q){
  var d = KEYS[dayKey] || {}; var e = d[keyOf(dayKey,q)];
  return e ? e[0] : null;
}
function explOf(dayKey, q){
  var d = KEYS[dayKey] || {}; var e = d[keyOf(dayKey,q)];
  return e ? (e[1]||'') : '';
}
function uid(dayKey, q){ return dayKey + '/' + keyOf(dayKey,q); }

/* ---------- tabs ---------- */
var tabs = document.getElementById('tabs');
var weeksNav = document.getElementById('weeks');

function buildTabs(){
  tabs.innerHTML = '';
  days.forEach(function(d, i){
    var b = document.createElement('button');
    b.textContent = d.key.replace('曜','');
    b.addEventListener('click', function(){ cur = i; render(); window.scrollTo(0,0); });
    tabs.appendChild(b);
  });
  var recBtn = document.createElement('button');
  recBtn.textContent = '記録';
  recBtn.addEventListener('click', function(){ cur = -1; render(); window.scrollTo(0,0); });
  tabs.appendChild(recBtn);
}

function mount(w){
  stopSeq();
  WEEK = w;
  CONTENT = WEEKS[w];
  LISTEN = CONTENT.listen;
  days = CONTENT.days;
  KEYS = CONTENT.answers;
  STORE = 'n3-week' + w;
  loadState();
  try { localStorage.setItem('n3-lastweek', w); } catch(e){}
  document.getElementById('h1').textContent = '第' + w + '週　タブレット学習';
  Array.prototype.forEach.call(weeksNav.children, function(b){
    b.classList.toggle('on', b.dataset.w === w);
  });
  buildTabs();
  cur = 0;
  render();
  window.scrollTo(0,0);
}

Object.keys(WEEKS).sort().forEach(function(w){
  var b = document.createElement('button');
  b.textContent = '第' + w + '週';
  b.dataset.w = w;
  b.addEventListener('click', function(){ mount(w); });
  weeksNav.appendChild(b);
});

/* ---------- render ---------- */
var pane = document.getElementById('pane');

function questionEl(dayKey, q){
  var box = document.createElement('div');
  box.className = 'q' + (q.drill ? ' drill' : '');
  var id = uid(dayKey, q);

  var head = document.createElement('div'); head.className = 'qt';
  var n = document.createElement('span'); n.className = 'qn';
  n.textContent = q.drill ? q.id : q.id;
  var tx = document.createElement('span'); tx.innerHTML = q.text || '';
  head.appendChild(n); head.appendChild(tx); box.appendChild(head);

  var expl = document.createElement('div'); expl.className = 'expl';

  q.opts.forEach(function(o, idx){
    var num = idx + 1;
    var row = document.createElement('div'); row.className = 'opt';
    var c = document.createElement('span'); c.className = 'num'; c.textContent = num;
    var s = document.createElement('span'); s.innerHTML = o;
    row.appendChild(c); row.appendChild(s);
    row.addEventListener('click', function(){
      if(state.marked[dayKey]) return;
      state.ans[id] = num; save();
      Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){ x.classList.remove('sel'); });
      row.classList.add('sel');
      updateStat();
    });
    if(state.ans[id] === num) row.classList.add('sel');
    box.appendChild(row);
  });

  box.appendChild(expl);

  if(state.marked[dayKey]) paint(box, dayKey, q, expl);
  return box;
}

function paint(box, dayKey, q, expl){
  var id = uid(dayKey, q), got = state.ans[id], right = correctOf(dayKey, q);
  var rows = box.querySelectorAll('.opt');
  Array.prototype.forEach.call(rows, function(r, i){
    r.classList.remove('sel');
    if(i+1 === right) r.classList.add('ok');
    else if(i+1 === got) r.classList.add('ng');
  });
  var e = explOf(dayKey, q);
  expl.innerHTML = (got === right
      ? '<b class="v">正解</b>'
      : '<b class="x">不正解</b>　正しい答え：' + right)
    + (e ? '<br>' + e : '');
  expl.classList.add('show');
}

function render(){
  Array.prototype.forEach.call(tabs.children, function(b, i){
    b.classList.toggle('on', (cur === -1) ? (i === tabs.children.length-1) : (i === cur));
  });
  pane.innerHTML = '';
  if(cur === -1){ renderRecord(); updateStat(); return; }

  var d = days[cur];

  if(d.key === '土曜') pane.appendChild(timerEl());
  if(d.key === '日曜') pane.appendChild(playerEl());

  d.blocks.forEach(function(b){
    var el;
    if(b.t === 'h2'){ el = document.createElement('h2'); el.className='sec'; el.textContent = b.v; }
    else if(b.t === 'h3'){ el = document.createElement('h3'); el.className='sub3'; el.textContent = b.v; }
    else if(b.t === 'passage'){ el = document.createElement('div'); el.className='passage'; el.innerHTML = b.v; }
    else if(b.t === 'table'){ el = document.createElement('div'); el.className='ref'; el.innerHTML = b.v; }
    else if(b.t === 'q'){ el = questionEl(d.key, b); }
    else { el = document.createElement('p'); el.className='body'; el.innerHTML = b.v; }
    pane.appendChild(el);
  });
  updateStat();
}

/* ---------- 土曜 timer ---------- */
var tmr = null, left = 3600;
function timerEl(){
  var w = document.createElement('div'); w.className = 'timer';
  var c = document.createElement('span'); c.className = 'clock'; c.id = 'clock';
  var b1 = document.createElement('button'); b1.className='act'; b1.textContent='60分スタート';
  var b2 = document.createElement('button'); b2.className='act ghost'; b2.textContent='止める';
  function show(){
    var m = Math.floor(left/60), s = left%60;
    c.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    c.classList.toggle('low', left <= 300);
  }
  show();
  b1.addEventListener('click', function(){
    if(tmr) clearInterval(tmr);
    left = 3600; show();
    tmr = setInterval(function(){
      left--; show();
      if(left <= 0){ clearInterval(tmr); tmr = null; alert('60分が終わりました。'); }
    }, 1000);
  });
  b2.addEventListener('click', function(){ if(tmr){ clearInterval(tmr); tmr=null; } });
  w.appendChild(c); w.appendChild(b1); w.appendChild(b2);
  var note = document.createElement('span');
  note.style.cssText='font-size:13px;color:var(--ink-soft)';
  note.textContent = '中文6分／長文12分／情報検索8分';
  w.appendChild(note);
  return w;
}

/* ---------- 日曜 listening player ---------- */
var synth = window.speechSynthesis, voices = [], vA = null, vB = null, rate = 1;
var stopped = false, running = false, timers = [];
function clearTimers(){ timers.forEach(function(t){ clearTimeout(t); clearInterval(t); }); timers = []; }
function wait(ms){ return new Promise(function(r){ timers.push(setTimeout(r, ms)); }); }
function speak(text, voice){
  return new Promise(function(res){
    if(stopped) return res();
    var u = new SpeechSynthesisUtterance(text);
    u.lang='ja-JP'; if(voice) u.voice = voice; u.rate = rate;
    var done=false, keep=0;
    function fin(){ if(!done){ done=true; if(keep) clearInterval(keep); res(); } }
    u.onend=fin; u.onerror=fin;
    if(/Chrome|Chromium|Edg\//.test(navigator.userAgent)){
      keep = setInterval(function(){ if(synth.speaking && !synth.paused){ synth.pause(); synth.resume(); } }, 9000);
      timers.push(keep);
    }
    timers.push(setTimeout(fin, Math.max(4000, text.length*420/rate)));
    synth.speak(u);
  });
}
function loadVoices(){ voices = (synth.getVoices()||[]).filter(function(v){ return (v.lang||'').toLowerCase().indexOf('ja')===0; });
  vA = voices[0]||null; vB = voices[1]||voices[0]||null; }
loadVoices();
if(typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = function(){ loadVoices(); };

function playSeq(items, btn){
  if(running) return;
  stopped = false; running = true; clearTimers();
  try{ synth.cancel(); }catch(e){}
  if(btn){ btn.classList.add('on'); btn.textContent='再生中…'; }
  var chain = Promise.resolve();
  items.forEach(function(it){
    it.steps.forEach(function(st){
      chain = chain.then(function(){
        if(stopped) return;
        if(st.k === 'pause') return wait(st.s*1000);
        return speak(st.v, st.sp === '男' ? vB : vA).then(function(){ return wait(200); });
      });
    });
  });
  chain.then(function(){
    running = false;
    if(btn){ btn.classList.remove('on'); btn.textContent = btn.dataset.label; }
  });
}
function stopSeq(){ stopped = true; running = false; clearTimers(); try{ synth.cancel(); }catch(e){}
  Array.prototype.forEach.call(document.querySelectorAll('.playbtn'), function(b){
    b.classList.remove('on'); if(b.dataset.label) b.textContent = b.dataset.label; }); }

function playerEl(){
  var w = document.createElement('div'); w.className='player';
  var all = []; LISTEN.forEach(function(g){ g.items.forEach(function(it){ all.push(it); }); });

  if(!voices.length){
    var warn = document.createElement('div'); warn.className='warnbox';
    warn.innerHTML = '<b>この端末では日本語の音声が見つかりません。</b><br>'
      + 'iPad：設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 日本語を追加<br>'
      + 'Android / Windows：設定から日本語の音声データを追加するか、別のブラウザで開いてください。';
    w.appendChild(warn);
  }

  var r1 = document.createElement('div'); r1.className='row';
  var ba = document.createElement('button'); ba.className='playbtn'; ba.textContent='7問を通して再生';
  ba.dataset.label='7問を通して再生';
  ba.addEventListener('click', function(){ playSeq(all, ba); });
  var bs = document.createElement('button'); bs.className='act ghost'; bs.textContent='止める';
  bs.addEventListener('click', stopSeq);
  r1.appendChild(ba); r1.appendChild(bs);
  w.appendChild(r1);

  var r2 = document.createElement('div'); r2.className='row';
  var lab = document.createElement('span'); lab.style.fontSize='13px'; lab.textContent='速さ';
  var sl = document.createElement('input'); sl.type='range'; sl.min='0.7'; sl.max='1.2'; sl.step='0.05'; sl.value='1';
  var vv = document.createElement('span'); vv.style.cssText='font-size:13px;font-weight:700'; vv.textContent='1.00';
  sl.addEventListener('input', function(){ rate = +sl.value; vv.textContent = rate.toFixed(2); });
  r2.appendChild(lab); r2.appendChild(sl); r2.appendChild(vv);
  w.appendChild(r2);

  var r3 = document.createElement('div'); r3.className='row';
  all.forEach(function(it){
    var b = document.createElement('button'); b.className='playbtn';
    b.textContent = it.no; b.dataset.label = it.no;
    b.style.cssText = 'background:#4A6A7A';
    b.addEventListener('click', function(){ playSeq([it], b); });
    r3.appendChild(b);
  });
  w.appendChild(r3);

  var note = document.createElement('div'); note.className='note';
  note.innerHTML = '会話は<b>1回だけ</b>流れます。聞いてから下の選択肢をタップしてください。'
    + '答え合わせは、7問すべて答えてから「採点する」を押します。';
  w.appendChild(note);
  return w;
}

/* ---------- marking ---------- */
function dayQuestions(d){ return d.blocks.filter(function(b){ return b.t === 'q'; }); }

function updateStat(){
  var el = document.getElementById('stat');
  if(cur === -1){
    var tot=0, don=0;
    days.forEach(function(d){ dayQuestions(d).forEach(function(q){ tot++; if(state.ans[uid(d.key,q)]) don++; }); });
    el.innerHTML = '週全体　<b>'+don+'</b> / '+tot+' 問 解答ずみ';
    document.getElementById('btnMark').style.display='none';
    document.getElementById('btnClear').style.display='none';
    return;
  }
  document.getElementById('btnMark').style.display='';
  document.getElementById('btnClear').style.display='';
  var d = days[cur], qs = dayQuestions(d), don=0, ok=0;
  qs.forEach(function(q){ var a = state.ans[uid(d.key,q)]; if(a) don++; if(a && a === correctOf(d.key,q)) ok++; });
  if(state.marked[d.key]) el.innerHTML = d.key+'　<b>'+ok+'</b> / '+qs.length+' 問 正解';
  else el.innerHTML = d.key+'　<b>'+don+'</b> / '+qs.length+' 問 解答ずみ';
  document.getElementById('btnMark').textContent = state.marked[d.key] ? '採点ずみ' : '採点する';
  document.getElementById('btnMark').disabled = !!state.marked[d.key];
}

document.getElementById('btnMark').addEventListener('click', function(){
  if(cur === -1) return;
  var d = days[cur], qs = dayQuestions(d);
  var un = qs.filter(function(q){ return !state.ans[uid(d.key,q)]; }).length;
  if(un > 0 && !confirm(un + '問がまだ答えられていません。このまま採点しますか。')) return;
  state.marked[d.key] = true; save(); render();
});

document.getElementById('btnClear').addEventListener('click', function(){
  if(cur === -1) return;
  var d = days[cur];
  if(!confirm(d.key + 'の解答を消して、やり直しますか。')) return;
  dayQuestions(d).forEach(function(q){ delete state.ans[uid(d.key,q)]; });
  delete state.marked[d.key]; save(); render();
});

/* ---------- record tab ---------- */
function renderRecord(){
  var h = document.createElement('div'); h.className='rec';
  var t1 = '<h2 class="sec">曜日ごとの成績</h2><table><tr><th>曜日</th><th>正解</th><th>問題数</th><th>状態</th></tr>';
  days.forEach(function(d){
    var qs = dayQuestions(d), ok = 0;
    qs.forEach(function(q){ if(state.ans[uid(d.key,q)] === correctOf(d.key,q)) ok++; });
    t1 += '<tr><td>'+d.key+'</td><td class="n">'+(state.marked[d.key]?ok:'—')+'</td><td class="n">'+qs.length+'</td><td>'
       + (state.marked[d.key]?'採点ずみ':'未採点')+'</td></tr>';
  });
  t1 += '</table>';

  var tally = {shiji:0, shucho:0, joken:0, naiyou:0};
  days.forEach(function(d){
    if(!state.marked[d.key]) return;
    dayQuestions(d).forEach(function(q){
      if(!q.tag) return;
      if(state.ans[uid(d.key,q)] !== correctOf(d.key,q)) tally[q.tag]++;
    });
  });
  var t2 = '<h2 class="sec">間違えた読解問題のタイプ</h2><table><tr><th>タイプ</th><th>間違えた数</th></tr>';
  Object.keys(TAGNAME).forEach(function(k){
    t2 += '<tr><td>'+TAGNAME[k]+'</td><td class="n">'+tally[k]+'</td></tr>';
  });
  t2 += '</table><p class="body" style="font-size:14px;color:var(--ink-soft)">'
     + 'いちばん数が多いタイプが、いまの弱点です。11月の総復習では、このタイプだけを集中的に解きます。</p>';

  var t3 = '<h2 class="sec">目標</h2><table><tr><th>項目</th><th>目標</th></tr>'
     + '<tr><td>土曜・読解通し</td><td>11 / 13問</td></tr>'
     + '<tr><td>日曜・復習テスト</td><td>17 / 20問</td></tr>'
     + '<tr><td>日曜・聴解</td><td>6 / 7問</td></tr></table>';

  var reset = '<p class="body"><button class="act warn" id="btnReset">この週の解答をすべて消す</button></p>';
  h.innerHTML = t1 + t2 + t3 + reset;
  pane.appendChild(h);
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('第'+WEEK+'週の解答をすべて消しますか。元に戻せません。')) return;
    state = {ans:{}, marked:{}}; save(); render();
  });
}

window.addEventListener('beforeunload', function(){ try{ synth.cancel(); }catch(e){} });

var last = '1';
try { last = localStorage.getItem('n3-lastweek') || '1'; } catch(e){}
if(!WEEKS[last]) last = Object.keys(WEEKS).sort()[0];
mount(last);
})();
