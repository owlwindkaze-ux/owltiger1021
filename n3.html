,"木曜":{"問1":[2,"第2段落「文字を追う時間は、むしろ増えているのではないか」。"],"問2":[2,"「画面の文章は、途中でやめて別のものに移れる」。"],"問3":[3,"直前の「この『移りやすさ』が」を指します。"],"問4":[3,"「問題は……『最後まで読む力』が育っているかだ」「最後まで行くかどうかである」。"],"d1":[1,""],"d2":[1,""],"d3":[1,""],"d4":[1,""],"d5":[1,""],"d6":[1,""]},"金曜":{"問1":[2,"第2会議室は1時間800円、2時間で1,600円。市内の方は半額なので800円になります。"],"問2":[2,"「利用の前に説明を受けてからでないとお使いになれません」。説明は毎週水曜日なので、金曜に使うには水曜の説明を受けておきます。"],"問3":[4,"「利用日の3か月前から3日前まで」受け付けます。電話は不可、当日の取り消しは返金なし、和室は17時までです。"],"d1":[1,""],"d2":[1,""],"d3":[1,""],"d4":[1,""],"d5":[1,""],"d6":[1,""]},"土曜":{"問1":[1,"第一段落「毎朝、同じ時間に同じ電車に乗る。同じ車両の、同じあたりに立つ」。"],"問2":[2,"すぐあとに「心配というほど強くはない。ただ、いつもあるものがない、という落ち着かなさだった」とあります。"],"問3":[3,"最後の段落。「話した回数で決まるのだと思っていた。そうではないらしい」なので1は誤り。"],"問4":[2,"「長い間、母は厳しい人だと思っていた」。"],"問5":[2,"「引き出しの奥に押し込むのは、母から見れば隠しているだけだった」。取り出せない形の例です。"],"問6":[2,"最後の段落「言葉は同じでも、中身がちがえば、話は通じない」。"],"問7":[2,"「失敗を話せば、注意されると思うからだ」。"],"問8":[2,"「一番上の人が最初に言うと、不思議と、次の人が続けやすくなる」。"],"問9":[2,"半年で事故は減っています。筆者が驚いたのは、その原因が「隠さなくなったこと」だという点です。"],"問10":[2,"最後の段落「隠さなくてよい場所を作ると、結果として失敗が減る」。"],"問11":[2,"③は800円。「65歳以上の方に限り、③は半額」なので400円。"],"問12":[4,"午前は②（10:00〜11:30）、午後は④（13:30〜14:30）で重なりません。③と④は重なるので不可。"],"問13":[2,"④は「不要（そのまま参加）」。血液検査は朝食事をしない、雨でも①が体育館に移るだけ、費用は当日払いです。"]},"日曜":{"L1":[2,"「資料はまだ人数分ないんだ。先にコピーしてもらえる？」。いすはもう並べ終わっています。"],"L2":[4,"「印鑑と写真を1枚」。保険証は「もう結構です」、申込書は窓口にあります。"],"L3":[2,"「あとで思い出せる言葉だけを残す」――メモの取り方の話です。"],"L4":[3,"「入ってきた方の顔を見て、まず声をかける」「順番を間違えないでください」。"],"L5":[1,"先に帰るときは「お先に失礼します」。"],"L6":[2,"待ってもらうときは「少々お待ちいただけますか」。1は待たせたあとの言葉です。"],"L7":[3,"「こちらこそ、よろしくお願いします」と返します。"],"r1":[1,""],"r2":[1,""],"r3":[1,""],"r4":[1,""],"r5":[1,""],"r6":[1,""],"r7":[1,""],"r8":[1,""],"r9":[1,""],"r10":[1,""],"r11":[1,""],"r12":[1,""],"r13":[1,""],"r14":[1,""],"r15":[1,""],"r16":[1,""],"r17":[1,""],"r18":[1,""],"r19":[1,""],"r20":[1,""]}},"listen":[{"group":"問題1　課題理解","hint":"はじめに質問を聞いてください。それから会話を聞いて、1〜4から一つ選びます。","items":[{"no":"問1","label":"女の人はこのあとまず何をしますか","answer":"2　資料をコピーする","why":"「先にコピーを」と言われている。並べるのはそのあと。","steps":[{"k":"q","v":"女の人は、このあとまず何をしますか。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"会議の準備、どこまで進んでる？"},{"k":"line","sp":"女","v":"いすを並べ終わりました。次は資料を配ります。"},{"k":"line","sp":"男","v":"あ、資料はまだ人数分ないんだ。先にコピーしてもらえる？"},{"k":"line","sp":"女","v":"はい、すぐにやります。"},{"k":"pause","s":8,"a":true}]},{"no":"問2","label":"男の人は明日、何を持って行きますか","answer":"4　印鑑と写真","why":"保険証は「今日出したので要らない」。申込書は窓口にある。","steps":[{"k":"q","v":"男の人は、明日、何を持って行きますか。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"明日は、印鑑と写真を1枚お持ちください。"},{"k":"line","sp":"男","v":"保険証も要りますか。"},{"k":"line","sp":"女","v":"いえ、今日お出しいただいたので、もう結構です。"},{"k":"line","sp":"男","v":"申込書は。"},{"k":"line","sp":"女","v":"窓口にございますので、そのままお越しください。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題2　概要理解","hint":"この問題には、問題用紙に何も書いてありません。話を聞いて、話の中心を選びます。","items":[{"no":"問3","label":"先生は何について話していますか","answer":"2　メモの取り方","why":"「全部書かない」「あとで思い出せる言葉だけ」と、書き方の話をしている。","steps":[{"k":"q","v":"学校で、先生が話しています。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"　みなさんは授業中、話を全部書こうとしていませんか。それでは手が追いつかず、聞くほうがおろそかになります。大事なのは、あとで思い出せる言葉だけを残すことです。三つか四つでいいのです。書く量を減らすほど、頭に残る量は増えます。"},{"k":"q","v":"先生は、何について話していますか。"},{"k":"pause","s":8,"a":true}]},{"no":"問4","label":"店長が一番言いたいことは何ですか","answer":"3　あいさつを先にすること","why":"「品物より先に、まず声を」が中心。片づけや値段の話は例。","steps":[{"k":"q","v":"店で、店長が話しています。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"　棚をきれいにするのも、値段を分かりやすく書くのも大切です。ただ、お客様が最初に受け取るのは品物ではありません。入ってきた方の顔を見て、まず声をかける。それができていれば、多少の失敗は許していただけます。順番を間違えないでください。"},{"k":"q","v":"店長が、一番言いたいことは何ですか。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題3　発話表現","hint":"絵はありません。場面の説明を聞いて、そのときに何と言うか、1〜3から一つ選びます。","items":[{"no":"問5","label":"何と言いますか","answer":"1　お先に失礼します","why":"まだ仕事をしている人を残して先に帰るときのあいさつ。","steps":[{"k":"q","v":"仕事が終わりました。ほかの人はまだ残って仕事をしています。何と言いますか。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"1、お先に失礼します。"},{"k":"line","sp":"女","v":"2、お疲れさまでした、お先にどうぞ。"},{"k":"line","sp":"女","v":"3、失礼いたしました。"},{"k":"pause","s":8,"a":true}]},{"no":"問6","label":"何と言いますか","answer":"2　少々お待ちいただけますか","why":"相手を待たせるときの丁寧な言い方。","steps":[{"k":"q","v":"お客さんに、少し待ってもらいたいです。何と言いますか。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"1、少々お待たせしました。"},{"k":"line","sp":"女","v":"2、少々お待ちいただけますか。"},{"k":"line","sp":"女","v":"3、少々お待ちになります。"},{"k":"pause","s":8,"a":true}]},{"no":"問7","label":"何と言いますか","answer":"3　こちらこそ、よろしくお願いします","why":"相手から「よろしく」と言われたときの返し方。","steps":[{"k":"q","v":"初めて会った相手に「よろしくお願いします」と言われました。何と言いますか。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"1、はい、お願いされました。"},{"k":"line","sp":"男","v":"2、いいえ、けっこうです。"},{"k":"line","sp":"男","v":"3、こちらこそ、よろしくお願いします。"},{"k":"pause","s":8,"a":true}]}]}]},"10":{"days":[{"key":"月曜","title":"短文読解 ── 職場の掲示を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>【お知らせ】食堂の利用時間の変更について</b></p><p>10月から、食堂の利用時間を次のように変えます。</p><p>これまで　11時30分〜13時30分　→　10月から　<b>11時〜14時</b></p><p>時間を長くするのは、席が足りないという声が多かったためです。ただ、時間を延ばしたことで<u>①調理の人数が足りなくなる日</u>があります。その日は、メニューをA・Bの2種類だけにします。前の日の夕方までに、入り口の黒板でお知らせします。</p><p>また、混む時間を避けていただくため、部署ごとのおすすめ時間を決めました。決まりではありませんので、守れないときは気にしないでください。早く来る人ばかりでなく、遅く来る人がいて、はじめて席が回ります。</p><p>総務課</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"食堂の利用時間を長くする理由はどれか。  ","opts":["調理の人が増えたから  ","席が足りないという声が多かったから  ","メニューを増やすから  ","部署が増えたから"],"tag":"riyuu"},{"t":"q","id":"問2","text":"①「調理の人数が足りなくなる日」は、どうなるか。  ","opts":["食堂が休みになる  ","メニューが2種類だけになる  ","時間が短くなる  ","値段が上がる"],"tag":"shiji"},{"t":"q","id":"問3","text":"このお知らせの内容に合うものはどれか。  ","opts":["部署ごとの時間は必ず守らなければならない  ","おすすめ時間は決まりではない  ","変更は9月から始まる  ","黒板は当日の朝に書かれる"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>利用</td><td>りよう</td><td>使うこと</td><td>penggunaan</td></tr><tr><td>2</td><td>変更</td><td>へんこう</td><td>変えること</td><td>perubahan</td></tr><tr><td>3</td><td>延ばす</td><td>のばす</td><td>長くする</td><td>memperpanjang</td></tr><tr><td>4</td><td>調理</td><td>ちょうり</td><td>料理を作ること</td><td>memasak</td></tr><tr><td>5</td><td>種類</td><td>しゅるい</td><td>ものの分け方</td><td>jenis</td></tr><tr><td>6</td><td>黒板</td><td>こくばん</td><td>チョークで書く板</td><td>papan tulis</td></tr><tr><td>7</td><td>避ける</td><td>さける</td><td>ぶつからないようにする</td><td>menghindari</td></tr><tr><td>8</td><td>部署</td><td>ぶしょ</td><td>会社の中の分かれた組織</td><td>divisi / bagian</td></tr><tr><td>9</td><td>決まり</td><td>きまり</td><td>守るべきルール</td><td>aturan</td></tr><tr><td>10</td><td>総務課</td><td>そうむか</td><td>会社の中の事務をする課</td><td>bagian umum</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜ばかりでなく（〜だけでなく）（Bukan hanya ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ ばかりでなく</td><td>早く来る人<b>ばかりでなく</b>、遅く来る人も必要だ。</td></tr><tr><td>動詞・い形容詞 普通形 ＋ ばかりでなく</td><td>安い<b>ばかりでなく</b>、味もいい。</td></tr></tbody></table>"},{"t":"passage","v":"注意：後ろには「も」がよく来ます。「〜だけでなく」より少しかたい言い方で、掲示や文章で使われます。"},{"t":"p","v":"②〜たびに（〜するときはいつも）（Setiap kali ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ たびに</td><td>ここへ来る<b>たびに</b>、思い出す。</td></tr><tr><td>名詞 ＋ の ＋ たびに</td><td>会議<b>のたびに</b>、資料を作る。</td></tr></tbody></table>"},{"t":"p","v":"・「〜ときはいつも」と同じ意味ですが、回数の少ないことにも使えます。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"時間の（　　）をお知らせします。  ","opts":["変更","調理","種類","部署"]},{"t":"q","id":"2","drill":true,"text":"混む時間を（　　）ましょう。  ","opts":["避け","延ばし","決め","利用し"]},{"t":"q","id":"3","drill":true,"text":"（　　）はA・Bの2種類です。  ","opts":["メニュー","黒板","決まり","総務課"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"この店は安い（　　）、味もいい。  ","opts":["ばかりでなく","ばかりで","ばかりに","ばかりか思うと"]},{"t":"q","id":"5","drill":true,"text":"この写真を見る（　　）、母を思い出す。  ","opts":["たびに","ときに","うちに","ながら"]},{"t":"q","id":"6","drill":true,"text":"会議（　　）、資料を作らなければならない。  ","opts":["のたびに","たびに","のときに限り","ばかりでなく"]}]},{"key":"火曜","title":"短文読解 ── お礼のメールを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>あて先：みなみ物産　佐藤様<br>件名：先日の見学のお礼</p><p>みなみ物産　佐藤様</p><p>いつもお世話になっております。あおば工業の李です。</p><p>先日は、お忙しいところ工場を見せていただき、ありがとうございました。おかげさまで、<u>①書類では分からなかったこと</u>が、いくつもはっきりいたしました。特に、箱を組み立てる場所の広さと、作業の人が動く順番は、実際に見なければ分からなかったと思います。</p><p>社に戻ってから、すぐに報告書をまとめました。来週の会議で使わせていただきます。なお、当日いただいた図面のうち、3ページ目だけ印刷がうすく、数字が読み取れませんでした。お手数ですが、その1枚だけ、もう一度お送りいただけないでしょうか。</p><p>今後ともどうぞよろしくお願いいたします。</p><p>あおば工業　製造部　李</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"このメールを書いた一番の目的はどれか。  ","opts":["工場見学を申し込むこと  ","見学のお礼を言うこと  ","会議に招くこと  ","図面の間違いを注意すること"],"tag":"shucho"},{"t":"q","id":"問2","text":"①「書類では分からなかったこと」として、本文に書かれているものはどれか。  ","opts":["商品の値段と数  ","作業の場所の広さと人の動く順番  ","工場までの行き方  ","会議の日にち"],"tag":"shiji"},{"t":"q","id":"問3","text":"李さんが佐藤さんにお願いしていることはどれか。  ","opts":["図面を全部送り直すこと  ","図面の3ページ目だけ送り直すこと  ","会議に出ること  ","報告書を見ること"],"tag":"joken"},{"t":"q","id":"問4","text":"このメールの内容に合うものはどれか。  ","opts":["報告書はまだ書いていない  ","見学は来週の予定である  ","報告書は来週の会議で使う  ","図面はまだ受け取っていない"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>件名</td><td>けんめい</td><td>メールの題</td><td>judul / perihal</td></tr><tr><td>2</td><td>おかげさまで</td><td>おかげさまで</td><td>助けてもらって（あいさつ）</td><td>berkat bantuan Anda</td></tr><tr><td>3</td><td>書類</td><td>しょるい</td><td>仕事の紙</td><td>dokumen</td></tr><tr><td>4</td><td>組み立てる</td><td>くみたてる</td><td>部品を合わせて作る</td><td>merakit</td></tr><tr><td>5</td><td>実際</td><td>じっさい</td><td>ほんとうのようす</td><td>kenyataan / sebenarnya</td></tr><tr><td>6</td><td>報告書</td><td>ほうこくしょ</td><td>結果を知らせる文書</td><td>laporan</td></tr><tr><td>7</td><td>図面</td><td>ずめん</td><td>形や寸法をかいた紙</td><td>gambar teknik</td></tr><tr><td>8</td><td>うすい</td><td>うすい</td><td>色や濃さが弱い</td><td>tipis / samar</td></tr><tr><td>9</td><td>読み取る</td><td>よみとる</td><td>読んで内容をつかむ</td><td>membaca / menangkap</td></tr><tr><td>10</td><td>お手数ですが</td><td>おてすうですが</td><td>ご面倒でしょうが</td><td>maaf merepotkan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜おかげで／〜せいで（よい結果／悪い結果の原因）（Berkat ~ / Gara-gara ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ おかげで（よい結果）</td><td>見せていただいた<b>おかげで</b>、よく分かった。</td></tr><tr><td>普通形 ＋ せいで（悪い結果）</td><td>雨の<b>せいで</b>、遅れた。</td></tr></tbody></table>"},{"t":"passage","v":"注意：結果がよければ「おかげで」、悪ければ「せいで」。「〜ため」はどちらにも使えます。"},{"t":"p","v":"②〜ないでしょうか／〜ませんでしょうか（ていねいなお願い）（Permohonan yang sangat sopan）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞て形 ＋ いただけないでしょうか</td><td>お送りいただけ<b>ないでしょうか</b>。</td></tr><tr><td>動詞て形 ＋ いただけますか</td><td>送っていただけ<b>ますか</b>。</td></tr></tbody></table>"},{"t":"p","v":"・下にいくほど丁寧：てください＜ていただけますか＜ていただけないでしょうか。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"（　　）を見ながら部品を組み立てる。  ","opts":["図面","件名","実際","書類"]},{"t":"q","id":"2","drill":true,"text":"（　　）ですが、もう一度お願いします。  ","opts":["お手数","おかげさま","実際","報告"]},{"t":"q","id":"3","drill":true,"text":"印刷が（　　）て数字が見えない。  ","opts":["うすく","細かく","広く","早く"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"先生の（　　）、合格できました。  ","opts":["おかげで","せいで","ためか","くせに"]},{"t":"q","id":"5","drill":true,"text":"事故の（　　）、電車が止まった。  ","opts":["せいで","おかげで","おかげさまで","ばかりでなく"]},{"t":"q","id":"6","drill":true,"text":"こちらにご記入いただけ（　　）。  ","opts":["ないでしょうか","ないでしたか","ませんだろうか","なくないですか"]}]},{"key":"水曜","title":"中文読解 ── エッセイを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　私は傘をよくなくす。一年に三本か四本は消える。注意が足りないのだと、長い間、自分を責めていた。</p><p>　あるとき気がついた。傘をなくすのは、たいてい<u>①雨がやんだ日</u>である。降っているうちは、傘は手の中にあって、体の一部のようになっている。ところが、やんだ途端に、傘はただの棒になる。必要がなくなったものを、人はそのまま持ち続けられない。置いてしまうのだ。</p><p>　つまり私は、注意が足りないわけではなかった。<b>役に立っているあいだだけ覚えている</b>、という仕組みで動いていただけである。それは人間なら、だれでもそういうものだろう。</p><p>　それが分かってから、私は雨がやんだときに、いったん立ち止まって傘を見るようにした。②<u>方法を変えたのではない。見る場所を変えただけだ</u>。それ以来、傘は一本もなくしていない。</p><p>　自分を責めていたころは、何も変わらなかった。責めるのをやめて、起きている順番を見たら、一日で変わった。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「雨がやんだ日」に傘をなくすのはなぜだと筆者は考えているか。  ","opts":["雨がやむと荷物が増えるから  ","必要がなくなったものを持ち続けられないから  ","傘が重いから  ","人が多くなるから"],"tag":"riyuu"},{"t":"q","id":"問2","text":"②「方法を変えたのではない。見る場所を変えただけだ」とは、どういうことか。  ","opts":["傘の持ち方を工夫したということ  ","なくしやすい場面に目を向けたということ  ","新しい傘を買ったということ  ","傘を持たなくなったということ"],"tag":"shiji"},{"t":"q","id":"問3","text":"筆者は以前、傘をなくす原因を何だと思っていたか。  ","opts":["自分の注意が足りないこと  ","傘が安いこと  ","天気が変わりやすいこと  ","店に置き忘れること"],"tag":"naiyou"},{"t":"q","id":"問4","text":"筆者が最も言いたいことはどれか。  ","opts":["傘は高いものを買うべきだ  ","自分を責めるより、起きている順番を見るほうがよい  ","雨の日は外に出ないほうがよい  ","人は注意すれば何でもできる"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>責める</td><td>せめる</td><td>悪いと言ってとがめる</td><td>menyalahkan</td></tr><tr><td>2</td><td>消える</td><td>きえる</td><td>なくなる</td><td>hilang</td></tr><tr><td>3</td><td>途端</td><td>とたん</td><td>ちょうどそのとき</td><td>begitu ~</td></tr><tr><td>4</td><td>棒</td><td>ぼう</td><td>細長い木や金属</td><td>tongkat / batang</td></tr><tr><td>5</td><td>仕組み</td><td>しくみ</td><td>ものごとの動く形</td><td>mekanisme</td></tr><tr><td>6</td><td>いったん</td><td>いったん</td><td>ひとまず。一度</td><td>sekali / sejenak</td></tr><tr><td>7</td><td>立ち止まる</td><td>たちどまる</td><td>歩くのをやめて止まる</td><td>berhenti melangkah</td></tr><tr><td>8</td><td>それ以来</td><td>それいらい</td><td>そのときからあと</td><td>sejak itu</td></tr><tr><td>9</td><td>順番</td><td>じゅんばん</td><td>ものごとの並び</td><td>urutan</td></tr><tr><td>10</td><td>工夫</td><td>くふう</td><td>よくするための考え</td><td>ide / akal</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜わけではない（そう決まっているのではない）（Bukan berarti ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ わけではない</td><td>注意が足りない<b>わけではなかった</b>。</td></tr><tr><td>な形容詞 な ／ 名詞 な ＋ わけではない</td><td>きらい<b>なわけではない</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「全部そうだとは言えない」と<b>やわらかく打ち消す</b>言い方です。強く否定する「〜ない」とはちがいます。"},{"t":"p","v":"②〜ものだ（一般にそういうものだ／感想）（Memang begitulah ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ ものだ</td><td>だれでもそういう<b>ものだ</b>。</td></tr><tr><td>い形容詞 ＋ ものだ（感想）</td><td>時がたつのは早い<b>ものだ</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「〜ものだから」（理由）とは別です。形が似ているので注意しましょう。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"自分を（　　）てもよくならない。  ","opts":["責め","消え","止まっ","工夫し"]},{"t":"q","id":"2","drill":true,"text":"家を出た（　　）、雨が降ってきた。  ","opts":["途端","以来","順番","仕組み"]},{"t":"q","id":"3","drill":true,"text":"機械の（　　）を調べる。  ","opts":["仕組み","棒","順番","工夫"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"きらいな（　　）が、あまり食べません。  ","opts":["わけではない","ものではない","はずがない","ことはない"]},{"t":"q","id":"5","drill":true,"text":"子どもは風邪をひきやすい（　　）。  ","opts":["ものだ","ものだから","わけだ","ことだ"]},{"t":"q","id":"6","drill":true,"text":"全部できない（　　）。半分はできる。  ","opts":["わけではない","わけがない","はずだ","ものだ"]}]},{"key":"木曜","title":"中文読解 ── 意見文を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　地図の画面を見ながら歩く人が増えた。そのせいで、道を覚える力が落ちている、という話をよく聞く。</p><p>　たしかに、画面のとおりに曲がっていけば着くのだから、周りを見る必要はない。一度通った道でも、次にまた画面を見る。<u>①そういう人は多い</u>だろう。</p><p>　しかし、道具のせいで力が落ちたと決めてしまうのは、早すぎるように思う。問題は道具ではなく、<b>使い方</b>である。着いたあとで、「今、自分はどちらから来たのか」を一度だけ考えてみればよい。それさえすれば、道は頭に残る。画面を見たことが、そのまま「覚えないこと」になるわけではない。</p><p>　私の知り合いに、地図を使いながら、知らない町にとても詳しくなった人がいる。その人は、目的地に着くと必ず一度、画面を消して周りを見るという。②<u>その一分が、道具を先生に変えている</u>に違いない。</p><p>　便利な道具は、人を弱くも強くもする。分かれ目は、道具を使い終わったあとの、わずかな時間の使い方にあるのではないだろうか。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「そういう人」とは、どんな人か。  ","opts":["地図を持たずに歩く人  ","一度通った道でも、また画面を見る人  ","道を人に聞く人  ","地図を書く人"],"tag":"shiji"},{"t":"q","id":"問2","text":"筆者は、道を覚える力が落ちる原因は何だと考えているか。  ","opts":["道具そのもの  ","道具の使い方  ","町が変わったこと  ","人が忙しいこと"],"tag":"shucho"},{"t":"q","id":"問3","text":"②「その一分が、道具を先生に変えている」とは、どういうことか。  ","opts":["地図が道を教えてくれるということ  ","着いたあとに周りを見る短い時間が、覚える力を育てているということ  ","一分で目的地に着くということ  ","先生が地図を使うということ"],"tag":"shiji"},{"t":"q","id":"問4","text":"筆者の考えに合うものはどれか。  ","opts":["便利な道具は使わないほうがよい  ","便利な道具は人を弱くするだけだ  ","道具を使い終わったあとの時間の使い方が分かれ目になる  ","地図は紙のほうがよい"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>落ちる</td><td>おちる</td><td>程度が下がる</td><td>menurun</td></tr><tr><td>2</td><td>周り</td><td>まわり</td><td>そのもののそば</td><td>sekeliling</td></tr><tr><td>3</td><td>決める</td><td>きめる</td><td>そうだと定める</td><td>memutuskan</td></tr><tr><td>4</td><td>目的地</td><td>もくてきち</td><td>行こうとする場所</td><td>tujuan</td></tr><tr><td>5</td><td>詳しい</td><td>くわしい</td><td>よく知っている。細かい</td><td>paham betul / rinci</td></tr><tr><td>6</td><td>消す</td><td>けす</td><td>見えなく・なくする</td><td>mematikan / menghapus</td></tr><tr><td>7</td><td>分かれ目</td><td>わかれめ</td><td>どちらになるかの境</td><td>titik penentu</td></tr><tr><td>8</td><td>わずか</td><td>わずか</td><td>とても少ない</td><td>sedikit sekali</td></tr><tr><td>9</td><td>知り合い</td><td>しりあい</td><td>知っている人</td><td>kenalan</td></tr><tr><td>10</td><td>必ず</td><td>かならず</td><td>いつも。きっと</td><td>pasti</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜さえ〜ば（それだけすれば十分だ）（Asal ~ saja）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ さえ ＋ 〜ば</td><td>これ<b>さえあれば</b>、大丈夫です。</td></tr><tr><td>動詞ます形 ＋ さえすれば</td><td>考え<b>さえすれば</b>、覚えられる。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「それ一つで足りる」という気持ち。「〜だけ」より条件をしぼる感じが強くなります。"},{"t":"p","v":"②〜に違いない（きっと〜だ）（Pasti ~ / Tidak salah lagi）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ に違いない</td><td>変えている<b>に違いない</b>。</td></tr><tr><td>名詞・な形容詞 ＋ に違いない</td><td>彼は先生<b>に違いない</b>。</td></tr></tbody></table>"},{"t":"p","v":"・話し手の強い判断です。証拠があるときに使います。「〜かもしれない」より確かです。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"この町のことなら彼が（　　）。  ","opts":["詳しい","わずかだ","必ずだ","落ちる"]},{"t":"q","id":"2","drill":true,"text":"（　　）に着いたら連絡します。  ","opts":["目的地","分かれ目","知り合い","周り"]},{"t":"q","id":"3","drill":true,"text":"残りは（　　）3日です。  ","opts":["わずか","必ず","詳しく","周り"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"あなた（　　）いれば、ほかは要りません。  ","opts":["さえ","こそ","しか","ばかり"]},{"t":"q","id":"5","drill":true,"text":"電気がついている。中にだれかいる（　　）。  ","opts":["に違いない","に限る","どころではない","おそれがある"]},{"t":"q","id":"6","drill":true,"text":"一度確認し（　　）、間違えません。  ","opts":["さえすれば","さえしても","だけすれば","ばかりすれば"]}]},{"key":"金曜","title":"情報検索 ── 回数券と定期券の案内を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>みどり市民バス　おトクな切符のご案内</b>（大人1回200円）</p><table><thead><tr><th>切符</th><th>値段</th><th>使える回数・期間</th><th>使える人</th><th>買う場所</th></tr></thead><tbody><tr><td>ア　回数券</td><td>2,000円</td><td>11回分</td><td>だれでも</td><td>車内・市役所</td></tr><tr><td>イ　1日券</td><td>500円</td><td>その日1日、何回でも</td><td>だれでも</td><td>車内のみ</td></tr><tr><td>ウ　1か月定期券</td><td>5,000円</td><td>1か月、何回でも</td><td>だれでも</td><td>市役所のみ</td></tr><tr><td>エ　通学定期券</td><td>3,000円</td><td>1か月、何回でも</td><td>学生</td><td>市役所のみ</td></tr></tbody></table><p>◆定期券（ウ・エ）をお買いになるときは、申込書に必要なことをご記入のうえ、写真を1枚お持ちください。エは学生証もお見せください。</p><p>◆回数券は、お使いになる回数に応じて何冊でもお買いになれます。期限はありません。</p><p>◆75歳以上の方は、「シルバー券」（年3,000円）をお使いいただけます。この券をお持ちの方は、ほかの切符は必要ありません。市役所の窓口でのみお申し込みいただけます。</p><p>◆どの切符も、なくした場合の再発行はいたしません。また、お金はお返しできません。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"1か月に20回バスに乗る学生が、いちばん安くすむ買い方はどれか。  ","opts":["ア　回数券を2冊  ","イ　1日券を20枚  ","ウ　1か月定期券  ","エ　通学定期券"],"tag":"joken"},{"t":"q","id":"問2","text":"市役所へ行かなくても買える切符はどれか。  ","opts":["アとイ  ","ウとエ  ","イだけ  ","エだけ"],"tag":"joken"},{"t":"q","id":"問3","text":"この案内の内容に合うものはどれか。  ","opts":["回数券には使う期限がある  ","切符をなくしたらもう一度もらえる  ","定期券を買うときは写真が要る  ","シルバー券は車内でも買える"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>回数券</td><td>かいすうけん</td><td>何回分かまとめた切符</td><td>tiket berlangganan (per kali)</td></tr><tr><td>2</td><td>定期券</td><td>ていきけん</td><td>決まった期間使える切符</td><td>tiket langganan bulanan</td></tr><tr><td>3</td><td>期間</td><td>きかん</td><td>いつからいつまで</td><td>jangka waktu</td></tr><tr><td>4</td><td>期限</td><td>きげん</td><td>使える終わりの日</td><td>batas waktu</td></tr><tr><td>5</td><td>記入する</td><td>きにゅうする</td><td>書き入れる</td><td>mengisi (formulir)</td></tr><tr><td>6</td><td>学生証</td><td>がくせいしょう</td><td>学生であることを示す証明</td><td>kartu pelajar</td></tr><tr><td>7</td><td>再発行</td><td>さいはっこう</td><td>もう一度出すこと</td><td>penerbitan ulang</td></tr><tr><td>8</td><td>窓口</td><td>まどぐち</td><td>手続きをする場所</td><td>loket</td></tr><tr><td>9</td><td>冊</td><td>さつ</td><td>本や券をまとめたものを数える語</td><td>(satuan) buku / buklet</td></tr><tr><td>10</td><td>必要</td><td>ひつよう</td><td>なくてはならないこと</td><td>perlu / diperlukan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜に応じて（〜に合わせて変わる）（Sesuai dengan ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ に応じて</td><td>回数<b>に応じて</b>、お買いになれます。</td></tr><tr><td>名詞 ＋ に応じた ＋ 名詞</td><td>年齢<b>に応じた</b>料金。</td></tr></tbody></table>"},{"t":"passage","v":"注意：前の言葉が変わると、後ろも一緒に変わる関係です。「〜によって」も似ていますが、「に応じて」は<b>合わせて調整する</b>気持ちが強くなります。"},{"t":"p","v":"②〜のうえ（〜してから）（Setelah ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞（する動詞の名詞形）＋ のうえ</td><td>ご記入<b>のうえ</b>、お持ちください。</td></tr><tr><td>名詞 ＋ のうえで</td><td>相談<b>のうえで</b>、決めます。</td></tr></tbody></table>"},{"t":"p","v":"・案内・掲示のかたい言い方です。話しことばでは「〜してから」を使います。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"この券に使用（　　）はありません。  ","opts":["期限","冊","窓口","必要"]},{"t":"q","id":"2","drill":true,"text":"申込書にご（　　）ください。  ","opts":["記入","再発行","必要","期間"]},{"t":"q","id":"3","drill":true,"text":"学生は（　　）を見せてください。  ","opts":["学生証","定期券","回数券","窓口"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"人数（　　）、部屋を決めます。  ","opts":["に応じて","に限り","について","にとって"]},{"t":"q","id":"5","drill":true,"text":"ご確認（　　）、ご提出ください。  ","opts":["のうえ","のうちに","のところ","のたびに"]},{"t":"q","id":"6","drill":true,"text":"よく相談（　　）で決めましょう。  ","opts":["のうえ","のあと","のまま","のはず"]}]},{"key":"土曜","title":"読解通しテスト（50分）","blocks":[{"t":"passage","v":"<p>第10週。<b>50分</b>で13問です。今週は「筆者が最も言いたいこと」を問う設問を各文章に入れました。最後の段落を必ず読み切ってから答えを選んでください。時間配分の目安：中文4分30秒／長文10分／情報検索6分。</p>"},{"t":"h2","v":"問題1　中文（3問）"},{"t":"passage","v":"<p>　「わかりました」と言われると、以前の私は安心していた。説明が終わった合図だと思っていたからだ。</p><p>　あるとき、同じ説明を三度した相手が、三度とも「わかりました」と答えた。それでも仕事は直らなかった。腹が立つ前に、私は自分の聞き方を変えてみた。「では、何をしますか」と尋ねたのである。相手はしばらく黙り、それから「……すみません、そこが分かりません」と言った。</p><p>　「わかりました」は、理解の合図ではなく、<b>会話を終わらせる言葉</b>だったのだ。責めるべきは相手ではない。終わらせやすい問い方をしていた私のほうだった。</p>"},{"t":"q","id":"問1","text":"以前、筆者は「わかりました」をどう受け取っていたか。  ","opts":["説明が終わった合図  ","断りの言葉  ","あいさつ  ","質問のはじまり"],"tag":"naiyou"},{"t":"q","id":"問2","text":"筆者が「では、何をしますか」と尋ねたのはなぜか。  ","opts":["相手を試したかったから  ","自分の聞き方を変えてみたから  ","時間がなかったから  ","相手に怒っていたから"],"tag":"riyuu"},{"t":"q","id":"問3","text":"筆者が最も言いたいことはどれか。  ","opts":["同じ説明を三度するべきだ  ","「わかりました」と言う人を信じてはいけない  ","終わらせやすい問い方をしていた自分に問題があった  ","説明は短いほうがよい"],"tag":"shucho"},{"t":"h2","v":"問題2　中文（3問）"},{"t":"passage","v":"<p>　引っ越しのとき、荷物を減らそうと決めた。ところが、いざ箱に入れる段になると、何も捨てられない。「いつか使うかもしれない」と思うからである。</p><p>　友人に相談したら、<u>①「捨てるものを選ぶな。残すものを選べ」</u>と言われた。同じことのようで、まったくちがった。捨てるものを選ぶときは、一つ一つに「いらない理由」が要る。残すものを選ぶときは、「使っている」という一つの理由さえあればよい。</p><p>　理由が要らないほうを選ぶ。それだけで、荷物は半分になった。決められないときは、意志が弱いわけではなく、<b>問いの立て方</b>が重いのかもしれない。</p>"},{"t":"q","id":"問4","text":"筆者が何も捨てられなかったのはなぜか。  ","opts":["荷物が少なかったから  ","「いつか使うかもしれない」と思ったから  ","箱が足りなかったから  ","友人に止められたから"],"tag":"riyuu"},{"t":"q","id":"問5","text":"①「捨てるものを選ぶな。残すものを選べ」とあるが、この二つはどうちがうか。  ","opts":["残すほうは、理由が一つで足りる  ","残すほうは、時間が長くかかる  ","捨てるほうは、お金がかからない  ","捨てるほうは、人に頼める"],"tag":"shiji"},{"t":"q","id":"問6","text":"筆者が最も言いたいことはどれか。  ","opts":["引っ越しは大変だ  ","決められないのは、問いの立て方が重いからかもしれない  ","荷物は半分にするべきだ  ","友人に相談してはいけない"],"tag":"shucho"},{"t":"h2","v":"問題3　長文（4問）"},{"t":"passage","v":"<p>　うちの近所に、朝六時に開く小さなパン屋がある。早すぎると思っていたが、店の前にはいつも数人が並んでいる。</p><p>　あるとき、店主に理由を聞いてみた。返ってきたのは、パンの話ではなかった。「この道は、夜勤明けの人が通るんです」。病院と工場が近い。仕事を終えて帰る人にとって、六時は<u>①一日の終わり</u>である。終わりに、温かいものが買える場所がある。それだけのことだという。</p><p>　店主は続けた。「うちは、朝の人に合わせているんじゃない。②<u>この道を歩く人に合わせているだけです</u>」。同じ六時でも、客によって意味がちがう。出勤前の人には始まりで、夜勤明けの人には終わりだ。店はその両方に開いている。</p><p>　商売のうまい人は、売るものを考えていると思っていた。そうではないらしい。この店主が見ていたのは、<b>店の前を通る人の一日</b>だった。売るものは、そのあとで決まる。</p><p>　私の仕事も、たぶん同じである。何を出すかを先に決めるから、合わなくなる。相手の一日のどこに自分がいるのかを先に考えるべきなのだろう。</p>"},{"t":"q","id":"問7","text":"パン屋が朝六時に開く理由はどれか。  ","opts":["パンがよく焼けるから  ","夜勤明けの人がこの道を通るから  ","店主が早起きだから  ","昼は客が来ないから"],"tag":"riyuu"},{"t":"q","id":"問8","text":"①「一日の終わり」とあるが、だれにとっての終わりか。  ","opts":["出勤前の人  ","夜勤を終えて帰る人  ","店主  ","近所の子ども"],"tag":"shiji"},{"t":"q","id":"問9","text":"②「この道を歩く人に合わせているだけです」とは、どういうことか。  ","opts":["朝早い人だけを客にしているということ  ","通る人それぞれの一日に合わせて店を開けているということ  ","道を歩く人に道を教えているということ  ","客を選んでいるということ"],"tag":"shiji"},{"t":"q","id":"問10","text":"筆者が最も言いたいことはどれか。  ","opts":["商売は朝早いほうがよい  ","何を出すかより、相手の一日のどこに自分がいるかを先に考えるべきだ  ","パン屋の仕事は大変だ  ","売るものは決めなくてよい"],"tag":"shucho"},{"t":"h2","v":"問題4　情報検索（3問）"},{"t":"passage","v":"<p><b>ひかり町　地域清掃と交流会のお知らせ</b></p><table><thead><tr><th>行事</th><th>日時</th><th>集合場所</th><th>持ち物</th><th>参加費</th></tr></thead><tbody><tr><td>ア　川の清掃</td><td>11/2（日）8:00〜10:00</td><td>川原の駐車場</td><td>長ぐつ・軍手</td><td>無料</td></tr><tr><td>イ　公園の草取り</td><td>11/2（日）8:30〜10:00</td><td>中央公園</td><td>軍手</td><td>無料</td></tr><tr><td>ウ　交流会（昼食つき）</td><td>11/2（日）12:00〜14:00</td><td>公民館</td><td>なし</td><td>600円</td></tr><tr><td>エ　子ども工作教室</td><td>11/2（日）13:00〜15:00</td><td>公民館</td><td>はさみ</td><td>200円</td></tr></tbody></table><p>◆アとイに参加した方は、ウの参加費が<b>無料</b>になります。受付でカードをお受け取りください。</p><p>◆ウとエは時間が重なりますが、ウは14時までですので、エに途中から入っていただいてもかまいません。</p><p>◆軍手は、当日、集合場所でもお配りします。長ぐつの用意はありません。</p><p>◆雨の場合、アは中止、イは翌週に行います。ウとエは雨でも行います。</p>"},{"t":"q","id":"問11","text":"川の清掃に出たあと交流会に出る人が、当日払うお金はいくらか。  ","opts":["無料  ","200円  ","600円  ","800円"],"tag":"joken"},{"t":"q","id":"問12","text":"軍手を持っていない人は、どうすればよいか。  ","opts":["参加できない  ","当日、集合場所でもらえる  ","公民館で買う  ","前の日に受け取る"],"tag":"joken"},{"t":"q","id":"問13","text":"このお知らせの内容に合うものはどれか。  ","opts":["雨のとき、公園の草取りは翌週に行う  ","雨のとき、交流会は中止になる  ","長ぐつは当日もらえる  ","交流会と工作教室は両方に出られない"],"tag":"naiyou"}]},{"key":"日曜","title":"聴解30分 ＋ 復習30分","blocks":[{"t":"h2","v":"Part 1　聴解（20分・7問）"},{"t":"passage","v":"<p>注意：この紙には会話は書いてありません。音を聞いて答えます。会話は1回だけ流れます。今週は<b>5つの形式が全部出ます</b>（課題理解・ポイント理解・概要理解・発話表 "},{"k":"line","sp":"女","v":"2、はい、手伝ってさしあげました。"},{"k":"line","sp":"女","v":"3、いえ、こちらこそ助かりました。"},{"k":"pause","s":8,"a":true}]}]}]},"11":{"days":[{"key":"月曜","title":"短文読解 ── 職場の掲示を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>【お願い】更衣室のロッカーについて</b></p><p>更衣室のロッカーが足りなくなってきました。調べてみると、<u>①春に一度使ったきり、そのままになっているもの</u>が20個ほどありました。</p><p>使っていない方は、10月末までに中の物を出し、かぎを事務室にお返しください。出しにくい物がある場合は、事務室にご相談ください。こちらで一時お預かりします。</p><p>11月からは、空いたロッカーを新しく入った方に使っていただきます。なお、名札のないロッカーは中を確認させていただくことがあります。あらかじめご了承ください。</p><p>夏は物が増えがちですが、着がえは2組までにしていただけると助かります。</p><p>総務課</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「春に一度使ったきり、そのままになっているもの」とは何のことか。  ","opts":["新しい制服  ","使われていないロッカー  ","事務室のかぎ  ","名札"],"tag":"shiji"},{"t":"q","id":"問2","text":"ロッカーを使っていない人は、何をすればよいか。  ","opts":["11月まで待つ  ","中の物を出して、かぎを返す  ","名札を付ける  ","新しい人に渡す"],"tag":"joken"},{"t":"q","id":"問3","text":"このお知らせの内容に合うものはどれか。  ","opts":["名札のないロッカーは中を見ることがある  ","着がえは何組でもよい  ","出しにくい物は捨てられる  ","かぎは更衣室に返す"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>更衣室</td><td>こういしつ</td><td>着がえをする部屋</td><td>ruang ganti</td></tr><tr><td>2</td><td>そのまま</td><td>そのまま</td><td>変わらない状態で</td><td>apa adanya / dibiarkan</td></tr><tr><td>3</td><td>事務室</td><td>じむしつ</td><td>手続きをする部屋</td><td>ruang administrasi</td></tr><tr><td>4</td><td>一時</td><td>いちじ</td><td>少しの間</td><td>sementara</td></tr><tr><td>5</td><td>名札</td><td>なふだ</td><td>名前を書いた札</td><td>papan nama</td></tr><tr><td>6</td><td>確認する</td><td>かくにんする</td><td>たしかめる</td><td>memastikan</td></tr><tr><td>7</td><td>あらかじめ</td><td>あらかじめ</td><td>前もって</td><td>sebelumnya</td></tr><tr><td>8</td><td>了承する</td><td>りょうしょうする</td><td>わかって受け入れる</td><td>memaklumi / menyetujui</td></tr><tr><td>9</td><td>着がえ</td><td>きがえ</td><td>着かえる服</td><td>baju ganti</td></tr><tr><td>10</td><td>助かる</td><td>たすかる</td><td>ありがたい。楽になる</td><td>tertolong / sangat membantu</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜たきり（〜してから、そのあと何も起きない）（Sejak ~, tidak ada lagi）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞た形 ＋ きり</td><td>一度使っ<b>たきり</b>です。</td></tr><tr><td>動詞た形 ＋ きり ＋ 〜ない</td><td>出かけ<b>たきり</b>、帰ってこ<b>ない</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：後ろには「そのまま」「〜ない」がよく来ます。「〜だけ」ではなく、<b>そのあと変化がない</b>ことを表します。"},{"t":"p","v":"②〜がち（〜することが多い。よくないことに使う）（Cenderung ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ がち</td><td>忘れ<b>がち</b>です。</td></tr><tr><td>名詞 ＋ がち</td><td>病気<b>がち</b>の子ども。</td></tr></tbody></table>"},{"t":"p","v":"・「〜やすい」と似ていますが、「がち」は<b>よくないこと</b>にだけ使います。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"（　　）で着がえてください。  ","opts":["更衣室","事務室","名札","着がえ"]},{"t":"q","id":"2","drill":true,"text":"（　　）ご連絡いたします。  ","opts":["あらかじめ","そのまま","一時","了承"]},{"t":"q","id":"3","drill":true,"text":"手伝ってもらって（　　）ました。  ","opts":["助かり","確認し","了承し","着がえ"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"去年一度会っ（　　）です。  ","opts":["たきり","たばかり","たところ","たまま"]},{"t":"q","id":"5","drill":true,"text":"このごろ、忘れ（　　）です。  ","opts":["がち","やすさ","ぎみだ","っぽさ"]},{"t":"q","id":"6","drill":true,"text":"出かけ（　　）、まだ帰らない。  ","opts":["たきり","たあと","たとたん","るなり"]}]},{"key":"火曜","title":"短文読解 ── 予定変更のメールを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>あて先：あおば工業　李様<br>件名：25日の打ち合わせについて（変更のお願い）</p><p>あおば工業　李様</p><p>いつもお世話になっております。みなみ物産の佐藤です。</p><p>25日（水）14時からの打ち合わせですが、<u>①こちらの都合で日を変えていただけないでしょうか</u>。同じ日に本社の検査が入ることになり、担当の者が全員そちらに出ることになりました。直前のお願いで、誠に申し訳ございません。</p><p>候補として、27日（金）の午前中か、30日（月）の終日が空いております。ご都合のよい日をお知らせください。決まり次第、会議室を押さえます。</p><p>なお、前回お渡しした見積書は、数量が変わりましたので作り直しております。古いほうは、お手数ですが処分してください。新しいものは、打ち合わせの日にお持ちします。</p><p>みなみ物産　営業部　佐藤</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"佐藤さんが日を変えたい理由はどれか。  ","opts":["李さんの都合が悪いから  ","同じ日に本社の検査が入るから  ","会議室が取れないから  ","見積書ができていないから"],"tag":"riyuu"},{"t":"q","id":"問2","text":"李さんは、このメールを読んでまず何をすればよいか。  ","opts":["会議室を予約する  ","都合のよい日を知らせる  ","見積書を送る  ","本社へ行く"],"tag":"joken"},{"t":"q","id":"問3","text":"古い見積書は、どうすればよいか。  ","opts":["返送する  ","処分する  ","そのまま使う  ","コピーする"],"tag":"joken"},{"t":"q","id":"問4","text":"このメールの内容に合うものはどれか。  ","opts":["新しい見積書はメールで送られる  ","打ち合わせは中止になった  ","会議室は日が決まってから押さえる  ","候補の日は1日だけである"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>打ち合わせ</td><td>うちあわせ</td><td>前もってする相談</td><td>rapat persiapan</td></tr><tr><td>2</td><td>都合</td><td>つごう</td><td>予定の具合</td><td>kesempatan / keadaan</td></tr><tr><td>3</td><td>検査</td><td>けんさ</td><td>調べること</td><td>pemeriksaan</td></tr><tr><td>4</td><td>担当</td><td>たんとう</td><td>受け持つこと・人</td><td>penanggung jawab</td></tr><tr><td>5</td><td>直前</td><td>ちょくぜん</td><td>すぐ前</td><td>tepat sebelum</td></tr><tr><td>6</td><td>候補</td><td>こうほ</td><td>えらぶもとになるもの</td><td>kandidat / pilihan</td></tr><tr><td>7</td><td>終日</td><td>しゅうじつ</td><td>一日じゅう</td><td>sepanjang hari</td></tr><tr><td>8</td><td>押さえる</td><td>おさえる</td><td>（席や部屋を）確保する</td><td>memesan / mengamankan</td></tr><tr><td>9</td><td>見積書</td><td>みつもりしょ</td><td>値段を計算して出す書類</td><td>surat penawaran harga</td></tr><tr><td>10</td><td>数量</td><td>すうりょう</td><td>数と量</td><td>jumlah / kuantitas</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜次第（〜したら、すぐに）（Begitu ~, segera）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ 次第</td><td>決まり<b>次第</b>、押さえます。</td></tr><tr><td>名詞（する動詞）＋ 次第</td><td>到着<b>次第</b>、ご連絡します。</td></tr></tbody></table>"},{"t":"passage","v":"注意：後ろに<b>過去の文は来ません</b>。これからすることに使います（×決まり次第、押さえました）。"},{"t":"p","v":"②〜ようがない（方法がなくてできない）（Tidak ada cara untuk ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ ようがない</td><td>連絡先が分からないので、知らせ<b>ようがない</b>。</td></tr><tr><td>動詞ます形 ＋ ようもない</td><td>どうし<b>ようもない</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「やりたくない」ではなく、<b>方法がない</b>という意味です。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"会議室を（　　）ておきます。  ","opts":["押さえ","変え","作り","決まり"]},{"t":"q","id":"2","drill":true,"text":"日にちの（　　）を三つ出す。  ","opts":["候補","都合","検査","担当"]},{"t":"q","id":"3","drill":true,"text":"（　　）が変わったので作り直す。  ","opts":["数量","終日","直前","見積書"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"品物が届き（　　）、お知らせします。  ","opts":["次第","しだいに","たら次第","ながら"]},{"t":"q","id":"5","drill":true,"text":"住所が分からないので、送り（　　）。  ","opts":["ようがない","たくない","かねない","がたい"]},{"t":"q","id":"6","drill":true,"text":"こわれてしまって、直し（　　）。  ","opts":["ようがない","ようだ","そうだ","がちだ"]}]},{"key":"水曜","title":"中文読解 ── エッセイを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　母から料理を教わったことがある。といっても、習ったのは一品だけだ。味つけを聞くと、母はいつも「見て覚えなさい」と言った。当時の私は、それを<u>①不親切だと思っていた</u>。</p><p>　自分で作るようになって、考えが変わった。母は分量を言えなかったのではない。言っても意味がないと知っていたのだ。その日の野菜の水分、なべの大きさ、火の強さ。条件が変われば、同じ分量では同じ味にならない。<b>細かく決めれば決めるほど、その日に合わなくなる</b>。</p><p>　母がしていたのは、分量を渡さないことではなく、<u>②「味を見る」という手順そのものを渡すこと</u>だった。一口なめて、足りなければ足す。それだけを、何度も見せていた。</p><p>　昔はよく、そばで見ているだけの時間が長いと思ったものだ。今は分かる。あれは、見ている時間ではなく、<b>味を見る回数を数えている時間</b>だった。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「不親切だと思っていた」のはなぜか。  ","opts":["母が料理を作ってくれなかったから  ","味つけを聞いても分量を教えてくれなかったから  ","母が忙しそうだったから  ","料理が好きではなかったから"],"tag":"riyuu"},{"t":"q","id":"問2","text":"「細かく決めれば決めるほど、その日に合わなくなる」のはなぜか。  ","opts":["作る人が変わるから  ","野菜の水分やなべ、火の強さなど条件が毎回ちがうから  ","分量が多すぎるから  ","時間がかかるから"],"tag":"riyuu"},{"t":"q","id":"問3","text":"②「『味を見る』という手順そのものを渡すこと」とは、どういうことか。  ","opts":["味つけの分量を紙に書いて渡すこと  ","なめて足りなければ足す、というやり方を教えること  ","料理の本を買ってやること  ","いっしょに作ってやること"],"tag":"shiji"},{"t":"q","id":"問4","text":"筆者が最も言いたいことはどれか。  ","opts":["料理は母から習うべきだ  ","決まった分量より、その場で確かめるやり方のほうが役に立つ  ","見ているだけの時間はむだである  ","料理は一品でよい"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>教わる</td><td>おそわる</td><td>教えてもらう</td><td>diajari</td></tr><tr><td>2</td><td>一品</td><td>いっぴん</td><td>料理ひとつ</td><td>satu hidangan</td></tr><tr><td>3</td><td>味つけ</td><td>あじつけ</td><td>味を調えること</td><td>pembumbuan</td></tr><tr><td>4</td><td>当時</td><td>とうじ</td><td>そのころ</td><td>waktu itu</td></tr><tr><td>5</td><td>分量</td><td>ぶんりょう</td><td>どれだけの量か</td><td>takaran</td></tr><tr><td>6</td><td>水分</td><td>すいぶん</td><td>ふくまれている水</td><td>kadar air</td></tr><tr><td>7</td><td>条件</td><td>じょうけん</td><td>そうなるためのきまり</td><td>kondisi / syarat</td></tr><tr><td>8</td><td>手順</td><td>てじゅん</td><td>することの順序</td><td>prosedur / urutan</td></tr><tr><td>9</td><td>なめる</td><td>なめる</td><td>舌でちょっと味わう</td><td>mencicipi</td></tr><tr><td>10</td><td>数える</td><td>かぞえる</td><td>数を調べる</td><td>menghitung</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜ば〜ほど（一方が進むと、もう一方も進む）（Semakin ~ semakin ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ば形 ＋ 辞書形 ＋ ほど</td><td>決めれ<b>ば</b>決める<b>ほど</b>、合わなくなる。</td></tr><tr><td>い形容詞：〜ければ〜いほど</td><td>安けれ<b>ば</b>安い<b>ほど</b>いい。</td></tr></tbody></table>"},{"t":"passage","v":"注意：な形容詞は「静かなら静かなほど」、名詞は「〜であれば〜であるほど」。同じ言葉を2回くり返す形が基本です。"},{"t":"p","v":"②〜たものだ（昔よくそうだった。思い出）（Dulu sering ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞た形 ＋ ものだ</td><td>よく思った<b>ものだ</b>。</td></tr><tr><td>（今日のことには使わない）</td><td>×今日はよく歩いた<b>ものだ</b></td></tr></tbody></table>"},{"t":"p","v":"・「〜ものだ」（一般的な性質）とはちがい、<b>過去の習慣・思い出</b>を表します。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"料理を（　　）ました。  ","opts":["教わり","数え","なめ","足り"]},{"t":"q","id":"2","drill":true,"text":"（　　）どおりに進めてください。  ","opts":["手順","分量","条件","当時"]},{"t":"q","id":"3","drill":true,"text":"野菜の（　　）が多い日は水を減らす。  ","opts":["水分","味つけ","一品","当時"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"考えれば考える（　　）、分からなくなる。  ","opts":["ほど","ばかり","まで","ながら"]},{"t":"q","id":"5","drill":true,"text":"値段は安けれ（　　）安いほどいい。  ","opts":["ば","たら","なら","ても"]},{"t":"q","id":"6","drill":true,"text":"子どものころ、よく川で泳いだ（　　）。  ","opts":["ものだ","ことだ","ところだ","ばかりだ"]}]},{"key":"木曜","title":"中文読解 ── 意見文を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　「あいさつは形だけだ」という人がいる。心がこもっていなければ意味がない、という考えである。</p><p>　この意見に対して、私は半分だけ賛成する。たしかに、声だけ出して顔も見ないあいさつなら、しないほうがましかもしれない。しかし、<u>①形だけだからといって、無意味だとは限らない</u>。</p><p>　私が働き始めたころ、毎朝「おはようございます」と言うのが苦痛だった。気持ちがついてこないからだ。それでも続けているうちに、妙なことが起きた。言ったあとのほうが、声をかけやすくなるのである。順番が逆だった。<b>気持ちがあるからあいさつをするのではなく、あいさつをするから気持ちが動く</b>。</p><p>　もちろん、形だけで止まってしまえば、ただの音である。大事なのは、形を入り口として使うことだ。②<u>入り口は、部屋そのものではない。しかし入り口がなければ、部屋には入れない</u>。</p><p>　心を先に用意しなければならない、と考えると、人は動けなくなる。まず形から入ってよい。私はそう思っている。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"「あいさつは形だけだ」という意見に対する筆者の立場はどれか。  ","opts":["全部賛成する  ","半分だけ賛成する  ","まったく賛成しない  ","意見を持たない"],"tag":"shucho"},{"t":"q","id":"問2","text":"①「形だけだからといって、無意味だとは限らない」とあるが、その例として本文に書かれているものはどれか。  ","opts":["あいさつを続けるうちに声をかけやすくなったこと  ","あいさつをやめたら楽になったこと  ","大きな声を出すと元気になること  ","あいさつを教える仕事をしたこと"],"tag":"naiyou"},{"t":"q","id":"問3","text":"②「入り口は、部屋そのものではない。しかし入り口がなければ、部屋には入れない」とは、どういうことか。  ","opts":["形だけでは足りないが、形がなければ気持ちも動かないということ  ","部屋を広くするべきだということ  ","あいさつは玄関でするものだということ  ","形は必要ないということ"],"tag":"shiji"},{"t":"q","id":"問4","text":"筆者が最も言いたいことはどれか。  ","opts":["心を先に用意してからあいさつをするべきだ  ","まず形から入ってよい  ","あいさつは声を出せばよい  ","あいさつはしなくてもよい"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>こもる</td><td>こもる</td><td>中に入ってある</td><td>terkandung</td></tr><tr><td>2</td><td>賛成する</td><td>さんせいする</td><td>その考えに同意する</td><td>setuju</td></tr><tr><td>3</td><td>まし</td><td>まし</td><td>そのほうがまだよい</td><td>lebih baik (dari yang buruk)</td></tr><tr><td>4</td><td>無意味</td><td>むいみ</td><td>意味がないこと</td><td>tidak bermakna</td></tr><tr><td>5</td><td>苦痛</td><td>くつう</td><td>つらいこと</td><td>penderitaan / berat</td></tr><tr><td>6</td><td>妙</td><td>みょう</td><td>ふしぎな</td><td>aneh</td></tr><tr><td>7</td><td>逆</td><td>ぎゃく</td><td>反対</td><td>terbalik</td></tr><tr><td>8</td><td>入り口</td><td>いりぐち</td><td>入るところ</td><td>pintu masuk</td></tr><tr><td>9</td><td>用意する</td><td>よういする</td><td>前もってそろえる</td><td>menyiapkan</td></tr><tr><td>10</td><td>立場</td><td>たちば</td><td>その人の位置・考え方</td><td>posisi / pendirian</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜に対して（〜に向かって／〜と比べて）（Terhadap ~ / Sebaliknya ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ に対して（相手）</td><td>この意見<b>に対して</b>、私は賛成だ。</td></tr><tr><td>名詞 ＋ に対して（対比）</td><td>兄は静か<b>なのに対して</b>、弟はよく話す。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜について」は<b>話題</b>、「〜に対して」は<b>相手・向かう先</b>です。「先生について話す」と「先生に対して失礼だ」を比べてみましょう。"},{"t":"p","v":"②〜からといって〜とは限らない（そうだとしても、いつもそうではない）（Meskipun ~, belum tentu ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ からといって</td><td>形だけだ<b>からといって</b>、無意味だ<b>とは限らない</b>。</td></tr><tr><td>〜とは限らない（単独でも使う）</td><td>高い店がおいしい<b>とは限らない</b>。</td></tr></tbody></table>"},{"t":"p","v":"・後ろは打ち消しになります。JLPTでは「〜とは限らない」「〜わけではない」との組み合わせがよく出ます。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"その案に（　　）です。  ","opts":["賛成","無意味","苦痛","妙"]},{"t":"q","id":"2","drill":true,"text":"順番が（　　）でした。  ","opts":["逆","まし","妙","立場"]},{"t":"q","id":"3","drill":true,"text":"待つのは（　　）だ。  ","opts":["苦痛","入り口","用意","賛成"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"子ども（　　）、ていねいに話す。  ","opts":["に対して","について","にとって","によって"]},{"t":"q","id":"5","drill":true,"text":"安い（　　）、悪いとは限らない。  ","opts":["からといって","からには","からこそ","からして"]},{"t":"q","id":"6","drill":true,"text":"日本人がみな漢字を書ける（　　）。  ","opts":["とは限らない","に違いない","ものだ","ようがない"]}]},{"key":"金曜","title":"情報検索 ── 粗大ごみの出し方を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>みどり市　粗大ごみの出し方</b></p><p>一辺が30cmをこえるものは粗大ごみです。たんす・自転車をはじめ、ふとん・いす・電子レンジなどが当たります。</p><table><thead><tr><th>大きさ</th><th>券の枚数</th><th>例</th></tr></thead><tbody><tr><td>ア　30〜80cm</td><td>1枚（400円）</td><td>いす・電子レンジ</td></tr><tr><td>イ　81〜150cm</td><td>2枚（800円）</td><td>自転車・ふとん2組</td></tr><tr><td>ウ　151cm以上</td><td>3枚（1,200円）</td><td>たんす・ソファー</td></tr></tbody></table><p>◆手順<br>１　電話かインターネットで申し込む（受付は月〜金の9〜17時）<br>２　コンビニで「粗大ごみ券」を買う<br>３　券に受付番号と氏名を書き、品物にはる<br>４　決められた日の朝8時までに、家の前に出す</p><p>◆申し込まないことには、券を買っても出すことはできません。必ず先に申し込んでください。</p><p>◆テレビ・冷蔵庫・洗濯機・エアコンの4品は<b>粗大ごみでは出せません</b>。買った店か、市の案内する業者にお問い合わせください。</p><p>◆家の中からの運び出しは行っておりません。ご自分で出せない場合は、有料の「お手伝いサービス」（1品1,000円）をご利用ください。申し込みのときにお申し出ください。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"自転車1台とたんす1つを出すとき、粗大ごみ券は何枚必要か。  ","opts":["2枚  ","3枚  ","5枚  ","6枚"],"tag":"joken"},{"t":"q","id":"問2","text":"古い洗濯機を捨てたい人は、どうすればよいか。  ","opts":["券を3枚はって出す  ","買った店か市の案内する業者に問い合わせる  ","家の前に出しておく  ","お手伝いサービスを申し込む"],"tag":"joken"},{"t":"q","id":"問3","text":"この案内の内容に合うものはどれか。  ","opts":["券を買ってから申し込む  ","受付は土曜日もしている  ","市の人が家の中から運び出してくれる  ","出す日の朝8時までに家の前に出す"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>粗大ごみ</td><td>そだいごみ</td><td>大きくて特別に出すごみ</td><td>sampah berukuran besar</td></tr><tr><td>2</td><td>一辺</td><td>いっぺん</td><td>四角い物の一つの辺</td><td>satu sisi</td></tr><tr><td>3</td><td>こえる</td><td>こえる</td><td>その数より多くなる</td><td>melebihi</td></tr><tr><td>4</td><td>当たる</td><td>あたる</td><td>それに当てはまる</td><td>termasuk / berlaku</td></tr><tr><td>5</td><td>受付番号</td><td>うけつけばんごう</td><td>申し込んだときにもらう番号</td><td>nomor pendaftaran</td></tr><tr><td>6</td><td>はる</td><td>はる</td><td>のりなどでつける</td><td>menempelkan</td></tr><tr><td>7</td><td>業者</td><td>ぎょうしゃ</td><td>その仕事をする会社</td><td>perusahaan / vendor</td></tr><tr><td>8</td><td>運び出す</td><td>はこびだす</td><td>外へ運んで出す</td><td>mengangkut keluar</td></tr><tr><td>9</td><td>有料</td><td>ゆうりょう</td><td>お金がかかること</td><td>berbayar</td></tr><tr><td>10</td><td>申し出る</td><td>もうしでる</td><td>自分から言って知らせる</td><td>mengajukan / menyampaikan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜をはじめ（〜を代表として、ほかにも）（Mulai dari ~ dan lainnya）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ をはじめ</td><td>たんす<b>をはじめ</b>、いすやふとんも当たります。</td></tr><tr><td>名詞 ＋ をはじめとする ＋ 名詞</td><td>市長<b>をはじめとする</b>関係者。</td></tr></tbody></table>"},{"t":"passage","v":"注意：<b>代表の一つを先に挙げて、ほかも続ける</b>言い方です。案内文でよく使われます。"},{"t":"p","v":"②〜ないことには〜ない（〜しなければ、何も始まらない）（Kalau tidak ~, tidak bisa ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ない形 ＋ ことには</td><td>申し込ま<b>ないことには</b>、出せません。</td></tr><tr><td>名詞 ＋ でないことには</td><td>会員<b>でないことには</b>、借りられない。</td></tr></tbody></table>"},{"t":"p","v":"・後ろは必ず否定です。「〜てからでないと」と意味が近い項目です。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"券を品物に（　　）ください。  ","opts":["はって","こえて","当たって","申し出て"]},{"t":"q","id":"2","drill":true,"text":"（　　）のサービスもあります。  ","opts":["有料","業者","一辺","受付番号"]},{"t":"q","id":"3","drill":true,"text":"必要な方は窓口で（　　）ください。  ","opts":["申し出て","運び出して","こえて","はって"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"社長（　　）、全員が出席した。  ","opts":["をはじめ","をこめて","をもとに","をとおして"]},{"t":"q","id":"5","drill":true,"text":"食べてみ（　　）、味は分からない。  ","opts":["ないことには","ないうちに","ないかぎりで","ないながら"]},{"t":"q","id":"6","drill":true,"text":"会員（　　）、この部屋は使えません。  ","opts":["でないことには","ではないことに","でなくては困り","でないとしても"]}]},{"key":"土曜","title":"読解通しテスト（50分）","blocks":[{"t":"passage","v":"<p>第11週。<b>50分</b>で13問です。本番まで残りが少なくなりました。<b>分からない問題は印をつけて次へ進み、最後に戻る</b>練習をしてください。時間配分の目安：中文4分30秒／長文10分／情報検索6分。</p>"},{"t":"h2","v":"問題1　中文（3問）"},{"t":"passage","v":"<p>　弟は、子どものころから物をなくさない。私は反対で、かぎも定期券もよくなくす。長い間、性格のちがいだと思っていた。</p><p>　あるとき、弟の部屋を見て分かった。弟の机には、物がほとんど出ていない。かわりに、小さい箱が一つ置いてあって、帰ってきたら、手に持っている物を全部そこへ入れるのだという。選ばない。分けない。ただ入れる。</p><p>　私は、「大事な物を大事な場所に置く」ことを考えていた。弟は、<b>考えなくていい場所</b>を一つ作っていた。なくさない人は、記憶が強いのではない。記憶を使わずに済む形を持っているのだ。</p>"},{"t":"q","id":"問1","text":"弟が帰ってきたとき、何をするか。  ","opts":["持っている物を全部、箱に入れる  ","物を種類ごとに分ける  ","机の上をふく  ","かぎだけを別の場所に置く"],"tag":"naiyou"},{"t":"q","id":"問2","text":"筆者が長い間、思っていたことはどれか。  ","opts":["弟は箱を使っている  ","なくすかどうかは性格のちがいだ  ","弟は記憶がよい  ","机はきれいにするべきだ"],"tag":"naiyou"},{"t":"q","id":"問3","text":"筆者が最も言いたいことはどれか。  ","opts":["大事な物は大事な場所に置くべきだ  ","なくさない人は、記憶を使わずに済む形を持っている  ","弟は特別な人だ  ","箱は小さいほうがよい"],"tag":"shucho"},{"t":"h2","v":"問題2　中文（3問）"},{"t":"passage","v":"<p>　ある店で、レジの前に「ゆっくりレジ」という表示があった。急いでいない人が並ぶ列である。最初は、<u>①だれが好んで遅い列に並ぶのだろう</u>と思った。</p><p>　ところが、その列にはいつも人がいる。小さい子を連れた人、財布からゆっくり小銭を出す人、店員と少し話したい人。この列があるおかげで、その人たちは<b>急がされない</b>。そして、隣の普通の列も、前より早く進むようになった。</p><p>　速さをそろえようとすると、全体が遅くなる。速さのちがいを認めて、道を分けたほうが、結局はどちらも早い。これは、レジだけの話ではないだろう。</p>"},{"t":"q","id":"問4","text":"①「だれが好んで遅い列に並ぶのだろう」とあるが、実際はどうだったか。  ","opts":["だれも並ばなかった  ","いつも人が並んでいた  ","店員がこまっていた  ","列がなくなった"],"tag":"naiyou"},{"t":"q","id":"問5","text":"「ゆっくりレジ」ができて、普通の列はどうなったか。  ","opts":["前より早く進むようになった  ","前より遅くなった  ","人がいなくなった  ","変わらなかった"],"tag":"naiyou"},{"t":"q","id":"問6","text":"筆者の考えに合うものはどれか。  ","opts":["みんなの速さをそろえるべきだ  ","速さのちがいを認めて道を分けたほうが、結局はどちらも早い  ","急いでいる人を優先するべきだ  ","レジは一つでよい"],"tag":"shucho"},{"t":"h2","v":"問題3　長文（4問）"},{"t":"passage","v":"<p>　新しい機械が入ったとき、会社は分厚い説明書を配った。百ページ以上ある。だれも最後まで読まなかった。</p><p>　一か月後、同じ質問が何度も出るようになった。「この音は何ですか」「このボタンは押してもいいですか」。説明書には全部書いてある。それでも、<u>①だれもそこにたどり着けなかった</u>。</p><p>　そこで、先輩の一人が、機械の横に紙を一枚はった。書いてあったのは三行だけである。「音が二回鳴ったら紙づまり」「赤いボタンは止める、押しても壊れない」「分からないときは電源を切ってよい」。</p><p>　質問は、その週のうちにほとんど消えた。百ページが要らなかったのではない。②<u>百ページに入るための三行がなかった</u>のだ。分厚い説明書は、調べ方を知っている人には役に立つ。しかし、何を調べればいいか分からない人には、入り口が要る。</p><p>　私はそれ以来、長い文書を作ったら、必ず三行の紙をいっしょに作る。本体より、そちらのほうが時間がかかる。それでも作る。読まれない百ページは、ないのと同じだからである。</p>"},{"t":"q","id":"問7","text":"①「だれもそこにたどり着けなかった」とは、どういうことか。  ","opts":["説明書が配られなかったということ  ","答えは書いてあるのに、見つけられなかったということ  ","機械が動かなかったということ  ","質問が禁止されていたということ"],"tag":"shiji"},{"t":"q","id":"問8","text":"先輩がはった紙には、何が書いてあったか。  ","opts":["機械の値段  ","よく困ることへの短い答え三つ  ","説明書の目次  ","会社の連絡先"],"tag":"naiyou"},{"t":"q","id":"問9","text":"②「百ページに入るための三行がなかった」とは、どういうことか。  ","opts":["説明書が三行足りなかったということ  ","長い説明書を使い始めるための入り口がなかったということ  ","三行だけで十分だったということ  ","説明書を短くするべきだったということ"],"tag":"shiji"},{"t":"q","id":"問10","text":"筆者が最も言いたいことはどれか。  ","opts":["説明書は短いほうがよい  ","長い文書には、それに入るための短い入り口が必要だ  ","説明書は作らなくてよい  ","質問はしないほうがよい"],"tag":"shucho"},{"t":"h2","v":"問題4　情報検索（3問）"},{"t":"passage","v":"<p><b>ひがし市　夜間・休日の医療案内</b></p><table><thead><tr><th>窓口</th><th>時間</th><th>対象</th><th>電話の要否</th></tr></thead><tbody><tr><td>①　夜間急病センター</td><td>毎日 19:00〜23:00</td><td>大人・子ども</td><td>要（先に電話）</td></tr><tr><td>②　休日当番医</td><td>日・祝 9:00〜17:00</td><td>大人・子ども</td><td>不要</td></tr><tr><td>③　子ども救急電話</td><td>毎日 19:00〜翌8:00</td><td>15歳まで</td><td>電話のみ（相談）</td></tr><tr><td>④　歯科休日診療</td><td>日・祝 9:00〜12:00</td><td>大人・子ども</td><td>要（先に電話）</td></tr></tbody></table><p>◆①と④は、行く前に必ずお電話ください。電話をしないことには、お待ちいただくことになります。</p><p>◆③は相談だけの窓口です。薬を出したり、診察をしたりすることはできません。</p><p>◆どの窓口も健康保険証をお持ちください。お持ちでない場合は、いったん全額をお支払いいただきます。</p><p>◆命に関わると思われるときは、これらの窓口ではなく、すぐに119番へおかけください。</p>"},{"t":"q","id":"問11","text":"日曜の夜9時に、8歳の子どもの熱について相談だけしたい人は、どこを使えばよいか。  ","opts":["①　夜間急病センター  ","②　休日当番医  ","③　子ども救急電話  ","④　歯科休日診療"],"tag":"joken"},{"t":"q","id":"問12","text":"保険証を持っていないとき、どうなるか。  ","opts":["受けられない  ","いったん全額を支払う  ","あとで郵送する  ","半額になる"],"tag":"joken"},{"t":"q","id":"問13","text":"この案内の内容に合うものはどれか。  ","opts":["①はいつでも電話なしで行ける  ","③では薬を出してもらえる  ","④は日曜と祝日の午前中だけである  ","命に関わるときも①に電話する"],"tag":"naiyou"}]},{"key":"日曜","title":"聴解30分 ＋ 復習30分","blocks":[{"t":"h2","v":"Part 1　聴解（20分・7問）"},{"t":"passage","v":"<p>注意：この紙には会話は書いてありません。音を聞いて答えます。会話は1回だけ流れます。今週のポイント理解は、<b>いったん出た答えが後で訂正される</b>形が入っています。最後まで聞いてから選んでください。</p>"},{"t":"h3","v":"問題1　課題理解（2問）"},{"t":"q","id":"問1","text":"","opts":["見積書を書き直す","工場へ行く","工場に電話する","数量を数える"]},{"t":"q","id":"問2","text":"","opts":["8時30分","8時45分","9時","9時15分"]},{"t":"h3","v":"問題2　ポイント理解（2問）"},{"t":"q","id":"問3","text":"","opts":["新しい人が増えたから","ロッカーがこわれたから","部屋がせまいから","使っていない人が返していないから"]},{"t":"q","id":"問4","text":"","opts":["当日の朝、雨が降ること","人数が足りないこ い百ページは、ないのと同じ」。"],"問11":[3,"③は毎日19時から翌8時まで、15歳まで、相談の窓口です。"],"問12":[2,"「お持ちでない場合は、いったん全額をお支払いいただきます」。"],"問13":[3,"④は「日・祝 9:00〜12:00」です。①は要電話、③は相談のみ、命に関わるときは119番です。"]},"日曜":{"L1":[3,"「先に工場に電話して聞いてから書き直します」。"],"L2":[2,"9時開始で「15分前にお願いします」なので8時45分。"],"L3":[4,"「それもありますが、それより、使っていない方がかぎを返してくださらないんです」。"],"L4":[1,"「朝に雨が降ると外に出せないので、そこだけ気になっています」。"],"L5":[2,"まだ決まっていないので「決まり次第、ご連絡します」。"],"L6":[3,"間違いを指摘されたら、まずわびて直します。"],"L7":[1,"自分が受け取っていないので「まだ届いておりません」。"],"r1":[1,""],"r2":[1,""],"r3":[1,""],"r4":[1,""],"r5":[1,""],"r6":[1,""],"r7":[1,""],"r8":[1,""],"r9":[1,""],"r10":[1,""],"r11":[1,""],"r12":[1,""],"r13":[1,""],"r14":[1,""],"r15":[1,""],"r16":[1,""],"r17":[1,""],"r18":[1,""],"r19":[1,""],"r20":[1,""]}},"listen":[{"group":"問題1　課題理解","hint":"はじめに質問を聞いてください。それから会話を聞いて、1〜4から一つ選びます。","items":[{"no":"問1","label":"女の人はこのあとまず何をしますか","answer":"3　工場に電話する","why":"「先に数を聞いてから」と決まる。書き直すのはそのあと。","steps":[{"k":"q","v":"女の人は、このあとまず何をしますか。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"見積書、数量が変わったから書き直してくれる？"},{"k":"line","sp":"女","v":"はい。新しい数は何個でしょうか。"},{"k":"line","sp":"男","v":"あ、まだ工場から連絡が来てないんだ。"},{"k":"line","sp":"女","v":"では、先に工場に電話して聞いてから書き直します。"},{"k":"pause","s":8,"a":true}]},{"no":"問2","label":"男の人は明日、何時に来ますか","answer":"2　8時45分","why":"9時開始の15分前と言われている。","steps":[{"k":"q","v":"男の人は、明日、何時に来ますか。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"明日の研修は9時からです。"},{"k":"line","sp":"男","v":"では9時に来ればいいですか。"},{"k":"line","sp":"女","v":"受付がありますので、15分前にお願いします。"},{"k":"line","sp":"男","v":"分かりました。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題2　ポイント理解","hint":"質問を聞いてから、問題用紙を見てください。読む時間があります。","items":[{"no":"問3","label":"ロッカーが足りない原因は何ですか","answer":"4　使っていない人が返していないから","why":"「新しい人が増えた」も出るが、女の人が「それより」と言って訂正している。","steps":[{"k":"q","v":"ロッカーが足りない原因は、何ですか。"},{"k":"pause","s":3},{"k":"line","sp":"男","v":"ロッカー、また足りないそうですね。新しい人が増えたからでしょうか。"},{"k":"line","sp":"女","v":"それもありますが、それより、使っていない方がかぎを返してくださらないんです。"},{"k":"line","sp":"男","v":"なるほど。"},{"k":"line","sp":"女","v":"20個くらい、春から動いていません。"},{"k":"pause","s":8,"a":true}]},{"no":"問4","label":"女の人が心配していることは何ですか","answer":"1　当日の朝、雨が降ること","why":"「人数」「場所」も話に出るが、心配しているのは天気。","steps":[{"k":"q","v":"女の人が心配していることは、何ですか。"},{"k":"pause","s":3},{"k":"line","sp":"男","v":"日曜の行事、人数は集まりましたか。"},{"k":"line","sp":"女","v":"おかげさまで、十分です。場所も広いところが取れました。"},{"k":"line","sp":"男","v":"では安心ですね。"},{"k":"line","sp":"女","v":"ただ、朝に雨が降ると外に出せないので、そこだけ気になっています。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題3　即時応答","hint":"短い文を聞いて、1〜3から合う返事を選びます。","items":[{"no":"問5","label":"返事を選ぶ","answer":"2　決まり次第、ご連絡します","why":"「いつ分かるか」と聞かれたときの答え方。","steps":[{"k":"line","sp":"男","v":"日にちは、いつごろ分かりますか。"},{"k":"line","sp":"女","v":"1、はい、決まりました。"},{"k":"line","sp":"女","v":"2、決まり次第、ご連絡します。"},{"k":"line","sp":"女","v":"3、いいえ、決まっています。"},{"k":"pause","s":8,"a":true}]},{"no":"問6","label":"返事を選ぶ","answer":"3　申し訳ありません、すぐ直します","why":"間違いを指摘されたときの返し方。","steps":[{"k":"line","sp":"女","v":"この数字、先月のままになっていますよ。"},{"k":"line","sp":"男","v":"1、はい、そのままにしておきます。"},{"k":"line","sp":"男","v":"2、では、先月にします。"},{"k":"line","sp":"男","v":"3、申し訳ありません、すぐ直します。"},{"k":"pause","s":8,"a":true}]},{"no":"問7","label":"返事を選ぶ","answer":"1　いえ、まだ届いておりません","why":"「届いたか」と聞かれ、届いていないときの丁寧な答え。","steps":[{"k":"line","sp":"男","v":"先日の書類、お手元に届きましたでしょうか。"},{"k":"line","sp":"女","v":"1、いえ、まだ届いておりません。"},{"k":"line","sp":"女","v":"2、はい、お届けになりました。"},{"k":"line","sp":"女","v":"3、いえ、お届けしません。"},{"k":"pause","s":8,"a":true}]}]}]},"12":{"days":[{"key":"月曜","title":"短文読解 ── 健康診断のお知らせを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>【重要】今年度の健康診断について</b></p><p>今年の健康診断は、11月10日（月）から14日（金）まで、本社3階の会議室で行います。受診は<b>全員必要</b>です。</p><p>受ける日は部署ごとに決めてありますが、都合が悪い場合は、同じ週の中であれば別の日に変えてかまいません。<u>①その場合は、当日の朝に受付でお申し出ください</u>。事前の連絡は必要ありません。</p><p>当日は、朝食をとらずにお越しください。水とお茶は飲んでもかまいません。受診が終わってから、3階で軽い食事をご用意しています。検査のついでに、健康相談も受けられます。希望する方は、受付でその旨をお伝えください。</p><p>この週にどうしても受けられない方は、12月に市の施設で受けることになります。その場合の費用は<b>いったんご本人がお支払いいただき</b>、あとで会社が全額お返しします。</p><p>総務課</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「その場合」とは、どんな場合か。  ","opts":["健康相談を受けたい場合  ","決められた日の都合が悪く、同じ週の別の日に受ける場合  ","朝食をとってしまった場合  ","12月に受ける場合"],"tag":"shiji"},{"t":"q","id":"問2","text":"当日、飲んでもよいものはどれか。  ","opts":["牛乳  ","水とお茶  ","コーヒー  ","何も飲めない"],"tag":"joken"},{"t":"q","id":"問3","text":"このお知らせの内容に合うものはどれか。  ","opts":["12月に受けた費用は自分の負担になる  ","健康相談は別の日に申し込む  ","受診は希望者だけでよい  ","日を変えるとき、事前の連絡は要らない"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>年度</td><td>ねんど</td><td>事務や学校の1年の区切り</td><td>tahun fiskal / tahun ajaran</td></tr><tr><td>2</td><td>受診</td><td>じゅしん</td><td>診察や検査を受けること</td><td>menjalani pemeriksaan</td></tr><tr><td>3</td><td>本社</td><td>ほんしゃ</td><td>会社の中心になる事業所</td><td>kantor pusat</td></tr><tr><td>4</td><td>都合</td><td>つごう</td><td>予定の具合</td><td>keadaan / kesempatan</td></tr><tr><td>5</td><td>事前</td><td>じぜん</td><td>前もって</td><td>sebelumnya</td></tr><tr><td>6</td><td>朝食</td><td>ちょうしょく</td><td>朝ごはん</td><td>sarapan</td></tr><tr><td>7</td><td>軽い</td><td>かるい</td><td>重くない。あっさりした</td><td>ringan</td></tr><tr><td>8</td><td>その旨</td><td>そのむね</td><td>そのことを（かたい言い方）</td><td>hal tersebut</td></tr><tr><td>9</td><td>施設</td><td>しせつ</td><td>建物や設備</td><td>fasilitas</td></tr><tr><td>10</td><td>負担</td><td>ふたん</td><td>費用や仕事を引き受けること</td><td>beban / tanggungan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜ついでに（あることをする、その機会に）（Sekalian ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ の ついでに</td><td>検査<b>のついでに</b>、相談も受けられます。</td></tr><tr><td>動詞辞書形・た形 ＋ ついでに</td><td>買い物に行く<b>ついでに</b>、出しておく。</td></tr></tbody></table>"},{"t":"passage","v":"注意：<b>主な用事が別にあって</b>、そのときに一緒にする、という意味です。主な用事のほうを前に置きます。"},{"t":"p","v":"②〜こそ（ほかではなく、まさにそれ）（Justru ~ / ~ lah）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ こそ</td><td>今年<b>こそ</b>合格したい。</td></tr><tr><td>〜からこそ（理由を強める）</td><td>大事だ<b>からこそ</b>、確認する。</td></tr></tbody></table>"},{"t":"p","v":"・「こそ」は前の言葉を強めます。「今度こそ」「こちらこそ」もこの形です。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"費用は会社が（　　）します。  ","opts":["負担","受診","事前","都合"]},{"t":"q","id":"2","drill":true,"text":"（　　）に連絡してください。  ","opts":["事前","その旨","年度","軽い"]},{"t":"q","id":"3","drill":true,"text":"希望の方は（　　）をお伝えください。  ","opts":["その旨","本社","朝食","施設"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"散歩の（　　）、郵便を出した。  ","opts":["ついでに","ついで","おかげで","うえで"]},{"t":"q","id":"5","drill":true,"text":"今度（　　）、必ずやります。  ","opts":["こそ","さえ","しか","ほど"]},{"t":"q","id":"6","drill":true,"text":"大事だ（　　）、何度も確認する。  ","opts":["からこそ","からには","からといって","からして"]}]},{"key":"火曜","title":"短文読解 ── 問い合わせへの返事を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>あて先：あおば工業　李様<br>件名：ご注文の変更について（回答）</p><p>あおば工業　李様</p><p>お問い合わせありがとうございます。さくら商会の田中でございます。</p><p>先日ご注文いただいた品（No.2214）について、数量を50個から30個へ変更したいとのことでした。結論から申し上げますと、<b>今回は変更を承ることができかねます</b>。当社においては、製造に入ったあとの変更はお受けしない決まりになっており、この品はすでに10月2日から製造を始めております。</p><p>ただし、<u>①次のご注文であれば、別の形でご相談できます</u>。同じ品を30個ずつ、月に2回に分けてお届けする方法です。一度にお納めするより、置き場所が少なくて済みます。ご希望でしたら、見積書をお作りします。</p><p>お役に立てず申し訳ございませんが、何とぞご了承くださいますようお願いいたします。</p><p>さくら商会　田中</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"李さんが問い合わせた内容はどれか。  ","opts":["注文の数を減らしたい  ","届ける日を早めたい  ","値段を下げてほしい  ","品物を返したい"],"tag":"naiyou"},{"t":"q","id":"問2","text":"変更を受けられない理由はどれか。  ","opts":["数が少なすぎるから  ","すでに製造が始まっているから  ","担当者がいないから  ","注文書がないから"],"tag":"riyuu"},{"t":"q","id":"問3","text":"①「別の形でご相談できます」とあるが、どんな方法か。  ","opts":["30個ずつ、月に2回に分けて届ける  ","50個を一度に届ける  ","注文を取り消す  ","品物を交換する"],"tag":"shiji"},{"t":"q","id":"問4","text":"このメールの内容に合うものはどれか。  ","opts":["見積書はもう送られている  ","製造は10月2日から始まっている  ","変更は無料でできる  ","この品はまだ作られていない"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>問い合わせ</td><td>といあわせ</td><td>たずねること</td><td>pertanyaan / permintaan info</td></tr><tr><td>2</td><td>結論</td><td>けつろん</td><td>まとめて出した答え</td><td>kesimpulan</td></tr><tr><td>3</td><td>承る</td><td>うけたまわる</td><td>「受ける」の謙譲語</td><td>menerima (bentuk merendah)</td></tr><tr><td>4</td><td>当社</td><td>とうしゃ</td><td>この会社（自分の会社）</td><td>perusahaan kami</td></tr><tr><td>5</td><td>製造</td><td>せいぞう</td><td>品物を作ること</td><td>produksi</td></tr><tr><td>6</td><td>決まり</td><td>きまり</td><td>守るべきルール</td><td>aturan</td></tr><tr><td>7</td><td>納める</td><td>おさめる</td><td>品物を渡す。収める</td><td>menyerahkan / menyetor</td></tr><tr><td>8</td><td>置き場所</td><td>おきばしょ</td><td>物を置くところ</td><td>tempat penyimpanan</td></tr><tr><td>9</td><td>役に立つ</td><td>やくにたつ</td><td>ためになる</td><td>berguna</td></tr><tr><td>10</td><td>何とぞ</td><td>なにとぞ</td><td>どうか（かたいお願い）</td><td>mohon dengan hormat</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜において（〜で。場所・場面のかたい言い方）（Di ~ / Dalam ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ において</td><td>当社<b>において</b>は、変更を受けません。</td></tr><tr><td>名詞 ＋ における ＋ 名詞</td><td>会議<b>における</b>発言。</td></tr></tbody></table>"},{"t":"passage","v":"注意：話しことばの「〜で」を、文書用にかたくした形です。人には使いません（×私において）。"},{"t":"p","v":"②〜かねます／〜かねない（できない／〜する可能性がある）（Tidak dapat ~ / Bisa jadi ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ かねます（できない）</td><td>お受けし<b>かねます</b>。</td></tr><tr><td>動詞ます形 ＋ かねない（悪い可能性）</td><td>事故になり<b>かねない</b>。</td></tr></tbody></table>"},{"t":"p","v":"・意味が正反対なので注意。<b>「かねます」＝できない、「かねない」＝あり得る（悪いこと）</b>。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"ご注文を（　　）ました。  ","opts":["承り","納め","製造し","問い合わせ"]},{"t":"q","id":"2","drill":true,"text":"（　　）から申し上げます。  ","opts":["結論","決まり","当社","置き場所"]},{"t":"q","id":"3","drill":true,"text":"（　　）よろしくお願いします。  ","opts":["何とぞ","役に立ち","納め","製造"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"現代（　　）、情報は力である。  ","opts":["において","にとって","に対して","にわたって"]},{"t":"q","id":"5","drill":true,"text":"その件はお答えし（　　）。  ","opts":["かねます","かねません","がちです","ようです"]},{"t":"q","id":"6","drill":true,"text":"このままでは事故になり（　　）。  ","opts":["かねない","かねます","がたい","づらい"]}]},{"key":"水曜","title":"中文読解 ── エッセイを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　父は、だれも見ていないのにテレビをつけっぱなしにする。子どものころ、それが気になってたまらなかった。電気がもったいない。何度も消して回った。</p><p>　一人で暮らし始めて、意味が分かった。帰って玄関を開けたとき、家が<b>静かすぎる</b>のである。音がないと、部屋は空き部屋のように見える。私はいつのまにか、ラジオをつけてから上着を脱ぐようになっていた。</p><p>　父がつけていたのは、<u>①番組ではなかった</u>。人の声である。母が亡くなってからの十年、父の家には返事をする相手がいなかった。テレビは、返事をしない。けれども、話し続けてはくれる。</p><p>　節約の話をしていた私と、静けさの話をしていた父。②<u>同じ画面を見ながら、まったくちがう物を見ていた</u>。相手が何に困っているのかを聞かずに、正しいことだけを言っていたのだと思う。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"子どものころ、筆者はなぜテレビを消して回ったか。  ","opts":["番組がつまらなかったから  ","電気がもったいないと思ったから  ","父にたのまれたから  ","音がうるさかったから"],"tag":"riyuu"},{"t":"q","id":"問2","text":"一人で暮らし始めて、筆者はどうなったか。  ","opts":["テレビを買わなくなった  ","帰るとまずラジオをつけるようになった  ","父の家に戻った  ","早く寝るようになった"],"tag":"naiyou"},{"t":"q","id":"問3","text":"①「番組ではなかった」とあるが、父がつけていたのは何か。  ","opts":["ニュース  ","人の声  ","音楽  ","明かり"],"tag":"shiji"},{"t":"q","id":"問4","text":"②「同じ画面を見ながら、まったくちがう物を見ていた」とは、どういうことか。  ","opts":["画面の映りが悪かったということ  ","筆者は節約を、父は静けさを問題にしていたということ  ","父は目が悪かったということ  ","番組の好みがちがったということ"],"tag":"shiji"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>もったいない</td><td>もったいない</td><td>むだにするのが惜しい</td><td>sayang (mubazir)</td></tr><tr><td>2</td><td>玄関</td><td>げんかん</td><td>家の入り口</td><td>pintu depan</td></tr><tr><td>3</td><td>空き部屋</td><td>あきべや</td><td>だれもいない部屋</td><td>kamar kosong</td></tr><tr><td>4</td><td>いつのまにか</td><td>いつのまにか</td><td>気づかないうちに</td><td>tanpa terasa</td></tr><tr><td>5</td><td>上着</td><td>うわぎ</td><td>外に着る服</td><td>jaket / baju luar</td></tr><tr><td>6</td><td>脱ぐ</td><td>ぬぐ</td><td>服を取る</td><td>melepas (pakaian)</td></tr><tr><td>7</td><td>亡くなる</td><td>なくなる</td><td>死ぬ（ていねいな言い方）</td><td>meninggal</td></tr><tr><td>8</td><td>節約</td><td>せつやく</td><td>むだをはぶくこと</td><td>penghematan</td></tr><tr><td>9</td><td>静けさ</td><td>しずけさ</td><td>静かなこと</td><td>keheningan</td></tr><tr><td>10</td><td>困る</td><td>こまる</td><td>どうすればよいか分からない</td><td>kesulitan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜っぱなし（そのままにしておく。よくない状態）（Dibiarkan begitu saja）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ っぱなし</td><td>つけ<b>っぱなし</b>にする。</td></tr><tr><td>（立つ・待つなどにも）</td><td>三時間立ち<b>っぱなし</b>だった。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜たまま」と似ていますが、「っぱなし」は<b>そうしておくのがよくない</b>という気持ちが入ります。"},{"t":"p","v":"②〜てたまらない（がまんできないほど〜だ）（Sangat ~ sampai tak tertahankan）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>い形容詞て形 ＋ たまらない</td><td>気になっ<b>てたまらない</b>。</td></tr><tr><td>な形容詞 で ＋ たまらない</td><td>心配<b>でたまらない</b>。</td></tr></tbody></table>"},{"t":"p","v":"・自分の気持ちや感覚に使います。他人には「〜たまらないようだ」とします。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"捨てるのは（　　）です。  ","opts":["もったいない","静けさ","節約","空き部屋"]},{"t":"q","id":"2","drill":true,"text":"（　　）に日が暮れていた。  ","opts":["いつのまにか","もったいなく","こまって","ぬいで"]},{"t":"q","id":"3","drill":true,"text":"電気の（　　）に協力する。  ","opts":["節約","玄関","上着","静けさ"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"水を出し（　　）にしないで。  ","opts":["っぱなし","っきり","がち","ぎみ"]},{"t":"q","id":"5","drill":true,"text":"国の家族が心配（　　）。  ","opts":["でたまらない","てたまらない","にたまらない","をたまらない"]},{"t":"q","id":"6","drill":true,"text":"今日は暑く（　　）。  ","opts":["てたまらない","でたまらない","てならず","がちだ"]}]},{"key":"木曜","title":"中文読解 ── 意見文を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　一人で食べる食事はさびしい、とよく言われる。だから、みんなで食べる場を作ろう、という活動もある。</p><p>　私はこの考えに、少し引っかかるところがある。一人で食べることが問題なのだろうか。<u>①問題は、選べないことのほうではないか</u>。一人がいいときに一人で食べられ、だれかといたいときにいられる。それが選べるなら、一人の食事はさびしくない。</p><p>　実際、大勢で食べる場に行っても、気が楽になるとは限らない。知らない人の間で黙って食べる時間は、<b>一人で食べるより長く感じる</b>ことさえある。人数のわりに、会話は少ない。</p><p>　必要なのは、人を集めることだけではない。②<u>「今日は一人がいい」と言える関係</u>のほうが、よほど難しく、よほど大事だと思う。毎日来なくてもいい。来ない日を責められない。そういう場所であれば、人は自分から来る。</p><p>　集める前に、選べるようにする。順番はそちらが先だろう。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「問題は、選べないことのほうではないか」とあるが、筆者は何が問題だと考えているか。  ","opts":["一人で食べること  ","一人か、だれかとかを自分で選べないこと  ","食事の時間が短いこと  ","食事の場が少ないこと"],"tag":"shucho"},{"t":"q","id":"問2","text":"大勢で食べる場について、筆者はどう述べているか。  ","opts":["必ず気が楽になる  ","人数のわりに会話が少ないこともある  ","いつも会話が多い  ","行くべきではない"],"tag":"naiyou"},{"t":"q","id":"問3","text":"②「『今日は一人がいい』と言える関係」とは、どのような関係か。  ","opts":["毎日会う関係  ","来ない日を責められない関係  ","食事を作ってもらう関係  ","仕事でつながる関係"],"tag":"shiji"},{"t":"q","id":"問4","text":"筆者が最も言いたいことはどれか。  ","opts":["人を集める場を増やすべきだ  ","集める前に、選べるようにするほうが先だ  ","一人で食べるほうがよい  ","食事は大勢でするべきだ"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>活動</td><td>かつどう</td><td>はたらきかけること</td><td>kegiatan</td></tr><tr><td>2</td><td>引っかかる</td><td>ひっかかる</td><td>気になって心に残る</td><td>mengganjal</td></tr><tr><td>3</td><td>実際</td><td>じっさい</td><td>ほんとうのところ</td><td>kenyataannya</td></tr><tr><td>4</td><td>大勢</td><td>おおぜい</td><td>たくさんの人</td><td>banyak orang</td></tr><tr><td>5</td><td>気が楽</td><td>きがらく</td><td>心配がなく、気持ちが軽い</td><td>merasa lega</td></tr><tr><td>6</td><td>黙る</td><td>だまる</td><td>何も言わない</td><td>diam</td></tr><tr><td>7</td><td>会話</td><td>かいわ</td><td>話し合うこと</td><td>percakapan</td></tr><tr><td>8</td><td>よほど</td><td>よほど</td><td>ずいぶん。かなり</td><td>jauh lebih</td></tr><tr><td>9</td><td>責める</td><td>せめる</td><td>悪いと言ってとがめる</td><td>menyalahkan</td></tr><tr><td>10</td><td>順番</td><td>じゅんばん</td><td>ものごとの並び</td><td>urutan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜わりに（〜から思うより）（Untuk ukuran ~, ternyata ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ の わりに</td><td>人数<b>のわりに</b>、会話は少ない。</td></tr><tr><td>普通形 ＋ わりに</td><td>値段が高い<b>わりに</b>、おいしくない。</td></tr></tbody></table>"},{"t":"passage","v":"注意：<b>予想と実際がずれている</b>ときに使います。よいほうにも悪いほうにも使えます。"},{"t":"p","v":"②〜どころか（〜どころではなく、もっと）（Jangankan ~, bahkan ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ どころか</td><td>楽になる<b>どころか</b>、疲れた。</td></tr><tr><td>名詞 ＋ どころか</td><td>一人<b>どころか</b>、二人も来なかった。</td></tr></tbody></table>"},{"t":"p","v":"・前を強く打ち消して、<b>反対のこと、またはもっと程度の強いこと</b>を続けます。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"その言い方が少し（　　）。  ","opts":["引っかかる","責める","黙る","よほど"]},{"t":"q","id":"2","drill":true,"text":"（　　）の人が集まった。  ","opts":["大勢","実際","会話","活動"]},{"t":"q","id":"3","drill":true,"text":"話してみたら（　　）になった。  ","opts":["気が楽","順番","よほど","会話"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"年齢の（　　）、しっかりしている。  ","opts":["わりに","ために","うえに","ばかりに"]},{"t":"q","id":"5","drill":true,"text":"休む（　　）、もっと忙しくなった。  ","opts":["どころか","どころで","ばかりか","とはいえ"]},{"t":"q","id":"6","drill":true,"text":"値段が高い（　　）、味はふつうだ。  ","opts":["わりに","おかげで","うえで","ついでに"]}]},{"key":"金曜","title":"情報検索 ── 図書館の利用案内を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>みなみ市立図書館　本を借りる・予約する</b></p><table><thead><tr><th>種類</th><th>冊数</th><th>期間</th><th>予約</th><th>のばせるか</th></tr></thead><tbody><tr><td>ア　一般の本</td><td>10冊まで</td><td>2週間</td><td>できる</td><td>1回だけ2週間</td></tr><tr><td>イ　雑誌（先月まで）</td><td>3冊まで</td><td>1週間</td><td>できない</td><td>できない</td></tr><tr><td>ウ　CD・DVD</td><td>2点まで</td><td>1週間</td><td>できる</td><td>できない</td></tr><tr><td>エ　新聞・今月の雑誌</td><td>―</td><td>館内のみ</td><td>―</td><td>―</td></tr></tbody></table><p>◆利用カードを作る上で、住所の分かるもの（免許証・保険証など）が必要です。市内に住んでいるか、市内で働いている方が対象です。</p><p>◆予約した本が用意できたら、メールでお知らせします。<b>お知らせの日から1週間</b>取り置きします。取りに来られない場合は、お手数ですがご連絡ください。</p><p>◆期間をのばせるのは、ほかに予約が入っていない場合を除いてできません。つまり、<b>次に待っている人がいるときは、のばせません</b>。</p><p>◆返すのは、開いている時間なら窓口へ。閉まっているときは、入り口横の返却ポストへ。ただし、CD・DVDはポストに入れないでください。傷がつくおそれがあります。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"一般の本を借りて、期間をのばしたい人ができるのはどんなときか。  ","opts":["いつでものばせる  ","その本にほかの予約が入っていないとき  ","2回目までならのばせる  ","のばすことはできない"],"tag":"joken"},{"t":"q","id":"問2","text":"図書館が閉まっているときにDVDを返したい人は、どうすればよいか。  ","opts":["返却ポストに入れる  ","ポストには入れず、開いている時間に窓口へ返す  ","予約を取り消す  ","入り口の前に置く"],"tag":"joken"},{"t":"q","id":"問3","text":"この案内の内容に合うものはどれか。  ","opts":["今月の雑誌も借りられる  ","予約した本は知らせの日から1週間取り置きされる  ","雑誌は予約できる  ","市外の人は利用カードを作れない"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>冊数</td><td>さっすう</td><td>本の数</td><td>jumlah buku</td></tr><tr><td>2</td><td>一般</td><td>いっぱん</td><td>特別でない、ふつうの</td><td>umum</td></tr><tr><td>3</td><td>雑誌</td><td>ざっし</td><td>定期的に出る本</td><td>majalah</td></tr><tr><td>4</td><td>館内</td><td>かんない</td><td>建物の中</td><td>di dalam gedung</td></tr><tr><td>5</td><td>免許証</td><td>めんきょしょう</td><td>資格を示す証明書</td><td>SIM / surat izin</td></tr><tr><td>6</td><td>対象</td><td>たいしょう</td><td>当てはまる人やもの</td><td>sasaran</td></tr><tr><td>7</td><td>取り置き</td><td>とりおき</td><td>取っておくこと</td><td>disimpankan</td></tr><tr><td>8</td><td>返却</td><td>へんきゃく</td><td>返すこと</td><td>pengembalian</td></tr><tr><td>9</td><td>傷</td><td>きず</td><td>こわれたあと・きずあと</td><td>goresan / luka</td></tr><tr><td>10</td><td>おそれ</td><td>おそれ</td><td>悪いことが起こる心配</td><td>kekhawatiran / risiko</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜上で（〜するときに。〜したあとで）（Dalam rangka ~ / Setelah ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ の 上で</td><td>カードを作る<b>上で</b>必要です。</td></tr><tr><td>動詞た形 ＋ 上で（〜してから）</td><td>確認し<b>た上で</b>、お返事します。</td></tr></tbody></table>"},{"t":"passage","v":"注意：辞書形＋上では「〜するために必要なこと」、た形＋上では「〜してから」。<b>形で意味が変わります</b>。"},{"t":"p","v":"②〜を除いて（〜以外は）（Kecuali ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ を除いて</td><td>日曜<b>を除いて</b>、毎日開いています。</td></tr><tr><td>名詞 ＋ を除き（かたい）</td><td>一部<b>を除き</b>、無料です。</td></tr></tbody></table>"},{"t":"p","v":"・案内文でよく出ます。「〜以外は」と言いかえられます。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"本の（　　）に制限があります。  ","opts":["冊数","館内","傷","対象"]},{"t":"q","id":"2","drill":true,"text":"（　　）は窓口へお願いします。  ","opts":["返却","取り置き","免許証","おそれ"]},{"t":"q","id":"3","drill":true,"text":"雨で中止になる（　　）があります。  ","opts":["おそれ","傷","一般","雑誌"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"よく調べた（　　）、決めます。  ","opts":["上で","上に","うちに","ついでに"]},{"t":"q","id":"5","drill":true,"text":"月曜（　　）、毎日開いています。  ","opts":["を除いて","を込めて","をはじめ","をもとに"]},{"t":"q","id":"6","drill":true,"text":"申し込みの（　　）、写真が必要です。  ","opts":["上で","上に","ついでに","わりに"]}]},{"key":"土曜","title":"読解通しテスト（50分）","blocks":[{"t":"passage","v":"<p>第12週。<b>50分</b>で13問です。今週は<b>設問を先に読んでから本文に入る</b>やり方を試してください。情報検索は必ず設問が先です。時間配分の目安：中文4分30秒／長文10分／情報検索6分。</p>"},{"t":"h2","v":"問題1　中文（3問）"},{"t":"passage","v":"<p>　電車で席をゆずろうとして、断られたことがある。相手は七十歳くらいの男性で、「大丈夫です」と笑った。私は顔が熱くなった。</p><p>　しばらく気にしていたが、あるとき、自分が重い荷物を持っていて、席をゆずられたことがあった。そのとき私も、「すぐ降りますので」と断った。断りながら、<b>うれしかった</b>のである。座りたくはない。でも、声をかけてもらえたことは、まったく別の話だった。</p><p>　断られることを、私は失敗だと思っていた。そうではない。声をかけた時点で、もう半分は届いている。残りの半分を受け取るかどうかは、相手が決めればいい。</p>"},{"t":"q","id":"問1","text":"席をゆずって断られたとき、筆者はどう感じたか。  ","opts":["腹が立った  ","はずかしかった  ","ほっとした  ","うれしかった"],"tag":"naiyou"},{"t":"q","id":"問2","text":"筆者が席をゆずられて断ったとき、どう感じたか。  ","opts":["めいわくだと思った  ","声をかけてもらえてうれしかった  ","早く降りたいと思った  ","何も感じなかった"],"tag":"naiyou"},{"t":"q","id":"問3","text":"筆者が最も言いたいことはどれか。  ","opts":["席はゆずらないほうがよい  ","声をかけた時点で半分は届いている  ","断る人は失礼だ  ","荷物は少ないほうがよい"],"tag":"shucho"},{"t":"h2","v":"問題2　中文（3問）"},{"t":"passage","v":"<p>　うちの職場では、毎年秋に大きな行事がある。準備の係を決めるとき、長い間、「やりたい人」を募っていた。しかし、手を挙げるのはいつも同じ三人だった。</p><p>　去年、係の決め方を変えた。「やりたい人」ではなく、<u>①「何ならできるか」を聞く</u>ことにしたのである。全体を仕切るのは無理でも、当日の受付ならできる。一時間だけならいられる。紙を印刷するだけならできる。そう答える人が、一気に増えた。</p><p>　「やりたい人」という聞き方は、実は<b>全部を引き受けられる人</b>を探していたのだ。募っても集まらないとき、足りないのはやる気ではなく、仕事の切り分けであることが多い。</p>"},{"t":"q","id":"問4","text":"以前の決め方では、どうなっていたか。  ","opts":["だれも参加しなかった  ","手を挙げるのはいつも同じ三人だった  ","全員が参加した  ","くじで決めていた"],"tag":"naiyou"},{"t":"q","id":"問5","text":"①「『何ならできるか』を聞く」に変えて、どうなったか。  ","opts":["答える人が一気に増えた  ","行事が中止になった  ","三人が辞めた  ","変わらなかった"],"tag":"naiyou"},{"t":"q","id":"問6","text":"筆者の考えに合うものはどれか。  ","opts":["人が集まらないのは、やる気がないからだ  ","人が集まらないとき、足りないのは仕事の切り分けであることが多い  ","係は三人で十分だ  ","行事はやめたほうがよい"],"tag":"shucho"},{"t":"h2","v":"問題3　長文（4問）"},{"t":"passage","v":"<p>　外国から来て働き始めた人に、最初の三か月で何がいちばん大変だったかを聞いたことがある。返ってきた答えは、言葉でも仕事でもなかった。「<u>①だれに聞けばいいのか分からないこと</u>」だという。</p><p>　職場には人がたくさんいる。親切な人も多い。それでも、この質問はこの人、あの手続きはあの人、という<b>地図</b>がない。地図がないまま、目の前の人に聞くと、「それは私じゃない」と言われる。何度か言われると、人は聞かなくなる。</p><p>　その話を聞いてから、私は新しく入る人に紙を一枚渡すようにした。写真はない。名前と、「この人に聞くこと」を一行だけ書いてある。②<u>正しさより、迷わないことを選んだ</u>。ほんとうは五人に関係する仕事でも、まず一人だけ書く。その人が違えば、その人が渡してくれる。</p><p>　半年で、質問の数が増えた。減ったのではない。増えたのだ。それまでは、分からないことをだまって持っていただけだった。</p><p>　人が育たないと言う前に、聞ける形になっているかを見たほうがいい。育つかどうかは、本人の力より、<b>最初の三か月の設計</b>で決まる部分が大きいと思う。</p>"},{"t":"q","id":"問7","text":"①「だれに聞けばいいのか分からないこと」とあるが、その原因はどれか。  ","opts":["職場に人が少ないから  ","親切な人がいないから  ","だれが何の担当かという地図がないから  ","言葉が通じないから"],"tag":"riyuu"},{"t":"q","id":"問8","text":"「それは私じゃない」と何度も言われると、人はどうなるか。  ","opts":["ほかの人に聞きに行く  ","聞かなくなる  ","怒る  ","仕事を辞める"],"tag":"naiyou"},{"t":"q","id":"問9","text":"②「正しさより、迷わないことを選んだ」とは、どういうことか。  ","opts":["関係する人を全員書いたということ  ","関係が五人でも、まず一人だけ書いたということ  ","紙を渡すのをやめたということ  ","写真をつけたということ"],"tag":"shiji"},{"t":"q","id":"問10","text":"筆者が最も言いたいことはどれか。  ","opts":["新しい人は自分で聞くべきだ  ","人が育つかどうかは、最初の三か月の設計で決まる部分が大きい  ","質問は少ないほうがよい  ","紙より写真のほうがよい"],"tag":"shucho"},{"t":"h2","v":"問題4　情報検索（3問）"},{"t":"passage","v":"<p><b>あおば市　日本語教室のご案内</b></p><table><thead><tr><th>教室</th><th>曜日・時間</th><th>レベル</th><th>費用</th><th>託児</th></tr></thead><tbody><tr><td>①　はじめの一歩</td><td>火 19:00〜20:30</td><td>初級</td><td>無料</td><td>なし</td></tr><tr><td>②　しごとの日本語</td><td>木 19:00〜20:30</td><td>中級</td><td>1回300円</td><td>なし</td></tr><tr><td>③　よみかき教室</td><td>土 10:00〜11:30</td><td>初級〜中級</td><td>無料</td><td>あり（予約制）</td></tr><tr><td>④　しけん対策（N3）</td><td>土 13:00〜15:00</td><td>中級以上</td><td>1回500円</td><td>なし</td></tr></tbody></table><p>◆申し込みは不要です。直接会場（市民センター）へお越しください。ただし、③の託児をご利用の方は、3日前までにお電話ください。</p><p>◆④は、過去の試験に近い問題を解いて解説を聞く教室です。中級以上が対象ですので、初めての方は②か③からお願いします。</p><p>◆③と④は同じ土曜ですが、時間が離れていますので、両方に出ることもできます。昼食は各自でお願いします。</p><p>◆祝日を除いて、毎週行っています。年末年始（12/28〜1/4）はお休みです。</p>"},{"t":"q","id":"問11","text":"土曜に、子どもを預けて午前と午後の両方に出たい人は、何をすればよいか。  ","opts":["申し込みは何も要らない  ","3日前までに電話して託児を予約する  ","④の費用を前もって払う  ","両方には出られないので一つ選ぶ"],"tag":"joken"},{"t":"q","id":"問12","text":"日本語を習うのが初めての人に合う教室はどれか。  ","opts":["①か③  ","②か④  ","④だけ  ","どれでもよい"],"tag":"joken"},{"t":"q","id":"問13","text":"この案内の内容に合うものはどれか。  ","opts":["すべての教室が無料である  ","祝日も毎週行っている  ","年末年始は休みである  ","申し込みが必要である"],"tag":"naiyou"}]},{"key":"日曜","title":"聴解30分 ＋ 復習30分","blocks":[{"t":"h2","v":"Part 1　聴解（20分・7問）"},{"t":"passage","v":"<p>注意：この紙には会話は書いてありません。音を聞いて答えます。会話は1回だけ流れます。今週の発話表現は<b>敬語の向き</b>がポイントです。自分がするのか、相手がするのかを聞き分けてください。</p>"},{"t":"h3","v":"問題1　課題理解（2問）"},{"t":"q","id":"問1","text":"","opts":["3階へ行く","検査を受ける","順番を待つ","受付でその旨を伝える"]},{"t":"q","id":"問2","text":"","opts":["保険証と印鑑","写真と印鑑","保険証と写真","印鑑だけ"]},{"t":"h3","v":"問題2　ポイント理解（2問）"},{"t":"q","id":"問3","text":"","opts":["数が少ないから","もう作り始めているから","担当者がいないから","値段が変わるから"]},{"t":"q","id":"問4","text":"","opts":["部屋がせまいこと","部屋が暗いこと","音がないこと","家賃が高いこと"]},{"t":"h3","v":"問題3　発話表現（3問）"},{"t":"q","id":"問5","text":"1　　2　　3","opts":["1","2","3"]},{"t":"q","id":"問6","text":"1　　2　　3","opts":["1","2","3"]},{"t":"q","id":"問7","text":"1　　2　　3","opts":["1","2","3"]},{"t":"h3","v":"聞き取りメモ欄"},{"t":"passage","v":"<p style=\"min-height:5em\">　</p>"},{"t":"h2","v":"Part 2　今週の復習テスト（20問）"},{"t":"h3","v":"A 語彙（10問）"},{"t":"q","id":"1","drill":true,"text":"費用は会社が（　　）します。  ","opts":["負担","受診","事前","結論"]},{"t":"q","id":"2","drill":true,"text":"希望の方は（　　）をお伝えください。  ","opts":["その旨","本社","朝食","館内"]},{"t":"q","id":"3","drill":true,"text":"ご注文を（　　）ました。  ","opts":["承り","納め","製造し","返却し"]},{"t":"q","id":"4","drill":true,"text":"（　　）から申し上げます。  ","opts":["結論","決まり","当社","冊数"]},{"t":"q","id":"5","drill":true,"text":"捨てるのは（　　）です。  ","opts":["もったいない
