。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"健康診断、そのまま3階へどうぞ。"},{"k":"line","sp":"男","v":"あの、健康相談も受けたいんですが。"},{"k":"line","sp":"女","v":"でしたら、先に受付でその旨をおっしゃってください。順番を入れますので。"},{"k":"line","sp":"男","v":"分かりました。"},{"k":"pause","s":8,"a":true}]},{"no":"問2","label":"女の人は何を持って行きますか","answer":"1　保険証と印鑑","why":"写真は「今回は要らない」と否定されている。","steps":[{"k":"q","v":"女の人は、何を持って行きますか。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"明日は保険証と印鑑をお願いします。"},{"k":"line","sp":"女","v":"写真も要りますか。"},{"k":"line","sp":"男","v":"今回は要りません。前回のものを使いますので。"},{"k":"line","sp":"女","v":"分かりました。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題2　ポイント理解","hint":"質問を聞いてから、問題用紙を見てください。読む時間があります。","items":[{"no":"問3","label":"変更を受けられない理由は何ですか","answer":"2　もう作り始めているから","why":"「数が少ない」「担当がいない」は否定されている。","steps":[{"k":"q","v":"変更を受けられない理由は、何ですか。"},{"k":"pause","s":3},{"k":"line","sp":"女","v":"数量の変更、お願いできませんか。"},{"k":"line","sp":"男","v":"申し訳ありません。数が少ないからではないんです。"},{"k":"line","sp":"女","v":"担当の方がいらっしゃらないとか。"},{"k":"line","sp":"男","v":"いえ。実はもう作り始めておりまして、製造に入ってからは変更を承っておりません。"},{"k":"pause","s":8,"a":true}]},{"no":"問4","label":"男の人は何が気になっていますか","answer":"3　音がないこと","why":"「せまい」「暗い」も出るが、最後に「静かすぎる」が中心。","steps":[{"k":"q","v":"男の人は、何が気になっていますか。"},{"k":"pause","s":3},{"k":"line","sp":"女","v":"新しい部屋、どうですか。せまくないですか。"},{"k":"line","sp":"男","v":"広さは十分です。"},{"k":"line","sp":"女","v":"暗いとか。"},{"k":"line","sp":"男","v":"いえ、明るいです。ただ、静かすぎて。帰っても音が何もないんですよ。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題3　発話表現","hint":"場面の説明を聞いて、そのときに何と言うか、1〜3から一つ選びます。","items":[{"no":"問5","label":"何と言いますか","answer":"2　少し早めに出ていただけますか","why":"相手に早く出てほしいときの、丁寧な頼み方。","steps":[{"k":"q","v":"明日、相手にいつもより早く来てほしいです。何と言いますか。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"1、少し早めに出てもよろしいですか。"},{"k":"line","sp":"女","v":"2、少し早めに出ていただけますか。"},{"k":"line","sp":"女","v":"3、少し早めに出させていただきます。"},{"k":"pause","s":8,"a":true}]},{"no":"問6","label":"何と言いますか","answer":"1　お手伝いしましょうか","why":"困っている人に手を貸すときの言い方。","steps":[{"k":"q","v":"重い荷物を持っている人がいます。何と言いますか。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"1、お手伝いしましょうか。"},{"k":"line","sp":"男","v":"2、お手伝いいたしましたか。"},{"k":"line","sp":"男","v":"3、お手伝いになりませんか。"},{"k":"pause","s":8,"a":true}]},{"no":"問7","label":"何と言いますか","answer":"3　あいにく、席をはずしております","why":"担当者が不在のときの、外の人への言い方。","steps":[{"k":"q","v":"電話で、担当者がいまいないことを伝えます。何と言いますか。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"1、あいにく、いらっしゃいません。"},{"k":"line","sp":"女","v":"2、あいにく、おられません。"},{"k":"line","sp":"女","v":"3、あいにく、席をはずしております。"},{"k":"pause","s":8,"a":true}]}]}]},"13":{"days":[{"key":"月曜","title":"短文読解 ── 防災訓練のお知らせを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>【全員参加】防災訓練を行います</b></p><p>11月20日（木）午後2時から、地震を想定した訓練を行います。放送が鳴りましたら、その場で身を低くし、<b>頭を守ってください</b>。そのあと、案内に従って第一駐車場へ出ます。</p><p>避難の際には、エレベーターを使わないようお願いします。止まってしまうおそれがあるためです。また、荷物は持たずに出てください。<u>①貴重品も同じです</u>。本番と同じ動きをすることが目的です。</p><p>訓練中も、来客の対応が必要な部署は残ってかまいません。その場合は、各部署で残る人を一人決めてください。あとで別の日に訓練を受けていただきます。</p><p>終わったあと、15分ほど集まって、気づいたことを出し合います。「うまくできなかったこと」を遠慮なく出していただけると助かります。</p><p>総務課</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"放送が鳴ったら、まず何をするか。  ","opts":["駐車場へ走る  ","その場で身を低くし、頭を守る  ","エレベーターに乗る  ","荷物をまとめる"],"tag":"joken"},{"t":"q","id":"問2","text":"①「貴重品も同じです」とは、どういうことか。  ","opts":["貴重品は持って出るということ  ","貴重品も持たずに出るということ  ","貴重品は預けるということ  ","貴重品は駐車場に置くということ"],"tag":"shiji"},{"t":"q","id":"問3","text":"このお知らせの内容に合うものはどれか。  ","opts":["来客対応で残った人は訓練を受けなくてよい  ","訓練のあと、気づいたことを出し合う  ","エレベーターを使ってもよい  ","参加は希望者だけである"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>防災</td><td>ぼうさい</td><td>災害を防ぐこと</td><td>penanggulangan bencana</td></tr><tr><td>2</td><td>訓練</td><td>くんれん</td><td>練習して身につけること</td><td>latihan / pelatihan</td></tr><tr><td>3</td><td>想定</td><td>そうてい</td><td>こうなると考えて決めること</td><td>asumsi / skenario</td></tr><tr><td>4</td><td>放送</td><td>ほうそう</td><td>建物内などの音声の知らせ</td><td>pengumuman / siaran</td></tr><tr><td>5</td><td>避難</td><td>ひなん</td><td>安全な場所へ逃げること</td><td>evakuasi</td></tr><tr><td>6</td><td>従う</td><td>したがう</td><td>言われたとおりにする</td><td>mengikuti</td></tr><tr><td>7</td><td>貴重品</td><td>きちょうひん</td><td>大切で高価なもの</td><td>barang berharga</td></tr><tr><td>8</td><td>来客</td><td>らいきゃく</td><td>たずねて来る客</td><td>tamu</td></tr><tr><td>9</td><td>対応</td><td>たいおう</td><td>相手に合わせて動くこと</td><td>penanganan / pelayanan</td></tr><tr><td>10</td><td>遠慮</td><td>えんりょ</td><td>ひかえめにすること</td><td>sungkan / segan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜際に（〜するとき。かたい言い方）（Pada saat ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形・た形 ＋ 際に</td><td>避難する<b>際に</b>は、走らないこと。</td></tr><tr><td>名詞 ＋ の 際に</td><td>ご利用<b>の際に</b>は、受付へ。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜とき」のかたい言い方です。案内・掲示でよく使われ、日常の小さなことには使いません。"},{"t":"p","v":"②〜ないよう（に）（〜しないように。お願い・注意）（Agar tidak ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ない形 ＋ よう（に）</td><td>使わ<b>ないよう</b>お願いします。</td></tr><tr><td>動詞辞書形 ＋ よう（に）</td><td>間に合う<b>ように</b>出ます。</td></tr></tbody></table>"},{"t":"p","v":"・「〜ないでください」より<b>かたく、丁寧</b>な言い方です。掲示では「〜ないようお願いいたします」の形でよく出ます。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"案内に（　　）てください。  ","opts":["従っ","想定し","避難し","遠慮し"]},{"t":"q","id":"2","drill":true,"text":"（　　）は持たずに出ます。  ","opts":["貴重品","来客","放送","訓練"]},{"t":"q","id":"3","drill":true,"text":"（　　）なくお申し出ください。  ","opts":["遠慮","対応","防災","想定"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"お帰りの（　　）、かぎをお返しください。  ","opts":["際に","間に","うちに","ほどに"]},{"t":"q","id":"5","drill":true,"text":"忘れ（　　）、メモをします。  ","opts":["ないように","ないので","ないために","ないうちに"]},{"t":"q","id":"6","drill":true,"text":"ろうかを走ら（　　）お願いします。  ","opts":["ないよう","ないでは","ずには","なくて"]}]},{"key":"火曜","title":"短文読解 ── アンケートのお願いを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>あて先：ご利用者ご家族の皆様<br>件名：サービスについてのアンケートのお願い</p><p>皆様</p><p>日ごろよりお世話になっております。みどりの家の山本でございます。</p><p>このたび、サービスの見直しを行うことになりました。つきましては、同封のアンケートにご記入くださいますようお願い申し上げます。所要時間は10分ほどです。</p><p>回収は11月末までです。同封の封筒に入れて郵便でお送りいただくか、受付の箱にお入れください。<u>①切手は必要ありません</u>。</p><p>お名前は書かなくてけっこうです。ただ、結果をお返しする際に分けて見たいと考えておりますので、ご利用の曜日だけお書きいただけますと助かります。</p><p>なお、前回のアンケートで「送迎の時間が分かりにくい」とのご意見を多くいただきました。こちらは4月から前日に電話でお知らせする形に改めております。</p><p>みどりの家　山本</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"このお知らせの一番の目的はどれか。  ","opts":["アンケートへの記入をお願いすること  ","送迎の時間を知らせること  ","料金の変更を伝えること  ","行事に招くこと"],"tag":"shucho"},{"t":"q","id":"問2","text":"①「切手は必要ありません」とあるが、それはなぜだと考えられるか。  ","opts":["受付の箱に入れるから  ","同封の封筒に切手が要らない仕組みだから  ","郵便が無料だから  ","家族が持って来るから"],"tag":"riyuu"},{"t":"q","id":"問3","text":"アンケートに書いてほしいと言われているものはどれか。  ","opts":["名前  ","利用している曜日  ","住所  ","電話番号"],"tag":"joken"},{"t":"q","id":"問4","text":"このお知らせの内容に合うものはどれか。  ","opts":["送迎の時間は前日に電話で知らせている  ","アンケートは12月末まで受け付ける  ","名前は必ず書く  ","アンケートは30分かかる"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>見直し</td><td>みなおし</td><td>もう一度見て考え直すこと</td><td>peninjauan ulang</td></tr><tr><td>2</td><td>同封</td><td>どうふう</td><td>いっしょに入れること</td><td>dilampirkan (dalam amplop)</td></tr><tr><td>3</td><td>所要時間</td><td>しょようじかん</td><td>かかる時間</td><td>waktu yang diperlukan</td></tr><tr><td>4</td><td>回収</td><td>かいしゅう</td><td>集めて戻すこと</td><td>pengumpulan kembali</td></tr><tr><td>5</td><td>封筒</td><td>ふうとう</td><td>手紙を入れる紙の袋</td><td>amplop</td></tr><tr><td>6</td><td>切手</td><td>きって</td><td>郵便に貼る券</td><td>perangko</td></tr><tr><td>7</td><td>結果</td><td>けっか</td><td>終わって出たもの</td><td>hasil</td></tr><tr><td>8</td><td>送迎</td><td>そうげい</td><td>送り迎えすること</td><td>antar-jemput</td></tr><tr><td>9</td><td>改める</td><td>あらためる</td><td>よいほうに変える</td><td>memperbaiki / mengubah</td></tr><tr><td>10</td><td>意見</td><td>いけん</td><td>考え。言い分</td><td>pendapat</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜ますようお願い申し上げます（ていねいな依頼）（Permohonan yang sangat sopan）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ ますよう</td><td>ご記入ください<b>ますよう</b>お願い申し上げます。</td></tr><tr><td>〜ますようお願いいたします</td><td>ご了承ください<b>ますよう</b>お願いいたします。</td></tr></tbody></table>"},{"t":"passage","v":"注意：文書の決まり文句です。「〜てください」より<b>ずっと丁寧</b>で、案内文の最後によく置かれます。"},{"t":"p","v":"②〜とのこと（〜だそうだ。人から聞いた話）（Katanya ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ とのこと</td><td>分かりにくい<b>とのこと</b>でした。</td></tr><tr><td>〜とのことです（伝える）</td><td>明日は休み<b>とのことです</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「〜そうです（伝聞）」のかたい言い方。メールや報告で使います。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"アンケートを（　　）します。  ","opts":["回収","同封","送迎","見直し"]},{"t":"q","id":"2","drill":true,"text":"（　　）の封筒をお使いください。  ","opts":["同封","回収","所要","改め"]},{"t":"q","id":"3","drill":true,"text":"やり方を（　　）ました。  ","opts":["改め","回収し","同封し","送迎し"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"ご協力ください（　　）お願い申し上げます。  ","opts":["ますよう","ますので","ますから","ますのに"]},{"t":"q","id":"5","drill":true,"text":"部長は明日出張（　　）です。  ","opts":["とのこと","ということ","とのもの","というもの"]},{"t":"q","id":"6","drill":true,"text":"工事は来月終わる（　　）でした。  ","opts":["とのこと","とのもの","ということに","というところ"]}]},{"key":"水曜","title":"中文読解 ── エッセイを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　祖母から、年に二回、手紙が届く。正月と、私の誕生日である。内容はほとんど同じで、体に気をつけなさい、とだけ書いてある。</p><p>　去年から、字がふるえるようになった。一行の長さもそろわない。読みにくいと思いながらも、<u>①私はその手紙を捨てられない</u>。同じ言葉なのに、去年の字と今年の字は、まったく別のことを伝えてくる。</p><p>　電話をすれば、声はいつもどおりである。元気そうに笑う。だから、電話だけでは分からない。<b>手紙は、書くのにかかった時間が残る</b>。ふるえた線の一本一本が、何分かかったかを見せてしまう。</p><p>　便利なものは、時間を消してくれる。それはありがたい。けれども、②<u>消えた時間の分だけ、伝わらなくなるもの</u>もある。私は祖母に返事を書く。パソコンでは打ちきれない何かを、こちらも残したいからだ。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"祖母の手紙は、去年からどう変わったか。  ","opts":["長くなった  ","字がふるえ、行の長さもそろわなくなった  ","内容が変わった  ","来なくなった"],"tag":"naiyou"},{"t":"q","id":"問2","text":"①「私はその手紙を捨てられない」のはなぜか。  ","opts":["内容が大切だから  ","字から、電話では分からないことが伝わってくるから  ","記念になるから  ","祖母に見せるから"],"tag":"riyuu"},{"t":"q","id":"問3","text":"電話について、筆者はどう述べているか。  ","opts":["声で体の様子がよく分かる  ","声はいつもどおりで、分からない  ","電話はかけないほうがよい  ","電話のほうが手紙よりよい"],"tag":"naiyou"},{"t":"q","id":"問4","text":"②「消えた時間の分だけ、伝わらなくなるもの」とは、どういうことか。  ","opts":["速く作れるものほど、そこにかかった時間が見えなくなるということ  ","時間がたつと忘れるということ  ","便利な道具は高いということ  ","手紙は遅いということ"],"tag":"shiji"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>祖母</td><td>そぼ</td><td>父や母の母</td><td>nenek</td></tr><tr><td>2</td><td>届く</td><td>とどく</td><td>着く</td><td>sampai / tiba</td></tr><tr><td>3</td><td>内容</td><td>ないよう</td><td>中身</td><td>isi</td></tr><tr><td>4</td><td>ふるえる</td><td>ふるえる</td><td>細かく動く</td><td>gemetar</td></tr><tr><td>5</td><td>そろう</td><td>そろう</td><td>同じになる。整う</td><td>seragam / lengkap</td></tr><tr><td>6</td><td>伝える</td><td>つたえる</td><td>知らせる</td><td>menyampaikan</td></tr><tr><td>7</td><td>一本一本</td><td>いっぽんいっぽん</td><td>ひとつずつ</td><td>satu per satu (batang)</td></tr><tr><td>8</td><td>ありがたい</td><td>ありがたい</td><td>感謝したい</td><td>patut disyukuri</td></tr><tr><td>9</td><td>返事</td><td>へんじ</td><td>答え</td><td>balasan / jawaban</td></tr><tr><td>10</td><td>残す</td><td>のこす</td><td>あとに残るようにする</td><td>menyisakan / meninggalkan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜ながらも（〜のに。逆の結果）（Meskipun ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ ながらも</td><td>読みにくいと思い<b>ながらも</b>、捨てられない。</td></tr><tr><td>い形容詞・名詞 ＋ ながらも</td><td>狭い<b>ながらも</b>、住みやすい家。</td></tr></tbody></table>"},{"t":"passage","v":"注意：同時に二つのことをする「〜ながら」とはちがい、<b>「〜のに」という逆の意味</b>です。前と後ろが合わないときに使います。"},{"t":"p","v":"②〜きれない（最後まで〜できない）（Tidak sanggup ~ sampai habis）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ます形 ＋ きれない</td><td>打ち<b>きれない</b>ものがある。</td></tr><tr><td>動詞ます形 ＋ きる（最後まで）</td><td>全部読み<b>きった</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「きる」＝最後までやりきる、「きれない」＝多すぎて・難しくて最後までできない。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"手が（　　）て字が書けない。  ","opts":["ふるえ","そろっ","届い","残し"]},{"t":"q","id":"2","drill":true,"text":"手紙が（　　）ました。  ","opts":["届き","そろい","伝え","残り"]},{"t":"q","id":"3","drill":true,"text":"助けていただき（　　）です。  ","opts":["ありがたい","そろう","返事","内容"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"悪いと知り（　　）、やめられない。  ","opts":["ながらも","ながらに","つつも思い","ばかりに"]},{"t":"q","id":"5","drill":true,"text":"量が多くて食べ（　　）。  ","opts":["きれない","きらない","きれる","かねる"]},{"t":"q","id":"6","drill":true,"text":"長い本をやっと読み（　　）。  ","opts":["きった","きれた","かけた","だした"]}]},{"key":"木曜","title":"中文読解 ── 意見文を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　「経験が長い人は強い」と言われる。たしかに、同じ場面を何度も見てきた人は、判断が速い。</p><p>　ただ、速さは正しさとはちがう。経験とは、<b>過去に起きたことの記録</b>にすぎない。前の職場でうまくいったやり方が、今の職場でも合うとは限らない。それなのに、経験の長い人ほど、<u>①「前はこうだった」で話を終わらせてしまう</u>ことがある。</p><p>　私の職場に、二十年働いている先輩がいる。その人は、新しい人が別のやり方を出すと、必ず一度は試す。「私のときはこうだったけど、今は条件がちがうから」と言って。経験が長いだけに、何がちがうのかを説明できる。②<u>経験は、止める材料にも、比べる材料にもなる</u>。どちらに使うかは、本人が決めている。</p><p>　私はまだ経験が浅い。だから今のうちに決めておきたい。十年後、自分の経験を<b>比べるほうに使う</b>と。経験は自然に財産になるのではない。使い方を選んで、はじめて財産になる。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"経験について、筆者はどう述べているか。  ","opts":["判断が速くなるが、速さは正しさとはちがう  ","経験は役に立たない  ","経験が長いほど正しい  ","経験は短いほうがよい"],"tag":"shucho"},{"t":"q","id":"問2","text":"①「『前はこうだった』で話を終わらせてしまう」のは、どんな人か。  ","opts":["新しく入った人  ","経験の長い人  ","若い人  ","外から来た人"],"tag":"naiyou"},{"t":"q","id":"問3","text":"先輩は、新しい人が別のやり方を出したとき、どうするか。  ","opts":["必ず一度は試す  ","断る  ","自分のやり方に直させる  ","何も言わない"],"tag":"naiyou"},{"t":"q","id":"問4","text":"②「経験は、止める材料にも、比べる材料にもなる」とは、どういうことか。  ","opts":["経験が多いほど強いということ  ","同じ経験でも、新しい案を止めるためにも、ちがいを見るためにも使えるということ  ","経験は人によって長さがちがうということ  ","経験は記録しておくべきだということ"],"tag":"shiji"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>経験</td><td>けいけん</td><td>実際にしてきたこと</td><td>pengalaman</td></tr><tr><td>2</td><td>場面</td><td>ばめん</td><td>その場のようす</td><td>situasi / adegan</td></tr><tr><td>3</td><td>判断</td><td>はんだん</td><td>考えて決めること</td><td>penilaian / keputusan</td></tr><tr><td>4</td><td>記録</td><td>きろく</td><td>書いて残したもの</td><td>catatan</td></tr><tr><td>5</td><td>条件</td><td>じょうけん</td><td>そうなるためのきまり</td><td>kondisi / syarat</td></tr><tr><td>6</td><td>試す</td><td>ためす</td><td>やってみる</td><td>mencoba</td></tr><tr><td>7</td><td>材料</td><td>ざいりょう</td><td>もとになるもの</td><td>bahan</td></tr><tr><td>8</td><td>浅い</td><td>あさい</td><td>深くない。少ない</td><td>dangkal / sedikit</td></tr><tr><td>9</td><td>財産</td><td>ざいさん</td><td>価値のあるもち物</td><td>harta / aset</td></tr><tr><td>10</td><td>自然に</td><td>しぜんに</td><td>ひとりでに</td><td>dengan sendirinya</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜にすぎない（ただ〜だけだ）（Tidak lebih dari ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ にすぎない</td><td>記録<b>にすぎない</b>。</td></tr><tr><td>普通形 ＋ にすぎない</td><td>思い出しただけ<b>にすぎない</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：<b>それ以上ではない、と価値を下げる</b>言い方です。「〜だけだ」より書きことば的です。"},{"t":"p","v":"②〜だけに（〜だから、いっそう）（Justru karena ~, maka ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ だけに</td><td>経験が長い<b>だけに</b>、説明できる。</td></tr><tr><td>名詞 ＋ だけに</td><td>専門家<b>だけに</b>、話がくわしい。</td></tr></tbody></table>"},{"t":"p","v":"・理由を表しますが、<b>「そういう立場だから、ふつう以上に」</b>という気持ちが入ります。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"新しい方法を（　　）てみる。  ","opts":["試し","浅く","判断し","残し"]},{"t":"q","id":"2","drill":true,"text":"まだ経験が（　　）です。  ","opts":["浅い","自然な","材料の","記録の"]},{"t":"q","id":"3","drill":true,"text":"そこで（　　）を求められた。  ","opts":["判断","場面","財産","条件"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"それは言いわけ（　　）。  ","opts":["にすぎない","にほかない","に限らない","にすぎる"]},{"t":"q","id":"5","drill":true,"text":"長く住んでいる（　　）、道にくわしい。  ","opts":["だけに","だけで","ばかりに","うえに"]},{"t":"q","id":"6","drill":true,"text":"私は手伝った（　　）です。  ","opts":["にすぎない","だけに","ばかりに","ながらも"]}]},{"key":"金曜","title":"情報検索 ── 引っ越しの手続きを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>きた市　引っ越しのときの手続き</b></p><table><thead><tr><th>手続き</th><th>いつ</th><th>場所</th><th>持ち物</th></tr></thead><tbody><tr><td>ア　転出届（市外へ出る）</td><td>引っ越しの14日前〜当日</td><td>きた市役所</td><td>本人確認書類</td></tr><tr><td>イ　転入届（市外から入る）</td><td>引っ越してから14日以内</td><td>きた市役所</td><td>本人確認書類・転出証明書</td></tr><tr><td>ウ　転居届（市内で移る）</td><td>引っ越してから14日以内</td><td>きた市役所</td><td>本人確認書類</td></tr><tr><td>エ　水道の開始・停止</td><td>3日前まで</td><td>電話・インターネット</td><td>―</td></tr></tbody></table><p>◆本人確認書類とは、免許証・在留カード・パスポートなどです。保険証だけでは<b>足りません</b>。もう一つ、住所の分かるものが必要です。</p><p>◆窓口は平日8時30分〜17時ですが、毎月第2日曜の午前中も開いています。この日は転入・転出・転居に限らず、ほとんどの手続きができます。ただし、混み合いますのでお時間に余裕をもってお越しください。</p><p>◆代理の方でも手続きできますが、委任状が必要です。様式は市のホームページにあります。同じ世帯のご家族であれば、委任状は要りません。</p><p>◆手続きは無料です。ただし、証明書を出す場合は1通300円かかります。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"市外から引っ越してきた人が、市役所に持って行くものはどれか。  ","opts":["本人確認書類だけ  ","本人確認書類と転出証明書  ","委任状だけ  ","保険証だけ"],"tag":"joken"},{"t":"q","id":"問2","text":"平日に市役所へ行けない人ができることはどれか。  ","opts":["何もできない  ","毎月第2日曜の午前中に行く  ","電話で手続きする  ","14日を過ぎてから行く"],"tag":"joken"},{"t":"q","id":"問3","text":"この案内の内容に合うものはどれか。  ","opts":["同じ世帯の家族が来るときも委任状が要る  ","手続きそのものは無料である  ","保険証だけで手続きできる  ","水道は当日に連絡すればよい"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>手続き</td><td>てつづき</td><td>必要な事務のやり方</td><td>prosedur / pengurusan</td></tr><tr><td>2</td><td>転出</td><td>てんしゅつ</td><td>その市から出ること</td><td>pindah keluar</td></tr><tr><td>3</td><td>転入</td><td>てんにゅう</td><td>その市に入ること</td><td>pindah masuk</td></tr><tr><td>4</td><td>以内</td><td>いない</td><td>その範囲の中</td><td>dalam (batas)</td></tr><tr><td>5</td><td>本人確認</td><td>ほんにんかくにん</td><td>その人だと確かめること</td><td>verifikasi identitas</td></tr><tr><td>6</td><td>在留カード</td><td>ざいりゅうカード</td><td>在留資格を示すカード</td><td>kartu izin tinggal</td></tr><tr><td>7</td><td>余裕</td><td>よゆう</td><td>ゆとり。あまり</td><td>kelonggaran / waktu lebih</td></tr><tr><td>8</td><td>代理</td><td>だいり</td><td>本人のかわり</td><td>perwakilan</td></tr><tr><td>9</td><td>委任状</td><td>いにんじょう</td><td>たのんだことを書いた書類</td><td>surat kuasa</td></tr><tr><td>10</td><td>世帯</td><td>せたい</td><td>いっしょに住む家族の単位</td><td>rumah tangga</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目）"},{"t":"p","v":"①〜に限らず（〜だけでなく、ほかも）（Tidak hanya ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞 ＋ に限らず</td><td>転入<b>に限らず</b>、ほとんどの手続きができます。</td></tr><tr><td>名詞 ＋ に限らない</td><td>この店だけ<b>に限らない</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「〜に限り」（〜だけ）と<b>正反対</b>です。「限り」＝限定、「限らず」＝限定しない。一字ちがいなので、試験でよく問われます。"},{"t":"p","v":"②〜ものの（〜けれども）（Meskipun ~, tetapi）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ ものの</td><td>申し込んだ<b>ものの</b>、行けなかった。</td></tr><tr><td>い形容詞・な形容詞な ＋ ものの</td><td>便利な<b>ものの</b>、高い。</td></tr></tbody></table>"},{"t":"p","v":"・「〜が」「〜けれども」のかたい言い方。<b>思ったとおりにならなかった</b>ときによく使います。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"14日（　　）に届け出ます。  ","opts":["以内","以上","余裕","代理"]},{"t":"q","id":"2","drill":true,"text":"（　　）の方は委任状が必要です。  ","opts":["代理","世帯","転入","手続き"]},{"t":"q","id":"3","drill":true,"text":"時間に（　　）をもって出ます。  ","opts":["余裕","以内","世帯","転出"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"子ども（　　）、大人も楽しめます。  ","opts":["に限らず","に限り","に限って","に応じて"]},{"t":"q","id":"5","drill":true,"text":"買った（　　）、一度も使っていない。  ","opts":["ものの","もので","ものだから","ものなら"]},{"t":"q","id":"6","drill":true,"text":"本日（　　）、半額です。  ","opts":["に限り","に限らず","に限って","に限る"]}]},{"key":"土曜","title":"読解通しテスト（50分）","blocks":[{"t":"passage","v":"<p>第13週。<b>50分</b>で13問です。本番が近づきました。今週は<b>時計を見るのは3回だけ</b>と決めて解いてください（中文が終わったとき・長文が終わったとき・残り10分）。時間配分の目安：中文4分30秒／長文10分／情報検索6分。</p>"},{"t":"h2","v":"問題1　中文（3問）"},{"t":"passage","v":"<p>　道具をなくす人と、なくさない人がいる。そう思っていたが、職場を見ていて、別の分け方があると気づいた。<b>戻す場所が決まっている職場</b>と、そうでない職場である。</p><p>　決まっている職場では、だれがなくすかは関係がない。使い終わった人が同じ場所に戻す。それだけで、次の人は探さずに済む。決まっていない職場では、ていねいな人が毎回ていねいに探すことになる。</p><p>　人の性格を直すのは難しい。けれども、場所を決めるのは一日で終わる。直せないほうを直そうとして、直せるほうを放っておく。それが、いちばん時間のかかるやり方だと思う。</p>"},{"t":"q","id":"問1","text":"筆者が気づいた「別の分け方」とはどれか。  ","opts":["なくす人となくさない人  ","戻す場所が決まっている職場とそうでない職場  ","忙しい職場とひまな職場  ","広い職場とせまい職場"],"tag":"naiyou"},{"t":"q","id":"問2","text":"場所が決まっていない職場では、どうなるか。  ","opts":["道具が増える  ","ていねいな人が毎回探すことになる  ","だれも探さない  ","道具を買い足す"],"tag":"naiyou"},{"t":"q","id":"問3","text":"筆者が最も言いたいことはどれか。  ","opts":["人の性格を直すべきだ  ","直せるほうを先に直すほうが早い  ","道具は一人一つずつ持つべきだ  ","ていねいな人を増やすべきだ"],"tag":"shucho"},{"t":"h2","v":"問題2　中文（3問）"},{"t":"passage","v":"<p>　初めて日本語で電話を取った日のことを、よく覚えている。相手の名前が聞き取れず、三回も聞き返した。受話器を置いたあと、手がふるえていた。</p><p>　そのとき、先輩が言った。「三回聞けたのがすごい」。<u>①私はほめられている意味が分からなかった</u>。聞き返したのは、分からなかったからだ。失敗ではないのか。</p><p>　今なら分かる。多くの人は、二回目で分かったふりをする。分かったふりのほうが、その場は楽だからだ。そして、名前をまちがえて伝える。三回聞くのは、<b>その場の気まずさより、あとの正しさを選ぶこと</b>である。先輩がほめたのは、日本語ではなく、その選び方だった。</p>"},{"t":"q","id":"問4","text":"初めて電話を取ったとき、筆者はどうしたか。  ","opts":["何も言えなかった  ","三回聞き返した  ","電話を切った  ","先輩に代わった"],"tag":"naiyou"},{"t":"q","id":"問5","text":"①「私はほめられている意味が分からなかった」のはなぜか。  ","opts":["先輩の日本語が難しかったから  ","聞き返したのは失敗だと思っていたから  ","先輩が怒っていたから  ","日本語が分からなかったから"],"tag":"riyuu"},{"t":"q","id":"問6","text":"先輩がほめたのは何か。  ","opts":["筆者の日本語の上手さ  ","気まずさよりあとの正しさを選んだこと  ","電話を早く取ったこと  ","声が大きかったこと"],"tag":"shucho"},{"t":"h2","v":"問題3　長文（4問）"},{"t":"passage","v":"<p>　ある会社が、会議を短くしようとして、「発言は一人一分まで」という規則を作った。会議は確かに短くなった。しかし半年後、やり直しの仕事が増えた。</p><p>　調べてみると、一分では「気になっていること」が言えないのだという。結論は一分で言える。けれども、<u>①「うまく言えないが、何か引っかかる」</u>は、一分では形にならない。そして、あとで問題になるのは、たいていそちらのほうだった。</p><p>　会社は規則を変えた。「一人一分」はやめ、かわりに会議の最後の五分を<b>「まだ言葉になっていないこと」の時間</b>にした。結論を出す時間ではない。ただ、気になっていることを言っておくだけの時間である。</p><p>　会議は少し長くなった。それでも、やり直しは減った。合計の時間で見れば、短くなっている。②<u>会議だけを見ていたから、会議だけが短くなったのだ</u>。</p><p>　速くするというのは、どこを見るかを決めることでもある。目の前の一つを縮めれば、その先で伸びる。それを何度もくり返して、私たちはようやく、「全体で見る」ということを覚えた。</p>"},{"t":"q","id":"問7","text":"「発言は一人一分まで」という規則を作った結果、どうなったか。  ","opts":["会議は短くなったが、やり直しの仕事が増えた  ","会議も仕事も減った  ","会議が長くなった  ","何も変わらなかった"],"tag":"naiyou"},{"t":"q","id":"問8","text":"①「うまく言えないが、何か引っかかる」について、本文はどう述べているか。  ","opts":["一分あれば十分に言える  ","一分では形にならないが、あとで問題になるのはそちらが多い  ","言う必要がない  ","結論より短く言える"],"tag":"naiyou"},{"t":"q","id":"問9","text":"②「会議だけを見ていたから、会議だけが短くなったのだ」とは、どういうことか。  ","opts":["会議を見るのをやめたということ  ","一部だけを短くしても、全体では短くならなかったということ  ","会議が一番大事だということ  ","会議を長くするべきだということ"],"tag":"shiji"},{"t":"q","id":"問10","text":"筆者が最も言いたいことはどれか。  ","opts":["会議は短いほうがよい  ","速くするには、全体で見て、どこを見るかを決める必要がある  ","規則は作らないほうがよい  ","発言は長いほうがよい"],"tag":"shucho"},{"t":"h2","v":"問題4　情報検索（3問）"},{"t":"passage","v":"<p><b>みなと市　資格取得の受講料補助のご案内</b></p><table><thead><tr><th>区分</th><th>対象</th><th>補助の額</th><th>申請の時期</th></tr></thead><tbody><tr><td>ア　介護の入門研修</td><td>市内で働く方</td><td>全額</td><td>受講の前</td></tr><tr><td>イ　国家資格の受験対策講座</td><td>市内で働く方</td><td>半額（上限3万円）</td><td>受講の後</td></tr><tr><td>ウ　日本語の講座</td><td>市内に住む外国籍の方</td><td>全額</td><td>受講の前</td></tr><tr><td>エ　パソコン講座</td><td>市内に住む方</td><td>半額（上限1万円）</td><td>受講の後</td></tr></tbody></table><p>◆アとウは、受講の前に申請してください。<b>受けたあとの申請は受け付けられません</b>。</p><p>◆イとエは、修了証と領収書を添えて、講座が終わってから1か月以内に申請してください。</p><p>◆同じ年度内に受けられるのは、ア〜エのうち<b>二つまで</b>です。ただし、ウは回数に数えません。</p><p>◆申請は市役所の窓口のみです。郵送・インターネットでは受け付けておりません。</p>"},{"t":"q","id":"問11","text":"市内で働く外国籍の人が、日本語の講座と国家資格の受験対策講座を受けた場合、同じ年度にあと何回この補助を使えるか。  ","opts":["0回  ","1回  ","2回  ","制限はない"],"tag":"joken"},{"t":"q","id":"問12","text":"パソコン講座の補助を受けたい人が、申請のときに持って行くものはどれか。  ","opts":["修了証と領収書  ","受講の申込書  ","在留カードだけ  ","何も要らない"],"tag":"joken"},{"t":"q","id":"問13","text":"この案内の内容に合うものはどれか。  ","opts":["申請はインターネットでもできる  ","介護の入門研修は受けたあとで申請する  ","国家資格の講座は3万円をこえて補助されない  ","日本語の講座は半額の補助である"],"tag":"naiyou"}]},{"key":"日曜","title":"聴解30分 ＋ 復習30分","blocks":[{"t":"h2","v":"Part 1　聴解（20分・7問）"},{"t":"passage","v":"<p>注意：この紙には会話は書いてありません。音を聞いて答えます。会話は1回だけ流れます。今週のポイント理解は、<b>一度言った日にちや理由が言い直される</b>形です。最初の言葉で決めないでください。</p>"},{"t":"h3","v" 題用紙を見てください。読む時間があります。","items":[{"no":"問3","label":"アンケートはいつまでですか","answer":"3　11月30日","why":"「今月いっぱい」と言い直されている。","steps":[{"k":"q","v":"アンケートは、いつまでですか。"},{"k":"pause","s":3},{"k":"line","sp":"男","v":"アンケート、たしか15日まででしたね。"},{"k":"line","sp":"女","v":"いえ、のびました。今月いっぱいです。"},{"k":"line","sp":"男","v":"今月というと、11月30日ですね。"},{"k":"line","sp":"女","v":"はい、そうです。"},{"k":"pause","s":8,"a":true}]},{"no":"問4","label":"女の人が手紙を送る理由は何ですか","answer":"4　書くのにかかった時間が伝わるから","why":"「安い」「速い」は否定されている。","steps":[{"k":"q","v":"女の人が手紙を送る理由は、何ですか。"},{"k":"pause","s":3},{"k":"line","sp":"男","v":"今どき手紙ですか。メールのほうが速いのに。"},{"k":"line","sp":"女","v":"速さでは負けます。"},{"k":"line","sp":"男","v":"安いから、ですか。"},{"k":"line","sp":"女","v":"いいえ。書くのに時間がかかるでしょう。その時間が、そのまま相手に届くんです。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題3　即時応答","hint":"短い文を聞いて、1〜3から合う返事を選びます。","items":[{"no":"問5","label":"返事を選ぶ","answer":"2　はい、承知しました。すぐ手配します","why":"指示を受けたときの答え方。","steps":[{"k":"line","sp":"女","v":"この件、今日中にお願いできますか。"},{"k":"line","sp":"男","v":"1、はい、お願いしました。"},{"k":"line","sp":"男","v":"2、はい、承知しました。すぐ手配します。"},{"k":"line","sp":"男","v":"3、いいえ、今日中です。"},{"k":"pause","s":8,"a":true}]},{"no":"問6","label":"返事を選ぶ","answer":"1　いえ、こちらの確認不足でした","why":"相手がわびたときに、自分にも非があると返す言い方。","steps":[{"k":"line","sp":"男","v":"こちらの説明が足りず、申し訳ありませんでした。"},{"k":"line","sp":"女","v":"1、いえ、こちらの確認不足でした。"},{"k":"line","sp":"女","v":"2、はい、説明が足りませんでした。"},{"k":"line","sp":"女","v":"3、いえ、申し上げました。"},{"k":"pause","s":8,"a":true}]},{"no":"問7","label":"返事を選ぶ","answer":"3　ええ、思ったほどではありませんでした","why":"「大変でしたか」に対し、そうでもなかったと答える形。","steps":[{"k":"line","sp":"女","v":"昨日の作業、大変だったでしょう。"},{"k":"line","sp":"男","v":"1、ええ、大変になります。"},{"k":"line","sp":"男","v":"2、いいえ、大変でした。"},{"k":"line","sp":"男","v":"3、ええ、思ったほどではありませんでした。"},{"k":"pause","s":8,"a":true}]}]}]},"14":{"days":[{"key":"月曜","title":"短文読解 ── 年末年始の勤務のお知らせを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>【お知らせ】年末年始の勤務について</b></p><p>12月29日から1月3日までは、人数を減らして動きます。通常より少ない体制になりますので、事故が起きないように、手順を一つずつ確かめながら進めてください。</p><p>この期間に出る方には、手当がつきます。希望の日は、12月10日までに用紙で出してください。<u>①希望が重なった場合は、話し合って決めます</u>。こちらで勝手に決めることはありません。</p><p>買い物の店は、31日から3日まで休みだそうです。食べ物は<b>28日までに</b>そろえておいてください。なお、休みの間も、急な用があれば事務所の電話は通じます。</p><p>年始のあいさつのために早く来る必要はありません。いつもどおりの時間で結構です。</p><p>みどりの家　事務所</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"この期間の勤務について、正しいものはどれか。  ","opts":["いつもより人数が多い  ","いつもより人数が少ない  ","全員が休みになる  ","人数は変わらない"],"tag":"naiyou"},{"t":"q","id":"問2","text":"①「希望が重なった場合」は、どうなるか。  ","opts":["事務所が決める  ","話し合って決める  ","早い者勝ちになる  ","くじで決める"],"tag":"shiji"},{"t":"q","id":"問3","text":"このお知らせの内容に合うものはどれか。  ","opts":["食べ物は28日までにそろえておく  ","年始は早く来てあいさつする  ","休みの間は電話が通じない  ","手当はつかない"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>勤務</td><td>きんむ</td><td>仕事をすること</td><td>tugas kerja</td></tr><tr><td>2</td><td>通常</td><td>つうじょう</td><td>ふつう</td><td>biasanya</td></tr><tr><td>3</td><td>体制</td><td>たいせい</td><td>人や組織の構え</td><td>sistem / formasi</td></tr><tr><td>4</td><td>手順</td><td>てじゅん</td><td>することの順序</td><td>prosedur</td></tr><tr><td>5</td><td>期間</td><td>きかん</td><td>いつからいつまで</td><td>periode</td></tr><tr><td>6</td><td>手当</td><td>てあて</td><td>決まった給料のほかに出るお金</td><td>tunjangan</td></tr><tr><td>7</td><td>重なる</td><td>かさなる</td><td>同じところに二つ以上あう</td><td>bertumpuk / bertabrakan</td></tr><tr><td>8</td><td>勝手に</td><td>かってに</td><td>自分だけの考えで</td><td>seenaknya</td></tr><tr><td>9</td><td>そろえる</td><td>そろえる</td><td>必要なものを用意する</td><td>melengkapi</td></tr><tr><td>10</td><td>通じる</td><td>つうじる</td><td>つながる。伝わる</td><td>tersambung / dimengerti</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目・まぎらわしい形の整理）"},{"t":"p","v":"①〜ために／〜ように（目的）（Untuk ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>意志のある動詞（辞書形）＋ ために</td><td>あいさつする<b>ために</b>早く来る。</td></tr><tr><td>意志のない形（可能・ない形・自動詞）＋ ように</td><td>事故が起き<b>ないように</b>確かめる。</td></tr></tbody></table>"},{"t":"passage","v":"注意：<b>自分が「する」ことなら「ために」</b>、<b>「そうなる／ならない」ことなら「ように」</b>。「聞こえるように」「わすれないように」は「ように」です。"},{"t":"p","v":"②〜そうだ（伝聞）／〜そうだ（様態）（Katanya ~ / Kelihatannya ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ そうだ（人から聞いた）</td><td>休み<b>だそうです</b>。</td></tr><tr><td>動詞ます形・形容詞語幹 ＋ そうだ（見た感じ）</td><td>降り<b>そうです</b>／おいし<b>そうです</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「雨が降るそうだ」＝聞いた話。「雨が降りそうだ」＝空を見て思う。<b>る／り の一字</b>で意味が変わります。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"（　　）より少ない人数です。  ","opts":["通常","体制","期間","手当"]},{"t":"q","id":"2","drill":true,"text":"休みの希望が（　　）ました。  ","opts":["重なり","そろえ","通じ","勝手に"]},{"t":"q","id":"3","drill":true,"text":"必要な物を（　　）ておく。  ","opts":["そろえ","重なっ","通じ","勤務し"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"忘れ（　　）、メモをします。  ","opts":["ないように","ないために","ないので","なくて"]},{"t":"q","id":"5","drill":true,"text":"資格を取る（　　）、勉強しています。  ","opts":["ために","ように","ようで","ためか"]},{"t":"q","id":"6","drill":true,"text":"天気予報では、明日は雨だ（　　）。  ","opts":["そうです","そうでした","ようです","らしさです"]}]},{"key":"火曜","title":"短文読解 ── 試験当日の案内メールを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>あて先：受験するみなさん<br>件名：12月7日（日）試験当日について</p><p>みなさん</p><p>受験票が届いたころだと思います。当日のことをまとめます。</p><p>集合は、会場の入り口に9時30分です。受験票に書いてある時刻より30分早いですが、道に迷う人がいるかもしれないので、早めに集まります。<u>①遅れそうな場合は、会場へ直接向かってください</u>。待ちませんので、連絡だけ入れてください。</p><p>持ち物は、受験票・在留カード・鉛筆・消しゴム・時計です。<b>音の出る時計は使えないはず</b>ですので、普通の腕時計にしてください。携帯電話は、電源を切ってかばんの中に入れておきます。</p><p>昼食は各自で用意してください。会場の近くの店は混むようです。朝のうちに買っておくほうが安全です。</p><p>終わったあと、同じ場所に集まる予定でしたが、解散する時刻がばらばらになるため、やめました。終わった人から帰ってかまいません。</p><p>みどりの家　山本</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"集合が9時30分になっているのはなぜか。  ","opts":["試験が9時30分に始まるから  ","道に迷う人がいるかもしれないから  ","受験票を配るから  ","昼食を買うから"],"tag":"riyuu"},{"t":"q","id":"問2","text":"①「遅れそうな場合」、どうすればよいか。  ","opts":["集合場所へ急ぐ  ","会場へ直接向かい、連絡を入れる  ","試験をあきらめる  ","山本さんを待つ"],"tag":"joken"},{"t":"q","id":"問3","text":"持って行ってはいけないものはどれか。  ","opts":["在留カード  ","音の出る時計  ","消しゴム  ","受験票"],"tag":"joken"},{"t":"q","id":"問4","text":"このメールの内容に合うものはどれか。  ","opts":["試験のあと、全員でもう一度集まる  ","昼食は会場で配られる  ","終わった人から帰ってよい  ","携帯電話は持って行けない"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>受験票</td><td>じゅけんひょう</td><td>試験を受けるための券</td><td>kartu ujian</td></tr><tr><td>2</td><td>集合</td><td>しゅうごう</td><td>集まること</td><td>berkumpul</td></tr><tr><td>3</td><td>会場</td><td>かいじょう</td><td>行う場所</td><td>tempat acara/ujian</td></tr><tr><td>4</td><td>時刻</td><td>じこく</td><td>時の一点</td><td>waktu (jam berapa)</td></tr><tr><td>5</td><td>迷う</td><td>まよう</td><td>どうすればよいか分からない。道が分からない</td><td>tersesat / ragu</td></tr><tr><td>6</td><td>直接</td><td>ちょくせつ</td><td>間に何も入れないで</td><td>langsung</td></tr><tr><td>7</td><td>電源</td><td>でんげん</td><td>電気の元</td><td>daya / power</td></tr><tr><td>8</td><td>各自</td><td>かくじ</td><td>それぞれの人</td><td>masing-masing</td></tr><tr><td>9</td><td>解散</td><td>かいさん</td><td>集まりを終えて別れること</td><td>bubar</td></tr><tr><td>10</td><td>ばらばら</td><td>ばらばら</td><td>そろっていないようす</td><td>tidak seragam / berbeda-beda</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目・まぎらわしい形の整理）"},{"t":"p","v":"①〜らしい／〜ようだ／〜みたいだ（推量）（Sepertinya ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ らしい（外から聞いた感じ）</td><td>店は混む<b>らしい</b>。</td></tr><tr><td>普通形 ＋ ようだ（自分で見て思う）</td><td>混む<b>ようだ</b>。</td></tr></tbody></table>"},{"t":"passage","v":"注意：「らしい」は<b>人の話や様子から</b>、「ようだ」は<b>自分が見て感じたこと</b>。「みたいだ」は「ようだ」の話しことばです。"},{"t":"p","v":"②〜はずだ／〜べきだ（当然の予想／すべきこと）（Seharusnya ~ / Sebaiknya harus ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>普通形 ＋ はずだ（そうなる予想）</td><td>使えない<b>はずです</b>。</td></tr><tr><td>動詞辞書形 ＋ べきだ（そうするのが正しい）</td><td>早く出る<b>べきだ</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「はず」＝<b>そうなると思う</b>、「べき」＝<b>そうするのが正しい</b>。意味がまったくちがいます。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"昼食は（　　）でご用意ください。  ","opts":["各自","直接","解散","電源"]},{"t":"q","id":"2","drill":true,"text":"携帯の（　　）を切ります。  ","opts":["電源","時刻","会場","集合"]},{"t":"q","id":"3","drill":true,"text":"終わったら（　　）します。  ","opts":["解散","集合","受験","迷い"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"あの人はもう帰った（　　）です。  ","opts":["はず","べき","ため","よう気"]},{"t":"q","id":"5","drill":true,"text":"約束は守る（　　）だ。  ","opts":["べき","はず","よう","そう"]},{"t":"q","id":"6","drill":true,"text":"話によると、来月から値上げ（　　）。  ","opts":["らしい","そうな","ような","べきだ"]}]},{"key":"水曜","title":"中文読解 ── エッセイを読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　大事な日の朝は、手が冷たくなる。若いころは、それを弱さだと思っていた。落ち着いている人はうらやましく、自分は向いていないのだと感じた。</p><p>　あるとき、長く舞台に立っている人に聞いてみた。その人は「三十年、毎回同じですよ」と笑った。<u>①慣れないんですか</u>、と重ねて聞くと、こう言った。「慣れたら、たぶん下手になります」。</p><p>　緊張は、<b>大事だと思っている証拠</b>である。なくすものではなく、連れていくものだ。その人は、本番の前に必ず同じ順番で道具を並べるという。手が冷たいままでもできることを、いくつか決めてある。②<u>体が覚えている動きが、心を連れ戻す</u>のだそうだ。</p><p>　私も、前の日にかばんの中身を並べておくようになった。朝、順番に入れるだけでよい。手はやはり冷たい。それでも、かばんは閉まる。閉まれば、出かけられる。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"若いころ、筆者は手が冷たくなることをどう考えていたか。  ","opts":["体が弱いのだと思っていた  ","自分の弱さで、向いていないのだと感じていた  ","だれにでもあることだと思っていた  ","よいことだと思っていた"],"tag":"naiyou"},{"t":"q","id":"問2","text":"①「慣れないんですか」に対する答えはどれか。  ","opts":["慣れました  ","慣れたら、たぶん下手になります  ","慣れる方法があります  ","人によります"],"tag":"naiyou"},{"t":"q","id":"問3","text":"②「体が覚えている動きが、心を連れ戻す」とは、どういうことか。  ","opts":["運動をすると落ち着くということ  ","いつもと同じ手順を行うことで、気持ちが戻ってくるということ  ","道具を新しくするとよいということ  ","体をきたえるべきだということ"],"tag":"shiji"},{"t":"q","id":"問4","text":"筆者が最も言いたいことはどれか。  ","opts":["緊張はなくすべきだ  ","緊張はなくすものではなく、決めた手順とともに連れていくものだ  ","大事な日は休むべきだ  ","慣れることが一番だ"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>うらやましい</td><td>うらやましい</td><td>人がよく見えて、そうなりたい</td><td>iri (ingin seperti itu)</td></tr><tr><td>2</td><td>向く</td><td>むく</td><td>合っている</td><td>cocok</td></tr><tr><td>3</td><td>舞台</td><td>ぶたい</td><td>演じる場所</td><td>panggung</td></tr><tr><td>4</td><td>重ねて</td><td>かさねて</td><td>もう一度</td><td>sekali lagi</td></tr><tr><td>5</td><td>緊張</td><td>きんちょう</td><td>気持ちが張りつめること</td><td>ketegangan / gugup</td></tr><tr><td>6</td><td>証拠</td><td>しょうこ</td><td>そうだと示すもの</td><td>bukti</td></tr><tr><td>7</td><td>本番</td><td>ほんばん</td><td>練習ではない、その場</td><td>pertunjukan sebenarnya / hari H</td></tr><tr><td>8</td><td>並べる</td><td>ならべる</td><td>順に置く</td><td>menata / menjajarkan</td></tr><tr><td>9</td><td>中身</td><td>なかみ</td><td>中に入っているもの</td><td>isi</td></tr><tr><td>10</td><td>連れる</td><td>つれる</td><td>いっしょに行く</td><td>membawa serta</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目・まぎらわしい形の整理）"},{"t":"p","v":"①〜と／〜ば／〜たら／〜なら（条件）（Kalau ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>〜と（必ずそうなる）</td><td>押す<b>と</b>、開きます。</td></tr><tr><td>〜たら（一回きり・したあと）</td><td>終わっ<b>たら</b>、帰ります。</td></tr></tbody></table>"},{"t":"passage","v":"注意：<b>「と」は自然にそうなること</b>（機械・道順）。<b>「なら」は相手の話を受けて</b>（「行くなら、地図を持って」）。後ろに「〜てください」が来るとき、「と」は使えません。"},{"t":"p","v":"②〜てある／〜ている（他動詞と自動詞）（Sudah di- / Sedang ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>他動詞て形 ＋ ある（だれかがして、その状態）</td><td>決め<b>てあります</b>。</td></tr><tr><td>自動詞て形 ＋ いる（そうなっている状態）</td><td>ドアが開い<b>ています</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「窓が開けてある」＝人が開けた。「窓が開いている」＝開いた状態。<b>だれかの意図があるかどうか</b>がちがいます。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"（　　）して声がふるえた。  ","opts":["緊張","証拠","舞台","中身"]},{"t":"q","id":"2","drill":true,"text":"かばんの（　　）を出す。  ","opts":["中身","本番","舞台","証拠"]},{"t":"q","id":"3","drill":true,"text":"この仕事は私に（　　）ています。  ","opts":["向い","連れ","重ね","並べ"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"このボタンを押す（　　）、水が出ます。  ","opts":["と","なら","たら困る","ばよい"]},{"t":"q","id":"5","drill":true,"text":"京都へ行く（　　）、この店がいいですよ。  ","opts":["なら","と","ては","ようで"]},{"t":"q","id":"6","drill":true,"text":"かべに紙が（　　）あります。  ","opts":["はって","はいって","はり","はられて"]}]},{"key":"木曜","title":"中文読解 ── 意見文を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p>　試験の点数は、その人の力を表している。そう言われることが多い。私は、半分だけそのとおりだと思う。</p><p>　点数が表しているのは、<b>「その日、その形式で、答えられたこと」</b>である。同じ人でも、体調がちがえば変わる。形式が変われば、もっと変わる。<u>①点数は、力そのものではなく、力の一つの写真だ</u>。写真は、写した角度によって見え方が変わる。</p><p>　だからといって、点数に意味がないわけではない。角度が決まっているからこそ、前と後ろを比べられる。同じ角度で二回撮れば、変化が見える。<b>点数の値打ちは、高さより、差にある</b>。</p><p>　落ちた人に「実力はある」と言うのは、なぐさめとしては正しい。けれども、それだけでは次につながらない。②<u>知りたいのは、どこで落としたかである</u>。読解か、聴解か。時間が足りなかったのか、意味が取れなかったのか。そこまで見て、はじめて点数は使える。</p><p>　点数を見て落ち込むのは、点数を全体だと思っているからだ。一枚の写真だと思えば、次はどこから撮るかを考えられる。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"①「点数は、力そのものではなく、力の一つの写真だ」とは、どういうことか。  ","opts":["点数は美しいということ  ","点数はある日・ある形式から見た一面にすぎないということ  ","点数は残しておくべきだということ  ","点数は毎回同じだということ"],"tag":"shiji"},{"t":"q","id":"問2","text":"筆者は、点数の値打ちはどこにあると述べているか。  ","opts":["高さ  ","差  ","回数  ","速さ"],"tag":"shucho"},{"t":"q","id":"問3","text":"②「知りたいのは、どこで落としたかである」とあるが、その例として挙げられていないものはどれか。  ","opts":["読解か聴解か  ","時間が足りなかったのか  ","意味が取れなかったのか  ","会場が遠かったのか"],"tag":"naiyou"},{"t":"q","id":"問4","text":"筆者が最も言いたいことはどれか。  ","opts":["点数は気にしなくてよい  ","点数を一枚の写真だと思えば、次にどこから撮るかを考えられる  ","点数は高いほうがよい  ","試験は受けないほうがよい"],"tag":"shucho"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>表す</td><td>あらわす</td><td>示す</td><td>menunjukkan</td></tr><tr><td>2</td><td>形式</td><td>けいしき</td><td>形・やり方</td><td>format / bentuk</td></tr><tr><td>3</td><td>体調</td><td>たいちょう</td><td>体の具合</td><td>kondisi badan</td></tr><tr><td>4</td><td>角度</td><td>かくど</td><td>見る方向</td><td>sudut</td></tr><tr><td>5</td><td>比べる</td><td>くらべる</td><td>ちがいを見る</td><td>membandingkan</td></tr><tr><td>6</td><td>変化</td><td>へんか</td><td>変わること</td><td>perubahan</td></tr><tr><td>7</td><td>値打ち</td><td>ねうち</td><td>価値</td><td>nilai</td></tr><tr><td>8</td><td>なぐさめ</td><td>なぐさめ</td><td>気持ちを楽にする言葉</td><td>penghiburan</td></tr><tr><td>9</td><td>落ち込む</td><td>おちこむ</td><td>気持ちが沈む</td><td>murung / terpuruk</td></tr><tr><td>10</td><td>全体</td><td>ぜんたい</td><td>すべて</td><td>keseluruhan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目・まぎらわしい形の整理）"},{"t":"p","v":"①〜ないで／〜なくて（〜しないで／〜ないので）（Tanpa ~ / Karena tidak ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞ない形 ＋ で（そうしないで、次をする）</td><td>見<b>ないで</b>答える。</td></tr><tr><td>動詞ない形 ＋ なくて（理由）</td><td>分から<b>なくて</b>、こまった。</td></tr></tbody></table>"},{"t":"passage","v":"注意：<b>後ろが「動作」なら「ないで」</b>、<b>後ろが「気持ち・結果」なら「なくて」</b>。「行かないで待つ」／「来なくて心配した」。"},{"t":"p","v":"②〜つもりだ／〜予定だ（意志／決まっている計画）（Berniat ~ / Dijadwalkan ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ つもりだ（自分の意志）</td><td>受ける<b>つもりです</b>。</td></tr><tr><td>動詞辞書形・名詞の ＋ 予定だ（決まった計画）</td><td>12月7日<b>の予定です</b>。</td></tr></tbody></table>"},{"t":"p","v":"・「つもり」は<b>自分の気持ち</b>、「予定」は<b>すでに決まっていること</b>。会社や行事の話には「予定」を使います。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"去年と（　　）てみましょう。  ","opts":["比べ","表し","落ち込ん","なぐさめ"]},{"t":"q","id":"2","drill":true,"text":"今日は（　　）がよくない。  ","opts":["体調","角度","形式","値打ち"]},{"t":"q","id":"3","drill":true,"text":"点が下がって（　　）でいる。  ","opts":["落ち込ん","比べ","表し","変化し"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"朝ごはんを食べ（　　）出かけた。  ","opts":["ないで","なくて","ずにも","ないでは"]},{"t":"q","id":"5","drill":true,"text":"バスが来（　　）、遅れました。  ","opts":["なくて","ないで","ずに","ないと"]},{"t":"q","id":"6","drill":true,"text":"式は3時に始まる（　　）です。  ","opts":["予定","つもり","はず気","ため"]}]},{"key":"金曜","title":"情報検索 ── 試験会場の案内を読む","blocks":[{"t":"h2","v":"本文"},{"t":"passage","v":"<p><b>日本語の試験　会場のご案内</b>（さくら大学　東キャンパス）</p><table><thead><tr><th>級</th><th>教室</th><th>入室</th><th>開始</th><th>終わり（予定）</th></tr></thead><tbody><tr><td>ア　N1</td><td>1号館 201</td><td>12:15</td><td>12:30</td><td>15:25</td></tr><tr><td>イ　N2</td><td>1号館 305</td><td>12:15</td><td>12:30</td><td>15:10</td></tr><tr><td>ウ　N3</td><td>2号館 104</td><td>12:15</td><td>12:30</td><td>15:05</td></tr><tr><td>エ　N4・N5</td><td>2号館 202</td><td>9:45</td><td>10:00</td><td>12:00</td></tr></tbody></table><p>◆入室の時刻を過ぎても、<b>開始から30分以内</b>であれば入れます。それより遅れると受けられません。遅れそうなときは、会場へ着いてから係員にお申し出ください。</p><p>◆昼休みのうちに食事を済ませてください。構内の食堂は日曜のため閉まっています。2号館1階に自動販売機がありますが、飲み物のみです。</p><p>◆かばんは足元に置き、机の上には受験票・筆記用具・時計だけを出してください。時計は<b>音の出ないもの</b>に限ります。</p><p>◆駐車場はありません。自転車は東門の内側に置いてください。西門は日曜、閉まっています。</p><p>◆試験中に気分が悪くなった場合は、手を挙げてください。別室で休んでいただけますが、<b>時間の延長はありません</b>。</p>"},{"t":"h2","v":"設問"},{"t":"q","id":"問1","text":"N3を受ける人が12時50分に会場に着いた場合、どうなるか。  ","opts":["受けられない  ","係員に申し出れば入れる  ","翌日に受ける  ","別室で受ける"],"tag":"joken"},{"t":"q","id":"問2","text":"自転車で来る人は、どこに置けばよいか。  ","opts":["駐車場  ","東門の内側  ","西門の外  ","2号館の前"],"tag":"joken"},{"t":"q","id":"問3","text":"この案内の内容に合うものはどれか。  ","opts":["構内の食堂で昼食が買える  ","気分が悪くなったら時間をのばしてもらえる  ","机の上に出せるのは受験票・筆記用具・時計だけである  ","時計は音が出てもよい"],"tag":"naiyou"},{"t":"h2","v":"本文から拾う語彙（10語）"},{"t":"table","v":"<table><thead><tr><th></th><th>語</th><th>読み</th><th>意味</th><th>Bahasa Indonesia</th></tr></thead><tbody><tr><td>1</td><td>会場</td><td>かいじょう</td><td>行う場所</td><td>tempat ujian</td></tr><tr><td>2</td><td>入室</td><td>にゅうしつ</td><td>部屋に入ること</td><td>masuk ruangan</td></tr><tr><td>3</td><td>係員</td><td>かかりいん</td><td>その仕事の担当者</td><td>petugas</td></tr><tr><td>4</td><td>済ませる</td><td>すませる</td><td>終わらせる</td><td>menyelesaikan</td></tr><tr><td>5</td><td>構内</td><td>こうない</td><td>敷地の中</td><td>dalam area kampus</td></tr><tr><td>6</td><td>自動販売機</td><td>じどうはんばいき</td><td>機械で売る売り場</td><td>mesin penjual otomatis</td></tr><tr><td>7</td><td>足元</td><td>あしもと</td><td>足のあたり</td><td>dekat kaki</td></tr><tr><td>8</td><td>筆記用具</td><td>ひっきようぐ</td><td>鉛筆・消しゴムなど</td><td>alat tulis</td></tr><tr><td>9</td><td>別室</td><td>べっしつ</td><td>別の部屋</td><td>ruang lain</td></tr><tr><td>10</td><td>延長</td><td>えんちょう</td><td>時間などをのばすこと</td><td>perpanjangan</td></tr></tbody></table>"},{"t":"h2","v":"文法（2項目・まぎらわしい形の整理）"},{"t":"p","v":"①〜うちに／〜あいだに（〜の状態が続く間に）（Selagi ~ / Selama ~）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>名詞の・動詞辞書形 ＋ うちに</td><td>昼休みの<b>うちに</b>済ませる。</td></tr><tr><td>名詞の・動詞ている ＋ あいだに</td><td>留守の<b>あいだに</b>来た。</td></tr></tbody></table>"},{"t":"passage","v":"注意：<b>「うちに」は「その状態が終わる前に」</b>という気持ち（＝あとでは遅い）。「あいだに」は<b>ただ時間の幅</b>を表します。"},{"t":"p","v":"②〜こと／〜の（動詞を名詞にする）（Mengubah kata kerja jadi benda）"},{"t":"table","v":"<table><thead><tr><th>接続</th><th>例</th></tr></thead><tbody><tr><td>動詞辞書形 ＋ こと</td><td>受ける<b>こと</b>が決まった。</td></tr><tr><td>動詞辞書形 ＋ の（見る・聞く・待つの前）</td><td>人が来る<b>の</b>を待つ。</td></tr></tbody></table>"},{"t":"p","v":"・「見る・聞く・待つ・手伝う」の前は「の」。「決める・できる・約束する」の前は「こと」。"},{"t":"h2","v":"確認ドリル（6問）"},{"t":"p","v":"A 語彙（3問）"},{"t":"q","id":"1","drill":true,"text":"食事を（　　）ておきます。  ","opts":["済ませ","延長し","入室し","置い"]},{"t":"q","id":"2","drill":true,"text":"かばんは（　　）に置きます。  ","opts":["足元","別室","構内","会場"]},{"t":"q","id":"3","drill":true,"text":"（　　）にお聞きください。  ","opts":["係員","別室","延長","入室"]},{"t":"p","v":"B 文法（3問）"},{"t":"q","id":"4","drill":true,"text":"明るい（　　）に帰りましょう。  ","opts":["うち","あいだ","ころ","ため"]},{"t":"q","id":"5","drill":true,"text":"子どもが遊んでいる（　　）に、掃除をした。  ","opts":["あいだ","うち","ながら","ばかり"]},{"t":"q","id":"6","drill":true,"text":"彼が来る（　　）を待っている。  ","opts":["の","こと","もの","ところ"]}]},{"key":"土曜","title":"読解通しテスト（50分・本番と同じ形）","blocks":[{"t":"passage","v":"<p>最終週です。<b>50分</b>で13問。本番と同じ順（中文→中文→長文→情報検索）で並んでいます。これまでどおり、<b>時間配分の紙を先に作ってから</b>始めてください。目安：中文4分30秒／長文10分／情報検索6分。分からない問題は印をつけて次へ。最後に戻ります。</p>"},{"t":"h2","v":"問題1　中文（3問）"},{"t":"passage","v":"<p>　同じ道を毎日通っていると、季節が変わったことに気づかない日がある。ある朝、木の下に葉が積もっていて、はじめて秋だと思った。</p><p>　毎日見ているのに、なぜ気づかなかったのか。少しずつ変わるものは、<b>変わっていないように見える</b>からだ。一日の差は小さすぎて、目に入らない。そして、ある量をこえた日に、突然「変わった」と感じる。</p><p>　人の上達も、たぶん同じである。毎日やっている人ほど、自分がうまくなったことに気づかない。気づくのは、たいてい他人か、ずっと前の自分の記録である。伸びていないと感じる日は、伸びていない日ではなく、<b>差が小さすぎて見えない日</b>なのだと思う。</p>"},{"t":"q","id":"問1","text":"筆者が秋だと思ったのは、何を見たときか。  ","opts":["木の下に葉が積もっているのを見たとき  ","雨が降ったとき  ","人が上着を着たとき  ","日が短くなったとき"],"tag":"naiyou"},{"t":"q","id":"問2","text":"少しずつ変わるものに気づかないのはなぜか。  ","opts":["見ていないから  ","一日の差が小さすぎて目に入らないから  ","興味がないから  ","忙しいから"],"tag":"riyuu"},{"t":"q","id":"問3","text":"筆者が最も言いたいことはどれか。  ","opts":["毎日同じ道を通るべきだ  ","伸びていないと感じる日は、差が小さすぎて見えない日である  ","上達は他人が決めるものだ  ","記録は残さないほうがよい"],"tag":"shucho"},{"t":"h2","v":"問題2　中文（3問）"},{"t":"passage","v":"<p>　試験の前になると、「何をやればいいですか」と聞かれる。以前は、足りないところを探して答えていた。今はちがう。<u>①「もう増やさないでください」</u>と言う。</p><p>　直前に新しい教材を開くと、知らないものばかりが目につく。当たり前である。新しいのだから。そして、「こんなに知らない」と思って、今までやってきたことまで信じられなくなる。</p><p>　直前にすることは、<b>増やすことではなく、取り出しやすくすること</b>だ。一度やった問題をもう一度解く。書いたメモを見返す。同じものを二回目に見ると、一回目より速く出てくる。その速さが、当日の点になる。</p>"},{"t":"q","id":"問4","text":"①「もう増やさないでください」とあるが、何を増やさないのか。  ","opts":["勉強の時間  ","新しい教材や知識  ","受ける試験の数  ","休みの日"],"tag":"shiji"},{"t":"q","id":"問5","text":"直前に新しい教材を開くと、どうなると筆者は述べているか。  ","opts":["自信がつく  ","今までやってきたことまで信じられなくなる  ","点が上がる  ","時間が余る"],"tag":"naiyou"},{"t":"q","id":"問6","text":"筆者は、直前に何をすればよいと考えているか。  ","opts":["新しい問題を解く  ","一度やった問題やメモを見返して、取り出しやすくする  ","休む  ","人に教える"],"tag":"shucho"},{"t":"h2","v":"問題3　長文（4問）"},{"t":"passage","v":"<p>　うちの施設に、五年前から働いている外国出身の職員がいる。来たばかりのころ、その人は記録が書けなかった。話すのは問題ない。けれども、紙に書こうとすると手が止まる。</p><p>　原因は、日本語の力ではなかった。<u>①「どこまで書けばいいのか」が分からなかった</u>のである。見たことを全部書けば長すぎる。短くすれば足りない。その線が、どこにあるのか。それは、教科書には書いていない。</p><p>　そこで、先輩たちが書いた記録を十本並べて見せた。説明はしない。ただ、「この十本は、どれも合格です」とだけ言った。二週間後、その人の記録は見分けがつかなくなった。</p><p>　言葉で説明できることは、実は少ない。②<u>「これくらい」という感覚は、例を並べたときにだけ渡せる</u>。一本では分からない。二本でも足りない。十本あって、はじめて<b>幅</b>が見える。幅が見えれば、人は自分でその中に入ってくる。</p><p>　教えるというのは、正解を渡すことだと思われがちである。私は、幅を渡すことだと思っている。正解は一つしかないが、幅の中にはその人のやり方が入る余地がある。</p>"},{"t":"q","id":"問7","text":"①「どこまで書けばいいのか」が分からなかったとあるが、その原因は何か。  ","opts":["日本語の力が足りなかったこと  ","書く量の線が教科書に書いていないこと  ","時間がなかったこと  ","パソコンが使えなかったこと"],"tag":"riyuu"},{"t":"q","id":"問8","text":"先輩たちがしたことはどれか。  ","opts":["書き方を細かく説明した  ","合格した記録を十本並べて見せた  ","毎日いっしょに書いた  ","日本語の授業をした"],"tag":"naiyou"},{"t":"q","id":"問9","text":"②「『これくらい』という感覚は、例を並べたときにだけ渡せる」とは、どういうことか。  ","opts":["例を一つ見せれば伝わるということ  ","複数の例を並べてはじめて、どの範囲ならよいかが伝わるということ  ","感覚は伝わらないということ  ","例より説明のほうがよいということ"],"tag":"shiji"},{"t":"q","id":"問10","text":"筆者が最も言いたいことはどれか。  ","opts":["教えるとは、正解を渡すことだ  ","教えるとは、幅を渡すことだ  ","記録は短いほうがよい  ","外国出身の職員には教えにくい"],"tag":"shucho"},{"t":"h2","v":"問題4　情報検索（3問）"},{"t":"passage","v":"<p><b>ひかり市　試験の日の交通のご案内</b>（12月7日・日曜）</p><table><thead><tr><th>経路</th><th>所要時間</th><th>本数</th><th>料金</th><th>会場までの徒歩</th></tr></thead><tbody><tr><td>ア　市営バス 3番</td><td>25分</td><td>1時間に2本</td><td>230円</td><td>3分</td></tr><tr><td>イ　電車＋徒歩</td><td>18分</td><td>1時間に6本</td><td>190円</td><td>12分</td></tr><tr><td>ウ　電車＋バス</td><td>28分</td><td>1時間に4本</td><td>360円</td><td>1分</td></tr><tr><td>エ　自転車</td><td>35分</td><td>―</td><td>無料</td><td>―</td></tr></tbody></table><p>◆日曜は、アの市営バスが<b>朝10時より前は動きません</b>。午前の試験を受ける方はお使いになれません。</p><p>◆イの電車は本数が多いのですが、駅から会場まで坂が続きます。雨の日は時間に余裕をもってください。</p><p>◆ウは乗り換えが1回あります。乗り換えの時間は所要時間に入っています。</p><p>◆自転車は東門の内側に置けます。駐車場はありませんので、自動車ではお越しにならないでください。</p>"},{"t":"q","id":"問11","text":"午前10時に始まる試験を受ける人が使えない経路はどれか。  ","opts":["ア  ","イ  ","ウ  ","エ"],"tag":"joken"},{"t":"q","id":"問12","text":"雨の日に、歩く時間をできるだけ短くしたい人に合う経路はどれか。  ","opts":["ア  ","イ  ","ウ  ","エ"],"tag":"joken"},{"t":"q","id":"問13","text":"この案内の内容に合うものはどれか。  ","opts":["自動車で来てもよい  ","ウの所要時間には乗り換えの時間が入っている  ","イは坂がなく歩きやすい  ","エは料金が230円かかる"],"tag":"naiyou"}]},{"key":"日曜","title":"聴解30分 ＋ 総復習30分","blocks":[{"t":"h2","v":"Part 1　聴解（20分・7問）"},{"t":"passage","v":"<p>注意：この紙には会話は書いてありません。音を聞いて答えます。会話は1回だけ流れます。最終週は<b>5形式すべて</b>を通します（課題理解・ポイント理解・概要理解・発話表現・即時応答）。本番と同じ順です。</p>"},{"t":"h3","v":"問題1　課題理解（2問）"},{"t":"q","id":"問1","text":"","opts":["西門から入る","東門から入る","駐車場に止める","2号館の前に置く"]},{"t":"q","id":"問2","text":"","opts":["食堂で食べる","教室で食べる","自動販売機で買って飲む","朝買ったものを教室の外で食べる"]},{"t":"h3","v":"問題2　ポイント理解（2問）"},{"t":"q","id":"問3","text":"","opts":["受験票","在留カード","音の出る時計","消しゴム"]},{"t":"q","id":"問4","text":"","opts":["見直しをすること","最後まで解ききること","速く解くこと","字をていねいに書くこと"]},{"t":"h3","v":"問題3　概要理解（1問）"},{"t":"q","id":"問5","text":"","opts":["語彙の増やし方","体調の整え方","時間の配り方","答案の書き方"]},{"t":"h3","v":"問題4　発話表現（1問）"},{"t":"q","id":"問6","text":"1　　2　　3","opts":["1","2","3"]},{"t":"h3","v":"問題5　即時応答（1問）"},{"t":"q","id":"問7","text":"1　　2　　3","opts":["1","2","3"]},{"t":"h3","v":"聞き取りメモ欄"},{"t":"passage","v":"<p style=\"min-height:5em\">　</p>"},{"t":"h2","v":"Part 2　総復習テスト（20問）"},{"t":"passage","v":"<p>今週は、<b>まぎらわしい形</b>を集めました。一字のちがいで意味が変わるものばかりです。間違えたところは、その日の文法表に戻って確かめてください。</p>"},{"t":"h3","v":"A 語彙（10問）"},{"t":"q","id":"1","drill":true,"text":"（　　）より少ない人数です。  ","opts":["通常","体制","期間","時刻"]},{"t":"q","id":"2","drill":true,"text":"休みの希望が（　　）ました。  ","opts":["重なり","そろえ","通じ","比べ"]},{"t":"q","id":"3","drill":true,"text":"昼食は（　　）でご用意ください。  ","opts":["各自","直接","解散","別室"]},{"t":"q","id":"4","drill":true,"text":"携帯の（　　）を切ります。  ","opts":["電源","時刻","会場","角度"]},{"t":"q","id":"5","drill":true,"text":"（　　）して声がふるえた。  ","opts":["緊張","証拠","舞台","変化"]},{"t":"q","id":"6","drill":true,"text":"この仕事は私に（　　）ています。  ","opts":["向い","連れ","重ね","並べ"]},{"t":"q","id":"7","drill":true,"text":"去年と（　　）てみましょう。  ","opts":["比べ","表し","落ち込ん","済ませ"]},{"t":"q","id":"8","drill":true,"text":"今日は（　　）がよくない。  ","opts":["体調","角度","形式","値打ち"]},{"t":"q","id":"9","drill":true,"text":"食事を（　　）ておきます。  ","opts":["済ませ","延長し","入室し","重なっ"]},{"t":"q","id":"10","drill":true,"text":"かばんは（　　）に置きます。  ","opts":["足元","別室","構内","全体"]},{"t":"h3","v":"B 文法（10問）"},{"t":"q","id":"11","drill":true,"text":"忘れ（　　）、メモをします。  ","opts":["ないように","ないために","ないので","なくて"]},{"t":"q","id":"12","drill":true,"text":"資格を取る（　　）、勉強しています。  ","opts":["ために","ように","ようで","ためか"]},{"t":"q","id":"13","drill":true,"text":"天気予報では、明日は雨だ（　　）。  ","opts":["そうです","そうでした","ようでした","らしさです"]},{"t":"q","id":"14","drill":true,"text":"あの人はもう帰った（　　）です。  ","opts":["はず","べき","ため","よう気"]},{"t":"q","id":"15","drill":true,"text":"約束は守る（　　）だ。  ","opts":["べき","はず","よう","そう"]},{"t":"q","id":"16","drill":true,"text":"このボタンを押す（　　）、水が出ます。  ","opts":["と","なら","たら困る","ばよい"]},{"t":"q","id":"17","drill":true,"text":"かべに紙が（　　）あります。  ","opts":["はって","はいって","はり","はられて"]},{"t":"q","id":"18","drill":true,"text":"バスが来（　　）、遅れました。  ","opts":["なくて","ないで","ずに","ないと"]},{"t":"q","id":"19","drill":true,"text":"式は3時に始まる（　　）です。  ","opts":["予定","つもり","はず気","ため"]},{"t":"q","id":"20","drill":true,"text":"明るい（　　）に帰りましょう。  ","opts":["うち","あいだ","ころ","ため"]}]}],"answers":{"月曜":{"問1":[2,"「人数を減らして動きます。通常より少ない体制になります」。"],"問2":[2,"「希望が重なった場合は、話し合って決めます。こちらで勝手に決めることはありません」。"],"問3":[1,"「食べ物は28日までにそろえておいてください」。年始は早く来る必要がなく、電話は通じ、手当はつきます。"],"d1":[1,""],"d2":[1,""],"d3":[1,""],"d4":[1,""],"d5":[1,""],"d6":[1,""]},"火曜":{"問1":[2,"「道に迷う人がいるかもしれないので、早めに集まります」。"],"問2":[2,"「会場へ直接向かってください。待ちませんので、連絡だけ入れてください」。"],"問3":[2,"「音の出る時計は使えないはずですので、普通の腕時計にしてください」。"],"問4":[3,"「終わった人から帰ってかまいません」。あとで集まる予定はやめ、昼食は各自、携帯は電源を切って持てます。"],"d1":[1,""],"d2":[1,""],"d3":[1,""],"d4":[1,""],"d5":[1,""],"d6":[1,""]},"水曜":{"問1":[2,"「それを弱さだと思っていた……自分は向いていないのだと感じた」。"],"問2":[2,"「慣れたら、たぶん下手になります」。"],"問3":[2,"「本番の前に必ず同じ順番で道具を並べる」動きのことです。"],"問4":[2,"「なくすものではなく、連れていくものだ」。筆者も前日にかばんの中身を並べるようになりました。"],"d1":[1,""],"d2":[1,""],"d3":[1,""],"d4":[1,""],"d5":[1,""],"d6":[1,""]},"木曜":{"問1":[2,"「その日、その形式で、答えられたこと」であり、角度によって見え方が変わる、と説明されています。"],"問2":[2,"「点数の値打ちは、高さより、差にある」。"],"問3":[4,"読解・聴解、時間、意味は挙げられていますが、会場の遠さは出てきません。"],"問4":[2,"最後の段落「一枚の写真だと思えば、次はどこから撮るかを考えられる」。"],"d1":[1,""],"d2":[1,""],"d3":[1,""],"d4":[1,""],"d5":[1,""],"d6":[1,""]},"金曜":{"問1":[2,"開始は12:30で、「開始から30分以内」＝13:00までなら入れます。着いたら係員に申し出ます。"],"問2":[2,"「自転車は東門の内側に置いてください」。"],"問3":[3,"「机の上には受験票・筆記用具・時計だけを出してください」。食堂は閉まり、延長はなく、時計は音の出ないものに限ります。"],"d1":[1,""],"d2":[1,""],"d3":[1,""],"d4":[1,""],"d5":[1,""],"d6":[1,""]},"土曜":{"問1":[1,"「ある朝、木の下に葉が積もっていて、はじめて秋だと思った」。"],"問2":[2,"「一日の差は小さすぎて、目に入らない」。"],"問3":[2,"最後の一文そのままです。"],"問4":[2,"次の段落が「直前に新しい教材を開くと」と続きます。"],"問5":[2,"「今までやってきたことまで信じられなくなる」。"],"問6":[2,"「一度やった問題をもう一度解く。書いたメモを見返す」。"],"問7":[2,"「その線が、どこにあるのか。それは、教科書には書いていない」。"],"問8":[2,"「先輩たちが書いた記録を十本並べて見せた」。"],"問9":[2,"「一本では分からない。二本でも足りない。十本あって、はじめて幅が見える」。"],"問10":[2,"最後の段落「私は、幅を渡すことだと思っている」。"],"問11":[1,"「アの市営バスが朝10時より前は動きません」。"],"問12":[3,"ウは会場までの徒歩が1分でいちばん短く、イは坂が12分続きます。"],"問13":[2,"「乗り換えの時間は所要時間に入っています」。自動車は不可、イは坂があり、エは無料です。"]},"日曜":{"L1":[2,"「日曜は西門が閉まっています。東門から入ってください」。"],"L2":[4,"食堂は閉まり、教室は飲食できません。「朝のうちに買って、廊下のいすで」。"],"L3":[3,"「音が出るものはだめです。別のにしてください」。"],"L4":[2,"「分からない問題で止まらないで、最後の問題まで行くことです」。"],"L5":[3,"「どの問題に何分使うかを、紙に書いて決めておくこと」。"],"L6":[1,"体調が悪いことをまず伝えます。延長はしてもらえません。"],"L7":[2,"励まされたら、礼を言って「がんばってきます」と返します。"],"r1":[1,""],"r2":[1,""],"r3":[1,""],"r4":[1,""],"r5":[1,""],"r6":[1,""],"r7":[1,""],"r8":[1,""],"r9":[1,""],"r10":[1,""],"r11":[1,""],"r12":[1,""],"r13":[1,""],"r14":[1,""],"r15":[1,""],"r16":[1,""],"r17":[1,""],"r18":[1,""],"r19":[1,""],"r20":[1,""]}},"listen":[{"group":"問題1　課題理解","hint":"はじめに質問を聞いてください。それから会話を聞いて、1〜4から一つ選びます。","items":[{"no":"問1","label":"男の人は明日、まず何をしますか","answer":"2　東門から入る","why":"西門は閉まっており、自転車は東門の内側。まず入るのは東門。","steps":[{"k":"q","v":"男の人は、明日、まず何をしますか。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"自転車で行こうと思うんですが、西門から入れますか。"},{"k":"line","sp":"女","v":"日曜は西門が閉まっています。東門から入ってください。"},{"k":"line","sp":"男","v":"自転車はどこに置けば。"},{"k":"line","sp":"女","v":"東門を入ってすぐ内側です。そのあと2号館へどうぞ。"},{"k":"pause","s":8,"a":true}]},{"no":"問2","label":"女の人は昼に何をしますか","answer":"4　朝買ったものを教室の外で食べる","why":"食堂は閉まり、教室では飲食できないと言われている。","steps":[{"k":"q","v":"女の人は、昼に何をしますか。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"お昼は食堂でいいですか。"},{"k":"line","sp":"男","v":"日曜は閉まっていますよ。"},{"k":"line","sp":"女","v":"では、教室で食べます。"},{"k":"line","sp":"男","v":"教室は飲食できません。朝のうちに買って、廊下のいすで召し上がってください。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題2　ポイント理解","hint":"質問を聞いてから、問題用紙を見てください。読む時間があります。","items":[{"no":"問3","label":"男の人が持って行かないものはどれですか","answer":"3　音の出る時計","why":"「音が出るのはだめ」と言われている。","steps":[{"k":"q","v":"男の人が、持って行かないものはどれですか。"},{"k":"pause","s":3},{"k":"line","sp":"男","v":"受験票と在留カード、鉛筆と消しゴム、あと時計ですね。"},{"k":"line","sp":"女","v":"その時計、時報が鳴りませんか。"},{"k":"line","sp":"男","v":"鳴ります。"},{"k":"line","sp":"女","v":"音が出るものはだめです。別のにしてください。"},{"k":"pause","s":8,"a":true}]},{"no":"問4","label":"女の人が一番気をつけていることは何ですか","answer":"2　最後まで解ききること","why":"「見直し」「速さ」も出るが、最後に「最後まで行く」が中心。","steps":[{"k":"q","v":"女の人が、一番気をつけていることは、何ですか。"},{"k":"pause","s":3},{"k":"line","sp":"男","v":"試験、どんなことに気をつけていますか。"},{"k":"line","sp":"女","v":"見直しもしたいんですが、それより先に。"},{"k":"line","sp":"男","v":"速く解くことですか。"},{"k":"line","sp":"女","v":"速さというより、分からない問題で止まらないで、最後の問題まで行くことです。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題3　概要理解","hint":"問題用紙に何も書いてありません。話の中心を選びます。","items":[{"no":"問5","label":"先生は何について話していますか","answer":"3　時間の配り方","why":"「どこに何分」という話。語彙や体調は例として出るだけ。","steps":[{"k":"q","v":"教室で、先生が話しています。"},{"k":"pause","s":2},{"k":"line","sp":"女","v":"　みなさん、明日は語彙を増やすことも、体調を整えることも、もう間に合いません。今からできるのは一つだけです。どの問題に何分使うかを、紙に書いて決めておくこと。決めておけば、迷った時間が減ります。減った分が、そのまま点になります。"},{"k":"q","v":"先生は、何について話していますか。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題4　発話表現","hint":"場面の説明を聞いて、そのときに何と言うか、1〜3から一つ選びます。","items":[{"no":"問6","label":"何と言いますか","answer":"1　すみません、体調が悪いのですが","why":"試験中に気分が悪くなったときの申し出方。","steps":[{"k":"q","v":"試験中に気分が悪くなりました。係員に何と言いますか。"},{"k":"pause","s":2},{"k":"line","sp":"男","v":"1、すみません、体調が悪いのですが。"},{"k":"line","sp":"男","v":"2、すみません、時間を延ばしてください。"},{"k":"line","sp":"男","v":"3、すみません、別室にいらっしゃいます。"},{"k":"pause","s":8,"a":true}]}]},{"group":"問題5　即時応答","hint":"短い文を聞いて、1〜3から合う返事を選びます。","items":[{"no":"問7","label":"返事を選ぶ","answer":"2　ありがとうございます。がんばってきます","why":"励まされたときの返し方。","steps":[{"k":"line","sp":"女","v":"明日、いよいよですね。落ち着いていってらっしゃい。"},{"k":"line","sp":"男","v":"1、はい、落ち着いていらっしゃいます。"},{"k":"line","sp":"男","v":"2、ありがとうございます。がんばってきます。"},{"k":"line","sp":"男","v":"3、いいえ、落ち着いていません。"},{"k":"pause","s":8,"a":true}]}]}]}};
var WEEK = "1";
var CONTENT = null, LISTEN = null;

var exam = new Date(2026,11,6), t0 = new Date(); t0.setHours(0,0,0,0);
document.getElementById('days').textContent = Math.max(0, Math.round((exam-t0)/86400000));

var TAGNAME = { shiji:'指示語', shucho:'筆者の主張', joken:'条件・情報検索', naiyou:'言いかえ・内容一致' };
var STORE = 'n3-week1';
/* ans=選んだ番号、mk=その問題を採点したか（問題ごと）、marked=その曜日を全部採点したか */
var state = { ans:{}, mk:{}, marked:{} };
function loadState(){
  state = { ans:{}, mk:{}, marked:{} };
  try { var raw = localStorage.getItem(STORE); if(raw) state = JSON.parse(raw); } catch(e){}
  if(!state.ans) state.ans = {};
  if(!state.mk) state.mk = {};
  if(!state.marked) state.marked = {};
}
/* 古い記録（曜日ごとにしか採点状態を持っていなかったころのもの）を、
   問題ごとの形に移します。1回だけ動きます。 */
function migrateMarks(){
  var changed = false;
  days.forEach(function(d){
    if(!state.marked[d.key]) return;
    dayQuestions(d).forEach(function(q){
      var id = uid(d.key, q);
      if(state.ans[id] && !state.mk[id]) { state.mk[id] = true; changed = true; }
    });
  });
  if(changed) save();
}
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

var days = [], KEYS = {}, cur = 0;

function keyOf(dayKey, q){
  if(dayKey === '日曜') return q.drill ? ('r'+q.id) : ('L'+q.id.replace('問',''));
  return q.drill ? ('d'+q.id) : q.id;
}
function correctOf(dayKey, q){
  var d = KEYS[dayKey] || {}; var e = d[keyOf(dayKey,q)];
  return e ? e[0] : null;
}
function explOf(dayKey, q){
  var d = KEYS[dayKey] || {}; var e = d[keyOf(dayKey,q)];
  return e ? (e[1]||'') : '';
}
function uid(dayKey, q){ return dayKey + '/' + keyOf(dayKey,q); }

/* ---------- tabs ---------- */
var tabs = document.getElementById('tabs');
var weeksNav = document.getElementById('weeks');

function buildTabs(){
  tabs.innerHTML = '';
  days.forEach(function(d, i){
    var b = document.createElement('button');
    b.textContent = d.key.replace('曜','');
    b.addEventListener('click', function(){ cur = i; render(); window.scrollTo(0,0); });
    tabs.appendChild(b);
  });
  var recBtn = document.createElement('button');
  recBtn.textContent = '記録';
  recBtn.addEventListener('click', function(){ cur = -1; render(); window.scrollTo(0,0); });
  tabs.appendChild(recBtn);
}

function mount(w){
  stopSeq();
  WEEK = w;
  CONTENT = WEEKS[w];
  LISTEN = CONTENT.listen;
  days = CONTENT.days;
  KEYS = CONTENT.answers;
  STORE = 'n3-week' + w;
  loadState();
  migrateMarks();     /* 古い記録を、問題ごとの採点状態に移す */
  try { localStorage.setItem('n3-lastweek', w); } catch(e){}
  document.getElementById('h1').textContent = '第' + w + '週　タブレット学習';
  Array.prototype.forEach.call(weeksNav.children, function(b){
    b.classList.toggle('on', b.dataset.w === w);
  });
  buildTabs();
  cur = 0;
  render();
  window.scrollTo(0,0);
}

Object.keys(WEEKS).sort(function(a,b){return a-b;}).forEach(function(w){
  var b = document.createElement('button');
  b.textContent = '第' + w + '週';
  b.dataset.w = w;
  b.addEventListener('click', function(){ mount(w); });
  weeksNav.appendChild(b);
});

/* ---------- render ---------- */
var pane = document.getElementById('pane');

function questionEl(dayKey, q){
  var box = document.createElement('div');
  box.className = 'q' + (q.drill ? ' drill' : '');
  var id = uid(dayKey, q);
  box.dataset.qid = q.id;        /* 聴解の再生中に、その問題まで画面を動かすため */

  var head = document.createElement('div'); head.className = 'qt';
  var n = document.createElement('span'); n.className = 'qn';
  n.textContent = q.drill ? q.id : q.id;
  var tx = document.createElement('span'); tx.innerHTML = q.text || '';
  head.appendChild(n); head.appendChild(tx); box.appendChild(head);

  var expl = document.createElement('div'); expl.className = 'expl';

  q.opts.forEach(function(o, idx){
    var num = idx + 1;
    var row = document.createElement('div'); row.className = 'opt';
    var c = document.createElement('span'); c.className = 'num'; c.textContent = num;
    var s = document.createElement('span'); s.innerHTML = o;
    row.appendChild(c); row.appendChild(s);
    row.addEventListener('click', function(){
      if(state.mk[id]) return;        /* 採点ずみの問題だけ、変えられない */
      state.ans[id] = num; save();
      Array.prototype.forEach.call(box.querySelectorAll('.opt'), function(x){ x.classList.remove('sel'); });
      row.classList.add('sel');
      updateStat();
    });
    if(state.ans[id] === num) row.classList.add('sel');
    box.appendChild(row);
  });

  box.appendChild(expl);

  if(state.mk[id]) paint(box, dayKey, q, expl);   /* 採点していない問題は、答えを出さない */
  return box;
}

function paint(box, dayKey, q, expl){
  var id = uid(dayKey, q), got = state.ans[id], right = correctOf(dayKey, q);
  var rows = box.querySelectorAll('.opt');
  Array.prototype.forEach.call(rows, function(r, i){
    r.classList.remove('sel');
    if(i+1 === right) r.classList.add('ok');
    else if(i+1 === got) r.classList.add('ng');
  });
  var e = explOf(dayKey, q);
  expl.innerHTML = (got === right
      ? '<b class="v">正解</b>'
      : '<b class="x">不正解</b>　正しい答え：' + right)
    + (e ? '<br>' + e : '');
  expl.classList.add('show');
}

function render(){
  Array.prototype.forEach.call(tabs.children, function(b, i){
    b.classList.toggle('on', (cur === -1) ? (i === tabs.children.length-1) : (i === cur));
  });
  pane.innerHTML = '';
  if(cur === -1){ renderRecord(); updateStat(); return; }

  var d = days[cur];

  if(d.key === '土曜') pane.appendChild(timerEl());
  if(d.key === '日曜') pane.appendChild(playerEl());

  d.blocks.forEach(function(b){
    var el;
    if(b.t === 'h2'){ el = document.createElement('h2'); el.className='sec'; el.textContent = b.v; }
    else if(b.t === 'h3'){ el = document.createElement('h3'); el.className='sub3'; el.textContent = b.v; }
    else if(b.t === 'passage'){ el = document.createElement('div'); el.className='passage'; el.innerHTML = b.v; }
    else if(b.t === 'table'){ el = document.createElement('div'); el.className='ref'; el.innerHTML = b.v; }
    else if(b.t === 'q'){ el = questionEl(d.key, b); }
    else { el = document.createElement('p'); el.className='body'; el.innerHTML = b.v; }
    pane.appendChild(el);
  });
  updateStat();
}

/* ---------- 土曜 timer ---------- */
var tmr = null, left = 3600;
function timerEl(){
  var w = document.createElement('div'); w.className = 'timer';
  var c = document.createElement('span'); c.className = 'clock'; c.id = 'clock';
  var b1 = document.createElement('button'); b1.className='act'; b1.textContent='60分スタート';
  var b2 = document.createElement('button'); b2.className='act ghost'; b2.textContent='止める';
  function show(){
    var m = Math.floor(left/60), s = left%60;
    c.textContent = (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
    c.classList.toggle('low', left <= 300);
  }
  show();
  b1.addEventListener('click', function(){
    if(tmr) clearInterval(tmr);
    left = 3600; show();
    tmr = setInterval(function(){
      left--; show();
      if(left <= 0){ clearInterval(tmr); tmr = null; alert('60分が終わりました。'); }
    }, 1000);
  });
  b2.addEventListener('click', function(){ if(tmr){ clearInterval(tmr); tmr=null; } });
  w.appendChild(c); w.appendChild(b1); w.appendChild(b2);
  var note = document.createElement('span');
  note.style.cssText='font-size:13px;color:var(--ink-soft)';
  note.textContent = '中文6分／長文12分／情報検索8分';
  w.appendChild(note);
  return w;
}

/* ---------- 日曜 listening player ---------- */
var synth = window.speechSynthesis, voices = [], vA = null, vB = null, rate = 1;
var stopped = false, running = false, timers = [];
function clearTimers(){ timers.forEach(function(t){ clearTimeout(t); clearInterval(t); }); timers = []; }
function wait(ms){ return new Promise(function(r){ timers.push(setTimeout(r, ms)); }); }
function speak(text, voice){
  return new Promise(function(res){
    if(stopped) return res();
    var u = new SpeechSynthesisUtterance(text);
    u.lang='ja-JP'; u.rate = rate;
    /* 端末によっては voice の代入で例外が出る。ここで止まると無音になるので受け止める */
    try{ if(voice) u.voice = voice; }catch(e){}
    var done=false, keep=0;
    function fin(){ if(!done){ done=true; if(keep) clearInterval(keep); res(); } }
    u.onend=fin; u.onerror=fin;
    if(/Chrome|Chromium|Edg\//.test(navigator.userAgent)){
      keep = setInterval(function(){ if(synth.speaking && !synth.paused){ synth.pause(); synth.resume(); } }, 9000);
      timers.push(keep);
    }
    timers.push(setTimeout(fin, Math.max(4000, text.length*420/rate)));
    synth.speak(u);
  });
}
function loadVoices(){ voices = (synth.getVoices()||[]).filter(function(v){ return (v.lang||'').toLowerCase().indexOf('ja')===0; });
  vA = voices[0]||null; vB = voices[1]||voices[0]||null; }
loadVoices();
if(typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = function(){ loadVoices(); };

/* いま流れている問題の選択肢まで、画面を動かす。
   通しで再生すると、どの問題を答えればよいか分からなくなるため。 */
function focusQ(no){
  Array.prototype.forEach.call(document.querySelectorAll('.q.playing'), function(x){
    x.classList.remove('playing');
  });
  var box = document.querySelector('#pane .q[data-qid="' + no + '"]');
  if(!box) return;
  box.classList.add('playing');
  try { box.scrollIntoView({ behavior:'smooth', block:'center' }); }
  catch(e) { box.scrollIntoView(); }
}
function clearFocus(){
  Array.prototype.forEach.call(document.querySelectorAll('.q.playing'), function(x){
    x.classList.remove('playing');
  });
}
function playSeq(items, btn){
  if(running) return;
  stopped = false; running = true; clearTimers();
  try{ synth.cancel(); }catch(e){}
  if(btn){ btn.classList.add('on'); btn.textContent='再生中…'; }
  var chain = Promise.resolve();
  items.forEach(function(it){
    chain = chain.then(function(){ if(!stopped) focusQ(it.no); });
    it.steps.forEach(function(st){
      chain = chain.then(function(){
        if(stopped) return;
        if(st.k === 'pause') return wait(st.s*1000);
        return speak(st.v, st.sp === '男' ? vB : vA).then(function(){ return wait(200); });
      });
    });
  });
  chain.then(function(){
    running = false;
    clearFocus();
    if(btn){ btn.classList.remove('on'); btn.textContent = btn.dataset.label; }
  });
}
function stopSeq(){ stopped = true; running = false; clearTimers(); try{ synth.cancel(); }catch(e){}
  clearFocus();
  Array.prototype.forEach.call(document.querySelectorAll('.playbtn'), function(b){
    b.classList.remove('on'); if(b.dataset.label) b.textContent = b.dataset.label; }); }

function playerEl(){
  var w = document.createElement('div'); w.className='player';
  var all = []; LISTEN.forEach(function(g){ g.items.forEach(function(it){ all.push(it); }); });

  if(!voices.length){
    var warn = document.createElement('div'); warn.className='warnbox';
    warn.innerHTML = '<b>この端末では日本語の音声が見つかりません。</b><br>'
      + 'iPad：設定 → アクセシビリティ → 読み上げコンテンツ → 声 → 日本語を追加<br>'
      + 'Android / Windows：設定から日本語の音声データを追加するか、別のブラウザで開いてください。';
    w.appendChild(warn);
  }

  /* 使い方（日本語＋インドネシア語）。iPadは「音のテスト」を先に押さないと
     最初の音が出ないことがあるので、いちばん上に置いている。 */
  var how = document.createElement('div'); how.className='note';
  how.innerHTML = '<b>使い方 ／ Cara pakai</b><br>'
    + '① <b>「🔊 音のテスト」</b>を おす（音が 出るか たしかめる）<br>'
    + '<span style="opacity:.75">　Tekan "Tes suara" dulu. iPhone・iPadは これを おさないと 音が 出ない ことが あります。</span><br>'
    + '② <b>「7問を通して再生」</b>を おす。会話は <b>1回だけ</b> 流れます<br>'
    + '<span style="opacity:.75">　Tekan "putar semua". Percakapan diputar <b>satu kali saja</b>.</span><br>'
    + '③ 聞きながら、下の 選択肢を タップする<br>'
    + '<span style="opacity:.75">　Pilih jawaban sambil mendengarkan.</span><br>'
    + '④ 7問 すべて 答えてから <b>「採点する」</b>を おす<br>'
    + '<span style="opacity:.75">　Setelah menjawab semua, tekan tombol penilaian.</span><br>'
    + '※ 1問だけ 聞き直したい ときは、下の「問1」などを おします。'
    + '本番の 練習なので、ふだんは <b>1回だけ</b> にしましょう。';
  w.appendChild(how);

  var r0 = document.createElement('div'); r0.className='row';
  var bt = document.createElement('button'); bt.className='act ghost'; bt.textContent='🔊 音のテスト';
  bt.addEventListener('click', function(){
    try{ synth.cancel(); }catch(e){}
    var u = new SpeechSynthesisUtterance('音の テストです。聞こえますか。');
    u.lang='ja-JP'; u.rate=rate; u.pitch=1;
    try{ if(voices.length) u.voice = voices[0]; }catch(e){}
    synth.speak(u);
  });
  r0.appendChild(bt);
  w.appendChild(r0);

  var r1 = document.createElement('div'); r1.className='row';
  var ba = document.createElement('button'); ba.className='playbtn'; ba.textContent='7問を通して再生';
  ba.dataset.label='7問を通して再生';
  ba.addEventListener('click', function(){ playSeq(all, ba); });
  var bs = document.createElement('button'); bs.className='act ghost'; bs.textContent='止める';
  bs.addEventListener('click', stopSeq);
  r1.appendChild(ba); r1.appendChild(bs);
  w.appendChild(r1);

  var r2 = document.createElement('div'); r2.className='row';
  var lab = document.createElement('span'); lab.style.fontSize='13px';
  lab.innerHTML = '速さ<span style="opacity:.7">／Kecepatan</span>';
  var sl = document.createElement('input'); sl.type='range'; sl.min='0.7'; sl.max='1.2'; sl.step='0.05'; sl.value='1';
  var vv = document.createElement('span'); vv.style.cssText='font-size:13px;font-weight:700'; vv.textContent='1.00';
  sl.addEventListener('input', function(){ rate = +sl.value; vv.textContent = rate.toFixed(2); });
  r2.appendChild(lab); r2.appendChild(sl); r2.appendChild(vv);
  w.appendChild(r2);

  var r3 = document.createElement('div'); r3.className='row';
  all.forEach(function(it){
    var b = document.createElement('button'); b.className='playbtn';
    b.textContent = it.no; b.dataset.label = it.no;
    b.style.cssText = 'background:#4A6A7A';
    b.addEventListener('click', function(){ playSeq([it], b); });
    r3.appendChild(b);
  });
  w.appendChild(r3);

  var note = document.createElement('div'); note.className='note';
  note.innerHTML = '会話は<b>1回だけ</b>流れます。聞いてから下の選択肢をタップしてください。'
    + '答え合わせは、7問すべて答えてから「採点する」を押します。<br>'
    + '<span style="opacity:.75">Percakapan diputar satu kali. Pilih jawaban, '
    + 'lalu tekan tombol penilaian setelah semua terjawab.</span>';
  w.appendChild(note);
  return w;
}

/* ---------- marking ---------- */
function dayQuestions(d){ return d.blocks.filter(function(b){ return b.t === 'q'; }); }

function updateStat(){
  var el = document.getElementById('stat');
  if(cur === -1){
    var tot=0, don=0;
    days.forEach(function(d){ dayQuestions(d).forEach(function(q){ tot++; if(state.ans[uid(d.key,q)]) don++; }); });
    el.innerHTML = '週全体　<b>'+don+'</b> / '+tot+' 問 解答ずみ';
    document.getElementById('btnMark').style.display='none';
    document.getElementById('btnClear').style.display='none';
    return;
  }
  document.getElementById('btnMark').style.display='';
  document.getElementById('btnClear').style.display='';
  var d = days[cur], qs = dayQuestions(d), don=0, ok=0, mk=0, waiting=0;
  qs.forEach(function(q){
    var id = uid(d.key,q), a = state.ans[id];
    if(a) don++;
    if(state.mk[id]) { mk++; if(a === correctOf(d.key,q)) ok++; }
    else if(a) waiting++;                 /* 答えたが、まだ採点していない */
  });
  if(mk) el.innerHTML = d.key+'　正解 <b>'+ok+'</b> / '+mk+' 問（採点ずみ）　'
    + '解答ずみ '+don+' / '+qs.length+' 問';
  else el.innerHTML = d.key+'　<b>'+don+'</b> / '+qs.length+' 問 解答ずみ';
  var btn = document.getElementById('btnMark');
  btn.textContent = waiting ? ('採点する（'+waiting+'問）') : (mk ? '採点ずみ' : '採点する');
  btn.disabled = !waiting;
}

document.getElementById('btnMark').addEventListener('click', function(){
  if(cur === -1) return;
  var d = days[cur], qs = dayQuestions(d);
  /* 答えた問題だけを採点します。答えていない問題は、答えを見せずに残します。 */
  var n = 0;
  qs.forEach(function(q){
    var id = uid(d.key, q);
    if(state.ans[id] && !state.mk[id]) { state.mk[id] = true; n++; }
  });
  if(!n){ alert('新しく採点する問題がありません。まず答えをえらんでください。'); return; }
  var un = qs.filter(function(q){ return !state.ans[uid(d.key,q)]; }).length;
  state.marked[d.key] = (un === 0);
  save(); render();
  if(un > 0) alert(n + '問を採点しました。まだ答えていない ' + un + '問は、'
    + 'このあと答えられます。答えたら、もう一度「採点する」を押してください。');
});

document.getElementById('btnClear').addEventListener('click', function(){
  if(cur === -1) return;
  var d = days[cur];
  if(!confirm(d.key + 'の解答を消して、やり直しますか。')) return;
  dayQuestions(d).forEach(function(q){
    var id = uid(d.key, q);
    delete state.ans[id]; delete state.mk[id];
  });
  delete state.marked[d.key]; save(); render();
});

/* ---------- record tab ---------- */
function renderRecord(){
  var h = document.createElement('div'); h.className='rec';
  var t1 = '<h2 class="sec">曜日ごとの成績</h2><table><tr><th>曜日</th><th>正解</th><th>問題数</th><th>状態</th></tr>';
  days.forEach(function(d){
    var qs = dayQuestions(d), ok = 0, mk = 0;
    qs.forEach(function(q){
      var id = uid(d.key,q);
      if(!state.mk[id]) return;
      mk++; if(state.ans[id] === correctOf(d.key,q)) ok++;
    });
    var st = !mk ? '未採点' : (mk === qs.length ? '採点ずみ' : ('途中（'+mk+'問）'));
    t1 += '<tr><td>'+d.key+'</td><td class="n">'+(mk?ok:'—')+'</td><td class="n">'+(mk?mk:qs.length)+'</td><td>'
       + st+'</td></tr>';
  });
  t1 += '</table>';

  var tally = {shiji:0, shucho:0, joken:0, naiyou:0};
  days.forEach(function(d){
    dayQuestions(d).forEach(function(q){
      var id = uid(d.key,q);
      if(!q.tag || !state.mk[id]) return;        /* 採点した問題だけ数える */
      if(state.ans[id] !== correctOf(d.key,q)) tally[q.tag]++;
    });
  });
  var t2 = '<h2 class="sec">間違えた読解問題のタイプ</h2><table><tr><th>タイプ</th><th>間違えた数</th></tr>';
  Object.keys(TAGNAME).forEach(function(k){
    t2 += '<tr><td>'+TAGNAME[k]+'</td><td class="n">'+tally[k]+'</td></tr>';
  });
  t2 += '</table><p class="body" style="font-size:14px;color:var(--ink-soft)">'
     + 'いちばん数が多いタイプが、いまの弱点です。11月の総復習では、このタイプだけを集中的に解きます。</p>';

  var t3 = '<h2 class="sec">目標</h2><table><tr><th>項目</th><th>目標</th></tr>'
     + '<tr><td>土曜・読解通し</td><td>11 / 13問</td></tr>'
     + '<tr><td>日曜・復習テスト</td><td>17 / 20問</td></tr>'
     + '<tr><td>日曜・聴解</td><td>6 / 7問</td></tr></table>';

  var reset = '<p class="body"><button class="act warn" id="btnReset">この週の解答をすべて消す</button></p>';
  h.innerHTML = t1 + t2 + t3 + reset;
  pane.appendChild(h);
  document.getElementById('btnReset').addEventListener('click', function(){
    if(!confirm('第'+WEEK+'週の解答をすべて消しますか。元に戻せません。')) return;
    state = {ans:{}, marked:{}}; save(); render();
  });
}

window.addEventListener('beforeunload', function(){ try{ synth.cancel(); }catch(e){} });

try { last = localStorage.getItem('n3-lastweek') || '1'; } catch(e){}
if(!WEEKS[last]) last = Object.keys(WEEKS).sort(function(a,b){return a-b;})[0];
mount(last);
})();
